<script>
/* VICE4X standalone QR Model 2, byte-mode, error-correction M, versions 1–9.
   Matrix implementation is self-contained; no external runtime dependency. */
const ViceQR = (() => {
  const BLOCKS = [null,[[26,16]],[[44,28]],[[70,44]],[[50,32],[50,32]],
    [[67,43],[67,43]],[[43,27],[43,27],[43,27],[43,27]],
    [[49,31],[49,31],[49,31],[49,31]],[[60,38],[60,38],[61,39],[61,39]],
    [[58,36],[58,36],[58,36],[59,37],[59,37]]];
  const ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46]];
  const exp = new Uint8Array(512), log = new Uint8Array(256);
  for(let i=0,v=1;i<255;i++) { exp[i]=v;log[v]=i;v<<=1;if(v&256)v^=0x11d; }
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  const mul=(x,y)=>!x||!y?0:exp[log[x]+log[y]];
  function rsPolynomial(n){let poly=[1];for(let i=0;i<n;i++){
    const out=Array(poly.length+1).fill(0);
    poly.forEach((c,j)=>{out[j]^=c;out[j+1]^=mul(c,exp[i]);});poly=out;
  }return poly;}
  function rs(data,n){let r=Array(n).fill(0),gen=rsPolynomial(n);
    for(const b of data){const f=b^r[0];r.shift();r.push(0);
      for(let j=0;j<n;j++)r[j]^=mul(f,gen[j+1]);}
    return r;
  }
  function bitsFor(text,v){
    const b=new TextEncoder().encode(text), cap=BLOCKS[v].reduce((n,a)=>n+a[1],0);
    const bits=[];const put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1);};
    put(4,4);put(b.length,8);for(const c of b)put(c,8);
    for(let k=0;k<4&&bits.length<cap*8;k++)bits.push(0);
    while(bits.length%8)bits.push(0);
    const out=[];for(let i=0;i<bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8).join(''),2));
    let pad=0;while(out.length<cap)out.push(pad++%2?0x11:0xec);
    return out;
  }
  function interleave(bytes,v){
    let off=0;const blocks=BLOCKS[v].map(([size,n])=>{
      const d=bytes.slice(off,off+n);off+=n;return {d,e:rs(d,size-n)};});
    const ans=[];for(const key of ['d','e']){
      const m=Math.max(...blocks.map(b=>b[key].length));
      for(let i=0;i<m;i++)for(const b of blocks)if(i<b[key].length)ans.push(b[key][i]);
    }return ans;
  }
  function build(text){
    const b=new TextEncoder().encode(text);
    const v=BLOCKS.findIndex((x,i)=>i>0&&i<10&&b.length<=x.reduce((n,a)=>n+a[1],0)-2);
    if(v<1)throw new Error('QR URL exceeds 9-version capacity');
    const n=v*4+17, m=Array.from({length:n},()=>Array(n).fill(false)),
      reserved=Array.from({length:n},()=>Array(n).fill(false));
    const set=(x,y,color)=>{if(x<0||y<0||x>=n||y>=n)return;m[y][x]=!!color;reserved[y][x]=true;};
    function finder(cx,cy){for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4);}}
    finder(3,3);finder(n-4,3);finder(3,n-4);
    for(let i=8;i<n-8;i++){set(i,6,i%2===0);set(6,i,i%2===0);}
    for(const y of ALIGN[v])for(const x of ALIGN[v]){
      if((x===6&&y===6)||(x===6&&y===n-7)||(x===n-7&&y===6))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)
        set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    // Format reservation and fixed dark module.
    for(let i=0;i<9;i++)if(i!==6){set(8,i,false);set(i,8,false);}
    for(let i=n-8;i<n;i++){set(8,i,false);set(i,8,false);}
    set(8,n-8,true);
    if(v>=7){for(let i=0;i<18;i++){
      set(n-11+i%3,Math.floor(i/3),false);set(Math.floor(i/3),n-11+i%3,false);}}
    const cw=interleave(bitsFor(text,v),v),bits=[];
    for(const c of cw)for(let i=7;i>=0;i--)bits.push((c>>>i)&1);
    let idx=0,up=true;
    for(let right=n-1;right>=1;right-=2){
      if(right===6)right=5;
      for(let j=0;j<n;j++){
        const y=up?n-1-j:j;
        for(let dx=0;dx<2;dx++){
          const x=right-dx;
          if(reserved[y][x])continue;
          const bit=idx<bits.length?bits[idx++]:0;
          m[y][x]=!!(bit^(((x+y)%2)===0?1:0));
        }
      }up=!up;
    }
    // Format information for EC level M (00) and mask 0, BCH(15,5).
    let rem=0,formatData=0;
    for(let i=14;i>=10;i--){ /* BCH polynomial division below */ }
    let val=formatData<<10;
    for(let i=14;i>=10;i--)if((val>>>i)&1)val^=0x537<<(i-10);
    const format=((formatData<<10)|val)^0x5412;
    const bit=i=>!!((format>>>i)&1);
    for(let i=0;i<=5;i++)set(8,i,bit(i));
    set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));
    for(let i=9;i<15;i++)set(14-i,8,bit(i));
    for(let i=0;i<8;i++)set(n-1-i,8,bit(i));
    for(let i=8;i<15;i++)set(8,n-15+i,bit(i));
    set(8,n-8,true);
    if(v>=7){let vv=v<<12;
      for(let i=17;i>=12;i--)if((vv>>>i)&1)vv^=0x1f25<<(i-12);
      const vb=(v<<12)|vv;
      for(let i=0;i<18;i++){
        const c=!!((vb>>>i)&1),a=n-11+i%3,d=Math.floor(i/3);
        set(a,d,c);set(d,a,c);
      }
    }
    return {version:v,size:n,matrix:m};
  }
  function encode(text,{moduleSize=6,quiet=4}={}){
    const q=build(String(text)), path=[];
    for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++)
      if(q.matrix[y][x])path.push(`M${x+quiet} ${y+quiet}h1v1h-1z`);
    return {...q,path:path.join(''),moduleSize,quiet,
      svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${q.size+quiet*2} ${q.size+quiet*2}" width="${(q.size+quiet*2)*moduleSize}" height="${(q.size+quiet*2)*moduleSize}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${path.join('')}" fill="#07080a"/></svg>`};
  }
  return {encode};
})();

</script>
<script>
'use strict';
const input=document.getElementById('certId');
const host=document.getElementById('result');
const row=(label,value)=>`<tr><td>${esc(label)}</td><td>${esc(value??'—')}</td></tr>`;
const formatUnits=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:0});
function asMoney(cents){
 try{const n=BigInt(cents||0);const a=n<0n?-n:n;return (n<0n?'-':'')+'$'+(a/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+String(a%100n).padStart(2,'0');}
 catch(_){return '—';}
}
async function verify(id){
  id=String(id||'').trim().toUpperCase();input.value=id;
  const course=/^VCA-[A-F0-9]{4}(?:-[A-F0-9]{4}){3}$/.test(id);
  const iru=/^VCT-[A-F0-9]{4}(?:-[A-F0-9]{4}){3}$/.test(id);
  if(!course&&!iru){
    host.innerHTML='<div class="verdict invalid">✕ Invalid certificate identifier</div><p class="muted">Enter the full VCA- or VCT- certificate ID displayed below the barcode.</p>';
    return;
  }
  history.replaceState(null,'','?id='+encodeURIComponent(id));
  host.setAttribute('aria-busy','true');
  host.innerHTML='<div class="verdict">◷ Checking the issuer registry…</div>';
  document.getElementById('verifyButton').disabled=true;
  try{
    const rpc=course?'verify_certificate':'verify_token_certificate';
    const {data,error}=await sb.rpc(rpc,{p_cert_id:id});
    if(error)throw error;
    if(!data?.valid){
      const reason=String(data?.reason||'NOT_FOUND');
      const revoked=reason==='REVOKED';
      host.innerHTML=`<div class="verdict invalid">✕ ${revoked?'Certificate revoked':'Certificate not verified'}</div>
        <p class="muted">${esc(reason)}. ${revoked?'This identifier is no longer an active certificate.':'Do not rely on this document as authentic.'}</p>
        ${revoked?`<p class="muted">Revoked ${esc(data.revoked_at||'')} · ${esc(data.revoked_reason||'')}</p>`:''}`;
      return;
    }
    const issued=new Date(data.issued_at).toLocaleString('en-US',{timeZone:'UTC',dateStyle:'long',timeStyle:'short'})+' UTC';
    const link=location.href;
    let qr='';try{qr=ViceQR.encode(link,{moduleSize:3}).svg;}catch(e){console.warn('QR render',e);}
    if(course){
      host.innerHTML=`<div class="verdict valid">✓ Course certificate verified</div><div class="stamp"><table>
        ${row('Certificate ID',data.cert_id)}${row('Recipient',data.name)}${row('Course',data.course)}
        ${row('Issued',issued)}</table>
        ${qr?`<div class="qr" aria-label="QR linking to certificate verification">${qr}</div>`:''}</div>
        <p class="muted">Registry validity and certificate integrity have been checked. Private academic scores and underlying digests are not exposed publicly. Completion is not a professional license.</p>`;
      return;
    }
    if(data.private_details===false){
      host.innerHTML=`<div class="verdict valid">✓ IRU certificate verified</div>
        <div class="stamp"><table>${row('Certificate ID',data.cert_id)}${row('Certificate kind',data.kind)}
        ${row('Program',data.program)}${row('Issued',issued)}${row('SHA-256 digest',data.digest)}</table>
        ${qr?`<div class="qr" aria-label="QR linking to certificate verification">${qr}</div>`:''}</div>
        <p class="muted">The issuer registry confirms this certificate's status and integrity. Holder identity, balances and internal records are private. Authorized holders can access their full certificate after signing in to <a href="/">VICE4X</a>.</p>`;
      return;
    }
    const snap=data.snapshot||{};
    const before=data.units_held_before==null?'Not applicable':formatUnits(data.units_held_before);
    const after=data.units_held_after==null?'Not applicable':formatUnits(data.units_held_after);
    host.innerHTML=`<div class="verdict valid">✓ IRU certificate verified</div>
      <p class="muted">This is the authentic issuer-recorded snapshot at the stated time. The recorded balance may have changed since issuance.</p>
      <div class="stamp"><table>
      ${row('Certificate ID',data.cert_id)}${row('Holder',data.holder_name)}
      ${row('Holder account',data.holder_client_id)}${row('Certificate kind',data.kind)}
      ${row('Transaction program',data.program)}${row('Units in transaction',formatUnits(data.units))}
      ${row('Units held before event',before)}${row('Units held after event',after)}
      ${row('VICE units at issuance',formatUnits(snap.vice_units))}
      ${row('V4X units at issuance',formatUnits(snap.v4x_units))}
      ${row('VICE issuer reference per unit',asMoney(snap.vice_reference_cents))}
      ${row('V4X issuer reference per unit',asMoney(snap.v4x_reference_cents))}
      ${row('Combined internal reference',asMoney(snap.combined_reference_cents))}
      ${row('Reference value basis',data.value_basis)}
      ${row('Recorded portfolio timestamp',snap.as_of)}
      ${row('Certificate issued',issued)}
      ${row('Source ledger sequence',data.source_event_seq||'Period certificate')}
      ${data.period?row('Period',data.period):''}
      ${snap.distribution_record?row('Distribution recorded amount',asMoney(snap.distribution_record.issuer_recorded_amount_cents)):''}
      ${snap.distribution_record?row('External settlement proof','NOT VERIFIED BY VICE4X'):''}
      ${row('SHA-256 digest',data.digest)}</table>
      ${qr?`<div class="qr" aria-label="QR linking to verified IRU holdings">${qr}</div>`:''}</div>
      <p class="muted">IRUs are internal accounting units. These issuer reference figures are not verified bank balances, on-chain custody, independent fair-market appraisals or lender commitments. A QR scan verifies the recorded certificate and its integrity, not current holdings or guaranteed redemption.</p>`;
  }catch(e){
    host.innerHTML='<div class="verdict invalid">✕ Registry unavailable</div><p class="muted">The issuer could not be reached. Do not treat the certificate as verified. Retry when connected.</p>';
    console.warn('Certificate verification request:',e);
  }finally{
    host.removeAttribute('aria-busy');document.getElementById('verifyButton').disabled=false;
  }
}
document.getElementById('verifyForm').addEventListener('submit',e=>{e.preventDefault();verify(input.value);});
const initial=new URLSearchParams(location.search).get('id');if(initial)verify(initial);
</script></body></html>
