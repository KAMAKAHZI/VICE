<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>VICE OS — Institutional Operating System</title>
<meta name="theme-color" content="#07080a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 866.025'%3E%3Cpath fill='%23c9a84c' d='M500 866 259 449 414 180 477 290 396 431 500 612 589 457 736 457ZM1000 0 759 417 449 417 512 308 675 308 780 127 601 127 528 0ZM0 0 482 0 637 268 511 268 429 127 220 127 309 282 236 409Z'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--bg2:#0a0b0d;--srf:#141518;--ln:rgba(201,168,76,.10);--ln2:rgba(201,168,76,.18);--ln3:rgba(201,168,76,.32);--tx:#f2ebe4;--tx2:#a3968e;--tx3:#6b5f59;--tx4:#3d3532;--gd:#c9a84c;--gdl:#ecd28a;--gr:#3ddc97;--rd:#d9465a;--wn:#f5a524;--vi:#8b7aff;--bl:#5b8def;--gg:linear-gradient(135deg,#ecd28a 0%,#c9a84c 45%,#9c7c33 100%);--sf:'Fraunces',Georgia,serif;--mn:'JetBrains Mono',ui-monospace,monospace;--nh:54px;--bh:22px;--sw:248px;--e:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:13.5px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}ul{list-style:none}
::selection{background:rgba(201,168,76,.3);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#1c1d20;border-radius:8px}
h1,h2,h3,h4{font-weight:500;line-height:1.1;letter-spacing:-.02em}
h1{font-size:1.3rem;font-weight:400}
h1 em{font-family:var(--sf);font-style:italic;font-weight:300;color:var(--gdl)}
p{color:var(--tx2)}
.tb{position:fixed;top:0;left:0;right:0;height:var(--nh);z-index:100;background:rgba(7,8,10,.95);backdrop-filter:blur(22px);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 12px;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.brand svg{width:22px;height:22px}
.bn{font-family:var(--sf);font-size:.86rem}
.bn em{font-style:italic;color:var(--gdl);font-weight:300}
.bsub{font-family:var(--mn);font-size:.44rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tx4);margin-top:1px}
.tbc{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;border:1px solid var(--ln2);background:rgba(0,0,0,.3);font-family:var(--mn);font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);cursor:pointer;transition:all .2s}
.pill:hover{border-color:var(--ln3);color:var(--tx)}
.pill .d{width:5px;height:5px;border-radius:50%;background:var(--gr);box-shadow:0 0 6px var(--gr)}
.pill .d.w{background:var(--wn);box-shadow:0 0 6px var(--wn)}
.pill .d.r{background:var(--rd);box-shadow:0 0 6px var(--rd)}
.tbr{display:flex;align-items:center;gap:6px}
.upill{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border:1px solid var(--ln2);border-radius:99px;background:rgba(0,0,0,.3);cursor:pointer}
.av{width:22px;height:22px;border-radius:50%;background:var(--gg);display:flex;align-items:center;justify-content:center;font-size:.54rem;font-weight:700;color:#1a0a0a}
.un{font-size:.68rem;color:var(--tx)}
.ur{font-family:var(--mn);font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4)}
.mob{display:none;width:32px;height:32px;border-radius:4px;border:1px solid var(--ln2);align-items:center;justify-content:center;flex-direction:column;gap:4px;flex-shrink:0;cursor:pointer}
.mob span{display:block;width:13px;height:1.5px;background:var(--tx);border-radius:2px}
.bnr{position:fixed;top:var(--nh);left:0;right:0;height:var(--bh);z-index:98;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,rgba(160,24,40,.16),rgba(201,168,76,.06),rgba(160,24,40,.16));border-bottom:1px solid rgba(201,168,76,.14);font-family:var(--mn);font-size:.48rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gdl)}
.bnr.sim{background:linear-gradient(90deg,rgba(139,122,255,.22),rgba(201,168,76,.08),rgba(139,122,255,.22));color:var(--vi);border-bottom-color:rgba(139,122,255,.4)}
.bnr .d{width:4px;height:4px;border-radius:50%;background:var(--wn);box-shadow:0 0 5px var(--wn);animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
.sb{position:fixed;top:calc(var(--nh) + var(--bh));left:0;bottom:0;width:var(--sw);background:var(--bg2);border-right:1px solid var(--ln);padding:10px 0;overflow-y:auto;z-index:90;transition:transform .4s var(--e)}
.sb.off{transform:translateX(-100%)}
.ss{padding:0 10px;margin-bottom:10px}
.ss h4{font-family:var(--mn);font-size:.46rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tx4);margin-bottom:4px;padding-left:8px;font-weight:500}
.slink{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:3px;font-size:.76rem;color:var(--tx2);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .18s;font-family:'Inter',sans-serif}
.slink:hover{color:var(--tx);background:rgba(201,168,76,.05);padding-left:11px}
.slink.on{color:var(--gd);background:rgba(201,168,76,.08);border-left:2px solid var(--gd);padding-left:6px}
.slink svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.slink.on svg{opacity:1}
.sbdg{margin-left:auto;font-family:var(--mn);font-size:.44rem;padding:1px 6px;border-radius:99px;background:rgba(201,168,76,.14);color:var(--gd);border:1px solid rgba(201,168,76,.28)}
.sbdg.lv{background:rgba(61,220,151,.12);color:var(--gr);border-color:rgba(61,220,151,.3)}
.sbdg.rd{background:rgba(217,70,90,.12);color:var(--rd);border-color:rgba(217,70,90,.3)}
.sbdg.vi{background:rgba(139,122,255,.12);color:var(--vi);border-color:rgba(139,122,255,.3)}
.mn{margin-left:var(--sw);padding-top:calc(var(--nh) + var(--bh));min-height:100vh;background:var(--bg);transition:margin-left .4s var(--e)}
.mni{padding:18px 22px 60px;max-width:1800px;margin:0 auto}
.ph{margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph .eb{font-family:var(--mn);font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gd);display:inline-flex;align-items:center;gap:8px;margin-bottom:5px}
.ph .eb::before{content:'';width:16px;height:1px;background:linear-gradient(90deg,var(--rd),transparent)}
.ph p{font-size:.76rem;color:var(--tx3);margin-top:4px;max-width:70ch}
.ph-acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.76rem;font-weight:500;padding:7px 13px;border-radius:3px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all .22s var(--e);font-family:'Inter',sans-serif}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--gg);color:#0a0a0b;font-weight:600;border-color:rgba(236,210,138,.3);box-shadow:0 6px 20px -8px rgba(201,168,76,.7)}
.btn-p:hover:not(:disabled){box-shadow:0 10px 30px -8px rgba(201,168,76,.9);transform:translateY(-1px)}
.btn-g{color:var(--tx2);border-color:var(--ln2);background:transparent}
.btn-g:hover:not(:disabled){color:var(--tx);border-color:var(--ln3);background:rgba(201,168,76,.04)}
.btn-gd{color:var(--gdl);border-color:var(--ln3);background:transparent}
.btn-gd:hover:not(:disabled){background:rgba(201,168,76,.08);border-color:var(--gd)}
.btn-r{color:var(--rd);border-color:rgba(217,70,90,.3);background:transparent}
.btn-r:hover:not(:disabled){background:rgba(217,70,90,.08);border-color:var(--rd)}
.btn-v{color:var(--vi);border-color:rgba(139,122,255,.35);background:transparent}
.btn-v:hover:not(:disabled){background:rgba(139,122,255,.08);border-color:var(--vi)}
.btn-sm{padding:4px 9px;font-size:.68rem}
.btn-b{width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin-bottom:12px}
.st{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;padding:12px 14px}
.st .l{font-family:var(--mn);font-size:.46rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);display:block;margin-bottom:5px}
.st .v{font-family:var(--sf);font-size:1.3rem;font-weight:500;line-height:1;color:var(--tx)}
.st .v.gr{color:var(--gr)}
.st .v.rd{color:var(--rd)}
.st .v.gd{color:var(--gdl)}
.st .v.vi{color:var(--vi)}
.st .v.sm{font-family:var(--mn);font-size:.78rem;letter-spacing:.08em;color:var(--wn)}
.st .n{font-family:var(--mn);font-size:.5rem;color:var(--tx4);margin-top:4px}
.pnl{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;overflow:hidden;margin-bottom:10px}
.pnl-h{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pnl-h h3{font-size:.84rem;display:flex;align-items:center;gap:7px}
.pnl-h .hint{font-family:var(--mn);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4)}
.pnl-b{padding:12px}
.pnl-b.fl{padding:0}
table{width:100%;border-collapse:collapse;font-size:.74rem}
th{font-family:var(--mn);font-size:.46rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx4);text-align:left;padding:7px 10px;border-bottom:1px solid var(--ln);font-weight:500;background:rgba(0,0,0,.15)}
td{padding:7px 10px;border-bottom:1px solid var(--ln);color:var(--tx2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(201,168,76,.02)}
td.mn{font-family:var(--mn);color:var(--tx);font-size:.68rem}
td.right{text-align:right}
.bdg{display:inline-flex;align-items:center;gap:3px;font-family:var(--mn);font-size:.46rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap}
.bdg.gr{color:var(--gr);border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.06)}
.bdg.rd{color:var(--rd);border-color:rgba(217,70,90,.3);background:rgba(217,70,90,.06)}
.bdg.gd{color:var(--gd);border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.06)}
.bdg.wn{color:var(--wn);border-color:rgba(245,165,36,.3);background:rgba(245,165,36,.06)}
.bdg.nt{color:var(--tx3);border-color:var(--ln2);background:rgba(0,0,0,.3)}
.bdg.lv{color:var(--gr);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.bdg.vi{color:var(--vi);border-color:rgba(139,122,255,.3);background:rgba(139,122,255,.06)}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-family:var(--mn);font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.ff input,.ff select,.ff textarea{background:rgba(0,0,0,.4);border:1px solid var(--ln2);border-radius:3px;padding:8px 10px;font-size:.8rem;color:var(--tx);transition:all .22s;font-family:'Inter',sans-serif;width:100%}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--gd);background:rgba(201,168,76,.04)}
.ff input::placeholder,.ff textarea::placeholder{color:var(--tx4)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .fc{grid-column:1/-1}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.crd{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;padding:14px;transition:all .3s var(--e);cursor:pointer}
.crd:hover{border-color:var(--ln3);transform:translateY(-2px)}
.crd h4{font-size:.86rem;margin-bottom:5px;color:var(--tx)}
.crd .d{font-size:.74rem;color:var(--tx3);line-height:1.55;margin-bottom:10px}
.crd .m{font-family:var(--mn);font-size:.5rem;color:var(--tx4);display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--ln)}
.mb{position:fixed;inset:0;background:rgba(3,4,6,.86);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:all .25s}
.mb.on{opacity:1;visibility:visible}
.mdl{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln2);border-radius:5px;box-shadow:0 40px 100px -30px rgba(0,0,0,.9);transform:translateY(8px);transition:transform .3s var(--e)}
.mb.on .mdl{transform:translateY(0)}
.mh{padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--srf);z-index:5}
.mh h3{font-size:.9rem;font-weight:500}
.mc{width:28px;height:28px;border-radius:4px;border:1px solid var(--ln2);color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem}
.mc:hover{color:var(--tx);border-color:var(--ln3)}
.mbd{padding:16px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln)}
.tsts{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tst{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln2);border-radius:3px;padding:10px 14px;min-width:230px;max-width:340px;box-shadow:0 20px 60px -20px rgba(0,0,0,.9);border-left:2px solid var(--gd);animation:tin .3s var(--e);pointer-events:auto;font-size:.74rem;color:var(--tx)}
.tst.ok{border-left-color:var(--gr)}
.tst.err{border-left-color:var(--rd)}
.tst.warn{border-left-color:var(--wn)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.rw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);gap:11px;flex-wrap:wrap}
.rw:last-child{border-bottom:none}
.rw-l{font-size:.78rem;color:var(--tx2)}
.rw-s{font-family:var(--mn);font-size:.5rem;color:var(--tx4);margin-top:2px}
.rw-v{font-family:var(--mn);font-size:.78rem;color:var(--tx)}
.sp2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.emp{padding:32px 16px;text-align:center;color:var(--tx4);font-size:.74rem}
.cwrap{position:relative;height:640px;background:#0a0b0d;border:1px solid var(--ln);border-radius:3px;overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.hud{position:absolute;top:9px;left:11px;font-family:var(--mn);font-size:.52rem;background:rgba(0,0,0,.82);padding:7px 10px;border-radius:3px;border:1px solid var(--ln);color:var(--tx2);line-height:1.55;pointer-events:none;max-width:280px;z-index:5}
.hud .k{color:var(--tx4);margin-right:4px}
.hud .v{color:var(--tx)}
.hud .up{color:var(--gr)}
.hud .dn{color:var(--rd)}
.hud .w{color:var(--wn)}
.hud .gd{color:var(--gdl)}
.clg{position:absolute;top:9px;right:11px;font-family:var(--mn);font-size:.48rem;background:rgba(0,0,0,.78);padding:7px 9px;border-radius:3px;border:1px solid var(--ln);color:var(--tx3);line-height:1.7;pointer-events:none;z-index:5;max-width:200px}
.clg .sw{display:inline-block;width:13px;height:2px;vertical-align:middle;margin-right:4px}
.cstat{position:absolute;bottom:7px;left:11px;font-family:var(--mn);font-size:.48rem;background:rgba(0,0,0,.78);padding:4px 8px;border-radius:3px;border:1px solid var(--ln);color:var(--tx4);letter-spacing:.06em;pointer-events:none;z-index:5;display:flex;gap:10px;flex-wrap:wrap}
.cstat .f0{color:var(--tx)}
.cstat .f100{color:var(--gd)}
.cstat .in{color:#5f5a37}
.cstat .ch{color:var(--vi)}
.ctb{display:flex;gap:5px;padding:7px 9px;background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.ctg{display:flex;gap:1px;padding:2px;background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:3px}
.ctb-btn{padding:4px 8px;font-family:var(--mn);font-size:.52rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);background:none;border:none;border-radius:2px;cursor:pointer;transition:all .15s;white-space:nowrap}
.ctb-btn:hover{color:var(--tx);background:rgba(201,168,76,.06)}
.ctb-btn.on{color:var(--gdl);background:rgba(201,168,76,.14)}
.ctb-sel{background:rgba(0,0,0,.4);border:1px solid var(--ln2);color:var(--gdl);font-family:var(--mn);font-size:.6rem;padding:5px 8px;border-radius:3px;cursor:pointer;transition:all .2s}
.ctb-sel:hover{border-color:var(--gd);background:rgba(201,168,76,.06)}
.pres{display:flex;gap:2px;padding:2px 4px;background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:3px;cursor:pointer}
.pres.on{border-color:var(--gd)}
.pres .chip{width:9px;height:9px;border-radius:2px}
.ctb-sep{width:1px;height:16px;background:var(--ln);margin:0 2px}
.bsk{padding:10px 12px;border-radius:3px;border:1px solid var(--ln2);background:rgba(0,0,0,.15);margin-bottom:9px}
.bsk.macro{border-left:3px solid var(--gd)}
.bsk.internal{border-left:3px solid var(--vi)}
.bsk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.bsk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:5px;margin-top:6px}
.bst{background:rgba(0,0,0,.3);border-radius:2px;padding:5px 7px}
.bst .l{font-family:var(--mn);font-size:.4rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx4);margin-bottom:2px}
.bst .v{font-family:var(--mn);font-size:.68rem;color:var(--tx)}
.bst .v.g{color:var(--gr)}
.bst .v.r{color:var(--rd)}
.bst .v.w{color:var(--wn)}
.bst .v.gd{color:var(--gdl)}
.ebar{display:flex;gap:2px;margin-top:7px;height:5px;border-radius:3px;overflow:hidden;background:rgba(0,0,0,.4)}
.ebar .seg{flex:1;background:rgba(255,255,255,.06);transition:all .3s}
.ebar .seg.filled{background:var(--gd)}
.ebar .seg.closed{background:var(--gr)}
.ebar .seg.runner{background:var(--vi)}
.log{max-height:280px;overflow-y:auto;font-family:var(--mn);font-size:.58rem;color:var(--tx2);padding:9px 12px;line-height:1.7}
.log .t{color:var(--tx4);margin-right:6px}
.log .ok{color:var(--gr)}
.log .no{color:var(--rd)}
.log .w{color:var(--wn)}
.log .gd{color:var(--gdl)}
.log .vi{color:var(--vi)}
.pos-tbl td{font-size:.68rem;padding:5px 8px}
.pos-tbl tr.hedge{background:rgba(139,122,255,.04)}

const YAHOO_INVERSE = {'SPX':'^GSPC','NDX':'^NDX','DJI':'^DJI','RUT':'^RUT','FTSE':'^FTSE','N225':'^N225','HSI':'^HSI','DAX':'^GDAXI','CAC':'^FCHI','SX5E':'^STOXX50E','VIX':'^VIX','GC':'GC=F','SI':'SI=F','CL':'CL=F','NG':'NG=F','HG':'HG=F','ES':'ES=F','NQ':'NQ=F','YM':'YM=F','RTY':'RTY=F'};

function looksLikeForex(s){ return s.length===6 && CCY.includes(s.slice(0,3)) && CCY.includes(s.slice(3)); }
function parseSymbol(sym){
  const s = String(sym||'').trim();
  if(!s) return { source:'BINANCE', ticker:'BTCUSDT' };
  if(s.includes(':')){ const [src,...rest]=s.split(':'); return { source:src.toUpperCase(), ticker:rest.join(':') }; }
  const u = s.toUpperCase();
  if(u.includes('/')){ const [base,quote]=u.split('/'); if(['USDT','BUSD','USDC','FDUSD'].includes(quote)) return { source:'BINANCE', ticker:base+quote }; return { source:'YAHOO', ticker:base+quote+'=X' }; }
  if(/(USDT|BUSD|USDC|FDUSD)$/.test(u) && u.length<=12) return { source:'BINANCE', ticker:u };
  if(YAHOO_INVERSE[u]) return { source:'YAHOO', ticker:YAHOO_INVERSE[u] };
  if(looksLikeForex(u)) return { source:'YAHOO', ticker:u+'=X' };
  return { source:'YAHOO', ticker:u };
}
function prettyTicker(source, ticker){
  if(source==='BINANCE') return ticker.replace(/(USDT|BUSD|USDC|FDUSD)$/, '/$1');
  if(PRETTY_ALIASES[ticker]) return PRETTY_ALIASES[ticker];
  if(ticker.endsWith('=X')) return ticker.slice(0,-2);
  if(ticker.endsWith('=F')) return ticker.slice(0,-2);
  if(ticker.startsWith('^')) return ticker.slice(1);
  return ticker;
}
function prettySymbol(pair){ const { source, ticker } = parseSymbol(pair); return prettyTicker(source, ticker); }

function solIsNA(v){ return v === null || v === undefined || !isFinite(v); }

function solComputeMacroPoles(cs){
  if(cs.length < 60) return;
  const lookback = Math.min(1000, cs.length);
  let hh=-Infinity, ll=Infinity, hb=0, lb=0;
  for(let k=0; k<lookback; k++){
    const idx = cs.length-1-k;
    if(cs[idx].h > hh){ hh=cs[idx].h; hb=k; }
    if(cs[idx].l < ll){ ll=cs[idx].l; lb=k; }
  }
  const bi = cs.length-1;
  SOL.macro.F100.price = hh;
  SOL.macro.F100.originIdx = bi - hb;
  SOL.macro.F100.originTime = cs[cs.length-1-hb].t;
  SOL.macro.F0.price = ll;
  SOL.macro.F0.originIdx = bi - lb;
  SOL.macro.F0.originTime = cs[cs.length-1-lb].t;
  SOL.macro.range = hh - ll;
  const zw = SOL.macro.range * SOL.settings.ZONE_PCT;
  SOL.macro.buyZone.bot  = ll;
  SOL.macro.buyZone.top  = ll + zw;
  SOL.macro.sellZone.top = hh;
  SOL.macro.sellZone.bot = hh - zw;
  SOL.macro.F100.bar = solLastRejection(cs, hh, true,  bi - SOL.macro.F100.originIdx);
  SOL.macro.F0.bar   = solLastRejection(cs, ll, false, bi - SOL.macro.F0.originIdx);
}

function solComputeInternalPoles(cs){
  const ltf = CH.ltfCandles;
  if(!ltf || ltf.length < 60){
    SOL.internal.F0.price = null; SOL.internal.F100.price = null;
    SOL.internal.buyZone.top = SOL.internal.buyZone.bot = null;
    SOL.internal.sellZone.top = SOL.internal.sellZone.bot = null;
    SOL.internal.range = 0;
    return;
  }
  const lookback = Math.min(1000, ltf.length);
  let hh=-Infinity, ll=Infinity, hb=0, lb=0;
  for(let k=0; k<lookback; k++){
    const idx = ltf.length-1-k;
    if(ltf[idx].h > hh){ hh=ltf[idx].h; hb=k; }
    if(ltf[idx].l < ll){ ll=ltf[idx].l; lb=k; }
  }
  SOL.internal.F100.price = hh;
  SOL.internal.F100.originTime = ltf[ltf.length-1-hb].t;
  SOL.internal.F0.price = ll;
  SOL.internal.F0.originTime = ltf[ltf.length-1-lb].t;
  SOL.internal.range = hh - ll;
  SOL.internal.source = CH.ltfTf ? CH.ltfTf.toUpperCase() : null;
  const zw = SOL.internal.range * SOL.settings.ZONE_PCT;
  SOL.internal.buyZone.bot  = ll;
  SOL.internal.buyZone.top  = ll + zw;
  SOL.internal.sellZone.top = hh;
  SOL.internal.sellZone.bot = hh - zw;
  const last = cs[cs.length-1];
  SOL.internal.F0.armed = last.c > ll + 0.5 * (CH.atr||0);
  SOL.internal.F100.armed = last.c < hh - 0.5 * (CH.atr||0);
}

function solLastRejection(cs, level, isHigh, fallback){
  if(solIsNA(level)) return fallback;
  const atr = CH.atr || 0.00001;
  const tol = 0.20 * atr;
  const scan = Math.min(400, cs.length-1);
  for(let q=0; q<=scan; q++){
    const idx = cs.length-1-q;
    if(idx < 0) break;
    const w = isHigh ? cs[idx].h : cs[idx].l;
    const pierced = isHigh ? (w >= level - tol) : (w <= level + tol);
    if(!pierced) continue;
    const inside = isHigh ? (cs[idx].c < level) : (cs[idx].c > level);
    if(inside) return q;
  }
  return fallback;
}

function solDetectCHoCH(cs, zone, dir){
  if(cs.length < 20) return null;
  const atr = CH.atr || 0.00001;
  const lb = SOL.settings.SWING_LOOKBACK;
  const last = cs[cs.length-1];
  const prev = cs[cs.length-2];
  if(dir === 1){
    if(solIsNA(zone.bot) || solIsNA(zone.top)) return null;
    let swept = false;
    for(let k=1; k<=SOL.settings.SWEEP_LOOKBACK && k<cs.length-1; k++){
      const c = cs[cs.length-1-k];
      if(c.l <= zone.top + atr*0.05){ swept = true; break; }
    }
    if(!swept) return null;
    let sh = -Infinity;
    for(let k=1; k<=lb; k++){
      const c = cs[cs.length-1-k-1];
      if(!c) break;
      if(c.h > sh) sh = c.h;
    }
    if(prev.c <= sh && last.c > sh) return { level: sh, ts: last.t };
  } else {
    if(solIsNA(zone.top) || solIsNA(zone.bot)) return null;
    let swept = false;
    for(let k=1; k<=SOL.settings.SWEEP_LOOKBACK && k<cs.length-1; k++){
      const c = cs[cs.length-1-k];
      if(c.h >= zone.bot - atr*0.05){ swept = true; break; }
    }
    if(!swept) return null;
    let sl = Infinity;
    for(let k=1; k<=lb; k++){
      const c = cs[cs.length-1-k-1];
      if(!c) break;
      if(c.l < sl) sl = c.l;
    }
    if(prev.c >= sl && last.c < sl) return { level: sl, ts: last.t };
  }
  return null;
}

function enMacroAvgEntry(){
  const open = EN.macro.positions.filter(p => p.status === 'OPEN');
  if(!open.length) return null;
  let vol = 0, sum = 0;
  for(const p of open){ vol += p.lots; sum += p.lots * p.entry; }
  return vol > 0 ? sum / vol : null;
}

function enMacroBreakeven(){
  const avg = enMacroAvgEntry();
  if(avg == null) return null;
  const open = EN.macro.positions.filter(p => p.status === 'OPEN');
  const totalLots = open.reduce((s,p)=>s+p.lots,0);
  if(totalLots <= 0) return avg;
  const costs = totalLots * EN.costsPerLotBps * 1e-4;
  const side = EN.macro.side;
  return side === 'BUY' ? (avg + costs / totalLots) : (avg - costs / totalLots);
}

function solResolve(cs){
  if(cs.length < 60) return;
  solComputeMacroPoles(cs);
  solComputeInternalPoles(cs);

  const mBull = solDetectCHoCH(cs, SOL.macro.buyZone, 1);
  const mBear = solDetectCHoCH(cs, SOL.macro.sellZone, -1);
  if(mBull){ SOL.choch.macro = { dir:1, level:mBull.level, ts:mBull.ts, refPrice:SOL.macro.F0.price }; }
  else if(mBear){ SOL.choch.macro = { dir:-1, level:mBear.level, ts:mBear.ts, refPrice:SOL.macro.F100.price }; }

  const iBull = solDetectCHoCH(cs, SOL.internal.buyZone, 1);
  const iBear = solDetectCHoCH(cs, SOL.internal.sellZone, -1);
  if(iBull){ SOL.choch.internal = { dir:1, level:iBull.level, ts:iBull.ts, refPrice:SOL.internal.F0.price }; }
  else if(iBear){ SOL.choch.internal = { dir:-1, level:iBear.level, ts:iBear.ts, refPrice:SOL.internal.F100.price }; }

  const atr = CH.atr || 0.00001;

  if(SOL.choch.macro.dir !== 0 && !solIsNA(SOL.macro.F0.price) && !solIsNA(SOL.macro.F100.price)){
    const isBuy = SOL.choch.macro.dir === 1;
    const entryLvl = SOL.choch.macro.level;
    const stop = isBuy ? SOL.macro.F0.price - SOL.settings.STOP_ATR*atr : SOL.macro.F100.price + SOL.settings.STOP_ATR*atr;
    const target = isBuy ? SOL.macro.F100.price : SOL.macro.F0.price;
    const risk = Math.abs(entryLvl - stop);
    const rew  = Math.abs(target - entryLvl);
    SOL.trade.macro = { side:isBuy?'BUY':'SELL', entry:entryLvl, stop, target, rr:risk>0?rew/risk:0 };
  } else {
    SOL.trade.macro = { side:null, entry:null, stop:null, target:null, rr:0 };
  }

  if(SOL.choch.internal.dir !== 0 && !solIsNA(SOL.internal.F0.price) && !solIsNA(SOL.internal.F100.price)){
    const isBuy = SOL.choch.internal.dir === 1;
    const entryLvl = SOL.choch.internal.level;
    const stop = isBuy ? SOL.internal.F0.price - SOL.settings.STOP_ATR*atr : SOL.internal.F100.price + SOL.settings.STOP_ATR*atr;
    const hedgeBE = enMacroBreakeven();
    const target = hedgeBE != null ? hedgeBE : (isBuy ? SOL.macro.F100.price : SOL.macro.F0.price);
    const risk = Math.abs(entryLvl - stop);
    const rew  = Math.abs(target - entryLvl);
    SOL.trade.internal = { side:isBuy?'BUY':'SELL', entry:entryLvl, stop, target, rr:risk>0?rew/risk:0 };
  } else {
    SOL.trade.internal = { side:null, entry:null, stop:null, target:null, rr:0 };
  }

  SOL.fvg.bull = null;
  SOL.fvg.bear = null;
}

const BINANCE_TF  = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
const YAHOO_TF    = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'1h','1d':'1d','1wk':'1wk' };
const YAHOO_RANGE = { '1m':'5d','5m':'1mo','15m':'1mo','1h':'3mo','4h':'1y','1d':'2y','1wk':'5y' };

async function fetchCandlesBinance(ticker, tf, limit=500){
  const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${ticker}&interval=${BINANCE_TF[tf]||'1h'}&limit=${limit}`);
  if(!r.ok) throw new Error('Binance HTTP ' + r.status);
  const d = await r.json();
  return d.map(k => ({ t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] }));
}

async function fetchCandlesYahoo(ticker, tf){
  const interval = YAHOO_TF[tf] || '1h';
  const range    = YAHOO_RANGE[tf] || '3mo';
  const r = await fetch(`/.netlify/functions/yahoo?symbol=${encodeURIComponent(ticker)}&interval=${interval}&range=${range}`);
  if(!r.ok) throw new Error('Yahoo HTTP ' + r.status);
  const j = await r.json();
  const res = j?.chart?.result?.[0];
  if(!res || !res.timestamp?.length) throw new Error('Yahoo: no data');
  const ts = res.timestamp, q = res.indicators?.quote?.[0] || {};
  const out = [];
  for(let i=0;i<ts.length;i++){
    if(q.open[i]==null || q.close[i]==null) continue;
    out.push({ t:ts[i]*1000, o:q.open[i], h:q.high[i], l:q.low[i], c:q.close[i], v:q.volume?.[i]||0 });
  }
  return out;
}

async function fetchCandlesUnified(symbol, tf, limit=500){
  if(APP_MODE === 'SIM') return generateSim(symbol, limit);
  const { source, ticker } = parseSymbol(symbol);
  if(source === 'YAHOO') return await fetchCandlesYahoo(ticker, tf);
  return await fetchCandlesBinance(ticker, tf, limit);
}

async function loadLtfCandles(){

    else CH.ltfCandles = await fetchCandlesYahoo(ticker, ltf);
  }catch(e){
    CH.ltfCandles = [];
  }
}

function generateSim(sym, count){
  const { ticker } = parseSymbol(sym);
  let p = /BTC|ETH|SOL|BNB|XRP|ADA|AVAX|LINK|DOGE/i.test(ticker) ? 100 + Math.random()*600 : 100;
  const out = [];
  const step = {'1m':60e3,'5m':300e3,'15m':900e3,'1h':3600e3,'4h':14400e3,'1d':86400e3}[CH.tf] || 3600e3;
  const now = Date.now();
  for(let i=count-1;i>=0;i--){
    const t = now - i*step;
    const o = p; p += (Math.random()-0.495)*p*0.003; const c = p;
    out.push({t,o,h:Math.max(o,c)+Math.random()*p*0.001,l:Math.min(o,c)-Math.random()*p*0.001,c,v:Math.random()*1e6});
  }
  return out;
}

function computeATR(){
  const cs = CH.candles; if(cs.length < 15) return;
  let s = 0;
  for(let i=cs.length-14;i<cs.length;i++){
    const c = cs[i], pc = cs[i-1]?.c || c.o;
    s += Math.max(c.h-c.l, Math.abs(c.h-pc), Math.abs(c.l-pc));
  }
  CH.atr = s/14;
}

function connectWS(){
  try{
    const { ticker } = parseSymbol(CH.pair);
    const sym = ticker.toLowerCase(), tf = BINANCE_TF[CH.tf] || '1h';
    CH.ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym}@kline_${tf}`);
    CH.ws.onopen  = () => { CH.live = true; updateFeedDot(); };
    CH.ws.onmessage = e => {
      try{
        const m = JSON.parse(e.data); if(!m.k) return;
        const k = m.k;
        const c = { t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v };
        const cs = CH.candles;
        if(cs.length && cs[cs.length-1].t === c.t) cs[cs.length-1] = c;
        else if(!cs.length || c.t > cs[cs.length-1].t){ cs.push(c); if(cs.length > 600) cs.shift(); }
        computeATR(); solResolve(cs); scheduleDraw(); engineTick();
      }catch(_){}
    };
    CH.ws.onerror = () => { CH.live = false; updateFeedDot(); };
    CH.ws.onclose = () => { CH.live = false; updateFeedDot(); };
  }catch(_){ CH.live = false; updateFeedDot(); }
}

let _yahooTimer = null;
function startYahooPolling(){
  stopYahooPolling();
  CH.live = true; updateFeedDot();
  _yahooTimer = setInterval(async () => {
    try{
      const fresh = await fetchCandlesUnified(CH.pair, CH.tf, 500);
      if(!fresh.length) return;
      const cs = CH.candles;
      const tailN = Math.min(3, fresh.length);
      cs.splice(cs.length - tailN, tailN, ...fresh.slice(-tailN));
      computeATR(); solResolve(cs); scheduleDraw(); engineTick();
    }catch(_){}
  }, 45000);
}
function stopYahooPolling(){ if(_yahooTimer){ clearInterval(_yahooTimer); _yahooTimer = null; } }
function disconnectWS(){
  if(CH.ws){ try{ CH.ws.close(); }catch(_){} CH.ws = null; }
  stopYahooPolling();
  CH.live = false;
}

  if(!canExecuteBot()) return;
  if(EN.macro.positions.filter(p=>p.status==='OPEN').length >= EN.MAX_MACRO){ logEngine('MACRO cap 9', 'w'); return; }
  if(totalOpen() >= EN.MAX_TOTAL){ logEngine('Total cap 18', 'w'); return; }

  EN.macro.target = t.target;
  EN.macro.stop = t.stop;
  for(let i=0; i<CFG.BASKET_SIZE; i++){
    if(totalOpen() >= EN.MAX_TOTAL) break;
    const jitter = (Math.random()-0.5) * CH.atr * 0.15;
    EN.macro.positions.push({
      id:uuid(), basketId, engine:'MACRO', side:t.side,
      entry: t.entry + jitter, lots: 0.01 + i*0.002, closed:0,
      stop:t.stop, target:t.target,
      t1Closed:false, t2Closed:false, status:'OPEN',
      opened:Date.now(), pnl:0, progress:0, hedgeOf:null
    });
  }
  logEngine(`MACRO ${t.side} · 9 opened @ ~${t.entry.toFixed(2)} → TP ${t.target.toFixed(2)} (1:${t.rr.toFixed(1)})`, t.side==='BUY'?'ok':'no');
  toast(`MACRO ${t.side} basket opened`, 'success');
  audit('MACRO_BASKET_OPEN', `${t.side} @ ${t.entry.toFixed(2)} → ${t.target.toFixed(2)}`, 'ENGINE', basketId);
}

function openInternalHedge(dir){
  if(!canExecuteBot()) return;
  const macroOpen = EN.macro.positions.filter(p=>p.status==='OPEN');
  if(!macroOpen.length){ logEngine('Internal ignored — no macro', 'w'); return; }
  const macroSide = EN.macro.side;
  const wantSide = macroSide === 'BUY' ? 'SELL' : 'BUY';
  if((dir === 1 && wantSide !== 'BUY') || (dir === -1 && wantSide !== 'SELL')) return;
  if(EN.internal.positions.filter(p=>p.status==='OPEN').length >= EN.MAX_INTERNAL){ logEngine('Internal cap 9', 'w'); return; }
  if(totalOpen() >= EN.MAX_TOTAL){ logEngine('Total cap 18', 'w'); return; }
  if(EN.internal.hedgeOf === EN.macro.basketId){ logEngine('Hedge already exists', 'w'); return; }
  if(!SOL.trade.internal.side) return;
  const t = SOL.trade.internal;
  const be = enMacroBreakeven();
  if(be == null){ logEngine('No macro BE available', 'w'); return; }
  const basketId = 'I-'+Date.now().toString(36);
  EN.internal.basketId = basketId;
  EN.internal.side = t.side;
  EN.internal.target = be;
  EN.internal.stop = t.stop;
  EN.internal.hedgeOf = EN.macro.basketId;
  for(let i=0; i<CFG.BASKET_SIZE; i++){
    if(totalOpen() >= EN.MAX_TOTAL) break;
    const jitter = (Math.random()-0.5) * CH.atr * 0.15;
    EN.internal.positions.push({
      id:uuid(), basketId, engine:'INTERNAL', side:t.side,
      entry: t.entry + jitter, lots: 0.01 + i*0.002, closed:0,
      stop:t.stop, target:be,
      t1Closed:false, t2Closed:false, status:'OPEN',
      opened:Date.now(), pnl:0, progress:0, hedgeOf: EN.macro.basketId
    });
  }
  logEngine(`INTERNAL ${t.side} hedge · 9 opened @ ~${t.entry.toFixed(2)} → BE ${be.toFixed(2)}`, 'vi');
  toast(`Internal ${t.side} hedge opened`, 'success');
  audit('INTERNAL_HEDGE_OPEN', `${t.side} @ ${t.entry.toFixed(2)} → BE ${be.toFixed(2)}`, 'ENGINE', basketId);
}

function managePositions(last){
  const all = [...EN.macro.positions, ...EN.internal.positions];
  for(const p of all){
    if(p.status !== 'OPEN') continue;
    const dist = Math.abs(p.target - p.entry) || 1;
    p.progress = p.side === 'BUY' ? (last.c - p.entry)/dist : (p.entry - last.c)/dist;
    p.pnl = (p.side === 'BUY' ? (last.c - p.entry) : (p.entry - last.c)) * p.lots * 100;
    if((p.side === 'BUY' && last.c >= p.target) || (p.side === 'SELL' && last.c <= p.target)){
      p.status = 'CLOSED'; p.closed = p.lots;
      logEngine(`${p.engine} ${p.side} TP @ ${last.c.toFixed(2)}`, 'ok');
      continue;
    }
    if((p.side === 'BUY' && last.c <= p.stop) || (p.side === 'SELL' && last.c >= p.stop)){
      p.status = 'CLOSED';
      logEngine(`${p.engine} ${p.side} stopped @ ${last.c.toFixed(2)}`, 'no');
      continue;
    }
    const risk = Math.abs(p.entry - p.stop);
    if(risk > 0){
      const rrNow = (p.side==='BUY' ? (last.c - p.entry) : (p.entry - last.c)) / risk;
      if(rrNow >= CFG.T2_R && !p.t2Closed){
        const cv = p.lots * CFG.T2_CLOSE;
        if(cv >= 0.01){ p.lots -= cv; p.t2Closed = true; logEngine(`${p.engine} T2 (5R)`, 'gd'); }
      } else if(rrNow >= CFG.T1_R && !p.t1Closed){
        const cv = p.lots * CFG.T1_CLOSE;
        if(cv >= 0.01){ p.lots -= cv; p.t1Closed = true; logEngine(`${p.engine} T1 (2R)`, 'gd'); }
      }
    }
  }
  const macroLive = EN.macro.positions.filter(p=>p.status==='OPEN');
  if(EN.macro.positions.length && !macroLive.length){
    if(EN.internal.positions.some(p=>p.status==='OPEN' && p.hedgeOf === EN.macro.basketId)){
      logEngine('Macro closed — closing orphan hedge', 'w');
      EN.internal.positions.filter(p=>p.status==='OPEN' && p.hedgeOf === EN.macro.basketId).forEach(p=>{
        p.status = 'CLOSED';
        logEngine(`INTERNAL hedge closed (macro gone)`, 'no');
      });
    }
    EN.macro.basketId = null;
    EN.macro.side = null;
  }
}

function engineTick(){
  if(!EN.running || EN.killSwitch) return;
  if(!canExecuteBot()) return;
  const cs = CH.candles; if(cs.length < 3) return;
  const last = cs[cs.length-1];

  const mCh = SOL.choch.macro;
  if(mCh.dir !== 0 && (Date.now() - mCh.ts) < 3600_000){
    const inZone = mCh.dir === 1
      ? (last.l <= SOL.macro.buyZone.top && last.c >= SOL.macro.buyZone.bot)
      : (last.h >= SOL.macro.sellZone.bot && last.c <= SOL.macro.sellZone.top);
    const alreadyFired = EN.macro.positions.some(p => p.basketId && p.opened > mCh.ts - 60_000);
    if(inZone && !alreadyFired){
      openMacroBasket(mCh.dir);
      mCh.dir = 0; mCh.level = null;
    }
  }

  const iCh = SOL.choch.internal;
  const macroOpen = EN.macro.positions.some(p=>p.status==='OPEN');
  if(iCh.dir !== 0 && macroOpen && (Date.now() - iCh.ts) < 3600_000){
    const inZone = iCh.dir === 1
      ? (last.l <= SOL.internal.buyZone.top && last.c >= SOL.internal.buyZone.bot)
      : (last.h >= SOL.internal.sellZone.bot && last.c <= SOL.internal.sellZone.top);
    const alreadyFired = EN.internal.positions.some(p => p.hedgeOf === EN.macro.basketId && p.opened > iCh.ts - 60_000);
    if(inZone && !alreadyFired){
      openInternalHedge(iCh.dir);
      iCh.dir = 0; iCh.level = null;
    }
  }

  managePositions(last);
}

async function hydrateData(){

    holders:'holders', ouvVersions:'ouv_versions', proposals:'proposals', distributions:'distributions',

    invites:'invites', audit:'audit_log', mt5:'mt5_accounts', externalAccounts:'external_accounts',

function denorm(row){
  const out = {};
  for(const [k,v] of Object.entries(row)) out[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())] = v;
  return out;
}

let cv=null, ctx=null, DPR=1, W=0, H=0;
const PAD = {t:22, r:68, b:42, l:10};

function initCanvas(){ cv = $('cv'); if(!cv) return; ctx = cv.getContext('2d'); resizeCanvas(); drawAll(); installChartControls(); }
function resizeCanvas(){
  if(!cv) return;
  const r = cv.parentElement.getBoundingClientRect();
  DPR = window.devicePixelRatio || 1;
  cv.width = r.width*DPR; cv.height = r.height*DPR;
  cv.style.width = r.width+'px'; cv.style.height = r.height+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W = r.width; H = r.height;
}
let _lastDraw = 0;
function scheduleDraw(){ const now=Date.now(); if(now-_lastDraw<80) return; _lastDraw=now; drawAll(); }

function installChartControls(){
  if(!cv || cv._wired) return;
  cv._wired = true;
  cv.addEventListener('mousemove', e => { const r=cv.getBoundingClientRect(); cv._mx=e.clientX-r.left; cv._my=e.clientY-r.top; drawAll(); });
  cv.addEventListener('mouseleave', () => { cv._mx=null; cv._my=null; drawAll(); });
  cv.addEventListener('touchstart', e => { if(e.touches.length!==1) return; const t=e.touches[0],r=cv.getBoundingClientRect(); cv._mx=t.clientX-r.left; cv._my=t.clientY-r.top; drawAll(); }, {passive:true});
  cv.addEventListener('touchmove', e => { if(e.touches.length!==1) return; const t=e.touches[0],r=cv.getBoundingClientRect(); cv._mx=t.clientX-r.left; cv._my=t.clientY-r.top; drawAll(); }, {passive:true});
  cv.addEventListener('touchend', () => { cv._mx=null; cv._my=null; drawAll(); });
  cv.addEventListener('wheel', e => { e.preventDefault(); if(e.deltaY<0) CH.zoomBars=Math.max(50,(CH.zoomBars||200)-20); else CH.zoomBars=Math.min(400,(CH.zoomBars||200)+20); drawAll(); }, {passive:false});
}

function drawAll(){ drawSolace(); }

function drawSolace(){
  if(!cv || !ctx) return;
  const P = PRESETS[CH.preset];
  const cs = CH.candles;
  ctx.fillStyle = P.bg; ctx.fillRect(0,0,W,H);
  if(cs.length < 20) return;

  const cw = W-PAD.l-PAD.r, ch = H-PAD.t-PAD.b;
  const zoomBars = CH.zoomBars || 200;
  const visCount = Math.min(zoomBars, cs.length);
  const start = cs.length - visCount;

  let vmin=Infinity, vmax=-Infinity;
  for(let i=start;i<cs.length;i++){ if(cs[i].l<vmin) vmin=cs[i].l; if(cs[i].h>vmax) vmax=cs[i].h; }
  const levels = [
    SOL.macro.F0.price, SOL.macro.F100.price,
    SOL.internal.F0.price, SOL.internal.F100.price,
    SOL.macro.buyZone.top, SOL.macro.sellZone.bot,
    SOL.internal.buyZone.top, SOL.internal.sellZone.bot,
    SOL.trade.macro.entry, SOL.trade.macro.stop, SOL.trade.macro.target,
    SOL.trade.internal.entry, SOL.trade.internal.stop, SOL.trade.internal.target,
  ];
  for(const v of levels) if(!solIsNA(v)){ vmin=Math.min(vmin,v); vmax=Math.max(vmax,v); }
  const rng = vmax-vmin || 1;
  vmin -= rng*0.06;
  vmax += rng*0.06;

  const xAt = i => PAD.l + (i-start)/(visCount-1)*cw;
  const yAt = v => PAD.t + (1-(v-vmin)/(vmax-vmin))*ch;

  ctx.strokeStyle = P.grid; ctx.lineWidth = 1;
  for(let i=0;i<=5;i++){ const y = PAD.t+(i/5)*ch; ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke(); }
  ctx.strokeStyle = P.gridMajor;
  for(let i=0;i<=10;i++){ const x = PAD.l+(i/10)*cw; ctx.beginPath(); ctx.moveTo(x,PAD.t); ctx.lineTo(x,H-PAD.b); ctx.stroke(); }

  // Zone shading
  if(CH.toggles.zones){
    // Macro buy zone
    if(!solIsNA(SOL.macro.buyZone.top) && !solIsNA(SOL.macro.buyZone.bot)){
      const y1 = yAt(SOL.macro.buyZone.top), y2 = yAt(SOL.macro.buyZone.bot);
      ctx.fillStyle = 'rgba(61,220,151,.06)';
      ctx.fillRect(PAD.l, Math.min(y1,y2), cw, Math.abs(y2-y1));
      ctx.strokeStyle = 'rgba(61,220,151,.3)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      ctx.strokeRect(PAD.l, Math.min(y1,y2), cw, Math.abs(y2-y1));
      ctx.setLineDash([]);
    }
    // Macro sell zone
    if(!solIsNA(SOL.macro.sellZone.top) && !solIsNA(SOL.macro.sellZone.bot)){
      const y1 = yAt(SOL.macro.sellZone.top), y2 = yAt(SOL.macro.sellZone.bot);
      ctx.fillStyle = 'rgba(217,70,90,.06)';
      ctx.fillRect(PAD.l, Math.min(y1,y2), cw, Math.abs(y2-y1));
      ctx.strokeStyle = 'rgba(217,70,90,.3)'; ctx.setLineDash([3,3]);
      ctx.strokeRect(PAD.l, Math.min(y1,y2), cw, Math.abs(y2-y1));
      ctx.setLineDash([]);
    }
    // Internal buy zone (dimmer)
    if(!solIsNA(SOL.internal.buyZone.top) && !solIsNA(SOL.internal.buyZone.bot)){
      const y1 = yAt(SOL.internal.buyZone.top), y2 = yAt(SOL.internal.buyZone.bot);
      ctx.fillStyle = 'rgba(139,122,255,.05)';
      ctx.fillRect(PAD.l, Math.min(y1,y2), cw*0.55, Math.abs(y2-y1));
    }
    // Internal sell zone
    if(!solIsNA(SOL.internal.sellZone.top) && !solIsNA(SOL.internal.sellZone.bot)){
      const y1 = yAt(SOL.internal.sellZone.top), y2 = yAt(SOL.internal.sellZone.bot);
      ctx.fillStyle = 'rgba(139,122,255,.05)';
      ctx.fillRect(PAD.l+cw*0.45, Math.min(y1,y2), cw*0.55, Math.abs(y2-y1));
    }
  }

  const cw2 = Math.max(1.5, cw/visCount-1);
  for(let i=start;i<cs.length;i++){
    const c = cs[i], x = xAt(i), up = c.c >= c.o;
    const bC = up?P.bull:P.bear, bB = up?P.bullB:P.bearB, bW = up?P.bullW:P.bearW;
    ctx.strokeStyle = bW; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yAt(c.h)); ctx.lineTo(x, yAt(c.l)); ctx.stroke();
    const yO = yAt(c.o), yC = yAt(c.c);
    const top = Math.min(yO,yC), bh = Math.max(1, Math.abs(yC-yO));
    ctx.fillStyle = bC; ctx.fillRect(x-cw2/2, top, cw2, bh);
    ctx.strokeStyle = bB; ctx.strokeRect(x-cw2/2+0.5, top+0.5, cw2-1, Math.max(1,bh-1));
  }

  if(CH.toggles.vol){
    let vMax = 0;
    for(let i=start;i<cs.length;i++) if(cs[i].v > vMax) vMax = cs[i].v;
    if(vMax > 0){
      const vh = PAD.b*0.6, v0 = H-PAD.b;
      ctx.fillStyle = P.vol;
      for(let i=start;i<cs.length;i++){ const bh = (cs[i].v/vMax)*vh; ctx.fillRect(xAt(i)-cw2/2, v0-bh, cw2, bh); }
    }
  }

  // MACRO F100 (top pole)
  if(CH.toggles.poles && !solIsNA(SOL.macro.F100.price)){
    const y = yAt(SOL.macro.F100.price);
    ctx.strokeStyle = P.macroHi; ctx.lineWidth = 1.5;
    ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W-PAD.r, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = P.macroHi;
    ctx.font = '10px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(`F100  ${SOL.macro.F100.price.toFixed(2)}`, W-PAD.r+4, y-4);
  }
  // MACRO F0 (bottom pole)
  if(CH.toggles.poles && !solIsNA(SOL.macro.F0.price)){
    const y = yAt(SOL.macro.F0.price);
    ctx.strokeStyle = P.macroLo; ctx.lineWidth = 1.5;
    ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W-PAD.r, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = P.macroLo;
    ctx.font = '10px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(`F0    ${SOL.macro.F0.price.toFixed(2)}`, W-PAD.r+4, y+12);
  }

  // INTERNAL poles (dotted, purple)
  if(CH.toggles.internal){
    if(!solIsNA(SOL.internal.F100.price)){
      const y = yAt(SOL.internal.F100.price);
      ctx.strokeStyle = 'rgba(139,122,255,.6)'; ctx.lineWidth = 1;
      ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(PAD.l+cw*0.4, y); ctx.lineTo(W-PAD.r, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(139,122,255,.9)';
      ctx.font = '9px "JetBrains Mono", monospace'; ctx.textAlign='left';
      const src = SOL.internal.source ? ` (${SOL.internal.source})` : '';
      ctx.fillText(`INT-H${src}  ${SOL.internal.F100.price.toFixed(2)}`, W-PAD.r+4, y-4);
    }
    if(!solIsNA(SOL.internal.F0.price)){
      const y = yAt(SOL.internal.F0.price);
      ctx.strokeStyle = 'rgba(139,122,255,.6)'; ctx.lineWidth = 1;
      ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(PAD.l+cw*0.4, y); ctx.lineTo(W-PAD.r, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(139,122,255,.9)';
      ctx.font = '9px "JetBrains Mono", monospace'; ctx.textAlign='left';
      ctx.fillText(`INT-L  ${SOL.internal.F0.price.toFixed(2)}`, W-PAD.r+4, y+12);
    }
  }

  // MACRO CHoCH neckline
  if(CH.toggles.choch && SOL.choch.macro.dir !== 0 && !solIsNA(SOL.choch.macro.level)){
    const y = yAt(SOL.choch.macro.level);
    const c = SOL.choch.macro.dir === 1 ? 'rgba(61,220,151,.9)' : 'rgba(217,70,90,.9)';
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W-PAD.r, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = c;
    ctx.font = '10px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(`MACRO CHoCH ${SOL.choch.macro.dir===1?'BULL':'BEAR'}  ${SOL.choch.macro.level.toFixed(2)}`, PAD.l+4, y-4);
  }

  // INTERNAL CHoCH neckline (dashed)
  if(CH.toggles.choch && SOL.choch.internal.dir !== 0 && !solIsNA(SOL.choch.internal.level)){
    const y = yAt(SOL.choch.internal.level);
    const c = SOL.choch.internal.dir === 1 ? 'rgba(139,122,255,.9)' : 'rgba(255,140,80,.9)';
    ctx.strokeStyle = c; ctx.lineWidth = 1.5;
    ctx.setLineDash([1,4]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W-PAD.r, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = c;
    ctx.font = '9px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(`INT CHoCH ${SOL.choch.internal.dir===1?'BULL':'BEAR'}  ${SOL.choch.internal.level.toFixed(2)}`, PAD.l+4, y-4);
  }

  // MACRO trade geometry
  if(CH.toggles.trades && SOL.trade.macro.side && SOL.trade.macro.rr >= 9.5){
    const te = SOL.trade.macro.entry, ts = SOL.trade.macro.stop, tt = SOL.trade.macro.target;
    if(!solIsNA(te)){ ctx.strokeStyle='rgba(255,140,0,.95)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD.l,yAt(te)); ctx.lineTo(W-PAD.r,yAt(te)); ctx.stroke(); }
    if(!solIsNA(ts)){ ctx.strokeStyle='rgba(220,20,60,.7)'; ctx.lineWidth=1; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(PAD.l,yAt(ts)); ctx.lineTo(W-PAD.r,yAt(ts)); ctx.stroke(); ctx.setLineDash([]); }
    if(!solIsNA(tt)){ ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(PAD.l,yAt(tt)); ctx.lineTo(W-PAD.r,yAt(tt)); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle='rgba(255,140,0,.95)'; ctx.font='10px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(`MACRO ${SOL.trade.macro.side} entry ${te.toFixed(2)} stop ${ts.toFixed(2)} → ${tt.toFixed(2)} 1:${SOL.trade.macro.rr.toFixed(1)}`, PAD.l+6, yAt(ts)+14);
  }

  // INTERNAL trade geometry
  if(CH.toggles.trades && SOL.trade.internal.side && SOL.trade.internal.rr >= 5){
    const te = SOL.trade.internal.entry, ts = SOL.trade.internal.stop, tt = SOL.trade.internal.target;
    if(!solIsNA(te)){ ctx.strokeStyle='rgba(139,122,255,.9)'; ctx.lineWidth=2; ctx.setLineDash([3,2]); ctx.beginPath(); ctx.moveTo(PAD.l,yAt(te)); ctx.lineTo(W-PAD.r,yAt(te)); ctx.stroke(); ctx.setLineDash([]); }
    if(!solIsNA(tt)){ ctx.strokeStyle='rgba(139,122,255,.6)'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(PAD.l,yAt(tt)); ctx.lineTo(W-PAD.r,yAt(tt)); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle='rgba(139,122,255,.95)'; ctx.font='10px "JetBrains Mono", monospace'; ctx.textAlign='left';
    ctx.fillText(`INTERNAL ${SOL.trade.internal.side} hedge → BE ${tt.toFixed(2)} 1:${SOL.trade.internal.rr.toFixed(1)}`, PAD.l+6, yAt(te)+14);
  }

  // Price axis
  ctx.font = '9px "JetBrains Mono", monospace'; ctx.fillStyle = P.text; ctx.textBaseline = 'middle';
  for(let i=0;i<=5;i++){ const v = vmax-(i/5)*(vmax-vmin), y = PAD.t+(i/5)*ch; ctx.fillText(v.toFixed(v>100?2:4), W-PAD.r+5, y); }
  const last = cs[cs.length-1], yLast = yAt(last.c);
  const tag = last.c.toFixed(last.c>100?2:4);
  const tw = ctx.measureText(tag).width + 10;
  ctx.fillStyle = last.c >= last.o ? P.bullB : P.bearB;
  ctx.fillRect(W-PAD.r+2, yLast-8, tw, 16);
  ctx.fillStyle = '#07080a'; ctx.textAlign='left';
  ctx.fillText(tag, W-PAD.r+7, yLast);

  // Crosshair
  if(cv._mx != null && cv._my != null){
    ctx.strokeStyle = 'rgba(201,168,76,0.4)'; ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(cv._mx, PAD.t); ctx.lineTo(cv._mx, H-PAD.b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD.l, cv._my); ctx.lineTo(W-PAD.r, cv._my); ctx.stroke();
    ctx.setLineDash([]);
    const priceAtY = vmax - ((cv._my-PAD.t)/(H-PAD.t-PAD.b)) * (vmax-vmin);
    ctx.fillStyle = 'rgba(201,168,76,0.9)';
    ctx.fillRect(W-PAD.r, cv._my-8, PAD.r-2, 16);
    ctx.fillStyle = '#07080a';
    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.fillText(priceAtY.toFixed(priceAtY>100?2:4), W-PAD.r+5, cv._my);
  }

  updateChartHUD(); updateChartLegend(); updateChartStatus();
}

function updateChartHUD(){
  const cs = CH.candles; if(!cs.length) return;
  const last = cs[cs.length-1];
  const chg = ((last.c - last.o)/last.o*100);
  const el = $('hud'); if(!el) return;
  el.innerHTML =
    `<div><span class="k">${esc(prettySymbol(CH.pair))}</span><span class="v">${CH.tf.toUpperCase()}</span></div>` +
    `<div><span class="k">Last</span><span class="${chg>=0?'up':'dn'}">${last.c.toFixed(last.c>100?2:4)}</span> <span class="${chg>=0?'up':'dn'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span></div>` +
    `<div><span class="k">ATR</span><span class="v">${CH.atr.toFixed(CH.atr>1?2:5)}</span></div>` +
    `<div><span class="k">Macro</span><span class="${SOL.choch.macro.dir===1?'up':SOL.choch.macro.dir===-1?'dn':'w'}">${SOL.choch.macro.dir===1?'BULL CHoCH':SOL.choch.macro.dir===-1?'BEAR CHoCH':'—'}</span></div>` +
    `<div><span class="k">Internal</span><span class="${SOL.choch.internal.dir===1?'up':SOL.choch.internal.dir===-1?'dn':'w'}">${SOL.choch.internal.dir===1?'BULL CHoCH':SOL.choch.internal.dir===-1?'BEAR CHoCH':'—'}</span></div>`;
}

let _binanceSymbols = null;
let _searchDebounce = null;

async function openSymbolSearch(){
  openModal('Search Any Chart', `
    <div class="ff" style="margin-bottom:10px">
      <label for="symQuery">Symbol, name, or company</label>
      <input id="symQuery" placeholder="AAPL, gold, EURUSD, BTC, SPX…" autocomplete="off">
    </div>
    <div id="symResults" style="max-height:420px;overflow-y:auto;margin-top:6px">
      <div class="emp">Start typing to search crypto, stocks, forex, indices, commodities.</div>
    </div>
  `);
  const q = $('symQuery');
  if(!q) return;
  q.focus();
  q.addEventListener('input', () => {
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(() => runSymbolSearch(q.value), 220);
  });
  if(!_binanceSymbols && APP_MODE === 'LIVE'){
    fetch('https://api.binance.com/api/v3/exchangeInfo').then(r=>r.json()).then(j => {
      _binanceSymbols = (j.symbols||[]).filter(s=>s.status==='TRADING' && s.quoteAsset==='USDT')
        .map(s=>({ symbol:s.symbol, name:s.baseAsset+' / USDT', exchange:'BINANCE', type:'CRYPTO', source:'BINANCE' }));
    }).catch(()=>{ _binanceSymbols = []; });
  } else if(!_binanceSymbols){
    _binanceSymbols = [
      { symbol:'BTCUSDT', name:'Bitcoin / USDT', exchange:'BINANCE', type:'CRYPTO', source:'BINANCE' },
      { symbol:'ETHUSDT', name:'Ethereum / USDT', exchange:'BINANCE', type:'CRYPTO', source:'BINANCE' },
    ];
  }
}
async function runSymbolSearch(rawQuery){
  const q = String(rawQuery||'').trim();
  const host = $('symResults');
  if(!host) return;
  if(!q){ host.innerHTML = '<div class="emp">Start typing…</div>'; return; }
  host.innerHTML = '<div class="emp">Searching…</div>';
  const qU = q.toUpperCase();
  const binanceHits = (_binanceSymbols||[]).filter(s => s.symbol.includes(qU) || s.name.toUpperCase().includes(qU)).slice(0,8);
  let yahooHits = [];
  if(APP_MODE === 'LIVE'){
    try{
      const r = await fetch(`/.netlify/functions/yahoo-search?q=${encodeURIComponent(q)}`);
      if(r.ok){ const j = await r.json(); yahooHits = (j.quotes||[]).slice(0,20); }
    }catch(_){}
  }
  const all = [...binanceHits, ...yahooHits];
  if(!all.length){ host.innerHTML = '<div class="emp">No matches.</div>'; return; }
  host.innerHTML = all.map(h => {
    const full = `${h.source}:${h.symbol}`;
    const clean = h.source === 'BINANCE' ? h.symbol.replace(/(USDT|BUSD|USDC|FDUSD)$/, '/$1') : prettyTicker('YAHOO', h.symbol);
    const tag = h.source === 'BINANCE' ? 'lv' : h.type === 'EQUITY' ? 'gd' : h.type === 'CRYPTOCURRENCY' ? 'lv' : h.type === 'CURRENCY' ? 'vi' : h.type === 'FUTURE' ? 'gd' : h.type === 'INDEX' ? 'wn' : 'nt';
    const kind = (h.type||'').replace('CRYPTOCURRENCY','CRYPTO').replace('CURRENCY','FX').replace('FUTURE','FUT').replace('EQUITY','STOCK');
    return `<button class="crd" style="display:block;width:100%;text-align:left;margin-bottom:6px;padding:11px 13px" onclick="pickSymbol('${full.replace(/'/g,"\\'")}')">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="min-width:0;flex:1">
          <div class="mn" style="font-size:.82rem;color:var(--tx)">${esc(clean)}</div>
          <div style="font-size:.7rem;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.name||'')}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <span class="bdg ${tag}">${esc(h.exchange||h.source)}</span>
          <div style="font-family:var(--mn);font-size:.42rem;color:var(--tx4);margin-top:4px;letter-spacing:.12em;text-transform:uppercase">${esc(kind)}</div>
        </div>
      </div>
    </button>`;
  }).join('');
}
function pickSymbol(full){
  CH.pair = full;
  closeModal();
  toast('Loading ' + prettySymbol(full), 'info');
  loadCandles();
  const lbl = $('symLabel');
  if(lbl) lbl.textContent = '🔍 ' + prettySymbol(full);
}

function initCommsRealtime(){
  if(window._vipSub || APP_MODE === 'SIM') return;
  window._vipSub = sb.channel('vip-stream', { config:{ presence:{ key: S.user.id }}})
    .on('postgres_changes',{ event:'INSERT', schema:'public', table:'vip_messages' }, payload => {
      const m = payload.new;
      const chan = m.channel_id;
      if(chan.startsWith('dm:')) return;
      if(!S.comms.messages[chan]) S.comms.messages[chan] = [];
      if(!S.comms.messages[chan].some(x=>x.id === m.id)){
        S.comms.messages[chan].push({ id:m.id, from:m.from_name, at:new Date(m.created_at).getTime(), text:m.body, self:m.from_user === S.user.id, user_id:m.from_user });
        if(S.view === 'vip') renderMain();
      }
    })
    .on('presence', { event:'sync' }, () => {
      const state = window._vipSub.presenceState();
      S.comms.online = new Set();
      Object.values(state).forEach(arr => arr.forEach(p => { if(p.name) S.comms.online.add(p.name); }));
      if(S.view === 'vip') renderMain();
    })
    .subscribe(async (status) => {
      if(status === 'SUBSCRIBED') await window._vipSub.track({ name: S.profile.name, at: Date.now() });
    });
}

function renderNav(){
  const sbEl = $('sb'); if(!sbEl) return;
  let html = '';
  for(const group of NAV){
    const items = group.items.filter(it => can(it.perm) || (it.perm === 'admin' && isOwner()));
    if(!items.length) continue;
    html += `<div class="ss"><h4>${esc(group.group)}</h4>`;
    for(const it of items){
      const active = S.view === it.id ? ' on' : '';
      const badge = it.badge ? `<span class="sbdg ${it.badge==='LIVE'?'lv':it.badge==='OWNER'?'gd':it.badge==='ADMIN'?'rd':it.badge==='18'?'vi':''}">${it.badge}</span>` : '';
      html += `<button class="slink${active}" onclick="go('${it.id}')">
        <svg viewBox="0 0 24 24">${ICONS[it.icon]||''}</svg>
        <span>${esc(it.label)}</span>
        ${badge}
      </button>`;
    }
    html += `</div>`;
  }
  sbEl.innerHTML = html;
}

async function saveProfile(){
  const name = $('pName').value.trim();
  const username = $('pUser').value.trim().toLowerCase();
  const title = $('pTitle').value.trim();
  const jurisdiction = $('pJur').value.trim();
  if(username && !/^[a-z0-9_]{3,24}$/.test(username)){ toast('Username 3-24 lowercase alphanum + _','error'); return; }
  if(APP_MODE === 'SIM'){ Object.assign(S.profile,{name,username,title,jurisdiction,avatarInitials:(name||'NA').slice(0,2).toUpperCase()}); $('userName').textContent=S.profile.name; $('userAvatar').textContent=S.profile.avatarInitials; toast('Saved (SIM)','success'); renderMain(); return; }
  try{
    const { error } = await sb.from('profiles').update({ name, username:username||null, title, jurisdiction, avatar_initials:(name||'NA').slice(0,2).toUpperCase() }).eq('id', S.user.id);
    if(error){ toast('Failed: '+error.message,'error'); return; }
    Object.assign(S.profile,{name,username,title,jurisdiction,avatarInitials:(name||'NA').slice(0,2).toUpperCase()});
    $('userName').textContent = S.profile.name;
    $('userAvatar').textContent = S.profile.avatarInitials;
    toast('Saved','success');
  }catch(e){ toast(e.message,'error'); }
}
async function setPassword(){
  const pw = $('spNew').value, cf = $('spConf').value;
  if(!pw || pw.length < 8){ toast('Password 8+ chars','error'); return; }
  if(pw !== cf){ toast('Mismatch','error'); return; }
  if(APP_MODE === 'SIM'){ toast('Set (SIM)','success'); return; }
  try{
    const { error } = await sb.auth.updateUser({ password: pw });
    if(error){ toast('Failed: '+error.message,'error'); return; }
    toast('Password set','success');
    $('spNew').value=''; $('spConf').value='';
    renderMain();
  }catch(e){ toast(e.message,'error'); }
}

async function sendCommsMessage(e){
  if(e) e.preventDefault();
  const inp = $('cmInput'); if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  inp.value = '';
  const isDm = !!S.comms.activeDm;
  const ch = S.comms.activeChannel;
  const payload = {
    channel_id: isDm ? `dm:${S.user.id}:${S.comms.activeDm}` : ch,
    from_user: S.user.id,
    from_name: S.profile.name,
    body: text
  };
  if(APP_MODE === 'LIVE'){
    try{
      const { error } = await sb.from('vip_messages').insert(payload);
      if(error){ toast('Send failed: '+error.message,'error'); return; }
    }catch(e){ toast('Send failed: '+e.message,'error'); return; }
  }
  const newMsg = { id:uuid(), from:S.profile.name, at:Date.now(), text, self:true, user_id:S.user.id };
  if(isDm){
    if(!S.comms.dms[S.comms.activeDm]) S.comms.dms[S.comms.activeDm] = [];
    S.comms.dms[S.comms.activeDm].push(newMsg);
  } else {
    if(!S.comms.messages[ch]) S.comms.messages[ch] = [];
    S.comms.messages[ch].push(newMsg);
  }
  renderMain();
}
function pinActiveMessage(){
  const ch = S.comms.activeChannel;
  const msgs = S.comms.messages[ch] || [];
  if(!msgs.length){ toast('No messages to pin','info'); return; }
  const last = msgs[msgs.length - 1];
  const channel = S.comms.channels.find(c=>c.id===ch);
  if(channel) channel.pinned = `${last.from}: ${last.text}`;
  toast('Pinned','success');
  renderMain();
}
function openChannelCreate(){
  openModal('New Channel', `
    <div class="ff" style="margin-bottom:10px"><label>Name</label><input id="chName" placeholder="announcements"></div>
    <div class="ff" style="margin-bottom:10px"><label>Topic</label><input id="chTopic"></div>
    <div class="mact"><button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="createChannel()">Create</button></div>
  `);

function createChannel(){
  const name = $('chName').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');
  const topic = $('chTopic').value.trim();
  if(!name){ toast('Name required','error'); return; }
  S.comms.channels.push({ id:name, name, topic, icon:'#', adminOnly:false, pinned:null });
  toast('Channel created','success'); closeModal(); renderMain();
}
async function startCall(video){
  if(!navigator.mediaDevices){ toast('Media not supported','error'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:!!video });
    toast(`${video?'Video':'Voice'} call started (local preview)`, 'success');
    showLocalPreview(stream);
  }catch(e){ toast('Call failed: '+e.message,'error'); }
}
async function startScreenShare(){
  if(!navigator.mediaDevices?.getDisplayMedia){ toast('Screen share not supported','error'); return; }
  try{
    const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:false });
    toast('Screen sharing started','success');
    showLocalPreview(stream);
  }catch(e){ toast('Screen share failed: '+e.message,'error'); }
}
function showLocalPreview(stream){
  let host = $('_localPrev');
  if(!host){
    host = document.createElement('div');
    host.id = '_localPrev';
    host.style.cssText = 'position:fixed;bottom:80px;right:16px;z-index:9998;width:220px;border:1px solid var(--gd);border-radius:4px;overflow:hidden;background:#000';
    host.innerHTML = '<video autoplay playsinline muted style="width:100%;display:block"></video><button style="position:absolute;top:4px;right:4px;background:var(--rd);color:#fff;width:22px;height:22px;border-radius:50%;font-size:.7rem">×</button>';
    host.querySelector('button').onclick = () => { stream.getTracks().forEach(t=>t.stop()); host.remove(); };
    document.body.appendChild(host);
  }
  host.querySelector('video').srcObject = stream;
}

async function createInvite(){
  const code = 'vice-'+uuid().replace(/-/g,'').slice(0,10);
  const forUser = prompt('Label:') || 'New Member';
  const role = prompt('Role:','HOLDER') || 'HOLDER';
  const row = { code, for_user:forUser, role, used:false, vip_access:role==='SUPER_ADMIN' };
  if(APP_MODE === 'LIVE'){ const { error } = await sb.from('invites').insert(row); if(error){ toast(error.message,'error'); return; } }
  S.invites.unshift({ ...row, forUser, createdAt:nowIso() });
  toast('Created','success'); renderMain();
}
function copyInviteLink(code){
  const url = `${location.origin}?invite=${code}`;
  navigator.clipboard.writeText(url).then(()=>toast('Copied','success')).catch(()=>prompt('Copy:', url));
}

function applyInviteCode(){
  const c = $('invInput')?.value.trim(); if(!c) return;
  sessionStorage.setItem('pending_invite', c);
  closeModal(); toast('Invite saved','success');
  setTimeout(openInviteHelp, 200);
}

document.addEventListener('DOMContentLoaded', () => {
  applyModeUI();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
  }
  const params = new URLSearchParams(location.search);
  const inviteParam = params.get('invite');
  if(inviteParam) sessionStorage.setItem('pending_invite', inviteParam);
  if(params.get('welcome') || params.get('reset')){
    history.replaceState({}, '', location.pathname + (inviteParam ? '?invite=' + inviteParam : ''));
  }
  if(APP_MODE === 'SIM' && !S.user){ APP_MODE = 'LIVE'; localStorage.setItem(MODE_KEY, 'LIVE'); }
  const lf = $('loginForm');
  if(lf) lf.addEventListener('submit', e => { e.preventDefault(); login(); });
  sb.auth.getSession().then(({data})=>{
    if(data?.session?.user) onAuthenticated(data.session.user);
  }).catch(()=>{});
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN' && session?.user && !S.user) onAuthenticated(session.user);
    if(event === 'SIGNED_OUT'){ S.user = null; }
  });
});
