    <div class="band-head"><h2>Holder portal · ${esc(v.identity.clientId)}</h2>
      <button class="btn btn-sm btn-g" data-act="close-holder-view">Close</button></div>
    <p class="note">This is what <b>${esc(v.identity.name)}</b> sees when they sign in with their Client ID. No admin controls appear.</p>
    <p style="margin:10px 0"><span class="vip-badge">VICE VIP</span></p>
    <dl class="result" style="border-top:0;padding-top:0">
      <dt>Client ID</dt><dd>${esc(v.identity.clientId)}</dd>
      <dt>Name</dt><dd>${esc(v.identity.name)}</dd>
      <dt>Status</dt><dd>${esc(String(v.identity.status).toLowerCase())}${v.identity.demo ? ' · demo' : ''}</dd>
      <dt>Appointed</dt><dd>${v.identity.appointedAt ? whenText(v.identity.appointedAt) : '—'}</dd>
      <dt>Wallet</dt><dd>${v.identity.wallet ? esc(shortAddr(v.identity.wallet)) : 'not linked'}</dd>
    </dl>
    ${standingHtml(v.classification)}
    ${line('V4X')}${line('VICE')}
    <h3 style="margin-top:14px">Allocations</h3>
    <ul class="events">${v.allocations.length ? v.allocations.map(a => `<li><span>${esc(a.program)} · ${fmtU(a.units)} · <b>${esc(a.state.toLowerCase())}</b>${a.demo ? ' · demo' : ''}</span><span class="meta num">${whenText(a.createdAt)}</span></li>`).join('') : '<li><span class="meta">None yet.</span></li>'}</ul>
  </section>`;
}
function standingHtml(c){
  if (!c) return '';
  const TIER_BASIS = { CONTRIBUTION:'by contribution', QUALIFICATION:'by qualification', OVERRIDE:'authorized override' };
  const tier = c.tier ? `${esc(c.tier.tier)} · ${esc(c.tier.name)}` : 'not assigned';
  const legacy = c.legacy ? `${esc(c.legacy.order)} · ${esc(c.legacy.name)}` : 'not recorded';
  const entry = c.entry ? `${esc(c.entry.entryProgram)} · ${esc(c.entry.entryDate)}` : 'not recorded';
  return `<div class="standing">
    <div class="std"><span class="meta">Tier</span><b>${tier}</b>${c.tier ? `<span class="meta">${esc(TIER_BASIS[c.tier.basis]||'')}${c.tier.effectiveAt ? ` · since ${esc(c.tier.effectiveAt)}` : ''}</span>` : ''}</div>
    <div class="std"><span class="meta">Legacy</span><b>${legacy}</b>${c.legacy ? `<span class="meta">${esc(c.legacy.approvingAuthority)}</span>` : ''}</div>

function iruCommitMany(list){
  const by = S.user ? S.user.email : 'owner';
  const at = new Date().toISOString();
  const events = list.map(ev => ({ ...ev, by, at }));
  let test;
  try { test = IruEngine.replay(S.iru.events, { fourEyes:isOwner() }); for (const ev of events) IruEngine.apply(test, ev, { fourEyes:isOwner() }); }
  catch(e) { S.iru.msg = e.message; toast(e.message,'error'); renderMain(); return Promise.resolve(false); }
  S.iru.events = S.iru.events.concat(events);
  try { localStorage.setItem('vice-iru-events', JSON.stringify(S.iru.events)); } catch(_) {}
  S.iru.state = test;
  S.iru.msg = '';
  return Promise.resolve(true);
}

function openDocSign(id){
  const d = S.documents.find(x => String(x.id) === String(id)); if (!d) { toast('Document not found','error'); return; }
  openModal('Sign Document', `
    <p style="font-size:.86rem;color:var(--tx-2);margin-bottom:14px">Signing: <b>${esc(d.name)}</b>. Draw your signature below. The record will include the timestamp, IP hint, and a hash of this document.</p>
    <canvas id="signaturePad" class="signature-pad" width="600" height="180"></canvas>
    <label class="field" style="margin-top:12px">Full legal name<input id="signatureName" value="${esc(S.profile.name)}"></label>
    <div class="mact">
      <button class="btn btn-g" data-act="sign-clear">Clear</button>
      <button class="btn btn-g" data-act="modal-close">Cancel</button>
      <button class="btn btn-p" data-act="sign-confirm" data-id="${esc(id)}">Sign document</button>
    </div>
  `);
  const pad = $('signaturePad'); if (!pad) return;
  const ctx = pad.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,pad.width,pad.height);
  ctx.strokeStyle = '#16120a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false;
  const pos = e => { const r = pad.getBoundingClientRect(); return { x:(e.touches ? e.touches[0].clientX : e.clientX) - r.left, y:(e.touches ? e.touches[0].clientY : e.clientY) - r.top }; };
  pad.onpointerdown = e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); pad.setPointerCapture(e.pointerId); };
  pad.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
  pad.onpointerup = pad.onpointercancel = () => { drawing = false; pad.classList.add('signed'); };
}
async function confirmDocSign(id){
  const pad = $('signaturePad'); const name = $('signatureName')?.value.trim();
  if (!pad || !name) { toast('Draw your signature and enter your name','error'); return; }
  const data = pad.toDataURL('image/png');
  const empty = data.length < 12000;   // a blank canvas produces a very small image
  if (empty) { toast('Signature appears blank','error'); return; }
  const d = S.documents.find(x => String(x.id) === String(id));
  const hashInput = new TextEncoder().encode(`${d.id}|${d.name}|${name}|${Date.now()}`);
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', hashInput));
  const hash = Array.from(digest.slice(0,8), b => b.toString(16).padStart(2,'0')).join('');
  const sig = { id:uuid(), documentId:d.id, documentName:d.name, signer:name, signerEmail:S.profile.email, signature:data,
    hash, at:new Date().toISOString(), ip:S.user ? S.user.id : 'local' };
  S.signatures.push(sig);
  try { localStorage.setItem('vice-signatures', JSON.stringify(S.signatures.slice(-200))); } catch(_) {}
  if (APP_MODE === 'LIVE' && S.user && S.user.id !== 'sim-user') {
    try { await sb.from('signatures').insert({ id:sig.id, document_id:sig.documentId, signer:sig.signer, hash:sig.hash, signature_data:sig.signature, created_at:sig.at }); } catch(_) {}
  }
  await audit('DOCUMENT_SIGNED', `Signed ${d.name}`, 'DOCUMENT', d.id);
  closeModal(); toast('Document signed','success'); renderMain();
}
function downloadDocument(id){
  const d = S.documents.find(x => String(x.id) === String(id)); if (!d) return;
  const blob = d.blob || new Blob([d.content || `VICE OS document: ${d.name}\n\n${d.description || ''}\n\nSigned copies may be attached separately.`], { type:'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = d.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  audit('DOCUMENT_DOWNLOADED', `Downloaded ${d.name}`, 'DOCUMENT', d.id);
  toast('Downloading…','success');
}
function saveDocumentInApp(id){
  const d = S.documents.find(x => String(x.id) === String(id)); if (!d) return;
  try { const saved = JSON.parse(localStorage.getItem('vice-doc-saved') || '[]');
    if (!saved.includes(id)) { saved.push(id); localStorage.setItem('vice-doc-saved', JSON.stringify(saved)); }
    toast('Saved in your VICE OS library','success'); } catch(_) { toast('Could not save','error'); }
  audit('DOCUMENT_SAVED', `Saved ${d.name}`, 'DOCUMENT', d.id);
}
function uploadDocument(){
  const inp = $('docUpload'); if (!inp) return;
  inp.onchange = async () => {
    for (const f of inp.files) {
      const id = uuid();
      const doc = { id, name:f.name, type:(f.name.split('.').pop()||'FILE').toUpperCase(), createdAt:new Date().toISOString(), blob:f, size:f.size };
      S.documents.unshift(doc);
      if (APP_MODE === 'LIVE' && S.user && S.user.id !== 'sim-user') {
        try { const buf = await f.arrayBuffer();
          await sb.from('documents').insert({ id, name:f.name, type:doc.type, size:f.size, owner_id:S.user.id }); } catch(_) {}
      }
    }
    inp.value = '';
    toast('Uploaded','success'); renderMain();
  };
  inp.click();
}

function distOut(){
  const C = S.community;
  const profit = Money.toMinor(C.profit);
  const n = Math.max(0, Math.min(250, parseInt(C.eligible, 10) || 0));
  const rBps = Money.pctToBps(C.reservePct, 10000), mBps = Money.pctToBps(C.memberPct, 10000);
  if (profit === null) return '<p class="note warn">Enter realised profit as dollars and cents.</p>';
  if (rBps === null || mBps === null) return '<p class="note warn">Enter percentages between 0 and 100.</p>';
  const reserve = Money.bps(profit, rBps), net = profit - reserve;
  const memberPool = Money.bps(net, mBps);
  const { per, rem } = Money.split(memberPool, n);
  return `<dl class="result">
    <dt>Reserve</dt><dd>${Money.fmt(reserve)}</dd>
    <dt>Member pool</dt><dd>${Money.fmt(memberPool)}</dd>
    <dt>Each of ${n} members</dt><dd style="color:var(--gdl);font-size:18px">${Money.fmt(per)}</dd>
    <dt>Paid out</dt><dd>${Money.fmt(per * BigInt(n))}</dd>
    <dt>Carried forward</dt><dd>${Money.fmt(rem)}</dd>
    <dt>Good Samaritan and programs</dt><dd>${Money.fmt(net - memberPool)}</dd>
  </dl>`;
}

function commandMatches(q){
  const s = String(q||'').trim(); if (s.length < 2) return [];
  const words = s.toLowerCase().replace(CMD_VERB,'').replace(/[^a-z0-9’' .-]/g,' ').split(/\s+/).filter(w => w.length > 1 && !['the','my','me','to','of'].includes(w));
  if (!words.length) return [];
  return COMMANDS.filter(c => { const hay = `${c.t.toLowerCase()} ${c.k}`; return words.every(w => hay.includes(w)); }).slice(0,5);
}
const cmdState = { list:[], sel:-1 };
function paintCommands(q){
  const box = $('oi-cmds'), input = document.querySelector('[data-role="oi-q"]'); if (!box) return;
  cmdState.list = commandMatches(q);
  cmdState.sel = cmdState.list.length && (CMD_VERB.test(String(q).trim()) || String(q).trim().split(/\s+/).length <= 2) ? 0 : -1;
  box.hidden = !cmdState.list.length;
  box.innerHTML = cmdState.list.map((c,i) => `<button class="oi-cmd${i === cmdState.sel ? ' sel' : ''}" data-act="oi-cmd" data-i="${i}">${OI_ARROW}<span>${esc(c.t)}</span>${i === cmdState.sel ? '<kbd>Enter</kbd>' : ''}</button>`).join('');
}

  const m = root.querySelector('#oi-msgs'); if (m) { m.innerHTML = oiMessagesHtml(); m.scrollTop = m.scrollHeight; }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const act = t.dataset.act;
  switch (act) {
    case 'modal-close': closeModal(); return;
    case 'open-mode': openModeSwitch(); return;
    case 'set-mode': setAppMode(t.dataset.mode); return;
    case 'open-user': openUserMenu(); return;
    case 'google-sign-in': signInWithGoogle(); return;
    case 'forgot': forgotPassword(); return;
    case 'invite-help': openInviteHelp(); return;
    case 'sign-out': logout(); return;
    case 'apply-invite': { const c = $('invInput')?.value.trim(); if (!c) return; sessionStorage.setItem('pending_invite', c); closeModal(); toast('Invite saved','success'); setTimeout(openInviteHelp, 200); return; }
    case 'signup-invite': {
      const email = $('invEmail')?.value.trim(), pw = $('invPass')?.value, cf = $('invConf')?.value;
      const code = sessionStorage.getItem('pending_invite') || new URLSearchParams(location.search).get('invite');
      if (!code) { toast('Invite required','error'); return; }
      if (!email || !email.includes('@')) { toast('Valid email required','error'); return; }
      if (!pw || pw.length < 8) { toast('Password 8+ chars','error'); return; }
      if (pw !== cf) { toast('Mismatch','error'); return; }
      (async () => {
        const { data:invite } = await sb.from('invites').select('*').eq('code', code).eq('used', false).maybeSingle();
        if (!invite) { toast('Invite invalid','error'); return; }
        const { data, error } = await sb.auth.signUp({ email, password:pw, options:{ data:{ invite_code:code, name:invite.for_user || email.split('@')[0], role:invite.role || 'HOLDER' }}});
        if (error) { toast('Signup failed: ' + error.message,'error'); return; }
        if (data.session && data.user) { closeModal(); await onAuthenticated(data.user); }
        else { closeModal(); toast('Check your email to confirm','success'); }
      })();
      return;
    }
    /* Market / chart */
    case 'open-symbol-sheet': openSymbolSheet(); return;
    case 'set-tf': S.sel.tf = t.dataset.tf; loadCandles(); renderMain(); return;
    case 'set-preset': { S.chart.preset = t.dataset.preset; S.chart.colors = { ...PRESETS[t.dataset.preset] }; drawAll(); renderMain(); return; }
    case 'refresh-chart': loadCandles(); renderMain(); return;
    case 'zoom-in': zoomChart(0.8); return;
    case 'zoom-out': zoomChart(1.25); return;
    case 'chart-reset': S.view2 = { count:140, end:null }; drawAll(); return;
    case 'import-bars': $('csv').click(); return;
    /* MT5 accounts */
    case 'mt5-add': openMT5AddModal(); return;
    case 'mt5-add-submit': submitMT5Add(); return;
    case 'mt5-test': Link.testAccount(t.dataset.id); return;
    case 'mt5-remove': if (confirm('Remove this MT5 account?')) { Link.removeAccount(t.dataset.id); renderMain(); } return;
    case 'mt5-refresh': Link.send({ t:'sources' }); toast('Refreshing…'); return;
    case 'mt5-set-url': {
      const url = prompt('Bridge URL (wss://…)', Link.state.url);
      if (url !== null) { Link.setUrl(url, Link.state.token); toast('Saved','success'); }
      return;
    }
    /* Desk / engine */
    case 'desk-start-replay': Desk.startReplay(); return;
    case 'desk-stop-replay': Desk.stopReplay(); return;
    case 'desk-next': Desk.advance(1); return;
    case 'desk-play-25': Desk.advance(25); return;
    case 'desk-to-setup': Desk.playTo('setup'); return;
    case 'desk-prepare': Desk.prepare(); return;
    case 'desk-send': Desk.send(); return;
    case 'desk-kill': Desk.kill(); return;
    case 'desk-reset': { const r = document.querySelector('[data-breaker-reason]'); Desk.reset(r ? r.value : ''); return; }
    case 'spec-save': { const v = {}; for (const k of ['tickSize','tickValue','volumeMin','volumeStep','volumeMax']) { const el = document.querySelector(`[data-spec="${k}"]`); const num = Number(el ? el.value.trim() : ''); v[k] = Number.isFinite(num) && num > 0 ? num : null; } Desk.saveSpec(v); return; }
    case 'toggle-engine': {
      const E = S.engine2; E.running = !E.running;
      const d = $('engDot'), l = $('engLabel');
      if (d && l) { d.className = 'd ' + (E.running ? '' : 'w'); l.textContent = E.running ? 'RUNNING' : 'IDLE'; }
      toast(E.running ? 'Engine started' : 'Engine stopped', E.running ? 'success' : 'info');
      renderMain(); return;
    }
    /* Lab */
    case 'lab-run': { syncLabInputs(); Lab.run(); return; }
    case 'lab-wf': { syncLabInputs(); Lab.walk(); return; }
    case 'lab-mc': { syncLabInputs(); Lab.carlo(); return; }
    case 'lab-adv': { syncLabInputs(); Lab.attack(); return; }
    case 'lab-stress': { syncLabInputs(); Lab.stressNow(); return; }
    case 'lab-cc': { syncLabInputs(); Lab.champion(); return; }
    /* Wallet */
    case 'w-create': Wallet.beginCreate(); return;
    case 'w-import-start': Wallet.state.status = 'importing'; Wallet.state.msg = ''; renderMain(); return;
    case 'w-cancel': Wallet.cancelCreate(); return;
    case 'w-finish': Wallet.finishCreate($('wNewPass').value); return;
    case 'w-do-import': Wallet.importPhrase($('wImportPhrase').value, $('wImportPass').value); return;
    case 'w-unlock': Wallet.unlock($('wUnlock').value); return;
    case 'w-lock': Wallet.lock(); return;
    case 'w-forget': if (confirm('Remove this wallet from this device? Make sure you have your recovery phrase.')) Wallet.forget(); return;
    case 'w-refresh': Wallet.refresh(); return;
    case 'w-set-rpc': Wallet.setRpc($('wRpc').value); return;
    case 'w-reveal': Wallet.revealPhrase($('wRevealPass').value); return;
    case 'w-hide-phrase': Wallet.hidePhrase(); return;
    case 'w-copy-phrase': copyToClipboard(t.dataset.copy); return;
    /* Comms */
    case 'cm-open': {
      const type = t.dataset.type, id = t.dataset.id;
      if (type === 'channel') { S.comms.activeChannel = id; S.comms.activeDm = null; S.comms.unread[id] = 0; }
      else { S.comms.activeDm = id; S.comms.unread['dm:' + id] = 0; }
      renderMain(); return;
    }
    case 'cm-open-dm': S.comms.activeDm = t.dataset.id; S.comms.tab = 'chats'; renderMain(); return;
    case 'cm-close-thread': S.comms.activeDm = null; S.comms.activeChannel = null; renderMain(); return;
    case 'cm-new-channel': openCommsNewChannel(); return;

      const name = $('chName').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');

      closeModal(); toast('Channel created','success'); renderMain(); return;
    }
    case 'cm-edit-channel': openCommsEditChannel(t.dataset.id); return;
    case 'cm-edit-channel-submit': {
      const c = S.comms.channels.find(x => x.id === t.dataset.id); if (!c) return;
      c.name = $('chEName').value.trim() || c.name;
      c.topic = $('chETopic').value.trim();
      c.pinned = $('chEPin').value.trim() || null;
      closeModal(); toast('Channel updated','success'); renderMain(); return;
    }
    case 'cm-call-voice': startCommsCall(false); return;
    case 'cm-call-video': startCommsCall(true); return;
    case 'cm-invite-link': {
      const url = commsCallInviteLink();
      copyToClipboard(url);
      toast('Call invite link copied','success'); return;
    }
    case 'cm-invite-room': { const url = commsCallInviteLink(); copyToClipboard(url); renderMain(); return; }
    case 'cm-new-call': { if (S.comms.peers[0]) { S.comms.activeDm = S.comms.peers[0].id; startCommsCall(true); } return; }
    /* Holders */
    case 'appoint-client': openAppointClient(); return;
    case 'appoint-client-submit': submitAppointClient(); return;
    case 'view-holder': S.iru.viewHolder = t.dataset.id; renderMain(); return;
    case 'close-holder-view': S.iru.viewHolder = null; renderMain(); return;
    case 'classification-holder': toast('Classification editor opens in Admin → Holders.','info'); go('holders'); return;
    /* IRU */
    case 'iru-demo-toggle': { S.iru.demo = !S.iru.demo; toast(S.iru.demo ? 'Demo mode ON' : 'Demo mode OFF','success'); renderMain(); return; }
    case 'iru-demo-reset': { S.iru.events = []; S.iru.demo = true; toast('Demo reset','success'); renderMain(); return; }
    case 'iru-publish-value': publishIruValue(); return;
    /* Documents */
    case 'doc-upload': uploadDocument(); return;
    case 'doc-sign': openDocSign(t.dataset.id); return;
    case 'sign-clear': {
      const pad = $('signaturePad'); if (pad) { const ctx = pad.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,pad.width,pad.height); pad.classList.remove('signed'); }
      return;
    }
    case 'sign-confirm': confirmDocSign(t.dataset.id); return;
    case 'doc-download': downloadDocument(t.dataset.id); return;
    case 'doc-save': saveDocumentInApp(t.dataset.id); return;
    /* Distributions */
    case 'dist-add': {
      openModal('Record Distribution', `
        <div class="fg">
          <div class="ff"><label>Period</label><input id="dPer" placeholder="2026-Q1"></div>
          <div class="ff"><label>Status</label><select id="dStat"><option>DRAFT</option><option>PAID</option></select></div>
          <div class="ff"><label>Total ($)</label><input id="dTot" inputmode="decimal" value="0"></div>
          <div class="ff"><label>Per unit ($)</label><input id="dPU" inputmode="decimal" step="0.001" value="0"></div>
        </div>
        <div class="mact"><button class="btn btn-g" data-act="modal-close">Cancel</button><button class="btn btn-p" data-act="dist-add-submit">Add</button></div>
      `); return;
    }
    case 'dist-add-submit': {
      const row = { id:uuid(), period:$('dPer').value.trim(), status:$('dStat').value, total:parseFloat($('dTot').value)||0, perUnit:parseFloat($('dPU').value)||0, createdAt:nowIso() };
      if (!row.period) { toast('Period required','error'); return; }
      S.distributions.unshift(row); closeModal(); toast('Added','success'); renderMain(); return;
    }
    case 'dist-toggle': {
      const d = S.distributions.find(x => String(x.id) === t.dataset.id); if (!d) return;
      if (d.status !== 'PAID' && !confirm('Confirm the payment has actually been completed?')) return;
      d.status = d.status === 'PAID' ? 'DRAFT' : 'PAID'; toast('Updated','success'); renderMain(); return;
    }
    case 'dist-delete': {
      if (!confirm('Delete this distribution?')) return;
      S.distributions = S.distributions.filter(x => String(x.id) !== t.dataset.id);
      toast('Deleted','success'); renderMain(); return;
    }
    /* VIP */
    case 'vip-send': {
      const id = $('vipId').value.trim().toUpperCase(), msg = $('vipMsg').value.trim();
      const h = IruEngine.findByClientId(S.iru.state || IruEngine.emptyState(), id);
      if (!h || h.reserve) { S.iru.vipMsg = 'Concierge is for VIP members: enter a valid Client ID.'; }
      else if (!msg) { S.iru.vipMsg = 'Add details.'; }
      else { const tk = Support.add({ name:h.name, email:h.email || '', message:`[VIP ${$('vipKind').value}] ${msg}`, vip:true, clientId:h.clientId });
        S.iru.vipMsg = `Request ${tk.id} saved with VIP priority.`; }
      renderMain(); return;
    }
    /* Support */
    case 'sup-send': {
      const m = $('supMsg').value.trim();
      if (!m) { Support.state.msg = 'Tell us how we can help.'; }
      else { const tk = Support.add({ name:$('supName').value.trim(), email:$('supEmail').value.trim(), message:m });
        Support.state.msg = `Request ${tk.id} saved. VICE team will reply.`; }
      renderMain(); return;
    }
    /* System */
    case 'link-set': {
      const url = $('linkUrl').value.trim(), token = $('linkToken').value.trim();
      Link.setUrl(url, token); toast('Saved','success'); return;
    }
    case 'link-restart': Link.stop(); setTimeout(() => { Link.start(); toast('Restarting…','info'); }, 100); return;
    case 'rotate-pair': Link.send({ t:'rotate' }); return;
    case 'chain-check': ChainCheck.run(); return;
    case 'reset-settings': if (confirm('Reset all local settings? This cannot be undone.')) { try { localStorage.clear(); } catch(_) {} location.reload(); } return;
    /* Invites */
    case 'create-invite': createBetaInvite(); return;
    case 'copy-invite': copyInviteLink(t.dataset.code); return;
    /* Profile */
    case 'save-profile': saveProfile(); return;
    case 'set-password': setPassword(); return;
    case 'start-2fa': toast('Two-step setup launches in the Windows app.','info'); return;
    /* Module toggles */
    case 'module-toggle': {
      const id = t.dataset.id;
      S.modules.off[id] = !S.modules.off[id];
      try { localStorage.setItem('vice-modules-off', JSON.stringify(S.modules.off)); } catch(_) {}
      toast(S.modules.off[id] ? 'Module hidden from nav' : 'Module shown', 'success');
      renderNav(); renderMain(); return;

    /* O.I. */
    case 'oi-open': OI.state.open = true; paintOI(true); return;

    case 'oi-cmd': { const q = document.querySelector('[data-role="oi-q"]'); if (q) q.value = ''; runCommand(Number(t.dataset.i)); return; }
    case 'oi-chip': OI.state.open = true; paintOI(); OI.ask(t.dataset.q); return;
    case 'oi-mic': { if (!OI.listen(text => { const q = document.querySelector('[data-role="oi-q"]'); if (q) q.value = text; OI.ask(text); })) toast('Mic not available','warn'); return; }
    /* Utilities */
    case 'copy': copyToClipboard(t.dataset.copy); return;
  }
  /* The comms bottom tabs are handled via data-cm-tab */
  if (t.dataset.cmTab) { S.comms.tab = t.dataset.cmTab; renderMain(); }
});
function copyToClipboard(text){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied','success')).catch(() => prompt('Copy:', text));
  else prompt('Copy:', text);
}
function syncLabInputs(){
  const get = n => document.querySelector(`[data-lab="${n}"]`);
  if (get('strategy')) Lab.state.strategy = get('strategy').value;
  if (get('seed')) Lab.state.seed = Math.max(1, parseInt(get('seed').value, 10) || 1);
  const num = v => { const x = Number(String(v).trim()); return Number.isFinite(x) && x >= 0 ? x : 0; };
  Lab.setCosts({ spread:num(get('spread').value), slippage:num(get('slip').value), commission:0 });
}

  if (e.key === 'Escape') {
    if (OI.state.open) { OI.state.open = false; paintOI(true); return; }
    if ($('modal')?.classList.contains('on')) { closeModal(); return; }
  }
});
/* Ctrl/Cmd-K for O.I. */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault(); OI.state.open = !OI.state.open; paintOI(true); return;
  }
});
/* Enter sends the message in the composer */
document.addEventListener('submit', (e) => {
  if (e.target.matches('[data-act="cm-send-form"]')) { e.preventDefault(); sendCommsMessage(); }
});

/* ─── Comms composer inline ─── */
document.addEventListener('input', (e) => {
  if (e.target.dataset && e.target.dataset.role === 'cm-search') { S.query = e.target.value; const l = document.querySelector('.cm-list-scroll'); if (l) { const list = commsList(); l.innerHTML = list.length ? list.map(c => `<button class="cm-item${c.active ? ' on' : ''}${c.unread ? ' unread' : ''}" data-act="cm-open" data-type="${c.type}" data-id="${esc(c.id)}"><div class="cm-item-ava ${c.color === 'v4x' ? 'v4x' : ''}${c.online ? ' online' : ''}">${esc(c.initials)}</div><div class="cm-item-body"><div class="cm-item-top"><span class="cm-item-name">${esc(c.name)}</span><span class="cm-item-time">${c.time}</span></div><div class="cm-item-top"><span class="cm-item-prev">${esc(c.preview)}</span>${c.unread ? `<span class="cm-item-badge">${c.unread}</span>` : ''}</div></div></button>`).join('') : '<div class="emp">No matches.</div>'; } } }
});

/* ═══════════════════════════════════════════════════════════════════
   BOOT — initialise every engine and open the app
   ═══════════════════════════════════════════════════════════════════ */
(function boot(){
  /* Restore lab ledger */
  try { Lab.state.ledger = JSON.parse(localStorage.getItem('vice-lab') || '[]'); } catch(_) {}
  /* Restore signatures */
  try { S.signatures = JSON.parse(localStorage.getItem('vice-signatures') || '[]'); } catch(_) {}
  /* Restore IRU events and replay */
  try { S.iru.events = JSON.parse(localStorage.getItem('vice-iru-events') || '[]'); } catch(_) { S.iru.events = []; }
  S.iru.state = IruEngine.replay(S.iru.events, { fourEyes:isOwner() });
  /* Seed a few documents so the interface is never bare on first boot */
  if (!S.documents.length) {
    S.documents = [
      { id:'doc-1', name:'VICE Capital — Master Service Agreement.pdf', type:'PDF', createdAt:nowIso() },
      { id:'doc-2', name:'Client Reserve Allocation — Terms.pdf', type:'PDF', createdAt:nowIso() },
      { id:'doc-3', name:'VICE4X Academy — Core Curriculum (Summary).md', type:'MD', createdAt:nowIso() },
    ];
  }
  /* Restore data from IndexedDB */
  Store.all().then(list => {
    if (!list || !list.length) {
      /* If nothing saved, seed the practice series */
      addDataset({ symbol:PRACTICE, tf:'1h', source:'SIM', decimals:2, name:'Practice series',
        bars:sampleSeries(2000, 20260921, 3600e3, Date.now() - 2000 * 3600e3) }, false);
      S.ch.candles = S.sets[`${PRACTICE}|1h`].bars;
      computeATR();
      S.res = Solace.run(S.ch.candles, S.engine);
      S.sel.symbol = PRACTICE; S.sel.tf = '1h';
    } else {
      list.forEach(r => { try { addDataset(unpack(r), false); } catch(_) {} });
      /* Pick the most recent set as the default */
      const first = Object.values(S.sets)[0];
      if (first) { S.sel.symbol = first.symbol; S.sel.tf = first.tf; S.ch.candles = first.bars; computeATR(); S.res = Solace.run(S.ch.candles, S.engine); }
    }
    /* Supabase session */
    sb.auth.getSession().then(({ data }) => {
      if (data && data.session && data.session.user) onAuthenticated(data.session.user);
      else { showLogin(); }
    }).catch(() => showLogin());
  });
})();

function showLogin(){
  $('login').hidden = false;
  $('tb').style.display = 'none';
  $('bnr').style.display = 'none';
  $('sb').style.display = 'none';
  document.querySelector('.mn').style.display = 'none';
  $('cmTabs').classList.remove('on');
}
/* Auto-hide the splash after a short beat */
setTimeout(() => { const s = $('splash'); if (s) { s.classList.add('out'); setTimeout(() => s.remove(), 800); } }, 1800);
/* Comms indicator redraw on resize */
window.addEventListener('resize', () => paintCmTabs());
/* Auto-refresh live quote line in Markets every 3 s if open */
setInterval(() => { if (S.tab === 'markets' && S.ch) drawAll(); }, 3000);
</script>
