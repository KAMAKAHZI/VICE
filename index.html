let _cv = null, _ctx = null, _dpr = 1, _W = 0, _H = 0;
const PAD = { t:22, r:84, b:42, l:10 };

function initCanvas(){
  _cv = $('cv');
  if (!_cv) return;
  if(!S.view2.preferenceLoaded){
    S.view2.preferenceLoaded=true;
    try{const saved=Number(localStorage.getItem('vice-chart-count'));if(Number.isFinite(saved)&&saved>=30&&saved<=10000)S.view2.count=saved;}catch(_){}
  }
  _ctx = _cv.getContext('2d');
  resizeCanvas();drawAll();
  if (_cv._wired) return;
  const cv=_cv;cv._wired=true;cv.style.touchAction='none';cv.tabIndex=0;
  cv.setAttribute('aria-label','Market chart. Drag to pan; wheel to zoom; drag the price axis to scale. Arrow keys pan, plus and minus zoom, zero resets.');
  const pointers=new Map();let gesture=null,moved=false,frame=0;
  const paint=()=>{if(!frame)frame=requestAnimationFrame(()=>{frame=0;if(_cv===cv)drawAll();});};
  const point=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  const persist=()=>{try{localStorage.setItem('vice-chart-count',String(S.view2.count));}catch(_){}};
  const begin=()=>{
    const pts=[...pointers.values()];if(!pts.length){gesture=null;return;}
    const p=pts[0],q=pts[1];
    gesture={x:q?(p.x+q.x)/2:p.x,y:q?(p.y+q.y)/2:p.y,
      distance:q?Math.max(1,Math.hypot(q.x-p.x,q.y-p.y)):null,
      count:Math.min(S.ch.candles.length,S.view2.count),end:S.view2.end??S.ch.candles.length,
      range:cv._priceRange?{...cv._priceRange}:null,
      axis:p.x>=_W-PAD.r?'price':p.y>=_H-PAD.b?'time':'body'};
  };
  cv.addEventListener('pointerdown',e=>{
    if(e.button!==0||!S.ch.candles.length)return;
    e.preventDefault();cv.focus({preventScroll:true});pointers.set(e.pointerId,point(e));
    cv.setPointerCapture(e.pointerId);moved=false;begin();
  });
  cv.addEventListener('pointermove',e=>{
    if(_cv!==cv)return;const p=point(e);cv._mx=p.x;cv._my=p.y;
    if(!pointers.has(e.pointerId)||!gesture){paint();return;}
    e.preventDefault();pointers.set(e.pointerId,p);
    const g=gesture,pts=[...pointers.values()],cw=Math.max(1,_W-PAD.l-PAD.r),ch=Math.max(1,_H-PAD.t-PAD.b);
    const clampEnd=v=>{const n=S.ch.candles.length,end=Math.max(Math.min(n,S.view2.count),Math.min(n,Math.round(v)));S.view2.end=end>=n?null:end;};
    if(pts.length===2&&g.distance){
      const a=pts[0],b=pts[1],x=(a.x+b.x)/2,y=(a.y+b.y)/2;
      const factor=g.distance/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
      const fraction=Math.max(0,Math.min(1,(g.x-PAD.l)/cw)),anchor=g.end-g.count+fraction*g.count;
      S.view2.count=Math.max(Math.min(30,S.ch.candles.length),Math.min(S.ch.candles.length,Math.round(g.count*factor)));
      clampEnd(anchor+(1-fraction)*S.view2.count-(x-g.x)/cw*S.view2.count);
      if(g.range){const span=(g.range.max-g.range.min)*Math.max(.02,Math.min(50,factor));
        const anchorPrice=g.range.max-(g.y-PAD.t)/ch*(g.range.max-g.range.min);
        const max=anchorPrice+(y-PAD.t)/ch*span;S.view2.priceRange={min:max-span,max};}
      moved=true;
    }else{
      const dx=p.x-g.x,dy=p.y-g.y;moved=moved||Math.hypot(dx,dy)>4;
      if(g.axis==='price'&&g.range){
        const mid=(g.range.min+g.range.max)/2,span=(g.range.max-g.range.min)*Math.exp(Math.max(-4,Math.min(4,dy/180)));
        S.view2.priceRange={min:mid-span/2,max:mid+span/2};
      }else if(g.axis==='time'){
        S.view2.count=Math.max(Math.min(30,S.ch.candles.length),Math.min(S.ch.candles.length,Math.round(g.count*Math.exp(dx/180))));clampEnd(g.end);
      }else{
        clampEnd(g.end-dx/cw*g.count);
        if(g.range){const offset=dy/ch*(g.range.max-g.range.min);S.view2.priceRange={min:g.range.min+offset,max:g.range.max+offset};}
      }
    }
    paint();
  });
  const finish=e=>{if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);
    if(cv.hasPointerCapture(e.pointerId))cv.releasePointerCapture(e.pointerId);
    if(moved)cv._suppressClick=true;begin();persist();};
  cv.addEventListener('pointerup',finish);cv.addEventListener('pointercancel',finish);
  cv.addEventListener('lostpointercapture',e=>{pointers.delete(e.pointerId);begin();});
  cv.addEventListener('click',e=>{if(cv._suppressClick){e.preventDefault();e.stopImmediatePropagation();cv._suppressClick=false;}},true);
  cv.addEventListener('pointerleave',()=>{if(!pointers.size){cv._mx=null;cv._my=null;paint();}});
  cv.addEventListener('wheel',e=>{
    e.preventDefault();e.stopPropagation();const p=point(e),factor=Math.exp(Math.max(-1,Math.min(1,e.deltaY/400)));
    if((p.x>=_W-PAD.r||e.shiftKey)&&cv._priceRange){
      const r=cv._priceRange,ch=Math.max(1,_H-PAD.t-PAD.b),f=Math.max(0,Math.min(1,(p.y-PAD.t)/ch));
      const span=(r.max-r.min)*factor,anchor=r.max-f*(r.max-r.min);
      S.view2.priceRange={min:anchor-(1-f)*span,max:anchor+f*span};
    }else if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){
      const n=S.ch.candles.length,end=(S.view2.end??n)+e.deltaX/Math.max(1,_W-PAD.l-PAD.r)*S.view2.count;
      S.view2.end=Math.max(Math.min(n,S.view2.count),Math.min(n,Math.round(end)));
      if(S.view2.end>=n)S.view2.end=null;
    }else zoomChart(factor,p.x);
    paint();persist();
  },{passive:false});
  cv.addEventListener('dblclick',()=>{S.view2.priceRange=null;paint();});
  cv.addEventListener('keydown',e=>{
    const r=cv._priceRange,n=S.ch.candles.length;
    if(e.key==='+'||e.key==='=')zoomChart(.8);else if(e.key==='-')zoomChart(1.25);
    else if(e.key==='0'){S.view2={count:Math.min(140,n),end:null,priceRange:null};}
    else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      const end=(S.view2.end??n)+(e.key==='ArrowLeft'?-10:10);
      S.view2.end=Math.max(Math.min(n,S.view2.count),Math.min(n,end));if(S.view2.end>=n)S.view2.end=null;
    }else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&r){
      const d=(r.max-r.min)*(e.key==='ArrowUp'?.1:-.1);S.view2.priceRange={min:r.min+d,max:r.max+d};
    }else return;
    e.preventDefault();e.stopPropagation();paint();persist();
  });
}

function resizeCanvas(){
  if (!_cv) return;
  const r = _cv.parentElement.getBoundingClientRect();
  _dpr = window.devicePixelRatio || 1;
  _cv.width = r.width * _dpr;
  _cv.height = r.height * _dpr;
  _cv.style.width = r.width + 'px';
  _cv.style.height = r.height + 'px';
  _ctx.setTransform(_dpr, 0, 0, _dpr, 0, 0);
  _W = r.width;
  _H = r.height;
}

function zoomChart(f,x=_W-PAD.r){
  if (!S.ch.candles.length||!Number.isFinite(f)||f<=0) return;
  const n=S.ch.candles.length,old=Math.min(n,S.view2.count),end=S.view2.end??n;
  const fraction=Math.max(0,Math.min(1,(x-PAD.l)/Math.max(1,_W-PAD.l-PAD.r)));
  const anchor=end-old+fraction*old;
  S.view2.count=Math.max(Math.min(30,n),Math.min(n,Math.round(old*f)));
  const next=Math.max(S.view2.count,Math.min(n,Math.round(anchor+(1-fraction)*S.view2.count)));
  S.view2.end=next>=n?null:next;drawAll();
}

function fmtP(v){
  const d = S.ch.candles.length ? (S.ch.candles[0].c > 100 ? 2 : 4) : 2;
  return v == null
    ? '—'
    : Number(v).toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d });
}

function drawAll(){ drawSolace(); }

function drawSolace(){
  if (!_cv || !_ctx) return;
  if(!S.ch.candles.length||!S.res){
    _ctx.fillStyle=S.chart.colors.bg;_ctx.fillRect(0,0,_W,_H);_ctx.fillStyle=S.chart.colors.text;
    _ctx.font='14px sans-serif';_ctx.textAlign='center';
    _ctx.fillText(S.ch.error?'Market data unavailable — retry or import verified data':'Select an instrument and load data',_W/2,_H/2);
    _cv._priceRange=null;return;
  }
  const P = S.chart.colors, cs = S.ch.candles;
  _ctx.fillStyle = P.bg;
  _ctx.fillRect(0, 0, _W, _H);

  const cw = _W - PAD.l - PAD.r, ch = _H - PAD.t - PAD.b;
  const visCount = Math.min(S.view2.count, cs.length);
  const end = S.view2.end == null ? cs.length : Math.min(cs.length, S.view2.end);
  const startIdx = Math.max(0, end - visCount);
  const res = S.res.snapshots ? ViceSolaceSystem.at(S.res,end) : S.res;
  if (end - startIdx < 2) return;

  let vmin = Infinity, vmax = -Infinity;
  for (let i = startIdx; i < end; i++) {
    if (cs[i].l < vmin) vmin = cs[i].l;
    if (cs[i].h > vmax) vmax = cs[i].h;
    if (res.f0[i] != null && res.f0[i] < vmin) vmin = res.f0[i];
    if (res.f100[i] != null && res.f100[i] > vmax) vmax = res.f100[i];
  }
  const levels = [
    res.internal && res.internal.hi, res.internal && res.internal.lo,
    res.choch && res.choch.level,
    res.trade && res.trade.macro && res.trade.macro.entry,
    res.trade && res.trade.macro && res.trade.macro.stop,
    res.trade && res.trade.macro && res.trade.macro.target,
    res.trade && res.trade.internal && res.trade.internal.entry,
    res.trade && res.trade.internal && res.trade.internal.stop,
    res.trade && res.trade.internal && res.trade.internal.target,
  ];
  for (const v of levels) {
    if (v != null && isFinite(v)) {
      if (v < vmin) vmin = v;
      if (v > vmax) vmax = v;
    }
  }
  const rng = (vmax - vmin) || 1;
  vmin -= rng * 0.06;
  vmax += rng * 0.06;
  const manual=S.view2.priceRange;
  if(manual&&Number.isFinite(manual.min)&&Number.isFinite(manual.max)&&manual.max>manual.min){vmin=manual.min;vmax=manual.max;}
  _cv._priceRange={min:vmin,max:vmax};

  const span = Math.max(1, end - startIdx - 1 + (S.engine.extendBars??40));
  const xAt = i => PAD.l + (i - startIdx) / span * cw;
  const rayX = from => ViceSolaceSystem.rayStart(from,startIdx,end,xAt);
  const yAt = v => PAD.t + (1 - (v - vmin) / (vmax - vmin)) * ch;

  /* Grid */
  _ctx.strokeStyle = P.grid;
  _ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const y = PAD.t + (i / 5) * ch;
    _ctx.beginPath(); _ctx.moveTo(PAD.l, y); _ctx.lineTo(_W - PAD.r, y); _ctx.stroke();
  }
  _ctx.strokeStyle = P.gridMajor;
  for (let i = 0; i <= 10; i++) {
    const x = PAD.l + (i / 10) * cw;
    _ctx.beginPath(); _ctx.moveTo(x, PAD.t); _ctx.lineTo(x, _H - PAD.b); _ctx.stroke();
  }

  /* Historical F0/F100 layers */
  const drawHist = (hist, color) => {
    if (!hist || !hist.length) return;
    _ctx.save();
    _ctx.strokeStyle = color;
    _ctx.lineWidth = 1;
    _ctx.setLineDash([2, 4]);
    for (const seg of hist) {
      const a = Math.max(startIdx, seg.from);
      const b = Math.min(end, seg.to);
      if (b <= a) continue;
      const y = yAt(seg.price);
      if (!isFinite(y)) continue;
      _ctx.beginPath();
      _ctx.moveTo(xAt(a), y);
      _ctx.lineTo(xAt(b - 1), y);
      _ctx.stroke();
    }
    _ctx.setLineDash([]);
    _ctx.restore();
  };
  if (S.chart.show.history) {
    drawHist(res.f0History, P.hist);
    drawHist(res.f100History, P.hist);
  }

  /* System zones and active gap, extending right from the confirmed anchor. */
  if(S.chart.show.zones&&res.last&&res.zone){
    for(const [level,edge,from,color] of [[res.last.F100,res.zone.top,res.last.f100From,P.f100],[res.last.F0,res.zone.bottom,res.last.f0From,P.f0]]){
      const x=rayX(from);if(x==null)continue;_ctx.save();_ctx.globalAlpha=.08;_ctx.fillStyle=color;_ctx.fillRect(x,Math.min(yAt(level),yAt(edge)),_W-PAD.r-x,Math.abs(yAt(level)-yAt(edge)));_ctx.restore();
    }
    if(res.gap){const g=res.gap,x=rayX(g.from);if(x!=null){_ctx.save();_ctx.globalAlpha=.14;_ctx.fillStyle=g.bull?P.f0:P.f100;_ctx.fillRect(x,yAt(g.top),_W-PAD.r-x,yAt(g.bottom)-yAt(g.top));_ctx.restore();}}
  }

  /* Trade geometry. Text is spaced independently of precise price lines. */
  const viceLabelSlots=[];
  const viceFreeLabelY=(requested)=>{
    const min=PAD.t+10,max=_H-PAD.b-10;
    let y=Math.max(min,Math.min(max,requested));
    for(let attempts=0;attempts<30 && viceLabelSlots.some(v=>Math.abs(v-y)<13);attempts++)
      y=Math.max(min,Math.min(max,y+(attempts%2?-1:1)*(13+attempts*3)));
    viceLabelSlots.push(y);return y;
  };
  const drawLine = (price, color, dash, label, alpha, from) => {
    const x=rayX(from);if(x==null)return;
    if (price == null || !isFinite(price)) return;
    const y = yAt(price);
    _ctx.save();
    _ctx.strokeStyle = color;
    _ctx.globalAlpha = alpha || 1;
    _ctx.lineWidth = 1.5;
    if (dash) _ctx.setLineDash(dash);
    _ctx.beginPath(); _ctx.moveTo(x, y); _ctx.lineTo(_W - PAD.r, y); _ctx.stroke();
    _ctx.setLineDash([]);
    if (label && S.chart.show.labels !== false) {
      _ctx.globalAlpha = 1;
      _ctx.fillStyle = color;
      _ctx.font = '9px "JetBrains Mono", monospace';
      _ctx.textAlign = 'left';
      _ctx.fillText(label, Math.min(x+4,_W-PAD.r-180), viceFreeLabelY(y - 3));
    }
    _ctx.restore();
  };
  if (S.chart.show.trades && res.trade && res.trade.macro) {
    const t = res.trade.macro;
    drawLine(t.entry, P.entry, null, `MACRO ${t.side} ENTRY ${fmtP(t.entry)} · 1:${t.rr.toFixed(1)}`, 0.95,t.from);
    drawLine(t.stop, P.stop, [3, 3], `STOP ${fmtP(t.stop)}`, 0.75,t.from);
    drawLine(t.target, P.target, [4, 4], `TARGET ${fmtP(t.target)}`, 0.65,t.from);
  }
  if (S.chart.show.trades && res.trade && res.trade.internal) {
    const t = res.trade.internal;
    drawLine(t.entry, P.internal, [4, 3], `INT ${t.side} ${fmtP(t.entry)}`, 0.7,t.from);
    drawLine(t.target, P.internal, [2, 4], `INT TARGET ${fmtP(t.target)}`, 0.5,t.from);
    drawLine(t.stop,P.stop,[2,3],`INT STOP ${fmtP(t.stop)}`,0.65,t.from);
  }

  if(S.chart.show.internal&&res.pivot){const p=res.pivot;drawLine(p.level,p.type===1?'#00c853':'#ff1744',p.armed?null:[5,4],`INT ${p.type===1?'HIGH':'LOW'} · ${p.armed?'ARMED':p.pending?'BREAK PENDING':'WATCHING'} · x${p.tests||1}`,p.armed?1:.65,p.from);}
  if(S.chart.show.choch&&res.macroChoch){const c=res.macroChoch;drawLine(c.level,c.dir===1?P.chochBull:P.chochBear,[3,3],`MACRO CHoCH ${c.dir===1?'BULL':'BEAR'}${c.confirmed?' · CONFIRMED':''}`,0.7,c.bar);}

  /* Candles / bars / line */
  const cw2 = Math.max(1.5, cw / span - 1);
  if (S.chart.type === 'line') {
    _ctx.save();
    _ctx.strokeStyle = P.bullB;
    _ctx.lineWidth = 1.6;
    _ctx.beginPath();
    for (let i = startIdx; i < end; i++) {
      const x = xAt(i), y = yAt(cs[i].c);
      if (i === startIdx) _ctx.moveTo(x, y);
      else _ctx.lineTo(x, y);
    }
    _ctx.stroke();
    _ctx.restore();
  } else {
    for (let i = startIdx; i < end; i++) {
      const c = cs[i], x = xAt(i), up = c.c >= c.o;
      const bC = up ? P.bull : P.bear;
      const bB = up ? P.bullB : P.bearB;
      const bW = up ? P.bullW : P.bearW;
      _ctx.strokeStyle = bW;
      _ctx.lineWidth = 1;
      _ctx.beginPath();
      _ctx.moveTo(x, yAt(c.h));
      _ctx.lineTo(x, yAt(c.l));
      _ctx.stroke();
      const yO = yAt(c.o), yC = yAt(c.c);
      const top = Math.min(yO, yC), bh = Math.max(1, Math.abs(yC - yO));
      if (S.chart.type === 'bars') {
        const tick = Math.max(2, cw2 / 2);
        _ctx.beginPath();
        _ctx.moveTo(x - tick, yO);
        _ctx.lineTo(x, yO);
        _ctx.moveTo(x, yC);
        _ctx.lineTo(x + tick, yC);
        _ctx.stroke();
      } else if (S.chart.type === 'hollow' && up) {
        _ctx.fillStyle = P.bg;
        _ctx.fillRect(x - cw2 / 2, top, cw2, bh);
        _ctx.strokeStyle = bB;
        _ctx.strokeRect(x - cw2 / 2 + 0.5, top + 0.5, cw2 - 1, Math.max(1, bh - 1));
      } else {
        _ctx.fillStyle = bC;
        _ctx.fillRect(x - cw2 / 2, top, cw2, bh);
        _ctx.strokeStyle = bB;
        _ctx.strokeRect(x - cw2 / 2 + 0.5, top + 0.5, cw2 - 1, Math.max(1, bh - 1));
      }
    }
  }

  /* Volume bars */
  if (S.chart.show.vol) {
    let vMax = 0;
    for (let i = startIdx; i < end; i++) if (cs[i].v > vMax) vMax = cs[i].v;
    if (vMax > 0) {
      const vh = PAD.b * 0.55, v0 = _H - PAD.b;
      _ctx.save();
      _ctx.fillStyle = 'rgba(201,168,76,.18)';
      for (let i = startIdx; i < end; i++) {
        const bh = (cs[i].v / vMax) * vh;
        _ctx.fillRect(xAt(i) - cw2 / 2, v0 - bh, cw2, bh);
      }
      _ctx.restore();
    }
  }

  /* Current F0 / F100 tags */
  const last = res.last;
  if (last) {
    if (S.chart.show.poles && last.F0 != null && rayX(last.f0From)!=null) {
      const y = yAt(last.F0);
      _ctx.save();
      _ctx.strokeStyle = P.f0;
      _ctx.lineWidth = 1.6;
      _ctx.setLineDash(res.sellArmed?[6,3]:[]);
      _ctx.beginPath(); _ctx.moveTo(rayX(last.f0From), y); _ctx.lineTo(_W - PAD.r, y); _ctx.stroke();
      _ctx.setLineDash([]);
      _ctx.fillStyle = P.f0;
      _ctx.fillRect(_W - PAD.r, y - 8, PAD.r - 2, 16);
      _ctx.fillStyle = '#07080a';
      _ctx.font = '10px "JetBrains Mono", monospace';
      _ctx.textAlign = 'left';
      _ctx.textBaseline = 'middle';
      if(S.chart.show.labels !== false)_ctx.fillText('F0 ' + fmtP(last.F0), _W - PAD.r + 6, y);
      _ctx.restore();
    }
    if (S.chart.show.poles && last.F100 != null && rayX(last.f100From)!=null) {
      const y = yAt(last.F100);
      _ctx.save();
      _ctx.strokeStyle = P.f100;
      _ctx.lineWidth = 1.6;
      _ctx.setLineDash(res.sellArmed?[]:[6,3]);
      _ctx.beginPath(); _ctx.moveTo(rayX(last.f100From), y); _ctx.lineTo(_W - PAD.r, y); _ctx.stroke();
      _ctx.setLineDash([]);
      _ctx.fillStyle = P.f100;
      _ctx.fillRect(_W - PAD.r, y - 8, PAD.r - 2, 16);
      _ctx.fillStyle = '#07080a';
      _ctx.font = '10px "JetBrains Mono", monospace';
      _ctx.textAlign = 'left';
      _ctx.textBaseline = 'middle';
      if(S.chart.show.labels !== false)_ctx.fillText('F100 ' + fmtP(last.F100), _W - PAD.r + 6, y);
      _ctx.restore();
    }
  }

  /* Confirmed fractals: each candle is evaluated, with its confirmation
     index retained. Future confirmation cannot appear in an earlier viewport. */
  if(S.chart.show.poles&&res.fractals){
    _ctx.save();
    for(const f of res.fractals){
      if(f.bar<startIdx||f.bar>=end||f.confirmedAt>=end)continue;
      const high=f.side==='HIGH',x=xAt(f.bar),y=yAt(f.price)+(high?-6:6);
      if(!Number.isFinite(x)||!Number.isFinite(y)||y<PAD.t||y>_H-PAD.b)continue;
      _ctx.globalAlpha=f.confirmed===false?.4:1;_ctx.fillStyle=high?P.f100:P.f0;_ctx.beginPath();_ctx.arc(x,y,3,0,Math.PI*2);_ctx.fill();
    }
    _ctx.restore();
  }

  /* The internal fractal stays attached to its actual price/time anchor. */
  if(S.chart.show.internal&&res.pivot&&res.pivot.origin>=startIdx&&res.pivot.origin<end){const p=res.pivot;_ctx.save();_ctx.fillStyle=p.type===1?'#00c853':'#ff1744';_ctx.globalAlpha=p.armed?1:.4;_ctx.beginPath();_ctx.arc(xAt(p.origin),yAt(p.level)+(p.type===1?-7:7),4,0,Math.PI*2);_ctx.fill();_ctx.restore();}

  /* CHoCH line */
  if (S.chart.show.choch && res.choch && res.choch.dir !== 0 && res.choch.level != null && rayX(res.choch.bar)!=null) {
    const y = yAt(res.choch.level);
    const color = res.choch.dir === 1 ? P.chochBull : P.chochBear;
    _ctx.save();
    _ctx.strokeStyle = color;
    _ctx.lineWidth = 1.8;
    _ctx.setLineDash([3, 3]);
    _ctx.beginPath(); _ctx.moveTo(rayX(res.choch.bar), y); _ctx.lineTo(_W - PAD.r, y); _ctx.stroke();
    _ctx.setLineDash([]);
    _ctx.fillStyle = color;
    _ctx.font = '10px "JetBrains Mono", monospace';
    _ctx.textAlign = 'left';
    _ctx.textBaseline = 'middle';
    if(S.chart.show.labels !== false)
      _ctx.fillText(`CHoCH ${res.choch.dir === 1 ? 'BULL' : 'BEAR'} ${fmtP(res.choch.level)}`, PAD.l + 6, y - 4);
    _ctx.restore();
  }

  /* Watermark */
  if (S.chart.show.watermark) {
    _ctx.save();
    _ctx.globalAlpha = 0.08;
    _ctx.fillStyle = P.text;
    _ctx.font = '48px "Fraunces", serif';
    _ctx.textAlign = 'left';
    _ctx.textBaseline = 'top';
    _ctx.fillText(`${displaySymbol(S.sel.symbol)} · ${S.sel.tf}`, PAD.l + 16, PAD.t + 10);
    _ctx.restore();
  }

  /* Y-axis labels */
  _ctx.save();
  _ctx.font = '9px "JetBrains Mono", monospace';
  _ctx.fillStyle = P.text;
  _ctx.textAlign = 'left';
  _ctx.textBaseline = 'middle';
  for (let i = 0; i <= 5; i++) {
    const v = vmax - (i / 5) * (vmax - vmin);
    const y = PAD.t + (i / 5) * ch;
    _ctx.fillText(v.toFixed(v > 100 ? 2 : 4), _W - PAD.r + 6, y);
  }
  _ctx.restore();

  /* Last price tag */
  if (last && S.chart.show.lastPrice) {
    const yLast = yAt(cs[end-1].c);
    const tag = fmtP(cs[end-1].c);
    _ctx.save();
    _ctx.font = '10px "JetBrains Mono", monospace';
    const tw = _ctx.measureText(tag).width + 12;
    _ctx.fillStyle = cs[end-1].c >= cs[end-1].o ? P.bullB : P.bearB;
    _ctx.fillRect(_W - PAD.r + 2, yLast - 8, tw, 16);
    _ctx.fillStyle = '#07080a';
    _ctx.textAlign = 'left';
    _ctx.textBaseline = 'middle';
    _ctx.fillText(tag, _W - PAD.r + 7, yLast);
    _ctx.restore();
  }

  /* Crosshair */
  if (_cv._mx != null && _cv._my != null) {
    _ctx.save();
    _ctx.strokeStyle = 'rgba(201,168,76,0.4)';
    _ctx.lineWidth = 1;
    _ctx.setLineDash([3, 3]);
    _ctx.beginPath(); _ctx.moveTo(_cv._mx, PAD.t); _ctx.lineTo(_cv._mx, _H - PAD.b); _ctx.stroke();
    _ctx.beginPath(); _ctx.moveTo(PAD.l, _cv._my); _ctx.lineTo(_W - PAD.r, _cv._my); _ctx.stroke();
    _ctx.setLineDash([]);
    const priceAtY = vmax - ((_cv._my - PAD.t) / (_H - PAD.t - PAD.b)) * (vmax - vmin);
    _ctx.fillStyle = 'rgba(201,168,76,0.9)';
    _ctx.fillRect(_W - PAD.r, _cv._my - 8, PAD.r - 2, 16);
    _ctx.fillStyle = '#07080a';
    _ctx.font = '10px "JetBrains Mono", monospace';
    _ctx.textAlign = 'left';
    _ctx.textBaseline = 'middle';
    _ctx.fillText(priceAtY.toFixed(priceAtY > 100 ? 2 : 4), _W - PAD.r + 6, _cv._my);
    _ctx.restore();
  }

  updateHud();
}

function updateHud(){
  const hud = $('hud');
  if (!hud) return;
  const cs = S.ch.candles;
  if (!cs.length) { hud.innerHTML = ''; return; }
  const last = cs[cs.length - 1];
  const chg = ((last.c - last.o) / last.o) * 100;
  const L = S.res && S.res.last;
  const ltf = S.ch.ltfTf ? S.ch.ltfTf.toUpperCase() : '—';

/* ═══════════════════════════════════════════════════════════════════
   TRADE DESK ENGINE — wraps ViceCore into a stateful desk
   ═══════════════════════════════════════════════════════════════════ */

const Desk = (() => {
  const st = S.desk;
  st.policy = ViceCore.effectivePolicy(st.policy);
  const key = () => S.sel.symbol;
  const spec = () => st.specs[key()] || null;

  const ctx = () => {
    if (!S.ch.candles.length || !S.res) return null;
    const bars = S.ch.candles, n = bars.length;
    const cur = st.replay && st.cursor !== null ? Math.min(st.cursor, n - 1) : n - 1;
    const atr = S.res.atr;
    const regime = ViceCore.regimeAt(bars, atr, cur);
    const long = ViceCore.tighten(bars, S.res.f0, S.res.f100, atr, cur, 1);
    const short = ViceCore.tighten(bars, S.res.f0, S.res.f100, atr, cur, -1);
    const rank = { ARMED:6, CONFIRMATION:5, REJECTION:4, SWEEP:3, TEST:2, TOUCH:1, SEARCHING:0, INVALIDATED:0 };
    const active = rank[long.state] >= rank[short.state] ? long : short;
    const spread = 0.0001 * (bars[cur].c || 1);
    const mode = ViceCore.precisionMode({ regime, t:active, price:bars[cur].c, atr:atr[cur], spread });
    return { bars, n, cur, atr, regime, long, short, active, spread, price:bars[cur].c, mode };
  };

  const audit = what => {
    st.audit.push({ at:new Date().toISOString(), what });
    if (st.audit.length > 200) st.audit.shift();
  };

  const notify = () => { try { renderMain(); } catch(_) {} };

  const api = {
    state:st, ctx, spec,
    onChange:() => {},
    startReplay() {
      if (!S.ch.candles.length) return;
      st.replay = true;
      st.cursor = Math.max(300, S.ch.candles.length - 600);
      st.broker = ViceCore.createPaperBroker({
        equity:10000,
        spec:spec() || { tickSize:1, tickValue:0, volumeMin:1, volumeMax:1, volumeStep:1 },
      });
      st.breaker = ViceCore.newBreaker();
      st.risk = null;
      st.order = null;
      audit(`replay at bar ${st.cursor}`);
      notify();
    },
    stopReplay() {
      st.replay = false;
      st.cursor = null;
      notify();
    },
    advance(k) {
      k = k || 1;
      if (!st.replay || !st.broker) return;
      const bars = S.ch.candles, c = ctx();
      for (let j = 0; j < k && st.cursor < bars.length - 1; j++) {
        st.cursor++;
        st.broker.step(bars[st.cursor], st.cursor, c ? c.spread : 0);
      }
      notify();
    },
    playTo(kind, max) {
      max = max || 600;
      if (!st.replay || !st.broker) return;
      const bars = S.ch.candles;
      const spread = (ctx() || { spread:0 }).spread;
      for (let k = 0; k < max && st.cursor < bars.length - 1; k++) {
        st.cursor++;
        st.broker.step(bars[st.cursor], st.cursor, spread);
        if (kind === 'setup') {
          const a = ViceCore.tighten(bars, S.res.f0, S.res.f100, S.res.atr, st.cursor, 1);
          const b = ViceCore.tighten(bars, S.res.f0, S.res.f100, S.res.atr, st.cursor, -1);
          if (a.state === 'ARMED' || b.state === 'ARMED') break;
        }
      }
      notify();
    },
    saveSpec(v) {
      st.specs[key()] = v;
      try { localStorage.setItem('vice-specs', JSON.stringify(st.specs)); } catch(_) {}
      if (!st.broker) st.broker = ViceCore.createPaperBroker({ equity:10000, spec:v });
      audit(`spec saved for ${S.sel.symbol}`);
      notify();
    },
    prepare() {
      const c = ctx();
      if (!c) return;
      if (!st.broker) {
        st.broker = ViceCore.createPaperBroker({
          equity:10000,
          spec:spec() || { tickSize:1, tickValue:0, volumeMin:1, volumeMax:1, volumeStep:1 },
        });
      }
      const t = c.active;
      if (t.state !== 'ARMED' || !t.plan) {
        st.msg = 'Nothing armed: Tighten needs an ARMED setup first.';
        st.risk = null;
        notify();
        return;
      }
      const runner = /SWING|RUNNER/.test(c.mode.mode);
      st.order = {
        idempotencyKey:`${S.sel.symbol}-${S.sel.tf}-${c.cur}-${t.side}`,
        symbol:S.sel.symbol,
        side:t.side,
        price:t.side > 0 ? t.plan.zoneHi : t.plan.zoneLo,
        entry:t.side > 0 ? t.plan.zoneHi : t.plan.zoneLo,
        stop:t.plan.stop,
        target:runner ? t.plan.t2 : t.plan.t1,
        strategy:'tighten-f0f100',
        createdI:c.cur,
        why:{
          regime:c.regime.regime,
          tighten:`${t.side > 0 ? 'F0' : 'F100'} ${t.state}`,
          level:t.level, mode:c.mode.mode, plan:t.plan,
        },
      };
      st.risk = ViceCore.preTrade({
        order:st.order,
        account:st.broker.account,
        market:{ spread:c.spread, atr:c.atr[c.cur], mode:'PAPER' },
        spec:spec(),
        policy:st.policy,
        breaker:st.breaker,
        openPositions:st.broker.positions.length,
        usedKeys:st.broker.book.keys,
      });
      if (st.risk.size) st.order.volume = st.risk.size.volume;
      st.msg = '';
      audit(`risk ${st.risk.decision.toLowerCase()} for ${st.order.idempotencyKey}`);
      notify();
    },
    send() {
      if (!st.order || !st.risk) return;
      const r = st.broker.submit(st.order, st.risk);
      audit(`order ${r.order.id}`);
      st.order = null;
      st.risk = null;
      notify();
    },
    kill() {
      const bars = S.ch.candles, c = ctx();
      st.breaker = ViceCore.breakerStep(st.breaker, 'MANUAL_KILL', { at:new Date().toISOString() });
      if (st.broker && bars.length && c) st.broker.flatten(bars[c.cur], c.cur, c.spread);
      audit('KILL SWITCH');
      notify();
    },
    reset(reason) {
      try {
        st.breaker = ViceCore.breakerStep(
          st.breaker,
          st.breaker.state === 'SAFE_MODE' ? 'ACKNOWLEDGE_RESET' : 'RESET',
          { reason, at:new Date().toISOString() }
        );
        audit(`breaker reset: ${reason}`);
        st.msg = '';
      } catch(e) { st.msg = e.message; }
      notify();
    },
  };
  return api;
})();

let chartImmersive=false;
async function exitChartFullscreen(){
  chartImmersive=false;
  const w=$('cwrap');
  w?.classList.remove('vice-immersive');
  document.body.classList.remove('chart-fullscreen-fallback');
  if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){console.warn('Fullscreen exit failed',e)}}
  document.querySelectorAll('[data-act="toggle-fullscreen"]').forEach(b=>b.textContent='Fullscreen');
  setTimeout(()=>{if($('cv')){resizeCanvas();drawAll()}},100);
}
async function toggleChartFullscreen(){
  const w=$('cwrap');
  if(!w){toast('Open the chart first','warn');return;}
  if(document.fullscreenElement || chartImmersive){await exitChartFullscreen();return;}
  try {
    if(typeof w.requestFullscreen!=='function')throw new Error('No native Fullscreen API');
    await w.requestFullscreen();
  }catch(e){
    // iOS Safari does not support fullscreen for arbitrary elements.
    // Keep the chart full viewport with an explicit Exit button.
    chartImmersive=true;
    w.classList.add('vice-immersive');
    document.body.classList.add('chart-fullscreen-fallback');
  }
  document.querySelectorAll('[data-act="toggle-fullscreen"]').forEach(b=>b.textContent='Exit fullscreen');
  setTimeout(()=>{if($('cv')){resizeCanvas();drawAll()}},110);
}

      <div>

      </tbody></table></div>
    </section>` : ''}
    ${st.wf ? `<section class="band">

    <section class="band">
      <div class="band-head"><h2>Experiment ledger</h2><span class="meta">${st.ledger.length} on record</span></div>
      ${st.ledger.length ? `<ul class="events">${st.ledger.slice(-10).reverse().map(x =>

// VICE4X secure media messages: storage is private; chat is not audited E2EE.
const VICE_MEDIA_PREFIX='VICE_MEDIA_V1:';
let viceVoiceRecording=null;
function viceCommsBubble(value){
 const msg=String(value??'');
 if(msg.startsWith(VICE_MEDIA_PREFIX)){
  try{
   const item=JSON.parse(msg.slice(VICE_MEDIA_PREFIX.length));
   const path=String(item.path||'');
   const re=/^(?:ch\/(?:general|trading|reserve|treasury)\/[a-f0-9-]{36}|dm\/[a-f0-9-]{36}\/[a-f0-9-]{36}\/[a-f0-9-]{36})\/[a-f0-9-]{36}\.(?:jpg|png|webp|heic|heif|webm|m4a|aac|ogg|mp3|wav|pdf|txt)$/i;
   if(!re.test(path))throw Error('Unsafe media path');
   const filename=esc(String(item.name||'Attachment').slice(0,120));
   if(item.kind==='image')return '<div class="vice-comms-media"><img data-vice-chat-media="'+esc(path)+'" loading="lazy" alt="'+filename+'" style="max-width:min(100%,320px);max-height:320px;object-fit:contain;border-radius:8px"><small class="meta">'+filename+'</small></div>';
   if(item.kind==='audio')return '<div class="vice-comms-media"><audio data-vice-chat-media="'+esc(path)+'" controls preload="none" style="width:min(100%,320px)"></audio><small class="meta">'+filename+'</small></div>';
   if(item.kind==='file')return '<div class="vice-comms-media"><a href="#" data-vice-chat-file="'+esc(path)+'" download="'+filename+'" rel="noopener noreferrer">Download '+filename+'</a></div>';
  }catch(e){return '[Invalid media attachment]'}
 }
 return esc(msg).replace(/\r?\n/g,'<br>');
}
async function viceHydrateChatMedia(root){
 if(!root||!S.user||APP_MODE!=='LIVE')return;
 await Promise.all(Array.from(root.querySelectorAll('[data-vice-chat-media],[data-vice-chat-file]')).map(async el=>{
  try{
   const result=await sb.storage.from('vice-chat-media').createSignedUrl((el.dataset.viceChatMedia||el.dataset.viceChatFile),300);
   if(result.error)throw result.error;
   if(el.isConnected&&result.data?.signedUrl){if(el.matches('[data-vice-chat-file]'))el.href=result.data.signedUrl;else el.src=result.data.signedUrl;}
  }catch(_){if(el.isConnected)el.replaceWith(document.createTextNode('Attachment unavailable or access denied'))}
 }));
}
function viceMediaContext(){
 if(APP_MODE!=='LIVE'||!S.user||S.user.id==='sim-user')throw Error('Sign in to LIVE to send media');
 const owner=S.user.id, peer=S.comms.activeDm;
 if(peer){
  if(!/^[0-9a-f-]{36}$/i.test(peer))throw Error('Invalid direct message recipient');
  const pair=[owner,peer].sort();
  return {kind:'dm',peer,root:'dm/'+pair[0]+'/'+pair[1]+'/'+owner};
 }
 const channel=S.comms.activeChannel;
 if(!['general','trading','reserve','treasury'].includes(channel))throw Error('Open a channel before sending');
 return {kind:'channel',channel,root:'ch/'+channel+'/'+owner};
}
async function viceSendMedia(file,kind,context){
 const ctx=context||viceMediaContext();
 if(!file||file.size<1||file.size>8388608)throw Error('Maximum media size 8 MB');
 const mime=String(file.type||'').split(';')[0].toLowerCase();
 const allowed={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/heif':'heif','audio/webm':'webm','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/aac':'aac','audio/ogg':'ogg','audio/mpeg':'mp3','audio/mp3':'mp3','audio/wav':'wav','audio/x-wav':'wav','application/pdf':'pdf','text/plain':'txt'};
 if(!allowed[mime]||!(['image','audio','file'].includes(kind))||(kind==='image'&&!mime.startsWith('image/'))||(kind==='audio'&&!mime.startsWith('audio/'))||(kind==='file'&&!['application/pdf','text/plain'].includes(mime)))throw Error('Unsupported attachment type');
 const key=ctx.root+'/'+(crypto.randomUUID?.()||uuid())+'.'+allowed[mime];
 const storage=sb.storage.from('vice-chat-media');
 const uploaded=await storage.upload(key,file,{contentType:mime,upsert:false,cacheControl:'60'});
 if(uploaded.error)throw uploaded.error;
 const note=VICE_MEDIA_PREFIX+JSON.stringify({kind,path:key,mime,size:file.size,name:String(file.name||'Attachment').slice(0,120)});
 try{
  if(ctx.kind==='dm')await Realtime.sendDm(ctx.peer,note);
  else await Realtime.send(ctx.channel,note);
 }catch(e){try{await storage.remove([key])}catch(_){}throw e}
 toast(kind==='image'?'Image sent':kind==='audio'?'Voice note sent':'File sent','success');
 if(S.tab==='comms')renderMain();
}
function viceAbortVoiceRecording(){
 const item=viceVoiceRecording;
 if(!item)return;
 item.cancelled=true;clearTimeout(item.timer);
 try{if(item.recorder.state!=='inactive')item.recorder.stop()}catch(_){}
 item.stream.getTracks().forEach(t=>t.stop());
 viceVoiceRecording=null;
}
async function viceToggleVoiceRecording(){
 if(viceVoiceRecording){
  if(viceVoiceRecording.recorder.state!=='inactive')viceVoiceRecording.recorder.stop();
  return;
 }
 const ctx=viceMediaContext();
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')throw Error('Browser voice recording unavailable');
 const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
 try{
  const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'];
  const format=types.find(t=>MediaRecorder.isTypeSupported?.(t))||'';
  const recorder=new MediaRecorder(stream,format?{mimeType:format}:{});
  const item={recorder,stream,chunks:[],context:ctx,cancelled:false,timer:null};
  viceVoiceRecording=item;
  recorder.ondataavailable=e=>{if(e.data?.size>0)item.chunks.push(e.data)};
  recorder.onerror=()=>{toast('Recording stopped unexpectedly','error');viceAbortVoiceRecording()};
  recorder.onstop=async()=>{
   clearTimeout(item.timer);stream.getTracks().forEach(t=>t.stop());
   if(viceVoiceRecording===item)viceVoiceRecording=null;
   if(item.cancelled)return;
   const mime=String(recorder.mimeType||'audio/webm').split(';')[0].toLowerCase();
   const ext={'audio/mp4':'m4a','audio/ogg':'ogg','audio/mpeg':'mp3'}[mime]||'webm';
   const file=new File([new Blob(item.chunks,{type:mime})],'Voice note.'+ext,{type:mime});
   try{await viceSendMedia(file,'audio',ctx)}catch(e){toast('Voice note failed: '+e.message,'error')}
   if(S.tab==='comms')renderMain();
  };
  recorder.start(1000);
  item.timer=setTimeout(()=>{if(recorder.state!=='inactive')recorder.stop()},60000);
  toast('Recording. Tap Stop to send; recording automatically stops after 60 seconds.','info');
  if(S.tab==='comms')renderMain();
 }catch(e){stream.getTracks().forEach(t=>t.stop());throw e}
}

/* Read-only per-member issuance-index display; never changes official OUV or IRU units. */
function viceOuvMemberModelHtml(){
  if(APP_MODE!=='LIVE'||!S.user?.id||S.user.id==='sim-user')return '';
  const id=String(S.user.id);
  let c=window.__viceOuvMemberModel;
  if(!c||c.id!==id){c={id,at:0,loading:false,data:null,error:''};window.__viceOuvMemberModel=c;}
  if(!c.loading&&(!c.at||Date.now()-c.at>60000)){
    const epoch=authEpoch;c.loading=true;
    sb.rpc('vice_ouv_my_reference_snapshot')
      .then(({data,error})=>{
        if(authEpoch!==epoch||String(S.user?.id)!==id)return;
        c.data=!error&&data?.policy_status==='MODEL_ONLY'?data:null;
        c.error=error?.message||(!data?'No response':'');
        c.at=Date.now();
      })
      .catch(e=>{if(authEpoch===epoch){c.data=null;c.error=String(e.message||e);c.at=Date.now();}})
      .finally(()=>{c.loading=false;if(authEpoch===epoch&&S.tab==='iru'&&String(S.user?.id)===id)renderMain();});
  }
  if(!window.__viceOuvMemberTimer){
    window.__viceOuvMemberTimer=window.setInterval(()=>{
      if(document.visibilityState==='visible'&&S.tab==='iru'&&APP_MODE==='LIVE'&&!isOwner()){
        const q=window.__viceOuvMemberModel;
        if(q?.id===String(S.user?.id)&&!q.loading&&Date.now()-q.at>=60000){q.at=0;renderMain();}
      }
    },60000);
  }
  const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0)/100);
  const price=n=>Number.isFinite(Number(n))?'$'+Number(n).toFixed(8):'—';
  const heading='<section class="band"><div class="band-head"><h2>Distribution Supply Index</h2><span class="bdg gd">MODEL ONLY</span></div>';
  const note='<p class="note">This supply-distribution indicator does not create assets or prove market appreciation. Official OUV, your actual units, certificate history, and portfolio totals are unchanged until a separately authorized valuation policy takes effect.</p>';
  if(!c.data)return heading+'<p class="meta">'+(c.loading?'Reading your server-verified unit balances…':'Model not available; official records are unchanged.')+'</p>'+note+'</section>';
  const d=c.data;
  if(!d.reconciled||d.stale_baseline||!d.user_has_holder_record)
    return heading+'<p class="note warn">Preview unavailable until the ledger, model baseline, and account linkage reconcile.</p>'+note+'</section>';
  return heading+
    '<div class="rw"><span class="rw-l">Your VICE / V4X units (unchanged)</span><span class="rw-v">'+esc(fmtNum(Number(d.units?.VICE||0)))+' / '+esc(fmtNum(Number(d.units?.V4X||0)))+'</span></div>'+
    '<div class="rw"><span class="rw-l">Current official OUV (VICE / V4X)</span><span class="rw-v">'+esc(price(d.official_ouv?.VICE))+' / '+esc(price(d.official_ouv?.V4X))+'</span></div>'+
    '<div class="rw"><span class="rw-l">Modeled OUV (not effective)</span><span class="rw-v">'+esc(price(d.model_ouv?.VICE))+' / '+esc(price(d.model_ouv?.V4X))+'</span></div>'+
    '<div class="rw"><span class="rw-l">Official holder IRU reference</span><span class="rw-v">'+esc(money(d.official_reference_cents))+'</span></div>'+
    '<div class="rw"><span class="rw-l">Modeled holder reference (not official)</span><span class="rw-v">'+esc(money(d.modeled_reference_cents))+'</span></div>'+
    '<div class="rw"><span class="rw-l">Net new distribution since model baseline</span><span class="rw-v">'+esc(fmtNum(Number(d.incremental_distributed_units||0)))+' units · '+esc(String(d.distribution_model_change_percent||0))+'% modeled</span></div>'+
    note+'</section>';
}

function viceOuvIssuerIndexHtml(){
 if(APP_MODE!=='LIVE'||!S.user?.id)return '';
 const uid=String(S.user.id);
 let c=window.__viceOuvIssuerModel;
 if(!c||c.uid!==uid){c={uid,loading:false,at:0,data:null};window.__viceOuvIssuerModel=c;}
 if(!c.loading&&(!c.at||Date.now()-c.at>=60000)){
  const epoch=authEpoch;c.loading=true;
  sb.rpc('vice_ouv_release_snapshot').then(({data,error})=>{
   if(authEpoch!==epoch||String(S.user?.id)!==uid)return;
   c.data=error?null:data;c.at=Date.now();
  }).catch(e=>{console.warn('Issuer OUV model refresh:',e.message);if(authEpoch===epoch){c.data=null;c.at=Date.now()}})
  .finally(()=>{c.loading=false;if(authEpoch===epoch&&S.tab==='iru'&&String(S.user?.id)===uid)renderMain()});
 }
 const info='<p class="note">This is an internal fixed-supply release index, not a market price, actual appreciation, cash, appraisal, or officially effective OUV. Legal total supply stays fixed and reserve balances decline when units transfer.</p>';
 if(!c.data)return '<section class="band"><div class="band-head"><h2>Distribution Index</h2><span class="bdg gd">MODEL ONLY</span></div><p class="meta">Loading verified distribution arithmetic…</p>'+info+'</section>';
 const d=c.data;
 const fmt8=x=>Number.isFinite(Number(x))?'$'+Number(x).toFixed(8):'—';
 return '<section class="band"><div class="band-head"><h2>Distribution Index</h2><span class="bdg gd">MODEL ONLY · NOT OFFICIAL OUV</span></div>'+
 (d.model_usable===false?'<p class="note warn">Model paused: accounting reconciliation or base OUV needs review.</p>':
  '<div class="rw"><span class="rw-l">Net new units since index baseline</span><span class="rw-v">'+esc(fmtNum(Number(d.incremental_units||0)))+' of 20,000,000 · '+esc(String(d.appreciation_percent||0))+'% model</span></div>'+
  '<div class="rw"><span class="rw-l">Model VICE / V4X references</span><span class="rw-v">'+esc(fmt8(d.modeled_ouv?.VICE))+' / '+esc(fmt8(d.modeled_ouv?.V4X))+'</span></div>'+
  '<div class="rw"><span class="rw-l">Official VICE / V4X references</span><span class="rw-v">'+esc(fmt8(d.official_ouv?.VICE))+' / '+esc(fmt8(d.official_ouv?.V4X))+'</span></div>')+
 info+'</section>';
}
function viewIRU(el){
  // Founder executive identity controls the issuer reserve; it is not
  // implicitly an individually issued VIP/holder allocation.
  if(isOwner()){
    const viceReserve=managedReserveUnits('VICE');
    const v4xReserve=managedReserveUnits('V4X');
    const vice=Number(S.iruClasses[0]?.ouv)||0;
    const v4x=Number(S.iruClasses[1]?.ouv)||0;
    const fmt=v=>Number(v).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
    el.innerHTML=`
      <div class="ph"><div><div class="eb">Institutional Record</div><h1>Estate &amp; <em>Administrative Reserve</em></h1>
        <p>VC-000001 · VICE Capital Inc. · Founder &amp; CEO — authorized reserve controller, not a personal IRU allocation.</p></div></div>
      <section class="band"><div class="band-head"><h2>Issuer reserve · VC-000001</h2><span class="bdg gd">INSTITUTIONAL</span></div>
        <div class="rw"><span class="rw-l">Legal entity</span><span class="rw-v">VICE Capital Inc.</span></div>
        <div class="rw"><span class="rw-l">Authorized controller</span><span class="rw-v">Founder &amp; CEO</span></div>
        <div class="rw"><span class="rw-l">VICE unassigned reserve units</span><span class="rw-v">${S.estateAdminLedger?fmtNum(viceReserve):'Awaiting verified reserve ledger'}</span></div>
        <div class="rw"><span class="rw-l">V4X unassigned reserve units</span><span class="rw-v">${S.estateAdminLedger?fmtNum(v4xReserve):'Awaiting verified reserve ledger'}</span></div>
        <div class="rw"><span class="rw-l">Current VICE management OUV</span><span class="rw-v">${fmt(vice)}</span></div>
        <div class="rw"><span class="rw-l">Current V4X management OUV</span><span class="rw-v">${fmt(v4x)}</span></div>
        <div class="rw"><span class="rw-l">Combined reserve management reference</span><span class="rw-v">${S.estateAdminLedger?fmt(viceReserve*vice+v4xReserve*v4x):'Pending ledger verification — excluded from verified total'}</span></div>
        <p class="note">Reference calculations use the current displayed issuer OUV and stated reserve allocation, not an independently appraised fair market value. Reserve control does not constitute personal ownership. Historical certificates and signed balances are not modified by this display.</p>
        <div class="actions"><button class="btn btn-gd" data-go="governance">Governance</button><button class="btn btn-gd" data-go="admin">Propose OUV revision</button></div>
      </section>
      ${viceOuvIssuerIndexHtml()}`;
    return;
  }
  if(!S.tokenCerts.loaded&&!S.tokenCerts.loading&&S.user?.id&&S.user.id!=='sim-user')
    ViceTokenCertificates.load().then(()=>{if(S.tab==='iru')renderMain();}).catch(()=>{});
  const st = S.iru.state || IruEngine.emptyState();
  const me = S.user ? st.holders[currentHolderId()] : null;
  const mine = me ? IruEngine.holderView(st, currentHolderId()) : null;
  const cap = IruEngine.capacity(st);

  if(!mine){
    el.innerHTML = `
      <div class="ph"><div><div class="eb">My Record</div><h1>My <em>IRU</em></h1></div></div>
      <section class="band"><p class="muted">No holder record yet. It will be created automatically on your first interaction with the registry.</p></section>
      ${viceOuvMemberModelHtml()}
    `;
    return;
  }

  // Official issuer references come from vice_dao_config; replayed IRU journal
  // snapshots are historical and must never override the current policy.
  // Canonical My IRU display matches SQL: add *exact* eight-decimal line
  // values first, then round the combined holder reference ONCE to cents.
  // Independent per-class rounding can overstate a displayed total by $0.01.
  // Allocate any sub-cent reconciliation difference to the V4X display line.
  const officialScaled=APP_MODE==='LIVE'&&S.daoPriceSyncStatus==='CANONICAL'
    ?S.iruClasses.slice(0,2).map(c=>{
      const n=Number(c?.ouv);
      return Number.isFinite(n)&&n>0?BigInt(Math.round(n*100000000)):null;
    }):null;
  const canShowOfficial=!!officialScaled&&officialScaled.length===2
    &&officialScaled.every(p=>p!==null)
    &&officialScaled[1]===officialScaled[0]*160n;
  const roundedCents=n=>(n+500000n)/1000000n;
  const viceLiveRef=canShowOfficial
    ?roundedCents(BigInt(mine.VICE.held)*officialScaled[0]):null;
  const combinedLiveRef=canShowOfficial
    ?roundedCents(BigInt(mine.VICE.held)*officialScaled[0]
                 +BigInt(mine.V4X.held)*officialScaled[1]):null;
  const v4xLiveRef=canShowOfficial?combinedLiveRef-viceLiveRef:null;
  const viceShownRef=APP_MODE==='LIVE'?viceLiveRef:mine.VICE.refCents;
  const v4xShownRef=APP_MODE==='LIVE'?v4xLiveRef:mine.V4X.refCents;
  const combinedShownRef=APP_MODE==='LIVE'?combinedLiveRef
    :viceShownRef!==null&&v4xShownRef!==null?viceShownRef+v4xShownRef:null;
  el.innerHTML = `
    <div class="ph">
      <div><div class="eb">My Record</div><h1>My <em>IRU &amp; Units</em></h1>
        <p>Internal revenue units, allocation history, and internal reference values.</p></div>
      <div class="ph-acts">
        <span class="chip file"><i></i>${esc(mine.identity.clientId)}</span>
        ${mine.identity.status === 'ACTIVE' ? '<span class="chip live"><i></i>active</span>' : `<span class="chip blocked"><i></i>${esc(mine.identity.status.toLowerCase())}</span>`}
      </div>
    </div>
    <div class="stats">
      <div class="st"><span class="l">VICE units</span><div class="v gd">${fmtNum(Number(mine.VICE.held))}</div><div class="n">${viceShownRef!==null ? Money.fmt(viceShownRef) + ' official ref' : 'awaiting verified issuer OUV'}</div></div>
      <div class="st"><span class="l">V4X units</span><div class="v">${fmtNum(Number(mine.V4X.held))}</div><div class="n">${v4xShownRef!==null ? Money.fmt(v4xShownRef) + ' official ref' : 'awaiting verified issuer OUV'}</div></div>
      <div class="st"><span class="l">Total ref value</span><div class="v gr">${combinedShownRef!==null ? Money.fmt(combinedShownRef) : '—'}</div></div>
      <div class="st"><span class="l">Allocations</span><div class="v">${mine.allocations.length}</div></div>
    </div>
    ${viceOuvMemberModelHtml()}
    <section class="band">
      <div class="band-head"><h2>Classification</h2></div>
      <div class="rw"><span class="rw-l">Tier</span><span class="rw-v">${mine.classification.tier ? `${esc(mine.classification.tier.tier)} · ${esc(mine.classification.tier.name)}` : '<span class="meta">Not assigned</span>'}</span></div>
      <div class="rw"><span class="rw-l">Legacy</span><span class="rw-v">${mine.classification.legacy ? `${esc(mine.classification.legacy.order)} · ${esc(mine.classification.legacy.name)}` : '<span class="meta">Not assigned</span>'}</span></div>
      <div class="rw"><span class="rw-l">Entry Class</span><span class="rw-v">${mine.classification.entry ? `${esc(mine.classification.entry.entryProgram || '—')} · ${esc(mine.classification.entry.originalClass || '')}` : '<span class="meta">Not recorded</span>'}</span></div>
      <div class="rw"><span class="rw-l">Appointed</span><span class="rw-v">${whenText(mine.identity.appointedAt)}</span></div>
      <div class="rw"><span class="rw-l">Holder type</span><span class="rw-v">${esc(mine.identity.holderType || 'Standard')}</span></div>
    </section>
    <section class="band">
      <div class="band-head"><h2>Supply summary</h2><span class="meta">250-holder cap · ${cap.current}/${cap.max}</span></div>
      <div class="rw"><span class="rw-l">VICE distributed</span><span class="rw-v">${fmtNum(Number(st.supply.VICE))} / ${fmtNum(Number(IruEngine.ECON.pool))}</span></div>
      <div class="rw"><span class="rw-l">V4X distributed</span><span class="rw-v">${fmtNum(Number(st.supply.V4X))} / ${fmtNum(Number(IruEngine.ECON.pool))}</span></div>
      <div class="rw"><span class="rw-l">Estate reserve</span><span class="rw-v">${fmtNum(Number(IruEngine.ECON.reserve))} per program</span></div>
    </section>
    <section class="band">
      <div class="band-head"><h2>My allocations</h2><span class="meta">${mine.allocations.length}</span></div>
      ${mine.allocations.length ? `<div class="scroll-x"><table class="pos"><thead><tr>
        <th>ID</th><th>Program</th><th>Units</th><th>State</th><th>Created</th>
      </tr></thead><tbody>
        ${mine.allocations.map(a => `<tr>
          <td class="mn">${esc(a.allocationId.slice(0,8))}</td>
          <td><span class="bdg ${a.program === 'VICE' ? 'gd' : 'nt'}">${esc(a.program)}</span></td>
          <td class="mn">${fmtNum(Number(a.units))}</td>
          <td><span class="tstate ts-${a.state.toLowerCase()}">${esc(a.state.toLowerCase())}</span></td>
          <td class="meta">${whenText(a.createdAt)}</td>
        </tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">No allocations yet.</p>'}
    </section>
    ${ViceTokenCertificates.htmlSection()}
    <section class="band">
      <div class="band-head"><h2>Legal</h2></div>
      ${mine.legal ? `<div class="rw"><span class="rw-l">Status</span><span class="rw-v">${esc(mine.legal.status)}</span></div>
        <div class="rw"><span class="rw-l">Counsel</span><span class="rw-v">${esc(mine.legal.counsel || '—')}</span></div>
        <div class="rw"><span class="rw-l">Recorded</span><span class="rw-v">${whenText(mine.legal.at)}</span></div>` : '<p class="muted">No legal status on record.</p>'}
      <p class="note">IRU rights and transfer restrictions are governed by the applicable issuance and holder agreements. Any collateral use requires lender acceptance, an agreed valuation and properly documented security arrangements; recording a reference value does not itself establish these conditions.</p>
    </section>
  `;
}

function viewDistributions(el){
  const isAdmin = can('exec') || isOwner();
  const mine = isAdmin ? S.distributions : S.distributions.filter(d => {
    const holder = S.iru.state && S.user ? S.iru.state.holders[currentHolderId()] : null;
    if(!holder) return false;
    if(d.holderClientId && d.holderClientId === holder.clientId) return true;
    if(d.holderId && d.holderId === S.user.id) return true;
    return false;
  });
  el.innerHTML = `
    <div class="ph">
      <div><div class="eb">${isAdmin ? 'Records' : 'My Record'}</div><h1>${isAdmin ? 'Distributions' : 'My <em>Distributions</em>'}</h1></div>
      <div class="ph-acts">${isAdmin ? '<button class="btn btn-p" data-act="dist-new">+ New distribution</button>' : ''}</div>
    </div>
    <section class="band">
      <div class="band-head"><h2>Records</h2><span class="meta">${mine.length}</span></div>
      ${mine.length ? `<div class="scroll-x"><table class="pos"><thead><tr>
        <th>Period</th><th>Holder</th><th>Program</th><th class="right">Total</th><th>Status</th>${isAdmin ? '<th></th>' : ''}
      </tr></thead><tbody>
        ${mine.map(d => `<tr>

          <td class="mn right">${fmtMoney(d.total, 'USD')}</td>

async function viceExecKey(getOnly=false){const db=await new Promise((ok,no)=>{const q=indexedDB.open('vice-executive-signing',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('keys'))q.result.createObjectStore('keys')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});try{const identity=S.user?.id;if(!identity)throw Error('Executive session required');const get=id=>new Promise((ok,no)=>{const q=db.transaction('keys').objectStore('keys').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});const scoped=await get('executive:'+identity);const legacy=await get('executive');if(getOnly)return scoped||legacy||null;if(scoped)return scoped;if(legacy)throw Error('Legacy key requires verification before migration');const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);await new Promise((ok,no)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(pair,'executive:'+identity);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});return pair;}finally{db.close()}}
async function viceExecVerifiedKey(){if(!S.user?.id)throw Error('Executive sign-in required');const {data:signer,error}=await sb.from('vice_exec_signers').select('role,public_key').eq('user_id',S.user.id).maybeSingle();if(error)throw error;if(!signer?.public_key)throw Error('No registered executive signing key');const db=await new Promise((ok,no)=>{const q=indexedDB.open('vice-executive-signing',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('keys'))q.result.createObjectStore('keys')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});try{const get=id=>new Promise((ok,no)=>{const q=db.transaction('keys').objectStore('keys').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});for(const id of ['executive:'+S.user.id,'executive']){const pair=await get(id);if(!pair?.privateKey||!pair?.publicKey)continue;const key=await crypto.subtle.exportKey('jwk',pair.publicKey);if(['kty','crv','x','y'].every(k=>key[k]===signer.public_key[k])){if(id==='executive'){await new Promise((ok,no)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(pair,'executive:'+S.user.id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}return pair}}throw Error('No local signing key matches the registered '+signer.role+' key. Recovery authorization cannot be bypassed.');}finally{db.close()}}
async function viceExecReplacementKey(){if(!S.user?.id||!isOwner())throw Error('CEO authentication required');const db=await new Promise((ok,no)=>{const q=indexedDB.open('vice-executive-signing',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('keys'))q.result.createObjectStore('keys')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});try{const id='recovery-replacement:'+S.user.id;const existing=await new Promise((ok,no)=>{const q=db.transaction('keys').objectStore('keys').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});if(existing?.privateKey&&existing?.publicKey)return existing;const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);await new Promise((ok,no)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(pair,id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});return pair;}finally{db.close()}}
async function viceExecKeyDiagnostic(){const box=document.getElementById('execKeyDiagnostic');if(!box)return;box.textContent='Checking executive key custody…';try{const pair=await viceExecVerifiedKey();if(!pair?.privateKey)throw Error('Missing private key');box.textContent='Verified: this browser has the registered executive signing key.';}catch(e){box.textContent='Key verification: '+e.message+' · Verified 2FA authorization is available independently of browser signing keys.';}}
async function viceExecRecoverySign(id,action){const pair=action==='RECOVERY_ACTIVATE'?await viceExecReplacementKey():await viceExecVerifiedKey();const ch=await sb.rpc('vice_exec_recovery_challenge',{p_request:id,p_action:action});if(ch.error)throw ch.error;const bytes=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},pair.privateKey,new TextEncoder().encode(ch.data.message));const session=(await sb.auth.getSession()).data.session;if(!session)throw Error('Session expired');const response=await fetch(SUPABASE_URL+'/functions/v1/vice-institutional',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'verify_recovery',challenge_id:ch.data.id,signature:btoa(String.fromCharCode(...new Uint8Array(bytes)))})});const data=await response.json();if(!response.ok||data.error)throw Error(data.error||'Signature rejected');return data;}

async function viceExecPromoteRecoveredKey(){
 const pair=await viceExecReplacementKey();
 const {data:signer,error}=await sb.from('vice_exec_signers').select('public_key').eq('user_id',S.user.id).maybeSingle();
 if(error)throw error;
 const local=await crypto.subtle.exportKey('jwk',pair.publicKey);
 if(!signer?.public_key||!['kty','crv','x','y'].every(k=>local[k]===signer.public_key[k]))
  throw Error('Activated replacement key has not been registered; local signing key was not modified');
 const db=await new Promise((ok,no)=>{const q=indexedDB.open('vice-executive-signing',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('keys'))q.result.createObjectStore('keys')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
 try{
  const id='executive:'+S.user.id;
  const existing=await new Promise((ok,no)=>{const q=db.transaction('keys').objectStore('keys').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
  await new Promise((ok,no)=>{
   const tx=db.transaction('keys','readwrite');
   if(existing?.privateKey)tx.objectStore('keys').put(existing,'executive-prior:'+S.user.id+':'+Date.now());
   tx.objectStore('keys').put(pair,id);
   tx.oncomplete=ok;tx.onerror=()=>no(tx.error);
  });
 }finally{db.close()}
}
function viceExecMfaOpen(kind,id){
 if(APP_MODE!=='LIVE'||!S.user?.id)throw Error('Live executive sign-in required');
 if(!['APPROVE','RECOVERY_APPROVE','RECOVERY_ACTIVATE'].includes(kind))throw Error('Unsupported authorization action');
 const p=kind==='APPROVE'?(S.sovereignProposals||[]).find(x=>x.id===id):null;
 if(kind==='APPROVE'&&!p)throw Error('Refresh governance and select an active proposal');
 const subject=kind==='APPROVE'?'Proposal '+id:kind==='RECOVERY_APPROVE'?'CFO approval of CEO key recovery '+id:'CEO activation of replacement key '+id;
 const hash=kind==='APPROVE'?String(p.payload_hash||''):'';
 openModal('Executive 2FA Authorization','<p class="note">This method has equal internal governance authorization authority under VICE policy. It is recorded distinctly from a cryptographic signature.</p>'+
 '<p><strong>'+esc(subject)+'</strong></p>'+
 (hash?'<p class="meta">Verified proposal payload SHA-256: <code style="overflow-wrap:anywhere">'+esc(hash)+'</code></p>':'')+
 '<p class="meta">Enter a fresh six-digit authenticator code to explicitly approve this exact action. CEO and CFO authorizations remain independent.</p>'+
 '<div class="ff"><label>Authenticator code</label><input id="execMfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" /></div>'+
 '<div class="mact"><button class="btn btn-g" data-act="modal-close">Cancel</button><button class="btn btn-p" data-act="exec-mfa-confirm" data-authorization-action="'+esc(kind)+'" data-id="'+esc(id)+'">Verify & Authorize</button></div>');
}
async function viceExecMfaSubmit(kind,id,button){
 const code=String(document.getElementById('execMfaCode')?.value||'').trim();
 if(!/^[0-9]{6}$/.test(code))throw Error('Enter the six-digit authenticator code');
 const proposal=kind==='APPROVE'?id:null,recovery=kind==='APPROVE'?null:id;
 if(button){button.disabled=true;button.textContent='Verifying authenticator…';}
 try{
  const request=await sb.rpc('vice_exec_mfa_begin',{p_action:kind,p_proposal:proposal,p_recovery:recovery});
  if(request.error)throw request.error;
  let proof=null;
  if(kind==='RECOVERY_ACTIVATE'){
   const pair=await viceExecReplacementKey();
   const bytes=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},pair.privateKey,new TextEncoder().encode(request.data.message));
   proof=btoa(String.fromCharCode(...new Uint8Array(bytes)));
  }
  const result=await sb.auth.getSession(),session=result.data?.session;
  if(!session)throw Error('Executive session expired, sign in again');
  const response=await fetch(SUPABASE_URL+'/functions/v1/vice-institutional',{
   method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token},

    proposal_id:proposal,recovery_request_id:recovery,code,key_proof:proof})
  });
  const data=await response.json();
  if(!response.ok||data.error||!data.verified)throw Error(data.error||'Executive authorization was not verified');
  let promoted=true;

  const refresh=document.querySelector('[data-act="exec-recovery-refresh"]');
  if(refresh&&kind!=='APPROVE')refresh.click();
  return data;
 }finally{if(button?.isConnected){button.disabled=false;button.textContent='Verify & Authorize';}}
}

function openSheet(title, body){

  root.innerHTML = `
    <div class="sheet-back" data-act="sheet-close" data-sheet-back="1"></div>
    <div class="sheet">
      <div class="sheet-head">

function closeSheet(){
  S.sheet = null;
  const root = $('sheet-root');
  if(!root) return;
  root.classList.remove('on');

}

/* ═══════════════════════════════════════════════════════════════════
   SYMBOL SEARCH SHEET
   ═══════════════════════════════════════════════════════════════════ */

function openSymbolSheet(){
  const cats = CATALOG;
  const grouped = {};
  cats.forEach(([group, list]) => {
    grouped[group] = list.map(x => {
      const sym = Array.isArray(x) ? x[0] : x;
      const desc = Array.isArray(x) ? x[1] : (symDesc(sym));
      return { sym, desc };
    });
  });
  let html = `<div class="ff" style="margin-bottom:12px"><input id="symSearch" placeholder="Search symbol or description…" autofocus></div>`;
  if(!isLive() && S.sets[PRACTICE + '|1h']){
    html += `<div class="band" style="padding:10px;margin-bottom:8px"><b>Practice</b><span class="meta" style="margin-left:8px">Simulated practice series</span>
      <button class="btn btn-xs btn-p" data-act="pick-symbol" data-symbol="PRACTICE" style="margin-left:8px">Select</button></div>`;
  }
  for(const [group, items] of Object.entries(grouped)){
    html += `<div style="margin-bottom:12px"><div class="eb" style="margin-bottom:6px">${esc(group)}</div>`;
    html += items.map(it => {
      const active = S.sel.symbol === it.sym ? ' style="border-color:var(--gd);background:rgba(201,168,76,.08)"' : '';
      return `<button class="up-row" data-act="pick-symbol" data-symbol="${esc(it.sym)}"${active}>
        <span class="up-info"><b>${esc(displaySymbol(it.sym))}</b><span>${esc(it.desc || symDesc(it.sym))}</span></span>
      </button>`;
    }).join('');
    html += `</div>`;
  }
  html += `<div class="band" style="margin-top:12px;padding:12px">
    <b>Custom symbol</b>
    <div class="ff" style="margin-top:8px"><input id="customSym" placeholder="e.g. XAUUSD, EURUSD, BTCUSDT, or EXCHANGE:PAIR"></div>
    <div class="actions" style="margin-top:8px"><button class="btn btn-sm btn-p" data-act="pick-custom-symbol">Load</button></div>
  </div>`;
  openSheet('Search symbol', html);
  setTimeout(() => {
    const inp = $('symSearch');
    if(inp){
      inp.focus();
      inp.addEventListener('input', () => {
        const q = inp.value.trim().toLowerCase();
        document.querySelectorAll('#sheet-root .up-row').forEach(row => {
          const sym = (row.dataset.symbol || '').toLowerCase();
          const desc = (row.textContent || '').toLowerCase();
          row.style.display = (!q || sym.includes(q) || desc.includes(q)) ? '' : 'none';
        });
      });
    }
  }, 30);
}

/* ═══════════════════════════════════════════════════════════════════
   EXTENDED __viceAct — HANDLES EVERY data-act NOT COVERED ABOVE
   (Merges into the existing handler without clobbering it.)
   ═══════════════════════════════════════════════════════════════════ */

(function extendActHandler(){
  const prev = window.__viceAct;
  window.__viceAct = function(t, e){
    const act = t.dataset.act;

    switch(act){
      /* ─── MODE / BANNER ─── */
      case 'bnr-close': {
        try { localStorage.setItem('vice-banner-hidden','1'); } catch(_){}
        document.documentElement.classList.add('bnr-hidden');
        const bnr = $('bnr');
        if (bnr) { bnr.style.display = 'none'; bnr.remove(); }
        const mn = document.querySelector('main.mn');
        if (mn) mn.style.marginTop = '';
        return;
      }
      case 'bnr-reset': {
        try { localStorage.removeItem('vice-banner-hidden'); } catch(_){}
        document.documentElement.classList.remove('bnr-hidden');
        const mn = document.querySelector('main.mn');
        if (mn) mn.style.marginTop = '';
        location.reload();
        return;
      }

      /* ─── SYMBOL SHEET / CHART ─── */
      case 'open-symbol-sheet': { openSymbolSheet(); return; }
      case 'pick-symbol': {
        const sym = t.dataset.symbol;
        if(!sym) return;
        closeSheet();
        S.sel.symbol = sym;
        S.ch.pair = sym;
        S.sel.src = 'local';
        S.ch.source = 'SIM';
        loadCandles().then(() => {
          toast(`Loaded ${displaySymbol(sym)}`,'success');
          if(S.tab !== 'markets') go('markets'); else renderMain();
        });
        return;
      }
      case 'pick-custom-symbol': {
        const sym = ($('customSym')?.value || '').trim();
        if(!sym){ toast('Enter a symbol','error'); return; }
        closeSheet();
        S.sel.symbol = sym;
        S.ch.pair = sym;
        S.sel.src = 'local';
        loadCandles().then(() => {
          toast(`Loading ${displaySymbol(sym)}…`,'info');
          if(S.tab !== 'markets') go('markets'); else renderMain();
        });
        return;
      }
      case 'set-tf': {
        S.sel.tf = t.dataset.tf;
        S.ch.tf = t.dataset.tf;
        loadCandles().then(() => renderMain());
        return;
      }
      case 'toggle-show': {
        const k = t.dataset.key;
        S.chart.show[k] = S.chart.show[k] === false ? true : false;
        renderMain();
        return;
      }
      case 'set-preset': {
        const p = t.dataset.preset;
        S.chart.preset = p;
        S.chart.colors = { ...PRESETS[p] };
        renderMain();
        return;
      }
      case 'set-ctype': {
        S.chart.type = t.dataset.ctype;
        renderMain();
        return;
      }
      case 'refresh-chart': {
        loadCandles().then(() => { toast('Chart refreshed','success'); renderMain(); });
        return;
      }
      case 'zoom-in':  { zoomChart(0.8); return; }
      case 'zoom-out': { zoomChart(1.25); return; }
      case 'chart-reset': { S.view2.count = 140; S.view2.end = null; S.view2.priceRange=null; drawAll(); return; }
      case 'toggle-fullscreen': { toggleChartFullscreen(); return; }
      case 'toggle-chart-overlay': {
        const k=t.dataset.overlay;

   </div><div class="mact"><button class="btn btn-g" data-act="modal-close">Cancel</button>
   <button class="btn btn-p" data-act="ouv-save">Submit for CEO/CFO review</button></div>`);
}
async function saveOuv(){
  if(!isOwner())return;
  const vice=Number($('ouvVice')?.value);
  const version=($('ouvVersion')?.value||'').trim(),note=($('ouvNote')?.value||'').trim();
  if(!(vice>0&&vice<=1e10&&Number.isFinite(vice))||!version||note.length<40){
    toast('Enter a valid proposed OUV, proposal reference and documented rationale (40+ characters)','error');return;
  }
  if(APP_MODE!=='LIVE'||!S.user){toast('Sign in to LIVE to submit a proposal','warn');return;}
  const baselineVice=Number(S.iruClasses[0].ouv),baselineV4x=Number(S.iruClasses[1].ouv);
  if(!(baselineVice>0&&baselineV4x>0)){toast('Current approved OUV unavailable; refresh before submitting','error');return;}
  const id='PROP-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+crypto.randomUUID().slice(0,12).toUpperCase();
  const payload={protocol_version:'VICE4X-SOVEREIGN-ELITE-v3.0',proposal_id:id,
    parameters:{previous_baseline:{vice_ouv:baselineVice,v4x_ouv:baselineV4x},
      target_scaled_tier:{vice_ouv:vice,v4x_ouv:Number((vice*160).toFixed(8))},structural_ratio:160},
    proposal_reference:version,justification:note,valuation_basis:{classification:'INTERNAL_MANAGEMENT_REFERENCE',methodology_summary:note,prior_effective_ouv:{vice:baselineVice,v4x:baselineV4x},proposed_change_pct:Number(((vice/baselineVice-1)*100).toFixed(4)),independent_fmv_asserted:false,bank_collateral_acceptance_asserted:false,approval_status:'PENDING_GOVERNANCE'}};
  const button=document.querySelector('[data-act="ouv-save"]');
  if(button){button.disabled=true;button.textContent='Saving proposal…';}
  try{
    const submitted=await sb.rpc('vice_sovereign_submit',{p_payload:payload});
    if(submitted.error)throw submitted.error;
    if(submitted.data!==id)throw Error('Institutional service returned an unexpected proposal ID');
    // Confirm persistence through the canonical public feed rather than a
    // direct table SELECT, which may be restricted by row-level security.
    const {data:feed,error:feedError}=await sb.rpc('vice_sovereign_feed');
    if(feedError)throw Error('Submission acknowledged, but publication verification failed: '+feedError.message+' · '+id);
    const record=(Array.isArray(feed)?feed:[]).find(p=>p.id===id);
    if(!record)throw Error('Institutional service acknowledged the submission, but no validated REVIEW record is published. Check the institutional review log before resubmitting. ID: '+id);
    await refreshGovernance();
    closeModal();toast('Institutional proposal saved: '+id+' · CEO/CFO review required','success');
    try{navigate('governance');}catch(_){renderMain();}
  }catch(e){toast('OUV proposal not confirmed: '+e.message,'error');}
  finally{if(button){button.disabled=false;button.textContent='Submit for CEO/CFO review';}}
}

// Issuance gate: require server-attested canonical 1:160 OUV and fixed-pool
// capabilities. The exact OUV may change through governed versions; never
// permanently lock future distributions to historical $2/$320 prices.
async function verifyStrategicBackend(){
  S.strategicBackendVerified=false;
  if(!S.user || APP_MODE!=='LIVE' || !isRegistryOperator())return false;
  if(S.daoPriceSyncStatus!=='CANONICAL'){
    try{await refreshDaoConfig();}catch(_){return false;}
  }
  if(S.daoPriceSyncStatus!=='CANONICAL')return false;
  try{
    const {data,error}=await sb.rpc('vice_financial_release_capabilities');
    S.strategicBackendVerified=(!error && data?.strategic_price_rpc_v133===true
      && data?.canonical_ouv_verified===true
      && Number(data?.reference_vice)===Number(S.iruClasses[0].ouv)
      && Number(data?.reference_v4x)===Number(S.iruClasses[1].ouv)
      && Number(data?.reference_ratio)===160
      && Number(data?.total_units_per_class)===10000000
      && Number(data?.strategic_capacity_per_class)===2500000);
  }catch(_){S.strategicBackendVerified=false;}
  return S.strategicBackendVerified;
}

async function submitStrategicCorrection(){

async function submitStrategicAllocation(){

    if(!p_holder_id)throw Error('Choose holder');

    const {data,error}=await sb.rpc('create_iru_allocation',{
      p_holder_id,p_program,p_units:Number(s),p_price:null});

async function advanceStrategicAllocation(id,action){
  if(strategicActionBusy)return;strategicActionBusy=true;
  try{
    if(APP_MODE!=='LIVE'||!isRegistryOperator())throw Error('CFO or Reserve administrator required');
    if(!await verifyStrategicBackend())throw Error('Financial writes disabled: backend canonical-price migration not verified');
    if(!['APPROVE','RESERVE','DISTRIBUTE'].includes(action))throw Error('Invalid action');
    if(!confirm('Confirm '+action+' for strategic allocation '+String(id).slice(0,8)+'?'))return;
    const params=action==='DISTRIBUTE'
      ? ['distribute_iru_allocation',{p_allocation_id:id,p_correlation_id:crypto.randomUUID()}]
      : ['advance_iru_allocation',{p_allocation_id:id,p_action:action}];
    const {data,error}=await sb.rpc(params[0],params[1]);
    if(error)throw error;
    const status=action==='DISTRIBUTE'?'DISTRIBUTED':action==='APPROVE'?'APPROVED':'RESERVED';
    if(!data||data.status!==status)throw Error('Server result uncertain: reconcile before another request');
    toast('Strategic allocation: '+status,'success');
    // Invalidating the previous optimistic event projection is essential.
    // Reload from the authoritative, ordered IRU ledger after issuance.
    if(status==='DISTRIBUTED'){
      S.iru.registryReady=false;
      await hydrateData();
    }
    await openStrategicManager();
    renderMain();
  }catch(e){toast('Strategic action not confirmed: '+e.message,'error');}
  finally{strategicActionBusy=false;}
}

      program,
      units,
      reason,
      by: S.user?.email || 'system',
      at: nowIso(),
    };

async function submitDistribution(){
  if(!isOwner() || APP_MODE!=='LIVE') return toast('Issuer authorization required in LIVE mode','error');
  const period = $('distPeriod')?.value.trim();
  const sel = $('distHolder');
  const holderId = sel?.value;
  const holderName = sel?.selectedOptions[0]?.dataset.name || '';
  const holderClientId = sel?.selectedOptions[0]?.dataset.client || '';
  const program = $('distProgram')?.value || 'VICE';
  const total = Number($('distTotal')?.value || 0);
  const perUnit = Number($('distPerUnit')?.value || 0);
  const status = $('distStatus')?.value || 'DRAFT';
  const note = $('distNote')?.value.trim() || '';
  if(!period || !holderId || !Number.isFinite(total) || total<=0 || !Number.isFinite(perUnit) || perUnit<0){
    return toast('Period, holder and valid positive total required','error');
  }
  const rec = {
    id:uuid(), period, holderId, holderName, holderClientId, program,
    total, perUnit, status, note, createdAt:nowIso(),
  };
  try {
    const {data,error}=await sb.from('distributions').insert({
      id:rec.id, period:rec.period, holder_id:rec.holderId,
      holder_name:rec.holderName, holder_client_id:rec.holderClientId,
      program:rec.program, total:rec.total, per_unit:rec.perUnit,
      status:rec.status, note:rec.note, created_by:S.user.id,
    }).select('id,period,holder_id,holder_name,holder_client_id,program,total,per_unit,status,note,created_at').single();
    if(error)throw error;
    S.distributions.unshift({
      ...rec,id:data.id,period:data.period,holderId:data.holder_id,
      holderName:data.holder_name,holderClientId:data.holder_client_id,
      program:data.program,total:Number(data.total),perUnit:Number(data.per_unit),
      status:data.status,note:data.note,createdAt:data.created_at,
    });
    closeModal();
    toast('Distribution saved to Supabase','success');
    try{ audit('DISTRIBUTION_CREATED', `${period} · ${fmtMoney(total,'USD')}`, 'distribution', data.id); }catch(e){console.warn('Distribution audit:',e);}
    try{ if(holderId && window.Realtime?.emit) Realtime.emit('notify', {
      kind:'distribution',period,total,program,status,
    },holderId); }catch(e){console.warn('Distribution notification:',e);}
    renderMain();
  }catch(e){
    console.error('Distribution save failed:',e);
    toast('Distribution NOT saved: ' + (e.message||'request failed'),'error');
  }
}

async function advanceDistribution(id){
  if(!isOwner() || APP_MODE!=='LIVE')return toast('Issuer authorization required in LIVE mode','error');
  const d = S.distributions.find(x=>x.id===id);
  if(!d)return;
  const next=d.status==='DRAFT'?'AUDITED':d.status==='AUDITED'?'PAID':d.status;
  if(next===d.status)return;
  try{
    const {data,error}=await sb.from('distributions').update({status:next})
      .eq('id',id).select('id,status').single();
    if(error)throw error;
    d.status=data.status;
    if(next==='PAID'){
      S.tokenCerts.loaded=false;
      ViceTokenCertificates.load().catch(e=>console.warn('Distribution certificate refresh:',e));
    }
    toast(`Distribution saved: ${next}`,'success');
    try{ if(d.holderId && window.Realtime?.emit) Realtime.emit('notify',{
      kind:'distribution',period:d.period,total:d.total,program:d.program,status:next,
    },d.holderId); }catch(e){console.warn('Distribution notification:',e);}
    renderMain();
  }catch(e){
    console.error('Distribution status failed:',e);
    toast('Status NOT saved: '+(e.message||'request failed'),'error');
  }
}

function syncLabInputs(){
  document.querySelectorAll('[data-lab]').forEach(inp => {
    const k = inp.dataset.lab;
    const v = inp.value;
    if(k === 'strategy') S.lab.strategy = v;
    else if(k === 'seed') S.lab.seed = Math.max(1, Math.floor(Number(v) || 1));
    else if(k === 'spread' || k === 'slip'){
      S.lab.costs = S.lab.costs || { spread:0, slippage:0, commission:0 };
      if(k === 'spread') S.lab.costs.spread = Number(v) || 0;
      if(k === 'slip') S.lab.costs.slippage = Number(v) || 0;
    }
  });
}
