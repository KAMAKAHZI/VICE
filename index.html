  }
  if(!out.length)throw new Error('Yahoo: no valid price candles');
  return out;
}

async function fetchCandlesUnified(symbol, tf, limit) {
  if (APP_MODE === 'SIM' || symbol === PRACTICE) {
    return sampleSeries(limit || 500, 20260921, (TF_SEC[tf]||3600)*1000, Date.now() - (limit || 500) * (TF_SEC[tf]||3600)*1000);
  }
  const { source, ticker } = parseSymbol(symbol);
  if (source === 'YAHOO') {
    let raw = await fetchCandlesYahoo(ticker, tf);
    if (YAHOO_TF[tf] && YAHOO_TF[tf] !== tf && (TF_SEC[tf]||0) > (TF_SEC[YAHOO_TF[tf]]||0)) {
      raw = resample(raw, tf);
    }
    return raw;
  }
  return await fetchCandlesBinance(ticker, tf, limit);
}

async function loadLtfCandles(current=()=>true) {
  const ltf=Solace.LTF_FOR_TF[S.ch.tf];
  if(!ltf){if(current()){S.ch.ltfCandles=[];S.ch.ltfTf=null;}return;}
  try{
    const raw=await fetchCandlesUnified(S.ch.pair,ltf,Math.min(5000,ViceSolaceSystem.options(S.engine).lookback+100));
    if(current()){S.ch.ltfCandles=raw;S.ch.ltfTf=ltf;}
  }catch(e){if(current()){S.ch.ltfCandles=[];S.ch.ltfTf=ltf;console.warn('Lower timeframe unavailable:',e.message);}}
}
let chartRequestId=0;
async function loadCandles() {
  const request=++chartRequestId,pair=S.ch.pair,tf=S.ch.tf,epoch=authEpoch;
  const current=()=>request===chartRequestId&&pair===S.ch.pair&&tf===S.ch.tf&&epoch===authEpoch;
  const key=pair+'|'+tf;
  if(S.view2.datasetKey!==key){S.view2.priceRange=null;S.view2.end=null;S.view2.datasetKey=key;}
  try {
    const cs=await fetchCandlesUnified(pair,tf,Math.min(5000,ViceSolaceSystem.options(S.engine).lookback+100));
    if(!current())return;
    if(!Array.isArray(cs)||!cs.length)throw Error('Provider returned no candles');
    S.ch.candles=cs;S.ch.error=null;
    S.ch.source=APP_MODE==='SIM'||pair===PRACTICE?'SIM':parseSymbol(pair).source;
    computeATR();await loadLtfCandles(current);if(!current())return;
    S.res=ViceSolaceSystem.run(cs,{...S.engine,timeframe:tf,tfSeconds:TF_SEC[tf]||3600,ltfSeconds:TF_SEC[S.ch.ltfTf]||60},S.ch.ltfCandles);drawAll();
  }catch(e){
    if(!current())return;
    S.ch.candles=[];S.ch.ltfCandles=[];S.ch.source='UNAVAILABLE';S.ch.error=e.message||'Provider unavailable';S.res=null;
    toast('Market data unavailable: '+S.ch.error,'warn');drawAll();
  }
}

function computeATR() {
  const cs = S.ch.candles;
  if (cs.length < 15) return;
  let s = 0;
  for (let i = cs.length - 14; i < cs.length; i++) {
    const c = cs[i], pc = cs[i-1]?.c || c.o;
    s += Math.max(c.h - c.l, Math.abs(c.h - pc), Math.abs(c.l - pc));
  }
  S.ch.atr = s / 14;
}

/* ═══════════════════════════════════════════════════════════════════
   IRU ENGINE — event-sourced internal revenue unit ledger
   Tier · Legacy · Entry Class · 250-holder cap · append-only journal
   ═══════════════════════════════════════════════════════════════════ */

const IruEngine = (() => {
  const G = Object.freeze({
    representsCorporateOwnership:false,
    representsEquity:false,
    representsStock:false,
    representsMembershipInterest:false,
    grantsAutomaticCorporateVoting:false,
    grantsAutomaticAssetOwnership:false,
    grantsAutomaticIPOwnership:false,
    grantsAutomaticLiquidationRights:false,
    grantsAutomaticRedemptionRights:false,
    grantsAutomaticDividendRights:false,
    transferable:false,
    sellableThroughVice:false,
  });
  const PROGRAMS = Object.freeze({
    VICE:{ id:'VICE', name:'VICE', side:'Public',  unitLabel:'VICE IRU' },
    V4X:{  id:'V4X',  name:'V4X',  side:'Private', unitLabel:'V4X IRU' },
  });
  const ECON = Object.freeze({
    totalSupply:10000000n,
    reserve:7500000n,
    pool:2500000n,
    maxHolders:250,
    defaultAllocation:10000n,
    reserveHolderId:'ESTATE',
    strategicReference:Object.freeze({ VICE:200n, V4X:32000n }),
  });
  const VALUE_BASES = Object.freeze({
    INTERNAL_REFERENCE:'Internal reference value',
    STRATEGIC_REFERENCE:'Strategic reference value',
    SUPPORTED_IRU_VALUE:'Supported IRU value',
  });
  const TIERS = Object.freeze([
    { id:'T1', name:'Foundation', minCents:1000000n },
    { id:'T2', name:'Strategic',  minCents:5000000n },
    { id:'T3', name:'Executive',  minCents:10000000n },
    { id:'T4', name:'Sovereign',  minCents:15000000n },
    { id:'T5', name:'Titan',      minCents:100000000n },
  ]);
  const LEGACY = Object.freeze([
    { id:'I',   name:'Founding' },
    { id:'II',  name:'Builder' },
    { id:'III', name:'Steward' },
    { id:'IV',  name:'Architect' },
    { id:'V',   name:'Sovereign Legacy' },
  ]);
  const STATE_FLOW = { PENDING:'APPROVED', APPROVED:'RESERVED', RESERVED:'DISTRIBUTED' };
  const ACTIVE_STATES = new Set(['PENDING','APPROVED','RESERVED','FROZEN']);
  const TYPES = new Set([
    'HOLDER_ADDED','HOLDER_UPDATED','HOLDER_FROZEN','HOLDER_UNFROZEN',
    'HOLDINGS_LOCKED','HOLDINGS_UNLOCKED','ACCOUNT_SUSPENDED','ACCOUNT_RESUMED',
    'ACCOUNT_REVOKED','ACCOUNT_RESTORED','HOLDER_CLOSED','UNITS_TRANSFERRED_OUT','UNITS_TRANSFERRED_IN',
    'UNITS_ISSUED','UNITS_RETIRED','UNITS_ISSUANCE_REVERSED',
    'ALLOCATION_CREATED','ALLOCATION_APPROVED','ALLOCATION_RESERVED','ALLOCATION_DISTRIBUTED',
    'ALLOCATION_REVOKED','ALLOCATION_FROZEN','ALLOCATION_UNFROZEN',
    'VALUATION_PROPOSED','VALUATION_APPROVED','VALUATION_REJECTED',
    'LEGAL_STATUS_RECORDED','ENTRY_CLASS_RECORDED','TIER_ASSIGNED','LEGACY_RECORDED',
  ]);

  function emptyState() {
    const R = ECON.reserveHolderId;
    return {
      seq:0, nextClient:1, allocations:{},
      holders:{
        [R]:{ holderId:R, clientId:R, name:'Estate reserve', role:'ESTATE',
              status:'ESTATE_RESERVE', reserve:true, addedAt:null },
      },
      balances:{ VICE:{ [R]:ECON.reserve }, V4X:{ [R]:ECON.reserve } },
      supply:{ VICE:0n, V4X:0n },
      committed:{ VICE:0n, V4X:0n },
      valuations:{ VICE:[], V4X:[] },
      current:{ VICE:null, V4X:null },
      journal:[], legal:null,
    };
  }

  const avail = (st, p) => ECON.pool - st.supply[p] - st.committed[p];
  const countHolders = st => Object.values(st.holders).filter(h => !h.reserve&&h.status!=='CLOSED').length;
  const cid = n => `VC-${String(n).padStart(6,'0')}`;

  function ensureAvail(st, p, units) {
    const a = avail(st, p);
    if (units > a) {
      throw new Error(`Insufficient client reserve: requested ${units.toString()} ${p}, available ${a.toString()} ${p}.`);
    }
  }
  function parseUnits(v) {
    const s = String(v ?? '').trim().replace(/,/g,'');
    if (!/^\d{1,18}$/.test(s)) throw new Error('Units must be a whole number.');
    const u = BigInt(s);
    if (u <= 0n) throw new Error('Units must be more than zero.');
    return u;
  }
  function parseCents(v) {
    const s = String(v ?? '').trim().replace(/[$,\s]/g,'');
    if (!/^\d{1,12}(\.\d{1,2})?$/.test(s)) throw new Error('Enter a value like 160 or 160.50.');
    const [a,b=''] = s.split('.');
    return BigInt(a)*100n + BigInt(`${b}00`.slice(0,2));
  }
  const program = id => {
    const p = PROGRAMS[id];
    if (!p) throw new Error('Choose VICE or V4X.');
    return p;
  };
  const requireReason = (r, what) => {
    if (!String(r || '').trim()) throw new Error(`Give a reason for every ${what}.`);
    return String(r).trim().slice(0, 300);
  };
  const findTier = id => {
    const t = TIERS.find(x => x.id === String(id || '').toUpperCase());
    if (!t) throw new Error('Choose a tier from T1 Foundation to T5 Titan.');
    return t;
  };
  const tierForContribution = cents => {
    let o = null;
    for (const t of TIERS) if (BigInt(cents) >= t.minCents) o = t;
    return o;
  };
  const findLegacy = id => {
    const o = LEGACY.find(x => x.id === String(id || '').toUpperCase());
    if (!o) throw new Error('Choose a Legacy order from I Founding to V Sovereign Legacy.');
    return o;
  };
  const clip = (s, n) => String(s ?? '').trim().slice(0, n);
  function parseDate(s, label) {
    const v = String(s || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || Number.isNaN(Date.parse(`${v}T00:00:00Z`))) {
      throw new Error(`Enter the ${label} as YYYY-MM-DD.`);
    }
    return v;
  }
  const holder = (st, id) => {
    const h = st.holders[id];
    if (!h) throw new Error('Unknown holder.');
    if (h.reserve) throw new Error('Tier, Legacy and Entry Class apply to clients, not the Estate reserve.');
    return h;
  };

  function apply(state, ev, opts) {
    const fourEyes = opts && opts.fourEyes !== false;
    if (!ev || !TYPES.has(ev.type)) throw new Error('Unknown IRU change.');
    if (!ev.by) throw new Error('Every IRU change needs the person making it.');
    const st = state;
    switch (ev.type) {
      case 'HOLDER_ADDED': {
        const name = String(ev.name || '').trim();
        if (!name) throw new Error('A holder needs a name.');
        if (!ev.holderId || st.holders[ev.holderId]) throw new Error('That holder already exists.');
        if (countHolders(st) >= ECON.maxHolders) {
          throw new Error(`Holder capacity reached: ${ECON.maxHolders} / ${ECON.maxHolders} holders appointed.`);
        }
        const wallet = String(ev.wallet || '').trim();
        if (wallet && !/^0x[0-9a-fA-F]{40}$/.test(wallet)) throw new Error('That wallet address is not a valid Ethereum address.');
        st.holders[ev.holderId] = {
          holderId:ev.holderId,
          clientId:ev.clientId||cid(st.nextClient),
          name:name.slice(0,80),
          email:String(ev.email || '').slice(0,120),
          wallet,
          memberId:ev.memberId || null,
          holderType:String(ev.holderType || 'Standard').slice(0,40),
          notes:String(ev.notes || '').slice(0,300),
          role:'HOLDER', status:'ACTIVE', demo:!!ev.demo, addedAt:ev.at,
        };
        st.nextClient += 1;
        break;
      }
      case 'HOLDER_FROZEN':
      case 'HOLDER_UNFROZEN': {
        const h = st.holders[ev.holderId];
        if (!h || h.reserve) throw new Error('Unknown holder.');
        h.status = ev.type === 'HOLDER_FROZEN' ? 'FROZEN' : 'ACTIVE';
        break;
      }
      case 'HOLDINGS_LOCKED':
      case 'HOLDINGS_UNLOCKED':
      case 'ACCOUNT_SUSPENDED':
      case 'ACCOUNT_RESUMED':
      case 'ACCOUNT_REVOKED':
      case 'ACCOUNT_RESTORED':
      case 'HOLDER_CLOSED': {
        const h=holder(st,ev.holderId);
        if(ev.type==='HOLDER_CLOSED'){
          if((st.balances.VICE[ev.holderId]||0n)!==0n||(st.balances.V4X[ev.holderId]||0n)!==0n)
            throw new Error('Holder balances must be reconciled before closure.');
          Object.assign(h,{status:'CLOSED',email:'',name:'Closed account · '+h.clientId});
        }else if(ev.type.startsWith('HOLDINGS_'))h.holdingsLocked=ev.type==='HOLDINGS_LOCKED';
        else if(ev.type==='ACCOUNT_REVOKED'||ev.type==='ACCOUNT_RESTORED'){
          h.accountRevoked=ev.type==='ACCOUNT_REVOKED';h.accountSuspended=false;
          h.status=h.accountRevoked?'REVOKED':'ACTIVE';
        }else{
          h.accountSuspended=ev.type==='ACCOUNT_SUSPENDED';h.status=h.accountSuspended?'SUSPENDED':'ACTIVE';
        }
        break;
      }
      case 'UNITS_TRANSFERRED_OUT':
      case 'UNITS_TRANSFERRED_IN': {
        const h=holder(st,ev.holderId),p=program(ev.program),u=parseUnits(ev.units);
        requireReason(ev.reason,'transfer');
        if(!ev.transferId||!ev.counterpartyId||ev.counterpartyId===ev.holderId)throw new Error('Invalid transfer reference.');
        if(st.journal.some(e=>e.type===ev.type&&e.transferId===ev.transferId))throw new Error('Transfer already recorded.');
        const before=st.balances[p.id][ev.holderId]||0n,out=ev.type==='UNITS_TRANSFERRED_OUT';
        if(out&&before<u)throw new Error('Transfer exceeds holder balance.');
        st.balances[p.id][ev.holderId]=before+(out?-u:u);
        // Each holder can replay their own authorized side. Full-registry replay
        // sees both sides, so total issued supply is unchanged.
        st.supply[p.id]+=out?-u:u;
        break;
      }
      case 'HOLDER_UPDATED': {
        const h = st.holders[ev.holderId];
        if (!h) throw new Error('Unknown holder.');
        if (ev.name !== undefined) {
          const n = String(ev.name).trim();
          if (!n) throw new Error('A holder needs a name.');
          h.name = n.slice(0,80);
        }
        if (ev.email !== undefined) h.email = String(ev.email).slice(0,120);
        if (ev.wallet !== undefined) h.wallet = String(ev.wallet).slice(0,64);
        break;
      }
      case 'UNITS_ISSUED': {
        const p = program(ev.program);
        const h = st.holders[ev.holderId];
        if (!h || h.reserve) throw new Error('Unknown holder.');
        requireReason(ev.reason, 'issuance');
        const u = parseUnits(ev.units);
        ensureAvail(st, p.id, u);
        st.balances[p.id][ev.holderId] = (st.balances[p.id][ev.holderId] || 0n) + u;
        st.supply[p.id] += u;
        break;
      }
      case 'UNITS_RETIRED':
      case 'UNITS_ISSUANCE_REVERSED': {
        if(ev.type==='UNITS_ISSUANCE_REVERSED'){
          const original=st.journal.find(e=>e.seq===Number(ev.sourceEventSeq));
          if(!original || original.type!=='UNITS_ISSUED' || original.holderId!==ev.holderId
            || original.program!==ev.program || parseUnits(original.units)!==parseUnits(ev.units))
            throw new Error('Correction does not match its original issuance.');
          if(st.journal.some(e=>e.type==='UNITS_ISSUANCE_REVERSED' && Number(e.sourceEventSeq)===Number(ev.sourceEventSeq)))
            throw new Error('Issuance already corrected.');
        }
        const p = program(ev.program);
        const h = st.holders[ev.holderId];
        if (!h) throw new Error('Unknown holder.');
        if (h.reserve) throw new Error('The Estate reserve is fixed and cannot be retired.');
        requireReason(ev.reason, 'retirement');
        const u = parseUnits(ev.units);
        const have = st.balances[p.id][ev.holderId] || 0n;
        if (u > have) throw new Error(`That holder has only ${have.toString()} ${p.unitLabel}.`);
        st.balances[p.id][ev.holderId] = have - u;
        st.supply[p.id] -= u;
        break;
      }
      case 'ALLOCATION_CREATED': {
        const p = program(ev.program);
        const h = st.holders[ev.holderId];
        if (!h || h.reserve) throw new Error('Unknown holder.');
        if (h.status === 'FROZEN') throw new Error('That holder is frozen.');
        if (!ev.allocationId || st.allocations[ev.allocationId]) throw new Error('That allocation already exists.');
        const u = parseUnits(ev.units);
        ensureAvail(st, p.id, u);
        st.allocations[ev.allocationId] = {
          allocationId:ev.allocationId,
          holderId:ev.holderId,
          program:p.id,
          units:u,
          method:String(ev.method || 'CUSTOM').slice(0,20),
          state:'PENDING',
          settlement:'SIMULATED',
          demo:!!ev.demo,
          createdBy:ev.by, createdAt:ev.at,
          history:[{ state:'PENDING', by:ev.by, at:ev.at }],
        };
        st.committed[p.id] += u;
        break;
      }
      case 'ALLOCATION_APPROVED':
      case 'ALLOCATION_RESERVED':
      case 'ALLOCATION_DISTRIBUTED': {
        const a = st.allocations[ev.allocationId];
        if (!a) throw new Error('Unknown allocation.');
        const to = ev.type.replace('ALLOCATION_','');
        if (a.state === 'DISTRIBUTED') throw new Error('Distribution already processed: this allocation has already been distributed.');
        if (STATE_FLOW[a.state] !== to) throw new Error(`An allocation that is ${a.state.toLowerCase()} cannot move to ${to.toLowerCase()}.`);
        a.state = to;
        a.history.push({ state:to, by:ev.by, at:ev.at });
        if (to === 'DISTRIBUTED') {
          st.committed[a.program] -= a.units;
          st.balances[a.program][a.holderId] = (st.balances[a.program][a.holderId] || 0n) + a.units;
          st.supply[a.program] += a.units;
        }
        break;
      }
      case 'ALLOCATION_REVOKED': {
        const a = st.allocations[ev.allocationId];
        if (!a) throw new Error('Unknown allocation.');
        if (a.state === 'DISTRIBUTED') throw new Error('A distributed allocation cannot be revoked; retire units with a reason instead.');
        if (!ACTIVE_STATES.has(a.state)) throw new Error('That allocation is already closed.');
        requireReason(ev.reason, 'revocation');
        a.state = 'REVOKED';
        a.history.push({ state:'REVOKED', by:ev.by, at:ev.at, reason:ev.reason });
        st.committed[a.program] -= a.units;
        break;
      }
      case 'ALLOCATION_FROZEN':
      case 'ALLOCATION_UNFROZEN': {
        const a = st.allocations[ev.allocationId];
        if (!a) throw new Error('Unknown allocation.');
        if (ev.type === 'ALLOCATION_FROZEN') {
          if (!ACTIVE_STATES.has(a.state) || a.state === 'FROZEN') throw new Error('Only an open allocation can be frozen.');
          a.frozenFrom = a.state;
          a.state = 'FROZEN';
        } else {
          if (a.state !== 'FROZEN') throw new Error('That allocation is not frozen.');
          a.state = a.frozenFrom;
          delete a.frozenFrom;
        }
        a.history.push({ state:a.state, by:ev.by, at:ev.at });
        break;
      }
      case 'VALUATION_PROPOSED': {
        const p = program(ev.program);
        requireReason(ev.reason, 'valuation change');
        if (!ev.versionId) throw new Error('Missing version id.');
        if (st.valuations[p.id].some(v => v.status === 'PROPOSED')) throw new Error('Approve or reject the pending value first.');
        const prev = st.current[p.id];
        const basis = (ev.basis === undefined || ev.basis === '')
          ? 'INTERNAL_REFERENCE'
          : String(ev.basis).toUpperCase();
        if (!VALUE_BASES[basis]) throw new Error('A value is an internal reference, the strategic reference or a supported IRU value.');
        st.valuations[p.id].push({
          versionId:ev.versionId,
          version:st.valuations[p.id].length + 1,
          program:p.id,
          valueCents:parseCents(ev.value),
          previousCents:prev ? prev.valueCents : null,
          reason:String(ev.reason).trim(),
          basis,
          proposedBy:ev.by, proposedAt:ev.at, status:'PROPOSED',
        });
        break;
      }
      case 'VALUATION_APPROVED':
      case 'VALUATION_REJECTED': {
        const p = program(ev.program);
        const v = st.valuations[p.id].find(x => x.versionId === ev.versionId);
        if (!v || v.status !== 'PROPOSED') throw new Error('There is no pending value with that id.');
        if (ev.type === 'VALUATION_REJECTED') {
          v.status = 'REJECTED';
          v.rejectedBy = ev.by;
          v.rejectedAt = ev.at;
          break;
        }
        if (fourEyes && v.proposedBy === ev.by) throw new Error('A different admin must approve a valuation change.');
        if (st.current[p.id]) st.current[p.id].status = 'SUPERSEDED';
        Object.assign(v, {
          status:'PUBLISHED',
          approvedBy:ev.by,
          publishedAt:ev.at,
          selfApproved:v.proposedBy === ev.by,
        });
        st.current[p.id] = v;
        break;
      }
      case 'LEGAL_STATUS_RECORDED': {
        const s = String(ev.status || '').trim();
        if (!['COUNSEL_APPROVED','UNDER_REVIEW','NOT_DETERMINED'].includes(s)) throw new Error('Unknown legal status.');
        st.legal = {
          status:s,
          counsel:String(ev.counsel || '').slice(0,120),
          opinionRef:String(ev.opinionRef || '').slice(0,200),
          recordedBy:ev.by, at:ev.at,
        };
        break;
      }
      case 'ENTRY_CLASS_RECORDED': {
        const h = holder(st, ev.holderId);
        if (h.entry && !ev.correction) throw new Error('Entry Class is history and is recorded once. Record a correction, with a reason, to fix an error.');
        if (!h.entry && ev.correction) throw new Error('There is no Entry Class to correct yet.');
        if (ev.correction) requireReason(ev.reason, 'correction');
        const entryProgram = clip(ev.entryProgram, 80);
        if (!entryProgram) throw new Error('Name the program the holder entered through.');
        const entry = {
          entryDate:parseDate(ev.entryDate, 'entry date'),
          entryProgram,
          originalInstrument:clip(ev.originalInstrument, 40),
          originalClass:clip(ev.originalClass, 60),
          originalContributionCents:ev.originalContribution ? parseCents(ev.originalContribution) : null,
          originalTier:ev.originalTier ? findTier(ev.originalTier).id : null,
          onboardingRef:clip(ev.onboardingRef, 120),
          appointmentSequence:Number(String(h.clientId).replace(/\D/g,'')) || null,
          correction:!!ev.correction,
          reason:clip(ev.reason, 300),
          by:ev.by, at:ev.at,
        };
        h.entryHistory = [...(h.entryHistory || []), entry];
        h.entry = entry;
        break;
      }
      case 'TIER_ASSIGNED': {
        const h = holder(st, ev.holderId);
        const t = findTier(ev.tier);
        const reason = requireReason(ev.reason, 'tier change');
        const basis = String(ev.basis || '').toUpperCase();
        if (!['CONTRIBUTION','QUALIFICATION','OVERRIDE'].includes(basis)) {
          throw new Error('Give the tier basis: contribution, qualification or authorized override.');
        }
        let contrib = null;
        if (basis === 'CONTRIBUTION') {
          contrib = parseCents(ev.contribution);
          const auto = tierForContribution(contrib);
          if (!auto) throw new Error(`A contribution of ${Money.fmt(contrib)} is below T1 Foundation ($10,000.00). Use an authorized override to assign a tier.`);
          if (auto.id !== t.id) throw new Error(`A contribution of ${Money.fmt(contrib)} qualifies for ${auto.id} ${auto.name}. Use an authorized override to assign ${t.id} ${t.name}.`);
        }
        const eff = ev.effectiveAt
          ? parseDate(ev.effectiveAt, 'effective date')
          : String(ev.at || '').slice(0,10) || null;
        const exp = ev.expiresAt ? parseDate(ev.expiresAt, 'expiry date') : null;
        if (exp && eff && exp <= eff) throw new Error('A tier must expire after it takes effect.');
        const prev = h.tier || null;
        if (prev && prev.tier === t.id && (prev.expiresAt || null) === exp) {
          throw new Error(`That holder is already ${t.id} ${t.name}.`);
        }
        const rec = {
          tier:t.id, name:t.name, from:prev ? prev.tier : null,
          basis, override:basis === 'OVERRIDE', contributionCents:contrib,

        },
      };
    })();
    const account = {
      equity,
      balance:equity,
      dayStartEquity:equity,
      peakEquity:equity,
      dayPnl:0,
      currency,
    };
    const positions = [], journal = [];
    const pnl = (p, price) =>
      (p.side > 0 ? price - p.entry : p.entry - price) / spec.tickSize * spec.tickValue * p.volume;
    const close = (p, price, i, reason) => {
      const money = pnl(p, price);
      account.balance += money;
      account.equity = account.balance;
      account.dayPnl += money;
      account.peakEquity = Math.max(account.peakEquity, account.equity);
      const risk = Math.abs(p.entry - p.stop);
      journal.push({
        order:p.order, side:p.side, entry:p.entry, exit:price,
        stop:p.stop, target:p.target, volume:p.volume,
        entryI:p.entryI, exitI:i, barsHeld:i - p.entryI, reason,
        R:(p.side > 0 ? price - p.entry : p.entry - price) / risk,
        money,
        maeR:p.mae / risk,
        mfeR:p.mfe / risk,
        why:p.why,
        classification: reason === 'target'
          ? 'EXPECTED WIN'
          : reason === 'stop'
            ? (p.mfe / risk >= 1 ? 'LOSS AFTER BEING 1R IN PROFIT' : 'EXPECTED LOSS')
            : 'MANUAL EXIT',
      });
    };
    return {
      name:'VICE Paper Broker',
      capabilities:Object.freeze({ market:false, limit:true, cancel:true, close:true, live:false }),
      book, account, positions, journal,
      getHealth:() => ({ state:'OPERATIONAL', mode:'PAPER' }),
      submit(order, risk) {
        const r = book.create(order);
        if (r.duplicate) return r;
        const id = r.order.id;
        book.transition(id, 'VALIDATING');
        if (!risk || risk.decision !== 'APPROVED') {
          book.transition(id, 'REJECTED', `risk kernel: ${risk ? risk.decision.toLowerCase() : 'no decision'}`);
          return r;
        }
        book.transition(id, 'AUTHORIZED', 'risk kernel approved');
        book.transition(id, 'SUBMITTED', 'sent to paper broker');
        book.transition(id, 'ACCEPTED', 'working limit order');
        return r;
      },
      cancel(id, why) {
        const o = book.orders.get(id);
        if (o && ['ACCEPTED','MODIFIED','PARTIALLY_FILLED'].includes(o.state)) {
          book.transition(id, 'CANCEL_REQUESTED', why || 'cancelled');
          book.transition(id, 'CANCELLED');
          return true;
        }
        return false;
      },
      step(bar, i, spread) {
        spread = spread || 0;
        for (const o of book.orders.values()) {
          if (o.state !== 'ACCEPTED' && o.state !== 'MODIFIED') continue;
          if (i - o.createdI > (o.expiresAfter || 20)) {
            book.transition(o.id, 'EXPIRED', 'not filled in time');
            continue;
          }
          if (i <= o.createdI) continue;
          if (o.side > 0 ? bar.l + spread <= o.price : bar.h >= o.price) {
            const fill = o.side > 0 ? Math.min(o.price, bar.o + spread) : Math.max(o.price, bar.o);
            book.transition(o.id, 'FILLED', `filled at ${fill}`);
            positions.push({
              order:o.id, side:o.side, entry:fill, stop:o.stop, target:o.target,
              volume:o.volume, entryI:i, mae:0, mfe:0, why:o.why,
            });
          }
        }
        for (let k = positions.length - 1; k >= 0; k--) {
          const p = positions[k];
          p.mae = Math.max(p.mae, p.side > 0 ? p.entry - bar.l : bar.h + spread - p.entry);
          p.mfe = Math.max(p.mfe, p.side > 0 ? bar.h - p.entry : p.entry - (bar.l + spread));
          const hitStop = p.side > 0 ? bar.l <= p.stop : bar.h + spread >= p.stop;
          const hitTarget = p.side > 0 ? bar.h >= p.target : bar.l + spread <= p.target;
          if (hitStop || hitTarget) {
            close(p,
              hitStop
                ? (p.side > 0 ? Math.min(p.stop, bar.o) : Math.max(p.stop, bar.o + spread))
                : p.target,
              i,
              hitStop ? 'stop' : 'target'
            );
            positions.splice(k, 1);
          }
        }
      },
      flatten(bar, i, spread) {
        spread = spread || 0;
        for (const o of book.orders.values()) this.cancel(o.id, 'kill switch');
        while (positions.length) {
          const p = positions.pop();
          close(p, p.side > 0 ? bar.c : bar.c + spread, i, 'kill switch');
        }
      },
    };
  }
  return {
    HARD_LIMITS, DEFAULT_POLICY, AP_REASONS, ORDER_FLOW, TRANSITIONS,
    effectivePolicy, sizePosition, preTrade, newBreaker, breakerStep,
    regimeAt, tighten, precisionMode, autopilotGovern, createPaperBroker,
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   CHAIN READER — read-only EVM access
   ═══════════════════════════════════════════════════════════════════ */

function createChainReader(rpcUrl, opts) {
  opts = opts || {};
  const fetchImpl = opts.fetchImpl || fetch;
  let id = 0;
  async function rpc(method, params) {
    const res = await fetchImpl(rpcUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ jsonrpc:'2.0', id:++id, method, params }),
    });
    if (!res.ok) throw new Error(`RPC ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || 'RPC error');
    return data.result;
  }
  const pad = hex => hex.replace(/^0x/,'').toLowerCase().padStart(64,'0');
  const hexToBig = h => (h && h !== '0x' ? BigInt(h) : 0n);
  const W = window.ViceWalletHashes;
  const sel = sig => (W && W.keccak_256 && W.utf8ToBytes)
    ? Array.from(W.keccak_256(W.utf8ToBytes(sig))).slice(0,4).map(b => b.toString(16).padStart(2,'0')).join('')
    : '';
  const SEL = { balanceOf: sel('balanceOf(address)'), decimals: sel('decimals()') };
  const call = (to, data) => rpc('eth_call', [{ to, data:`0x${data}` }, 'latest']);
  return {
    chainId: async () => Number(hexToBig(await rpc('eth_chainId', []))),
    nativeBalance: async addr => hexToBig(await rpc('eth_getBalance', [addr, 'latest'])),
    async erc20(token, holder) {
      const [bal, dec] = await Promise.all([
        call(token, SEL.balanceOf + pad(holder)),
        call(token, SEL.decimals).catch(() => '0x12'),
      ]);
      return { raw:hexToBig(bal), decimals:Number(hexToBig(dec)) || 18 };
    },
  };
}
window.createChainReader = createChainReader;
window.formatUnits = function formatUnits(raw, decimals, maxFrac) {
  maxFrac = maxFrac == null ? 6 : maxFrac;
  const neg = raw < 0n;
  let v = neg ? -raw : raw;
  const base = 10n ** BigInt(decimals);
  const whole = v / base;
  let frac = (v % base).toString().padStart(decimals, '0').slice(0, maxFrac).replace(/0+$/, '');
  return `${neg ? '-' : ''}${whole.toLocaleString('en-US')}${frac ? `.${frac}` : ''}`;
};

/* ═══════════════════════════════════════════════════════════════════
   WALLET — non-custodial, on this device
   Waits for the ESM wallet library before declaring itself supported.
   ═══════════════════════════════════════════════════════════════════ */

const Wallet = (() => {
  // Loading the optional wallet library must not replace an unrelated chart/form.
  const repaint = () => {
    if(['wallet','portfolio','command','defi'].includes(S.tab)){
      try { renderMain(); } catch(e){ console.warn('Wallet view refresh failed:',e); }
    }
  };
  let W = window.ViceWallet || null;
  if(!W){
    window.addEventListener('vice-wallet-ready', () => {
      W = window.ViceWallet;
      if(S.wallet.status === 'unsupported' || S.wallet.status === 'pending'){
        S.wallet.status = S.wallet.vault ? 'locked' : 'none';
        repaint();
      }
    }, { once: true });
  }

  const NETWORKS = {
    ethereum: {
      name:'Ethereum', kind:'evm', chainId:1, symbol:'ETH',
      explorer:'https://etherscan.io',
      tokens:[
        ['USDT','0xdAC17F958D2ee523a2206206994597C13D831ec7'],
        ['USDC','0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'],
        ['VICE','0xd1b7660A5f13D669d3D939056d183eAfb15DFcb3'],
      ],
    },
    bitcoin:{ name:'Bitcoin', kind:'btc', symbol:'BTC', explorer:'https://mempool.space' },
  };
  const st = S.wallet;
  let phrase = null;
  const persist = () => {
    try {
      localStorage.setItem('vice-wallet', JSON.stringify({ vault:st.vault, rpc:st.rpc }));
    } catch(_) {}
  };
  function load() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('vice-wallet') || '{}'); } catch(_) { saved = {}; }
    st.rpc = saved.rpc || '';
    if (saved.vault) {
      st.vault = saved.vault;
      st.accounts = saved.vault.accounts;
      st.status = 'locked';
    }
  }
  load();
  if (!W && st.status === 'none') {
    st.status = 'pending';
    setTimeout(() => {
      if (window.ViceWallet) {
        W = window.ViceWallet;
        st.status = st.vault ? 'locked' : 'none';
        repaint();
      } else if (st.status === 'pending') {
        st.status = 'unsupported';
        repaint();
      }
    }, 3000);
  }
  const notify = repaint;

  async function refresh() {
    if (!st.unlocked || !st.accounts) return;
    st.balances = st.balances || {};
    st.balances.bitcoin = {
      note:'Bitcoin balance needs a Bitcoin data source (not connected yet)',
      address:st.accounts.btc.address,
    };
    if (!st.rpc) {
      st.balances.ethereum = { error:'Add an Ethereum RPC address to see balances' };
      notify();
      return;
    }
    st.loading = true;
    notify();
    try {
      const reader = window.createChainReader(st.rpc);
      st.chainId = await reader.chainId();
      const net = NETWORKS.ethereum;
      const holder = st.accounts.evm.address;
      const eth = await reader.nativeBalance(holder);
      const tokens = [];
      for (const [sym, addr] of net.tokens) {
        try {
          const t = await reader.erc20(addr, holder);
          tokens.push({
            symbol:sym, address:addr,
            amount:window.formatUnits(t.raw, t.decimals),
            zero:t.raw === 0n,
          });
        } catch(e) {
          tokens.push({ symbol:sym, address:addr, error:'unreadable' });
        }
      }
      st.balances.ethereum = {
        native:window.formatUnits(eth, 18),
        chainId:st.chainId,
        wrongChain:st.chainId !== 1,
        tokens,
      };
    } catch(e) {
      st.balances.ethereum = { error:e.message };
    }
    st.loading = false;
    notify();
  }

  const api = {
    state:st, networks:NETWORKS,
    has: () => st.status !== 'none' && st.status !== 'unsupported' && st.status !== 'pending',
    unlocked: () => st.unlocked,
    address: net => st.accounts && st.accounts[NETWORKS[net].kind] && st.accounts[NETWORKS[net].kind].address,
    start() { load(); },
    beginCreate() {
      if (!W) { toast('Wallet library unavailable on this device.','error'); return; }
      st.draftPhrase = W.newPhrase();
      st.status = 'creating';
      st.msg = '';
      notify();
    },
    cancelCreate() {
      st.draftPhrase = null;
      st.status = st.vault ? 'locked' : 'none';
      st.msg = '';
      notify();
    },
    async finishCreate(password) {
      if (!W) { toast('Wallet library unavailable.','error'); return; }
      try {
        st.vault = await W.sealPhrase(st.draftPhrase, password);
        phrase = W.normalizePhrase(st.draftPhrase);
        st.draftPhrase = null;
        st.accounts = st.vault.accounts;
        st.unlocked = true;
        st.status = 'ready';
        st.msg = '';
        persist();
        refresh();
      } catch(e) { st.msg = e.message; }
      notify();
    },
    async importPhrase(input, password) {
      if (!W) { toast('Wallet library unavailable.','error'); return; }
      try {
        if (!W.isPhrase(input)) throw new Error('That recovery phrase is not valid. Check the words and spacing.');
        st.vault = await W.sealPhrase(input, password);
        phrase = W.normalizePhrase(input);
        st.accounts = st.vault.accounts;
        st.unlocked = true;
        st.status = 'ready';
        st.msg = '';
        persist();
        refresh();
      } catch(e) { st.msg = e.message; }
      notify();
    },
    async unlock(password) {
      if (!W) { toast('Wallet library unavailable.','error'); return; }
      try {
        phrase = await W.openPhrase(st.vault, password);
        st.unlocked = true;
        st.status = 'ready';
        st.msg = '';
        refresh();
      } catch(e) { st.msg = e.message; }
      notify();
    },
    lock() {
      phrase = null;
      st.unlocked = false;
      st.reveal = null;
      st.status = 'locked';
      notify();
    },
    async revealPhrase(password) {
      if (!W) { toast('Wallet library unavailable.','error'); return; }
      try {
        st.reveal = await W.openPhrase(st.vault, password);
        st.msg = '';
      } catch(e) { st.msg = e.message; }
      notify();
    },
    hidePhrase() {
      st.reveal = null;
      notify();
    },
    signSiwe(msg) {
      if (!phrase) throw new Error('Unlock your wallet first');
      return W.signMessage(phrase, msg);
    },
    forget() {
      phrase = null;
      Object.assign(st, {
        status:'none', accounts:null, unlocked:false, reveal:null,
        balances:{}, vault:null
      });
      try { localStorage.removeItem('vice-wallet'); } catch(_) {}
      notify();
    },
    setRpc(url) {
      st.rpc = String(url || '').trim();
      persist();
      refresh();
      notify();
    },
    refresh,
  };
  return api;
})();

/* ═══════════════════════════════════════════════════════════════════
   REALTIME — presence · messaging · calls over Supabase Realtime
   Split presence and broadcast into separate channels.
   ICE candidate buffering. BroadcastChannel fallback. Message
   encryption. Ringtone + haptic via Notify.
   ═══════════════════════════════════════════════════════════════════ */

const Realtime = (() => {
  const st = S.realtime;
  const handlers = { message:[], presence:[], call:[] };
  let presenceChannel = null;
  let broadcastChannel = null;
  let dmChannel = null;
  let channelDb = null;
  let heartbeatTimer = null;

  /* Cross-tab fallback — same-browser multi-tab delivery independent of Supabase */
  let localBus = null;
  try { localBus = new BroadcastChannel('vice-os-local'); } catch(_) { localBus = null; }
  if(localBus){
    localBus.onmessage = ev => {
      const m = ev.data;
      if(!S.user || !m || !m.type || !m.payload) return;
      if(m.payload.senderId === S.user?.id) return;
      // Database subscriptions enforce channel ACLs; never trust cross-tab chat payloads.
      if(m.type === 'chat') return;
      // Calls use the authenticated recipient-scoped database stream.
    };
  }

  /* WebRTC call state */
  let pc = null, localStream = null, currentCall = null, callTimer = null, callStartAt = 0;
  let pendingIceCandidates = [];
  const PRESENCE_KEY='vice-presence-preference';
  let statusChoice=(()=>{try{return localStorage.getItem(PRESENCE_KEY)||'ONLINE';}catch(_){return 'ONLINE';}})();
  async function trackMe(){
    if(!presenceChannel||!S.user)return;
    if(statusChoice==='INVISIBLE'){try{await presenceChannel.untrack();}catch(_){}return;}
    await presenceChannel.track({user_id:S.user.id,name:S.profile.name||'Member',
      email:S.profile.email||'',role:S.profile.role||'HOLDER',
      avatar:S.profile.avatarInitials||'NA',at:Date.now(),status:statusChoice});
  }
  async function chooseStatus(mode){
    if(!['ONLINE','DND','INVISIBLE'].includes(mode))throw Error('Invalid status');
    statusChoice=mode;
    try{localStorage.setItem(PRESENCE_KEY,mode);}catch(_){}
    await trackMe();
    if(S.tab==='comms')renderMain();
  }

  const ICE = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
    { urls: 'stun:stun4.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' },
  ], iceCandidatePoolSize: 10 };

  // TURN requires an authenticated Netlify Function and deployed coturn.
  // If unavailable, calls may work over STUN but are not considered network-reliable.
  async function viceIceConfig(){
    const base=ICE;
    try {
      const {data}=await sb.auth.getSession();
      const token=data?.session?.access_token;
      if(!token)return base;
      const response=await fetch('/.netlify/functions/turn-credentials',{
        headers:{'Authorization':'Bearer '+token,'Accept':'application/json'},
        cache:'no-store'
      });
      if(!response.ok)throw Error('TURN credentials unavailable: '+response.status);
      const config=await response.json();
      const servers=(config.iceServers||[]).filter(s=>s&&s.urls&&s.username&&s.credential);
      return servers.length?{iceServers:[...base.iceServers,...servers],iceCandidatePoolSize:10}:base;
    } catch(e) {console.warn('TURN disabled; calls may fail behind restrictive networks:',e.message);return base;}
  }

  const notify = () => { try { renderMain(); } catch(_){} };

  /* ─── CONNECT ─── */
  async function connect(){
    if(!S.user || S.user.id === 'sim-user') return;
    if(presenceChannel) return;

    const sessionId = (() => {
      let s = sessionStorage.getItem('vice-rt-session');
      if(!s){ s = uuid().slice(0,8); sessionStorage.setItem('vice-rt-session', s); }
      return s;
    })();
    const presenceKey = `${S.user.id}:${sessionId}`;

    try {
      /* Channel 1: presence only */
      presenceChannel = sb.channel('vice-os-presence', {
        config: { presence:{ key: presenceKey } }
      });
      presenceChannel.on('presence', { event:'sync' }, () => {
        try {
          const state = presenceChannel.presenceState();
          const online = new Set();
          const profiles = {};
          const meId = S.user?.id;
          for(const k of Object.keys(state)){
            for(const p of state[k]){
              if(!p.user_id) continue;
              if(p.user_id === meId) continue;
              online.add(p.user_id);
              profiles[p.user_id] = {
                id:p.user_id, user_id:p.user_id,
                name:p.name, email:p.email, role:p.role,
                avatar:p.avatar, avatarUrl:st.profiles[p.user_id]?.avatarUrl, at:p.at,status:p.status||'ONLINE',
              };
            }
          }
          st.online = online;
          st.profiles = { ...st.profiles, ...profiles };
          S.comms.online = online;
          mergePeers(profiles);
          handlers.presence.forEach(h => h(online, profiles));
          paintRealtimeBadge();
          if(S.tab === 'comms') renderMain();
        } catch(_){}
      });
      presenceChannel.subscribe(async (status) => {
        if(status === 'SUBSCRIBED'){
          try {await trackMe();}catch(_){}
        }
      });

      /* Public realtime broadcast is for presence/call signaling only.
         Never send channel message contents over the shared broadcast. */
      broadcastChannel = sb.channel('vice-os-broadcast', {
        config: { broadcast:{ self:false } }
      });
      broadcastChannel
        .on('broadcast', { event:'call' }, ({ payload }) => {
          if(!payload) return;
          // Legacy public broadcasts are not authenticated call signaling.
        })
        .on('broadcast', { event:'profile' }, ({ payload }) => {
          if(payload && payload.id){
            // Treat a broadcast as an invalidation hint, never as verified identity.
            void loadProfiles();
          }
        })
        .on('broadcast', { event:'notify' }, ({ payload }) => {
          if(!payload) return;
          if(payload.from === S.user.id) return;
          if(payload.to && payload.to !== S.user.id) return;
          if(payload.kind === 'distribution'){
            try { Notify.haptic([80, 40, 80]); } catch(_){}
            try { Notify.beep({ freq: 660, dur: 0.15, gain: 0.1 }); } catch(_){}
            setTimeout(() => { try { Notify.beep({ freq: 990, dur: 0.18, gain: 0.1 }); } catch(_){} }, 200);
            toast(`Distribution ${payload.status} · ${payload.period} · ${fmtMoney(payload.total, 'USD')}`, 'success');
            try {
              Notify.message('VICE Capital', `Your distribution for ${payload.period} is ${String(payload.status).toLowerCase()} — ${fmtMoney(payload.total, 'USD')}.`, {
                tag: 'dist:' + payload.period,
                onClick: () => { go('distributions'); },
              });
            } catch(_){}
            renderMain();
          }
          if(payload.kind === 'assignment'){
            try { Notify.haptic([80, 40, 80]); } catch(_){}
            toast(payload.message || 'Your record was updated', 'success');
            renderMain();
          }
        })
        .subscribe((status) => {
          if(status === 'SUBSCRIBED'){
            st.connected = true;
            paintRealtimeBadge();
            broadcastProfile();
            loadProfiles();
            if(S.tab === 'comms') renderMain();
          } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
            st.connected = false;
            paintRealtimeBadge();
          }
        });

      /* Authorized channel stream: RLS hides reserve/treasury staff records. */
      channelDb=sb.channel('vice-os-rbac-channel-inbox-'+S.user.id)
        .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},({new:row})=>{
          if(S.user && row && row.sender_id!==S.user.id)receiveChat({
            id:row.id,channelId:row.channel_id,senderId:row.sender_id,
            senderName:row.sender_name,text:row.text,
            at:new Date(row.created_at).getTime()
          });
        }).subscribe();

      /* DM transport is RLS-scoped to the recipient, never global broadcast. */
      dmChannel=sb.channel('vice-os-dm-inbox-'+S.user.id)
        .on('postgres_changes',{
          event:'INSERT',schema:'public',table:'dm_messages',filter:'peer_id=eq.'+S.user.id
        },({new:row})=>{
          if(S.user && row?.peer_id===S.user.id && String(row.text||'').startsWith('VICE_CALL_V1:')){
            receiveCallRow(row);return;
          }
          if(S.user && row && row.sender_id!==S.user.id)receiveChat({
            id:row.id,peerId:S.user.id,senderId:row.sender_id,senderName:row.sender_name,
            text:row.text,at:new Date(row.created_at).getTime()
          });
        }).subscribe();

      /* Heartbeat: if the connection silently drops, reconnect */
      clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        const ok = (broadcastChannel && broadcastChannel.state === 'joined')
          || (presenceChannel && presenceChannel.state === 'joined');
        if(!ok && S.user && S.user.id !== 'sim-user'){
          try { disconnect(); } catch(_){}
          try { connect(); } catch(_){}
        }
      }, 25000);
    } catch(e){
      console.warn('Realtime connect failed:', e);
      st.connected = false;
      paintRealtimeBadge();
    }
  }

  function disconnect(){
    cleanup();
    st.profiles={};
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    if(presenceChannel){
      try { presenceChannel.untrack(); } catch(_){}
      try { presenceChannel.unsubscribe(); } catch(_){}
      presenceChannel = null;
    }
    if(broadcastChannel){
      try { broadcastChannel.unsubscribe(); } catch(_){}
      broadcastChannel = null;
    }
    if(dmChannel){try{dmChannel.unsubscribe();}catch(_){}dmChannel=null;}
    if(channelDb){try{channelDb.unsubscribe();}catch(_){}channelDb=null;}
    st.connected = false;
    st.online = new Set();
    paintRealtimeBadge();
  }

  /* ─── PEERS ─── */
  async function loadProfiles(){
    const epoch=authEpoch;
    try {
      const { data, error } = await sb.rpc('vice_member_directory');
      if(error)throw error;
      await window.ViceComms?.resolveAvatars(data||[]);
      if(epoch!==authEpoch||!S.user)return;
      if(!data) return;
      const peers = [];
      for(const p of data){

        st.profiles[p.id] = {
          id:p.id, name:p.name, email:p.email,
          role:p.role, avatar:p.avatar_initials, avatarUrl:p.avatar_url, vip:!!p.vip_access,
        };
        peers.push({ id:p.id, name:p.name || 'Member', role:ROLE_LABELS[p.role] || p.role || 'HOLDER' });
      }
      mergePeers(st.profiles);
      if(['comms','community'].includes(S.tab))renderMain();
      if(currentCall)paintCallOverlay();
    } catch(e){console.warn('Member directory:',e.message);}
  }

  function mergePeers(profiles){
    const seen = new Set();
    const meId = S.user?.id;
    const meEmail = S.profile?.email;
    const list = [];
    for(const id of Object.keys(profiles || {})){
      const p = profiles[id];
      if(!p) continue;
      const pid = p.id || p.user_id;
      if(!pid) continue;
      if(pid === meId) continue;
      if(meEmail && p.email && p.email === meEmail) continue;
      if(seen.has(pid)) continue;
      seen.add(pid);
      list.push({
        id: pid,
        name: p.name || 'Member',
        role: ROLE_LABELS[p.role] || p.role || 'HOLDER',
        avatar: p.avatar || (p.name || 'NA').slice(0,2).toUpperCase(),
        avatarUrl: p.avatarUrl || null,
        online: st.online.has(pid),
        status: st.online.has(pid) ? (p.status||'ONLINE') : 'OFFLINE',
      });
    }
    S.comms.peers = list.sort((a,b) => {
      if(a.online !== b.online) return a.online ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  /* ─── MESSAGING ─── */
  async function receiveChat(payload){
    const epoch=authEpoch;
    let plaintext = '[message unavailable — open the conversation to retry]';
    const listKey=payload.channelId||payload.senderId;
    const oldList=payload.channelId?S.comms.messages[listKey]:S.comms.dms[listKey];
    if(oldList?.some(m=>m.id===payload.id))return;
    try {
      if(payload.channelId){
        plaintext = await MsgCrypto.decrypt('ch:' + payload.channelId, payload.text);
      } else if(payload.peerId){
        const threadId = [payload.senderId, payload.peerId].sort().join('|');
        plaintext = await MsgCrypto.decrypt('dm:' + threadId, payload.text);
      }
    } catch(e){console.warn('Notification decryption:',e.message);}

    if(epoch!==authEpoch||!S.user)return;
    if(payload.channelId){
      const list = S.comms.messages[payload.channelId] || (S.comms.messages[payload.channelId] = []);
      if(!list.some(m => m.id === payload.id)){
        list.push({
          id:payload.id, from:payload.senderName, senderId:payload.senderId, at:payload.at,
          text:plaintext, self:false, _decrypted:true,
        });
        if(!(S.tab === 'comms' && S.comms.activeChannel === payload.channelId && !S.comms.activeDm)){
          S.comms.unread[payload.channelId] = (S.comms.unread[payload.channelId] || 0) + 1;
        }
      }
    } else if(payload.peerId){
      const key = payload.senderId;
      const list = S.comms.dms[key] || (S.comms.dms[key] = []);
      if(!list.some(m => m.id === payload.id)){
        list.push({
          id:payload.id, from:payload.senderName, senderId:payload.senderId, at:payload.at,
          text:plaintext, self:false, _decrypted:true,
        });
        if(!(S.tab === 'comms' && S.comms.activeDm === key)){
          S.comms.unread['dm:' + key] = (S.comms.unread['dm:' + key] || 0) + 1;
        }
      }
    }

    handlers.message.forEach(h => h({...payload,text:plaintext}));

    if(S.tab === 'comms') renderMain();
    paintCmTabs();

    const viewingThisChannel = S.tab === 'comms'
      && S.comms.activeChannel === payload.channelId
      && !S.comms.activeDm
      && !document.hidden;
    const viewingThisDm = S.tab === 'comms'
      && S.comms.activeDm === payload.senderId
      && !document.hidden;

    if(viewingThisChannel||viewingThisDm)window.ViceComms?.markRead([payload.id]);
    if(!viewingThisChannel && !viewingThisDm){
      try {
        Notify.message(payload.senderName || 'New message', plaintext || '', {
          id:payload.id, at:payload.at,
          tag: payload.channelId ? 'ch:' + payload.channelId : 'dm:' + payload.senderId,
          onClick: () => {
            try {
              if(payload.channelId){
                S.comms.activeChannel = payload.channelId;
                S.comms.activeDm = null;
              } else {
                S.comms.activeDm = payload.senderId;
                S.comms.activeChannel = null;
              }
              S.tab = 'comms';
              go('comms');
            } catch(_){}
          },
        });
      } catch(_){}
    }
  }

  // Database confirmation is required before showing a message as sent.
  // Realtime broadcast is an optimization; it is not proof of delivery or read receipt.
  async function persist(table, row){
    if(!S.user?.id) throw Error('Sign in before sending messages');
    if(String(row.text||'').length>10000)throw Error('Message is too large after encoding; shorten it and try again');
    const {error}=await sb.from(table).insert({...row,created_at:new Date().toISOString()});
    if(error) throw Error(error.message || 'Database rejected message');
    return true;
  }

  async function send(channelId, text){
    const epoch=authEpoch;
    const t=String(text||'').trim();
    if(!t) return false;
    if(t.length>10000)throw Error('Message exceeds 10,000 characters');
    if(!channelId) throw Error('Open a channel first');
    const id=uuid(),at=Date.now(),senderName=S.profile.name||'Me';
    const encrypted=await MsgCrypto.encrypt('ch:'+channelId,t);
    if(epoch!==authEpoch||!S.user)throw Error('Session changed; reopen the conversation');
    const payload={id,channelId,senderId:S.user.id,senderName,text:encrypted,at};
    if(epoch!==authEpoch||!S.user)throw Error('Session changed; reopen the conversation');
    await persist('messages',{
      id,channel_id:channelId,sender_id:S.user.id,sender_name:senderName,text:encrypted
    });
    if(epoch!==authEpoch)return false;
    const list=S.comms.messages[channelId]||(S.comms.messages[channelId]=[]);
    if(!list.some(m=>m.id===id)) list.push({id,from:senderName,at,text:t,self:true,_decrypted:true});
    // The subscriber receives this through postgres_changes after server RLS.
    // Do not broadcast staff-only payloads to every member.
    try{localBus?.postMessage({type:'chat',payload});}catch(_){}
    return true;
  }

  async function sendDm(peerId, text){
    const epoch=authEpoch;
    const t=String(text||'').trim();
    if(!t) return false;
    if(t.length>10000)throw Error('Message exceeds 10,000 characters');
    if(!peerId||peerId===S.user?.id) throw Error('Select another member');
    const id=uuid(),at=Date.now(),senderName=S.profile.name||'Me';
    const threadId=[S.user.id,peerId].sort().join('|');
    const encrypted=await MsgCrypto.encrypt('dm:'+threadId,t);
    if(epoch!==authEpoch||!S.user)throw Error('Session changed; reopen the conversation');
    await persist('dm_messages',{
      id,peer_id:peerId,sender_id:S.user.id,sender_name:senderName,text:encrypted
    });
    if(epoch!==authEpoch)return false;
    const list=S.comms.dms[peerId]||(S.comms.dms[peerId]=[]);
    if(!list.some(m=>m.id===id)) list.push({id,from:senderName,at,text:t,self:true,_decrypted:true});
    // Recipient receives this through the authenticated RLS-scoped realtime stream.
    return true;
  }

  async function loadHistory(channelId){
    const epoch=authEpoch;
    try {
      const { data, error } = await sb.from('messages')
        .select('*').eq('channel_id', channelId)
        .order('created_at', { ascending:false }).limit(200);
      if(error){console.warn('Channel history unavailable:',error.message);toast('Channel history could not load: '+error.message,'error');return;}
      if(!data||epoch!==authEpoch)return;
      const existing = S.comms.messages[channelId] || [];
      const ids = new Set(existing.map(m => m.id));
      for(const m of data){
        if(ids.has(m.id)) continue;
        const plain = await MsgCrypto.decrypt('ch:' + channelId, m.text);
        if(epoch!==authEpoch)return;
        existing.push({
          id:m.id, from:m.sender_name, senderId:m.sender_id,
          at:new Date(m.created_at).getTime(),
          text:plain, _decrypted:true,
          self: m.sender_id === S.user?.id,
        });
      }
      existing.sort((a,b) => a.at - b.at);
      S.comms.messages[channelId] = existing;
      if(S.tab==='comms'&&S.comms.activeChannel===channelId&&!S.comms.activeDm)window.ViceComms?.markRead(existing.map(m=>m.id));
    } catch(e){ console.error('Channel history processing failed:',e); toast('Unable to display channel messages: '+(e?.message||'unknown error'),'error'); }
  }

        const plain = await MsgCrypto.decrypt('dm:' + threadId, m.text);
