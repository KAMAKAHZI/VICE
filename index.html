<style>
:root{--bg:#07080a;--bg2:#0a0b0d;--srf:#141518;--ln:rgba(201,168,76,.10);--ln2:rgba(201,168,76,.18);--ln3:rgba(201,168,76,.32);--tx:#f2ebe4;--tx2:#a3968e;--tx3:#6b5f59;--tx4:#3d3532;--gd:#c9a84c;--gdl:#ecd28a;--gr:#3ddc97;--rd:#d9465a;--wn:#f5a524;--vi:#8b7aff;--gg:linear-gradient(135deg,#ecd28a 0%,#c9a84c 45%,#9c7c33 100%);--sf:'Fraunces',Georgia,serif;--mn:'JetBrains Mono',ui-monospace,monospace;--nh:54px;--bh:22px;--sw:248px;--e:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:13.5px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}ul{list-style:none}
::selection{background:rgba(201,168,76,.3);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1c1d20;border-radius:8px}
h1,h2,h3,h4{font-weight:500;line-height:1.1;letter-spacing:-.02em}
h1{font-size:1.3rem;font-weight:400}h1 em{font-family:var(--sf);font-style:italic;font-weight:300;color:var(--gdl)}
p{color:var(--tx2)}
.tb{position:fixed;top:0;left:0;right:0;height:var(--nh);z-index:100;background:rgba(7,8,10,.95);backdrop-filter:blur(22px);border-bottom:1px solid var(--ln);display:flex;align-items:center;padding:0 16px;gap:14px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer}
.brand svg{width:24px;height:24px;transition:transform .5s var(--e)}
.brand:hover svg{transform:rotate(90deg)}
.bn{font-family:var(--sf);font-size:.9rem}.bn em{font-style:italic;color:var(--gdl);font-weight:300}
.bsub{font-family:var(--mn);font-size:.46rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tx4);margin-top:1px}
.tbc{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:3px;border:1px solid var(--ln2);background:rgba(0,0,0,.3);font-family:var(--mn);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);cursor:pointer;transition:all .2s}
.pill:hover{border-color:var(--ln3);color:var(--tx)}
.pill .d{width:5px;height:5px;border-radius:50%;background:var(--gr);box-shadow:0 0 6px var(--gr)}
.pill .d.w{background:var(--wn);box-shadow:0 0 6px var(--wn)}
.pill .d.r{background:var(--rd);box-shadow:0 0 6px var(--rd)}
.tbr{display:flex;align-items:center;gap:7px}
.upill{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:1px solid var(--ln2);border-radius:99px;background:rgba(0,0,0,.3);cursor:pointer}
.av{width:22px;height:22px;border-radius:50%;background:var(--gg);display:flex;align-items:center;justify-content:center;font-size:.56rem;font-weight:700;color:#1a0a0a}
.un{font-size:.7rem;color:var(--tx)}.ur{font-family:var(--mn);font-size:.46rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4)}
.mob{display:none;width:32px;height:32px;border-radius:4px;border:1px solid var(--ln2);align-items:center;justify-content:center;flex-direction:column;gap:4px;flex-shrink:0;cursor:pointer}
.mob span{display:block;width:13px;height:1.5px;background:var(--tx);border-radius:2px}
.bnr{position:fixed;top:var(--nh);left:0;right:0;height:var(--bh);z-index:98;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,rgba(160,24,40,.16),rgba(201,168,76,.06),rgba(160,24,40,.16));border-bottom:1px solid rgba(201,168,76,.14);font-family:var(--mn);font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gdl)}
.bnr.sim{background:linear-gradient(90deg,rgba(139,122,255,.22),rgba(201,168,76,.08),rgba(139,122,255,.22));color:var(--vi);border-bottom-color:rgba(139,122,255,.4)}
.bnr .d{width:4px;height:4px;border-radius:50%;background:var(--wn);box-shadow:0 0 5px var(--wn);animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
.sb{position:fixed;top:calc(var(--nh) + var(--bh));left:0;bottom:0;width:var(--sw);background:var(--bg2);border-right:1px solid var(--ln);padding:12px 0;overflow-y:auto;z-index:90;transition:transform .4s var(--e)}
.sb.off{transform:translateX(-100%)}
.ss{padding:0 10px;margin-bottom:12px}
.ss h4{font-family:var(--mn);font-size:.48rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tx4);margin-bottom:5px;padding-left:8px;font-weight:500}
.slink{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:3px;font-size:.78rem;color:var(--tx2);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all .18s;font-family:'Inter',sans-serif}
.slink:hover{color:var(--tx);background:rgba(201,168,76,.05);padding-left:11px}
.slink.on{color:var(--gd);background:rgba(201,168,76,.08);border-left:2px solid var(--gd);padding-left:6px}
.slink svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.slink.on svg{opacity:1}
.sbdg{margin-left:auto;font-family:var(--mn);font-size:.46rem;padding:1px 6px;border-radius:99px;background:rgba(201,168,76,.14);color:var(--gd);border:1px solid rgba(201,168,76,.28)}
.sbdg.lv{background:rgba(61,220,151,.12);color:var(--gr);border-color:rgba(61,220,151,.3)}
.sbdg.sm{background:rgba(245,165,36,.12);color:var(--wn);border-color:rgba(245,165,36,.3)}
.sbdg.rd{background:rgba(217,70,90,.12);color:var(--rd);border-color:rgba(217,70,90,.3)}
.mn{margin-left:var(--sw);padding-top:calc(var(--nh) + var(--bh));min-height:100vh;background:var(--bg);transition:margin-left .4s var(--e)}
.mni{padding:20px 24px 60px;max-width:1800px;margin:0 auto}
.ph{margin-bottom:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph .eb{font-family:var(--mn);font-size:.54rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gd);display:inline-flex;align-items:center;gap:8px;margin-bottom:6px}
.ph .eb::before{content:'';width:16px;height:1px;background:linear-gradient(90deg,var(--rd),transparent)}
.ph p{font-size:.78rem;color:var(--tx3);margin-top:4px;max-width:70ch}
.ph-acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.78rem;font-weight:500;padding:7px 14px;border-radius:3px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all .22s var(--e);font-family:'Inter',sans-serif}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--gg);color:#0a0a0b;font-weight:600;border-color:rgba(236,210,138,.3);box-shadow:0 6px 20px -8px rgba(201,168,76,.7)}
.btn-p:hover:not(:disabled){box-shadow:0 10px 30px -8px rgba(201,168,76,.9);transform:translateY(-1px)}
.btn-g{color:var(--tx2);border-color:var(--ln2);background:transparent}
.btn-g:hover:not(:disabled){color:var(--tx);border-color:var(--ln3);background:rgba(201,168,76,.04)}
.btn-gd{color:var(--gdl);border-color:var(--ln3);background:transparent}
.btn-gd:hover:not(:disabled){background:rgba(201,168,76,.08);border-color:var(--gd)}
.btn-r{color:var(--rd);border-color:rgba(217,70,90,.3);background:transparent}
.btn-r:hover:not(:disabled){background:rgba(217,70,90,.08);border-color:var(--rd)}
.btn-v{color:var(--vi);border-color:rgba(139,122,255,.35);background:transparent}
.btn-v:hover:not(:disabled){background:rgba(139,122,255,.08);border-color:var(--vi)}
.btn-sm{padding:5px 10px;font-size:.7rem}.btn-b{width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px;margin-bottom:14px}
.st{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;padding:13px 15px;transition:border-color .3s}
.st:hover{border-color:var(--ln3)}
.st .l{font-family:var(--mn);font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);display:block;margin-bottom:6px}
.st .v{font-family:var(--sf);font-size:1.35rem;font-weight:500;line-height:1;color:var(--tx)}
.st .v.gr{color:var(--gr)}.st .v.rd{color:var(--rd)}.st .v.gd{color:var(--gdl)}
.st .v.sm{font-family:var(--mn);font-size:.8rem;letter-spacing:.08em;color:var(--wn)}
.st .n{font-family:var(--mn);font-size:.52rem;color:var(--tx4);margin-top:5px;letter-spacing:.04em}
.pnl{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;overflow:hidden;margin-bottom:11px}
.pnl-h{padding:11px 15px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pnl-h h3{font-size:.85rem;display:flex;align-items:center;gap:7px}
.pnl-h .hint{font-family:var(--mn);font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4)}
.pnl-b{padding:14px}.pnl-b.fl{padding:0}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th{font-family:var(--mn);font-size:.48rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx4);text-align:left;padding:8px 11px;border-bottom:1px solid var(--ln);font-weight:500;background:rgba(0,0,0,.15)}
td{padding:8px 11px;border-bottom:1px solid var(--ln);color:var(--tx2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(201,168,76,.02)}
td.mn{font-family:var(--mn);color:var(--tx);font-size:.7rem}
td.right{text-align:right}
.bdg{display:inline-flex;align-items:center;gap:3px;font-family:var(--mn);font-size:.48rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap}
.bdg.gr{color:var(--gr);border-color:rgba(61,220,151,.3);background:rgba(61,220,151,.06)}
.bdg.rd{color:var(--rd);border-color:rgba(217,70,90,.3);background:rgba(217,70,90,.06)}
.bdg.gd{color:var(--gd);border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.06)}
.bdg.wn{color:var(--wn);border-color:rgba(245,165,36,.3);background:rgba(245,165,36,.06)}
.bdg.nt{color:var(--tx3);border-color:var(--ln2);background:rgba(0,0,0,.3)}
.bdg.lv{color:var(--gr);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.bdg.vi{color:var(--vi);border-color:rgba(139,122,255,.3);background:rgba(139,122,255,.06)}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-family:var(--mn);font-size:.54rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.ff input,.ff select,.ff textarea{background:rgba(0,0,0,.4);border:1px solid var(--ln2);border-radius:3px;padding:9px 11px;font-size:.82rem;color:var(--tx);transition:all .22s;font-family:'Inter',sans-serif;width:100%}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--gd);background:rgba(201,168,76,.04)}
.ff input::placeholder,.ff textarea::placeholder{color:var(--tx4)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .fc{grid-column:1/-1}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.crd{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;padding:16px;transition:all .3s var(--e);cursor:pointer}
.crd:hover{border-color:var(--ln3);transform:translateY(-2px)}
.crd h4{font-size:.88rem;margin-bottom:5px;color:var(--tx)}
.crd .d{font-size:.76rem;color:var(--tx3);line-height:1.55;margin-bottom:11px}
.crd .m{font-family:var(--mn);font-size:.52rem;color:var(--tx4);display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid var(--ln)}
.mb{position:fixed;inset:0;background:rgba(3,4,6,.86);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;visibility:hidden;transition:all .25s}
.mb.on{opacity:1;visibility:visible}
.mdl{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln2);border-radius:5px;box-shadow:0 40px 100px -30px rgba(0,0,0,.9);transform:translateY(8px);transition:transform .3s var(--e)}
.mb.on .mdl{transform:translateY(0)}.mdl.wide{max-width:850px}
.mh{padding:14px 20px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--srf);z-index:5}
.mh h3{font-size:.92rem;font-weight:500}
.mc{width:28px;height:28px;border-radius:4px;border:1px solid var(--ln2);color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem}
.mc:hover{color:var(--tx);border-color:var(--ln3)}
.mbd{padding:18px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln)}
.tsts{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tst{background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln2);border-radius:3px;padding:10px 14px;min-width:230px;max-width:340px;box-shadow:0 20px 60px -20px rgba(0,0,0,.9);border-left:2px solid var(--gd);animation:tin .3s var(--e);pointer-events:auto;font-size:.76rem;color:var(--tx)}
.tst.ok{border-left-color:var(--gr)}.tst.err{border-left-color:var(--rd)}.tst.warn{border-left-color:var(--wn)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.rw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);gap:11px;flex-wrap:wrap}
.rw:last-child{border-bottom:none}
.rw-l{font-size:.8rem;color:var(--tx2)}
.rw-s{font-family:var(--mn);font-size:.52rem;color:var(--tx4);margin-top:2px}
.rw-v{font-family:var(--mn);font-size:.8rem;color:var(--tx)}
.sp2{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}
.emp{padding:32px 16px;text-align:center;color:var(--tx4);font-size:.76rem}
.cwrap{position:relative;height:640px;background:#0a0b0d;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
#cv{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:absolute;top:9px;left:11px;font-family:var(--mn);font-size:.54rem;background:rgba(0,0,0,.82);padding:7px 10px;border-radius:3px;border:1px solid var(--ln);color:var(--tx2);line-height:1.55;pointer-events:none;letter-spacing:.03em;max-width:280px;z-index:5}
.hud .k{color:var(--tx4);margin-right:4px}
.hud .v{color:var(--tx)}.hud .up{color:var(--gr)}.hud .dn{color:var(--rd)}.hud .w{color:var(--wn)}.hud .gd{color:var(--gdl)}
.clg{position:absolute;top:9px;right:11px;font-family:var(--mn);font-size:.5rem;background:rgba(0,0,0,.78);padding:7px 9px;border-radius:3px;border:1px solid var(--ln);color:var(--tx3);line-height:1.7;letter-spacing:.04em;pointer-events:none;z-index:5;max-width:190px}
.clg .sw{display:inline-block;width:13px;height:2px;vertical-align:middle;margin-right:4px}
.cstat{position:absolute;bottom:7px;left:11px;font-family:var(--mn);font-size:.5rem;background:rgba(0,0,0,.78);padding:4px 8px;border-radius:3px;border:1px solid var(--ln);color:var(--tx4);letter-spacing:.06em;pointer-events:none;z-index:5;display:flex;gap:11px;flex-wrap:wrap}
.cstat .f0{color:var(--tx)}.cstat .f100{color:var(--gd)}.cstat .eq{color:rgba(201,168,76,.55)}.cstat .in{color:#5f5a37}
.ctb{display:flex;gap:5px;padding:7px 9px;background:linear-gradient(165deg,var(--srf),var(--bg2));border:1px solid var(--ln);border-radius:3px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.ctg{display:flex;gap:1px;padding:2px;background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:3px}
.ctb-btn{padding:4px 8px;font-family:var(--mn);font-size:.54rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);background:none;border:none;border-radius:2px;cursor:pointer;transition:all .15s;white-space:nowrap}
.ctb-btn:hover{color:var(--tx);background:rgba(201,168,76,.06)}
.ctb-btn.on{color:var(--gdl);background:rgba(201,168,76,.14)}
.ctb-sel{background:rgba(0,0,0,.4);border:1px solid var(--ln2);color:var(--gdl);font-family:var(--mn);font-size:.62rem;padding:5px 8px;border-radius:3px;cursor:pointer;transition:all .2s}
.ctb-sel:hover{border-color:var(--gd);background:rgba(201,168,76,.06)}
.pres{display:flex;gap:2px;padding:2px 4px;background:rgba(0,0,0,.3);border:1px solid var(--ln);border-radius:3px;cursor:pointer;transition:all .15s}
.pres.on{border-color:var(--gd);box-shadow:0 0 0 1px rgba(201,168,76,.3) inset}
.pres .chip{width:9px;height:9px;border-radius:2px}
.ctb-sep{width:1px;height:16px;background:var(--ln);margin:0 2px}
.bsk{padding:11px 13px;border-radius:3px;border:1px solid var(--ln2);background:rgba(0,0,0,.15);margin-bottom:9px}
.bsk.macro{border-left:3px solid var(--gd)}
.bsk.internal{border-left:3px solid var(--vi)}
.bsk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bsk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:5px;margin-top:7px}
.bst{background:rgba(0,0,0,.3);border-radius:2px;padding:5px 7px}
.bst .l{font-family:var(--mn);font-size:.42rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx4);margin-bottom:2px}
.bst .v{font-family:var(--mn);font-size:.7rem;color:var(--tx)}
.bst .v.g{color:var(--gr)}.bst .v.r{color:var(--rd)}.bst .v.w{color:var(--wn)}.bst .v.gd{color:var(--gdl)}
.ebar{display:flex;gap:2px;margin-top:7px;height:5px;border-radius:3px;overflow:hidden;background:rgba(0,0,0,.4)}
.ebar .seg{flex:1;background:rgba(255,255,255,.06);transition:all .3s}
.ebar .seg.filled{background:var(--gd)}
.ebar .seg.closed{background:var(--gr)}

  const s = String(sym||'').trim();

  return { source:'YAHOO', ticker:u };
}

  if(ticker.startsWith('^')) return ticker.slice(1);

}

    if(btn){ btn.disabled=false; btn.querySelector('span').textContent='Continue with Google'; }
  }
}

async function login(){
  if(authBusy) return; authBusy = true;
  try{
    const identifier = $('lIdentifier').value.trim();
    const pw = $('lPass').value;
    if(!identifier || !pw){ toast('Email/username and password required','error'); authBusy=false; return; }

    let email = identifier;
    if(!identifier.includes('@')){
      const { data, error } = await sb.rpc('lookup_email_for_login', { p_identifier: identifier });
      if(error || !data){ toast('Username not found','error'); authBusy=false; return; }
      email = data;
    }

    const btn = $('loginBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error){
      toast('Login failed: ' + error.message,'error');
      if(btn){ btn.disabled = false; btn.textContent = 'Log In'; }
      authBusy = false;
      return;
    }
    await onAuthenticated(data.user);
  }catch(e){
    toast('Login failed: ' + e.message,'error');
    const btn = $('loginBtn'); if(btn){ btn.disabled = false; btn.textContent = 'Log In'; }
  }
  authBusy = false;
}

async function signUpWithEmailFromInvite(){
  const email = $('invEmail')?.value.trim();
  const pw = $('invPass')?.value;
  const cf = $('invConf')?.value;
  const inviteCode = sessionStorage.getItem('pending_invite') || new URLSearchParams(location.search).get('invite');

  if(!inviteCode){ toast('Invite required — open your invite link first','error'); return; }
  if(!email || !email.includes('@')){ toast('Valid email required','error'); return; }
  if(!pw || pw.length < 8){ toast('Password must be 8+ characters','error'); return; }
  if(pw !== cf){ toast('Passwords do not match','error'); return; }

  try{
    const { data: invite, error: invErr } = await sb.from('invites')
      .select('*').eq('code', inviteCode).eq('used', false).maybeSingle();
    if(invErr || !invite){ toast('Invite invalid or already used','error'); return; }

    const { data, error } = await sb.auth.signUp({
      email, password: pw,
      options: {
        data: { invite_code: inviteCode, name: invite.for_user || email.split('@')[0], role: invite.role || 'HOLDER' },
        emailRedirectTo: window.location.origin + '?invite=' + encodeURIComponent(inviteCode) + '&welcome=1'
      }
    });
    if(error){ toast('Signup failed: ' + error.message,'error'); return; }

    if(data.session && data.user){
      closeModal();
      await onAuthenticated(data.user);
    } else {
      closeModal();
      toast('Check your email to confirm — invite redeems automatically on first sign-in','success');
    }
  }catch(e){ toast('Signup failed: ' + e.message,'error'); }
}

async function onAuthenticated(user){
  try{
    const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();

    if(!prof){
      const inviteCode = sessionStorage.getItem('pending_invite') || new URLSearchParams(location.search).get('invite');
      if(!inviteCode){
        await sb.auth.signOut();
        toast('Access is invite-only. Open your invite link first.','error');
        return;
      }
      const { data: invite } = await sb.from('invites').select('*').eq('code', inviteCode).eq('used', false).maybeSingle();
      if(!invite){
        await sb.auth.signOut();
        toast('Invite invalid or already used.','error');
        sessionStorage.removeItem('pending_invite');
        return;
      }
      const googleName = user.user_metadata?.full_name || user.user_metadata?.name || '';
      const displayName = invite.for_user || googleName || user.email.split('@')[0];
      const initials = displayName.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase() || 'NA';
      const newProf = { id:user.id, email:user.email, name:displayName, role:invite.role||'HOLDER',
        vip_access:!!invite.vip_access || invite.role==='SUPER_ADMIN', avatar_initials:initials,
        title:'Member', jurisdiction:'CH', timezone:'UTC' };
      const { error: createErr } = await sb.from('profiles').insert(newProf);
      if(createErr){
        await sb.auth.signOut();
        toast('Profile creation failed: ' + createErr.message, 'error');
        return;
      }
      await sb.from('invites').update({ used:true }).eq('id', invite.id);
      sessionStorage.removeItem('pending_invite');
      S.profile = { ...newProf, username:'' };
      toast('Welcome to VICE OS — invite redeemed.','success');
    } else {
      S.profile = {
        name: prof.name || user.email?.split('@')[0] || 'User',
        username: prof.username || '',
        email: prof.email || user.email,
        role: prof.role || 'HOLDER',
        title: prof.title || 'Member',
        phone: prof.phone || '',
        jurisdiction: prof.jurisdiction || 'CH',
        timezone: prof.timezone || 'UTC',
        avatarInitials: prof.avatar_initials || (prof.name||'NA').slice(0,2).toUpperCase(),
        vipAccess: prof.vip_access || prof.role === 'SUPER_ADMIN',
      };
    }

    S.user = { id:user.id, email:user.email, name:S.profile.name, role:S.profile.role };
    S.personalHoldings = S.profile.role === 'SUPER_ADMIN'
      ? { viceUnits:7500000, v4xUnits:7500000 }
      : { viceUnits:0, v4xUnits:0 };

    await hydrateData();
    showApp();
    applyModeUI();
    if(!S.profile.username) toast('Set your username in Profile.','info');
    setTimeout(()=> loadCandles(), 250);

    if(!window._vipSub){
      window._vipSub = sb.channel('vip-stream')
        .on('postgres_changes',{ event:'INSERT', schema:'public', table:'vip_messages' }, payload => {
          const m = payload.new;
          if(!S.vip.messages[m.channel_id]) S.vip.messages[m.channel_id] = [];
          if(!S.vip.messages[m.channel_id].some(x=>x.id === m.id)){
            S.vip.messages[m.channel_id].push({ id:m.id, from:m.from_name, at:new Date(m.created_at).getTime(), text:m.body, self:m.from_user === S.user.id });
            if(S.view === 'vip') renderMain();
          }
        })
        .subscribe();
    }
  }catch(e){
    console.error('Auth hydration error', e);
    toast('Signed in but data load failed: ' + e.message, 'error');
  }
}

async function hydrateData(){
  const tables = {
    holders:'holders', allocations:'allocations', ouvVersions:'ouv_versions',
    proposals:'proposals', distributions:'distributions', documents:'documents',
    dataRooms:'data_rooms', complianceCases:'compliance_cases', treasuryTx:'treasury_tx',
    invites:'invites', audit:'audit_log', mt5:'mt5_accounts', externalAccounts:'external_accounts',
  };
  for(const [key, table] of Object.entries(tables)){
    try{
      const { data } = await sb.from(table).select('*').order('created_at',{ascending:false}).limit(500);
      if(data) S[key] = data.map(denorm);
    }catch(_){}
  }
  try{
    const { data: msgs } = await sb.from('vip_messages').select('*').order('created_at',{ascending:true}).limit(500);
    if(msgs){
      S.vip.messages = {};
      msgs.forEach(m=>{
        if(!S.vip.messages[m.channel_id]) S.vip.messages[m.channel_id] = [];
        S.vip.messages[m.channel_id].push({ id:m.id, from:m.from_name, at:new Date(m.created_at).getTime(), text:m.body, self:m.from_user === S.user.id });
      });
    }
  }catch(_){}
}

function denorm(row){
  const out = {};
  for(const [k,v] of Object.entries(row)) out[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())] = v;
  return out;
}

const BINANCE_TF  = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
const YAHOO_TF    = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'1h','1d':'1d','1wk':'1wk' };
const YAHOO_RANGE = { '1m':'5d','5m':'1mo','15m':'1mo','1h':'3mo','4h':'1y','1d':'2y','1wk':'5y' };

async function fetchCandlesBinance(ticker, tf, limit=500){
  const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${ticker}&interval=${BINANCE_TF[tf]||'1h'}&limit=${limit}`);
  if(!r.ok) throw new Error('Binance HTTP ' + r.status);
  const d = await r.json();
  return d.map(k => ({ t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] }));
}

async function fetchCandlesYahoo(ticker, tf){
  const interval = YAHOO_TF[tf] || '1h';
  const range    = YAHOO_RANGE[tf] || '3mo';
  const r = await fetch(`/.netlify/functions/yahoo?symbol=${encodeURIComponent(ticker)}&interval=${interval}&range=${range}`);
  if(!r.ok) throw new Error('Yahoo HTTP ' + r.status);
  const j = await r.json();
  const res = j?.chart?.result?.[0];
  if(!res || !res.timestamp?.length) throw new Error('Yahoo: no data');
  const ts = res.timestamp, q = res.indicators?.quote?.[0] || {};
  const out = [];
  for(let i=0;i<ts.length;i++){
    if(q.open[i]==null || q.close[i]==null) continue;
    out.push({ t:ts[i]*1000, o:q.open[i], h:q.high[i], l:q.low[i], c:q.close[i], v:q.volume?.[i]||0 });
  }
  return out;
}

async function fetchCandlesUnified(symbol, tf, limit=500){
  if(APP_MODE === 'SIM') return generateSim(symbol, limit);
  const { source, ticker } = parseSymbol(symbol);
  if(source === 'YAHOO') return await fetchCandlesYahoo(ticker, tf);
  return await fetchCandlesBinance(ticker, tf, limit);
}

async function loadCandles(){
  disconnectWS();
  const { source } = parseSymbol(CH.pair);
  try{
    CH.candles = await fetchCandlesUnified(CH.pair, CH.tf, 500);
    computeATR(); resolveAll();
    if(APP_MODE === 'LIVE' && source === 'BINANCE') connectWS();
    else if(APP_MODE === 'LIVE') startYahooPolling();
    else { CH.live = false; updateFeedDot(); }
  }catch(e){
    console.warn('Feed error:', e.message);
    CH.candles = generateSim(CH.pair, 500);
    computeATR(); resolveAll();
    toast('Live feed unavailable — using simulated data', 'warn');
    CH.live = false; updateFeedDot();
  }
  drawAll();
}

function generateSim(sym, count){
  const { ticker } = parseSymbol(sym);
  let p = /BTC|ETH|SOL|BNB|XRP|ADA|AVAX|LINK|DOGE/i.test(ticker) ? 100 + Math.random()*600 : 100;
  const out = [];
  const step = {'1m':60e3,'5m':300e3,'15m':900e3,'1h':3600e3,'4h':14400e3,'1d':86400e3}[CH.tf] || 3600e3;
  const now = Date.now();
  for(let i=count-1;i>=0;i--){
    const t = now - i*step;
    const o = p; p += (Math.random()-0.495)*p*0.003; const c = p;
    out.push({t,o,h:Math.max(o,c)+Math.random()*p*0.001,l:Math.min(o,c)-Math.random()*p*0.001,c,v:Math.random()*1e6});
  }
  return out;
}

function computeATR(){
  const cs = CH.candles; if(cs.length < 15) return;
  let s = 0;
  for(let i=cs.length-14;i<cs.length;i++){
    const c = cs[i], pc = cs[i-1]?.c || c.o;
    s += Math.max(c.h-c.l, Math.abs(c.h-pc), Math.abs(c.l-pc));
  }
  CH.atr = s/14;
}

function connectWS(){
  try{
    const { ticker } = parseSymbol(CH.pair);
    const sym = ticker.toLowerCase(), tf = BINANCE_TF[CH.tf] || '1h';
    CH.ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym}@kline_${tf}`);
    CH.ws.onopen  = () => { CH.live = true; updateFeedDot(); };
    CH.ws.onmessage = e => {
      try{
        const m = JSON.parse(e.data); if(!m.k) return;
        const k = m.k;
        const c = { t:k.t, o:+k.o, h:+k.h, l:+k.l, c:+k.c, v:+k.v };
        const cs = CH.candles;
        if(cs.length && cs[cs.length-1].t === c.t) cs[cs.length-1] = c;
        else if(!cs.length || c.t > cs[cs.length-1].t){ cs.push(c); if(cs.length > 600) cs.shift(); }
        computeATR(); resolveAll(); drawAll(); engineTick();
      }catch(_){}
    };
    CH.ws.onerror = () => { CH.live = false; updateFeedDot(); };
    CH.ws.onclose = () => { CH.live = false; updateFeedDot(); };
  }catch(_){ CH.live = false; updateFeedDot(); }
}

/* ═══ POLE RESOLUTION ═══ */
function resolveAll(){
  const cs = CH.candles; if(cs.length < 60) return;
  applyPole('microHi', resolvePole(cs,true, CFG.MICRO_SWING, CFG.MICRO_SCAN), cs);
  applyPole('microLo', resolvePole(cs,false,CFG.MICRO_SWING, CFG.MICRO_SCAN), cs);
  applyPole('macroHi', resolvePole(cs,true, CFG.MACRO_SWING, Math.min(CFG.MACRO_SCAN, cs.length-10)), cs);
  applyPole('macroLo', resolvePole(cs,false,CFG.MACRO_SWING, Math.min(CFG.MACRO_SCAN, cs.length-10)), cs);
  const p = CH.poles;
  if(p.macroHi.price>0 && p.microHi.price>0 && p.macroHi.price < p.microHi.price){
    p.macroHi.price = Math.max(p.macroHi.price, p.microHi.price);
    p.macroHi.wick = Math.max(p.macroHi.wick, p.macroHi.price);
  }
  if(p.macroLo.price>0 && p.microLo.price>0 && p.macroLo.price > p.microLo.price){
    p.macroLo.price = Math.min(p.macroLo.price, p.microLo.price);
    p.macroLo.wick = Math.min(p.macroLo.wick, p.macroLo.price);
  }
  updatePoleStates(cs); updateActiveSides(); updateConfirms(cs); updateArming(cs); resolveInternal(cs);
}

function resolvePole(candles, isHigh, N, scan){
  const out = {price:0, time:0, grade:0};
  if(candles.length < N*3+10) return out;
  const maxScan = Math.min(scan, candles.length-N-2);
  const len = candles.length;
  let aC=0,aT=0,sC=0,sT=0,aF=0,sF=0;
  for(let sft=N+1;sft<maxScan;sft++){
    const i = len-1-sft; if(i<N || i+N>=len) continue;
    const hv = candles[i].h, lv = candles[i].l;
    let isFractal = true;
    for(let j=1;j<=N;j++){
      if(isHigh){ if(candles[i-j].h >= hv || candles[i+j].h >= hv){ isFractal=false; break; } }
      else{ if(candles[i-j].l <= lv || candles[i+j].l <= lv){ isFractal=false; break; } }
    }
    if(!isFractal) continue;
    const cand = isHigh?hv:lv;
    let broken = false;
    for(let k=i+1;k<len;k++){ if(isHigh ? (candles[k].c > cand) : (candles[k].c < cand)){ broken=true; break; } }
    if(broken) continue;
    const aligned = peakAligned(candles, i, isHigh, N);
    if(aligned){
      if(aF===0){ aC=cand; aT=candles[i].t; aF=1; }
      else if(aF===1){ const moreExt = isHigh ? (cand > aC) : (cand < aC); if(moreExt){ aC=cand; aT=candles[i].t; aF=2; } }
    }
    if(sF===0){ sC=cand; sT=candles[i].t; sF=1; }
    else if(sF===1 && Math.abs(cand-sC)>1e-8) sF=2;
    if(aF>=2 && sF>=2) break;
  }
  if(aF>=1){ out.price=aC; out.time=aT; out.grade=1; return out; }
  if(sF>=1){ out.price=sC; out.time=sT; out.grade=2; return out; }
  const look = Math.min(scan, candles.length-2);
  let ex = isHigh ? -Infinity : Infinity, exI = -1;
  for(let k=len-1-look;k<len-1;k++){
    if(k<0) continue;
    if(isHigh ? (candles[k].h > ex) : (candles[k].l < ex)){ ex = isHigh?candles[k].h:candles[k].l; exI=k; }
  }
  if(exI>=0){ out.price=ex; out.time=candles[exI].t; out.grade=3; }
  return out;
}

function peakAligned(candles, idx, isHigh, N){
  const lb = CFG.ALIGN_BARS, len = candles.length;
  const start = Math.max(0, idx-50);
  let hi=-Infinity, lo=Infinity;
  for(let k=start;k<=Math.min(len-1, idx+lb);k++){
    if(candles[k].h > hi) hi = candles[k].h;
    if(candles[k].l < lo) lo = candles[k].l;
  }
  const rng = hi-lo; if(rng<=0) return false;
  for(let d=-lb;d<=lb;d++){
    const j = idx+d; if(j<0 || j>=len) continue;
    const k = isHigh ? ((candles[j].h-lo)/rng*100) : ((candles[j].l-lo)/rng*100);
    if(isHigh && k >= CFG.STD_OB) return true;
    if(!isHigh && k <= CFG.STD_OS) return true;
  }
  return false;
}

function applyPole(key, res, cs){
  const p = CH.poles[key];
  if(res.price <= 0) return;
  const changed = Math.abs(res.price - p.price) > 1e-8;
  if(changed){
    p.price = res.price; p.grade = res.grade;
    const idx = cs.findIndex(c=>c.t===res.time);
    p.wickShift = idx>=0 ? cs.length-1-idx : 1;
    if(p.wickShift < 1) p.wickShift = 1;
    p.wick = p.isHigh ? cs[cs.length-1-p.wickShift].h : cs[cs.length-1-p.wickShift].l;
    if(p.state === 'BROKEN' || p.state === 'DORMANT'){ p.state='DORMANT'; p.touched=false; p.reclaimed=false; }
    p.armedFired = false;
  }
}

function updatePoleStates(cs){
  const live = cs[cs.length-1];
  for(const key of ['microHi','microLo','macroHi','macroLo']){
    const p = CH.poles[key]; if(p.price<=0) continue;
    const beyond = p.isHigh ? (live.c > p.price) : (live.c < p.price);
    if(beyond && p.state !== 'BROKEN' && p.state !== 'DORMANT') p.state = 'BROKEN';
    const touch = p.isHigh ? (live.h >= p.price - CH.atr*0.15) : (live.l <= p.price + CH.atr*0.15);
    if(touch && (p.state==='DORMANT' || p.state==='HELD')){
      if(!p.touched){ p.touched = true; p.wick = p.isHigh ? live.h : live.l; }
      else if(p.isHigh ? live.h > p.wick : live.l < p.wick){ p.wick = p.isHigh?live.h:live.l; }
      if(p.state === 'DORMANT') p.state = 'HELD';
    }
    if(p.touched && !p.reclaimed){
      const inside = p.isHigh ? (live.c < p.price) : (live.c > p.price);
      if(inside && p.wickShift < CFG.ALIGN_BARS*2) p.reclaimed = true;
    }
  }
}

function updateActiveSides(){
  const p = CH.poles;
  const shHi = p.microHi.wickShift || 999999, shLo = p.microLo.wickShift || 999999;
  if(shHi === 999999 && shLo === 999999){ p.microHi.active=false; p.microLo.active=false; }
  else if(shHi <= shLo){ p.microHi.active=true; p.microLo.active=false; }
  else { p.microHi.active=false; p.microLo.active=true; }
  const ShHi = p.macroHi.wickShift || 999999, ShLo = p.macroLo.wickShift || 999999;
  if(ShHi === 999999 && ShLo === 999999){ p.macroHi.active=false; p.macroLo.active=false; }
  else if(ShHi <= ShLo){ p.macroHi.active=true; p.macroLo.active=false; }
  else { p.macroHi.active=false; p.macroLo.active=true; }
}

function updateConfirms(cs){
  for(const key of ['microHi','microLo','macroHi','macroLo']){
    const p = CH.poles[key];
    p.touches = countTouches(cs, p.price, p.isHigh, CH.atr);
    let total = 0;
    if(p.grade === 1) total += 3;
    if(engulfingAt(cs, p.wickShift, p.isHigh)) total += 1;
    if(consolidationAt(cs, p.wickShift, p.price, p.isHigh, CH.atr)) total += 1;
    if(p.reclaimed) total += 1;
    if(displacementAt(cs, p.wickShift, p.price, p.isHigh, CH.atr)) total += 1;
    if(p.touches > 1) total += Math.min((p.touches-1)*CFG.TOUCH_WEIGHT, CFG.TOUCH_MAX);
    p.confirmsTotal = total;
  }
}
function engulfingAt(cs, shift, bearish){
  if(shift < 1) return false;
  const i = cs.length-1-shift; if(i < 1) return false;
  const a = cs[i], b = cs[i-1];
  if(bearish) return (a.c < a.o && b.c > b.o && a.o >= b.c && a.c <= b.o);
  return (a.c > a.o && b.c < b.o && a.o <= b.c && a.c >= b.o);
}
function consolidationAt(cs, shift, price, isHigh, atr){
  if(shift < 3 || atr<=0) return false;
  const zone = 0.75*atr;
  for(let q=1;q<=3;q++){
    const i = cs.length-1-shift+q; if(i<0||i>=cs.length) return false;
    const c = cs[i];
    if(isHigh){ if(c.c > price || c.h < price - zone) return false; }
    else { if(c.c < price || c.l > price + zone) return false; }
  }
  return true;
}
function displacementAt(cs, shift, price, isHigh, atr){
  if(shift < 1 || atr <= 0) return false;
  for(let q=1;q<=6;q++){
    const i = cs.length-1-shift-q; if(i<0||i>=cs.length) return false;
    const c = cs[i];
    if(isHigh ? (c.c <= price - 0.25*atr) : (c.c >= price + 0.25*atr)) return true;
  }
  return false;
}
function countTouches(cs, price, isHigh, atr){
  if(price<=0||atr<=0) return 0;
  const tol = CFG.TOUCH_TOL_ATR * atr;
  let n = 0, inTouch = false;
  const scan = Math.min(CFG.TOUCH_SCAN, cs.length-2);
  for(let s=1;s<=scan;s++){
    const c = cs[cs.length-1-s]; if(!c) break;
    const reach = isHigh ? (c.h >= price - tol) : (c.l <= price + tol);
    const rej = isHigh ? (c.c < price) : (c.c > price);
    const hit = reach && rej;
    if(hit && !inTouch){ n++; inTouch=true; }
    else if(!hit) inTouch=false;
  }
  return n;
}
function updateArming(cs){
  for(const key of ['microHi','microLo','macroHi','macroLo']){
    const p = CH.poles[key];
    if(p.price<=0 || !p.active || p.grade!==1) continue;
    if(p.state === 'ARMED' || p.state === 'BROKEN') continue;
    if(!p.touched || !p.reclaimed) continue;
    if(p.confirmsTotal < CFG.MIN_CONFIRMS) continue;
    const oppKey = key==='microHi'?'microLo':key==='microLo'?'microHi':key==='macroHi'?'macroLo':'macroHi';
    const opp = CH.poles[oppKey]; if(opp.price <= 0) continue;
    const entry = cs[cs.length-1].c;
    const stop = p.isHigh ? p.wick + 0.5*CH.atr : p.wick - 0.5*CH.atr;
    const risk = Math.abs(entry - stop); if(risk <= 0) continue;
    const targetRaw = p.isHigh ? CH.poles.macroLo.price : CH.poles.macroHi.price;
    const target = targetRaw > 0 ? targetRaw : opp.price;
    const rr = Math.abs(target - entry) / risk;
    if(rr < CFG.MIN_RR) continue;
    p.state = 'ARMED'; p.rr = rr; p.target = target;
  }
}
function resolveInternal(cs){
  const mHi = CH.poles.microHi.price, mLo = CH.poles.microLo.price;
  if(mHi <= 0 || mLo <= 0){ CH.internal.high.price=0; CH.internal.low.price=0; return; }
  const N = CFG.INTERNAL_SWING;
  const scan = Math.min(CFG.INTERNAL_PERIOD, cs.length-10);
  let bH=0, bHI=-1, bL=0, bLI=-1;
  for(let sft=N+1;sft<=scan;sft++){
    const i = cs.length-1-sft; if(i<N || i+N>=cs.length) continue;
    const h = cs[i].h, l = cs[i].l;
    let isH=true, isL=true;
    for(let j=1;j<=N;j++){
      if(cs[i-j].h >= h || cs[i+j].h >= h) isH = false;
      if(cs[i-j].l <= l || cs[i+j].l <= l) isL = false;
    }
    if(isH && h > mLo && h < mHi && bH<=0){ bH = h; bHI = sft; }
    if(isL && l > mLo && l < mHi && bL<=0){ bL = l; bLI = sft; }
    if(bH > 0 && bL > 0) break;
  }
  CH.internal.high.price = bH; CH.internal.high.shift = bHI; CH.internal.high.active = bH > 0;
  CH.internal.low.price = bL;  CH.internal.low.shift = bLI;  CH.internal.low.active = bL > 0;
}

/* ═══ ENGINE ═══ */
function engineTick(){
  if(!EN.running || EN.killSwitch) return;
  if(!canExecuteBot()) return;
  updateMSF();
  for(const key of ['microHi','microLo','macroHi','macroLo']){
    const p = CH.poles[key];
    if(p.state !== 'ARMED' || p.armedFired) continue;
    const basketKey = p.isMacro ? 'macro' : 'internal';
    const basket = EN.baskets[basketKey];
    if(basket.entries.filter(x=>x.lots>0.001).length >= CFG.BASKET_SIZE) continue;
    fireBasket(basketKey, p);
    p.armedFired = true;
  }
  manageBaskets();
}
function fireBasket(key, pole){
  const b = EN.baskets[key];
  const live = CH.candles[CH.candles.length-1].c;
  const isBuy = !pole.isHigh;
  b.side = isBuy?'BUY':'SELL'; b.zone = pole.isHigh?'F100':'F0';
  b.target = pole.target;
  b.sl = pole.isHigh ? pole.wick + 0.5*CH.atr : pole.wick - 0.5*CH.atr;
  b.runnerSplit = false;
  for(let i=0;i<CFG.BASKET_SIZE;i++){
    const jitter = (Math.random()-0.5)*CH.atr*0.15;
    b.entries.push({ id:i+1, entry:live+jitter, lots:0.01+i*0.002, closed:0, sl:b.sl, t1Closed:false, t2Closed:false, pnl:0, progress:0 });
  }
  logEngine(`${key.toUpperCase()} BASKET · ${isBuy?'BUY':'SELL'} @ ${live.toFixed(2)}`, isBuy?'ok':'no');
  toast(`${key.toUpperCase()} basket fired`, 'success');
  audit('BASKET_FIRED', `${key.toUpperCase()} @ ${live.toFixed(2)}`, 'ENGINE', key);
}
function manageBaskets(){
  const live = CH.candles[CH.candles.length-1].c;
  for(const [key, b] of Object.entries(EN.baskets)){
    const open = b.entries.filter(x=>x.lots>0.001);
    if(!open.length){ b.progress = 0; continue; }
    let total = 0;
    open.forEach(x=>{
      const dist = Math.abs(b.target - x.entry);
      const prog = (b.side==='BUY' ? (live-x.entry) : (x.entry-live)) / dist;
      x.progress = prog;
      x.pnl = (b.side==='BUY' ? (live-x.entry) : (x.entry-live)) * x.lots * 100;
      total += prog;
    });
    b.progress = total / open.length;
    if(b.progress >= 1.0 && !b.runnerSplit){
      b.runnerSplit = true;
      let closed = 0;
      for(const x of open){
        if(closed >= CFG.CLOSE_COUNT) break;
        if(x.lots <= 0.01) continue;
        const cv = x.lots * 0.90;
        x.lots -= cv; x.closed += cv; closed++;
      }
      logEngine(`${key.toUpperCase()} 8/9 banked — runner active`, 'gd');
    }
    open.forEach(x=>{
      const risk = Math.abs(x.entry - x.sl); if(risk<=0) return;
      const rrNow = (b.side==='BUY' ? (live-x.entry) : (x.entry-live)) / risk;
      if(rrNow >= CFG.T2_R && !x.t2Closed){
        const cv = x.lots * CFG.T2_CLOSE;
        if(cv >= 0.01){ x.lots -= cv; x.closed += cv; x.t2Closed = true; }
      } else if(rrNow >= CFG.T1_R && !x.t1Closed){
        const cv = x.lots * CFG.T1_CLOSE;
        if(cv >= 0.01){ x.lots -= cv; x.closed += cv; x.t1Closed = true; }
      }
    });
  }
}
function updateMSF(){
  const cs = CH.candles; if(cs.length < 60) return;
  const N = 5; const swings = [];
  for(let sft=N+1;sft<60;sft++){
    const i = cs.length-1-sft; if(i<N || i+N>=cs.length) break;
    let isH=true, isL=true;
    for(let j=1;j<=N;j++){
      if(cs[i-j].h >= cs[i].h || cs[i+j].h >= cs[i].h) isH=false;
      if(cs[i-j].l <= cs[i].l || cs[i+j].l <= cs[i].l) isL=false;
    }
    if(isH) swings.push({v:cs[i].h, type:'H'});
    if(isL) swings.push({v:cs[i].l, type:'L'});
    if(swings.length >= 8) break;
  }
  let hh=0, hl=0, lh=0, ll=0;
  for(let i=0;i<swings.length-1;i++){
    const a = swings[i], b2 = swings[i+1];
    if(a.type==='H' && b2.type==='H'){ if(a.v > b2.v) hh++; else lh++; }
    if(a.type==='L' && b2.type==='L'){ if(a.v > b2.v) hl++; else ll++; }
  }
  if(hh>=2 && hl>=2) EN.msf = 'UPTREND';
  else if(lh>=2 && ll>=2) EN.msf = 'DOWNTREND';
  else EN.msf = 'RANGE';
}
function logEngine(msg, kind='ok'){
  EN.events.unshift({t:Date.now(), msg, kind});
  if(EN.events.length > 200) EN.events.length = 200;
}

/* ═══ CANVAS ═══ */
let cv=null, ctx=null, DPR=1, W=0, H=0;
const PAD = {t:22, r:68, b:42, l:10};

function initCanvas(){ cv = $('cv'); if(!cv) return; ctx = cv.getContext('2d'); resizeCanvas(); drawAll(); }
function resizeCanvas(){
  if(!cv) return;
  const r = cv.parentElement.getBoundingClientRect();
  DPR = window.devicePixelRatio || 1;
  cv.width = r.width*DPR; cv.height = r.height*DPR;
  cv.style.width = r.width+'px'; cv.style.height = r.height+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W = r.width; H = r.height;
}

function drawAll(){
  if(!cv||!ctx) return;
  const P = PRESETS[CH.preset];
  ctx.fillStyle = P.bg; ctx.fillRect(0,0,W,H);
  const cs = CH.candles; if(cs.length < 20) return;
  const cw = W-PAD.l-PAD.r, ch = H-PAD.t-PAD.b;
  const visCount = Math.min(200, cs.length);
  const start = cs.length - visCount;
  let vmin = Infinity, vmax = -Infinity;
  for(let i=start;i<cs.length;i++){
    if(cs[i].l < vmin) vmin = cs[i].l;
    if(cs[i].h > vmax) vmax = cs[i].h;
  }
  for(const p of Object.values(CH.poles)) if(p.price>0){ vmin = Math.min(vmin,p.price); vmax = Math.max(vmax,p.price); }
  const rng = vmax-vmin || 1; vmin -= rng*0.06; vmax += rng*0.06;
  const xAt = i => PAD.l + (i-start)/(visCount-1)*cw;
  const yAt = v => PAD.t + (1-(v-vmin)/(vmax-vmin))*ch;
  ctx.strokeStyle = P.grid; ctx.lineWidth = 1;
  for(let i=0;i<=5;i++){ const y = PAD.t+(i/5)*ch; ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke(); }
  ctx.strokeStyle = P.gridMajor;
  for(let i=0;i<=10;i++){ const x = PAD.l+(i/10)*cw; ctx.beginPath(); ctx.moveTo(x,PAD.t); ctx.lineTo(x,H-PAD.b); ctx.stroke(); }
  if(CH.toggles.zones){
    const Mh = CH.poles.macroHi, Ml = CH.poles.macroLo;
    if(Mh.price>0){ ctx.fillStyle='rgba(201,168,76,.03)'; ctx.fillRect(PAD.l,yAt(Mh.price),cw,yAt(vmax)-yAt(Mh.price)); }
    if(Ml.price>0){ ctx.fillStyle='rgba(139,122,255,.03)'; ctx.fillRect(PAD.l,yAt(Ml.price),cw,yAt(vmax)-yAt(Ml.price)); }
  }
  if(CH.toggles.sd) drawSDZones(cs, start, xAt, yAt);
  if(CH.toggles.fvg) drawFVGs(cs, start, xAt, yAt);
  const cw2 = Math.max(1.5, cw/visCount-1);
  if(CH.type === 'candle' || CH.type === 'bar'){
    for(let i=start;i<cs.length;i++){
      const c = cs[i], x = xAt(i), up = c.c >= c.o;
      const bC = up?P.bull:P.bear, bB = up?P.bullB:P.bearB, bW = up?P.bullW:P.bearW;
      ctx.strokeStyle = bW; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yAt(c.h)); ctx.lineTo(x, yAt(c.l)); ctx.stroke();
      const yO = yAt(c.o), yC = yAt(c.c);
      const top = Math.min(yO,yC), bh = Math.max(1, Math.abs(yC-yO));
      if(CH.type === 'candle'){
        ctx.fillStyle = bC; ctx.fillRect(x-cw2/2, top, cw2, bh);
        ctx.strokeStyle = bB; ctx.strokeRect(x-cw2/2+0.5, top+0.5, cw2-1, Math.max(1,bh-1));
      } else {
        ctx.strokeStyle = bC; ctx.lineWidth = Math.max(2,cw2);
        ctx.beginPath(); ctx.moveTo(x,yO); ctx.lineTo(x,yC); ctx.stroke();
      }
    }
  } else if(CH.type === 'line' || CH.type === 'area'){
    ctx.strokeStyle = P.bullB; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let i=start;i<cs.length;i++){
      const x = xAt(i), y = yAt(cs[i].c);
      i===start ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
    if(CH.type === 'area'){
      ctx.lineTo(xAt(cs.length-1), H-PAD.b); ctx.lineTo(xAt(start), H-PAD.b); ctx.closePath();
      const g = ctx.createLinearGradient(0,PAD.t,0,H-PAD.b);
      g.addColorStop(0,'rgba(201,168,76,.25)'); g.addColorStop(1,'rgba(201,168,76,0)');
      ctx.fillStyle = g; ctx.fill();
    }
  }
  if(CH.toggles.vol){
    let vMax = 0;
    for(let i=start;i<cs.length;i++) if(cs[i].v > vMax) vMax = cs[i].v;
    if(vMax > 0){
      const vh = PAD.b * 0.6, v0 = H-PAD.b;
      ctx.fillStyle = P.vol;
      for(let i=start;i<cs.length;i++){ const bh = (cs[i].v/vMax)*vh; ctx.fillRect(xAt(i)-cw2/2, v0-bh, cw2, bh); }
    }
  }
  if(CH.toggles.internal){
    drawInternalLine('H', CH.internal.high, cs, start, xAt, yAt, P);
    drawInternalLine('L', CH.internal.low, cs, start, xAt, yAt, P);
  }
  if(CH.toggles.poles){
    drawPole('macroHi', cs, start, xAt, yAt, P);
    drawPole('macroLo', cs, start, xAt, yAt, P);
    drawPole('microHi', cs, start, xAt, yAt, P);
    drawPole('microLo', cs, start, xAt, yAt, P);
  }
  const mh = CH.poles.microHi.price, ml = CH.poles.microLo.price;
  if(mh > 0 && ml > 0){
    const eq = (mh+ml)/2;
    ctx.strokeStyle = 'rgba(201,168,76,.35)'; ctx.setLineDash([3,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, yAt(eq)); ctx.lineTo(W-PAD.r, yAt(eq)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.font = '9px "JetBrains Mono", monospace'; ctx.fillStyle = P.text; ctx.textBaseline = 'middle';
  for(let i=0;i<=5;i++){ const v = vmax-(i/5)*(vmax-vmin), y = PAD.t+(i/5)*ch; ctx.fillText(v.toFixed(v>100?2:v>1?4:6), W-PAD.r+5, y); }
  const last = cs[cs.length-1], yLast = yAt(last.c);
  const tag = last.c.toFixed(last.c>100?2:last.c>1?4:6);
  const tw = ctx.measureText(tag).width + 10;
  ctx.fillStyle = last.c >= last.o ? P.bullB : P.bearB;
  ctx.fillRect(W-PAD.r+2, yLast-8, tw, 16);
  ctx.fillStyle = '#07080a'; ctx.fillText(tag, W-PAD.r+7, yLast);
  drawBasketMarkers(cs, start, xAt, yAt);
  if(CH.toggles.choch) drawChoCH(cs, start, xAt, yAt);
  updateChartHUD(cs); updateChartLegend(); updateChartStatus();
}

function drawPole(key, cs, start, xAt, yAt, P){
  const p = CH.poles[key]; if(p.price <= 0) return;
  let color, style, label;
  const isM = !p.isMacro;
  if(p.state === 'ARMED'){ color = p.isHigh ? P.armedSell : P.armedBuy; style = 'solid'; label = `${isM?'M':'MA'} ${p.isHigh?'F100 SELL':'F0 BUY'} · ARMED · 1:${p.rr.toFixed(1)}`; }
  else if(p.state === 'BROKEN'){ color = P.broken; style='dashed'; label = `${isM?'M':'MA'} ${p.isHigh?'F100':'F0'} · BROKEN`; }
  else if(p.state === 'HELD'){ color = p.isHigh ? (isM?P.microHi:P.macroHi) : (isM?P.microLo:P.macroLo); style='dashed'; label = `${isM?'M':'MA'} ${p.isHigh?'F100':'F0'} · HELD`; }
  else { color = p.isHigh ? (isM?P.microHi:P.macroHi) : (isM?P.microLo:P.macroLo); style='dotted'; label = `${isM?'M':'MA'} ${p.isHigh?'F100':'F0'} · ${p.grade===3?'T3':p.grade===2?'T2':'DORMANT'}`; }
  if(!p.active && p.state !== 'BROKEN') color = P.stopped;
  const y = yAt(p.price);
  ctx.strokeStyle = color; ctx.lineWidth = p.state === 'ARMED' ? 2.5 : 1;
  if(style==='dashed') ctx.setLineDash([6,4]); else if(style==='dotted') ctx.setLineDash([2,4]); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '10px "JetBrains Mono", monospace'; ctx.fillStyle = color;
  ctx.textAlign = 'right'; ctx.fillText(label, W-PAD.r-4, y-4); ctx.textAlign = 'left';
  if(p.touched && p.wickShift > 0){
    const wi = cs.length-1-p.wickShift;
    if(wi >= start && wi < cs.length){ ctx.fillStyle = color; ctx.beginPath(); ctx.arc(xAt(wi), yAt(p.wick), 3, 0, Math.PI*2); ctx.fill(); }
  }
  if(CH.toggles.arrows && p.state === 'ARMED'){
    const ax = W-PAD.r-18, ay = p.isHigh ? y-13 : y+13;
    ctx.fillStyle = color; ctx.beginPath();
    if(p.isHigh){ ctx.moveTo(ax,ay); ctx.lineTo(ax-5,ay-7); ctx.lineTo(ax+5,ay-7); }
    else { ctx.moveTo(ax,ay); ctx.lineTo(ax-5,ay+7); ctx.lineTo(ax+5,ay+7); }
    ctx.closePath(); ctx.fill();
  }
}

function drawInternalLine(side, internal, cs, start, xAt, yAt, P){
  if(internal.price <= 0 || !internal.active) return;
  const y = yAt(internal.price);
  const si = cs.length-1-internal.shift;
  const from = Math.max(start, si), to = cs.length-1;
  const segLen = Math.max(8, (to-from)/4);
  ctx.strokeStyle = P.internal; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  let x = xAt(from); const xEnd = xAt(to);
  while(x < xEnd){ const x2 = Math.min(x+segLen, xEnd); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y); ctx.stroke(); x = x2+6; }
  ctx.font = '9px "JetBrains Mono", monospace'; ctx.fillStyle = P.internal;
  ctx.fillText(side==='H'?'INT-H':'INT-L', xAt(from)+4, y-4);
}

function drawSDZones(cs, start, xAt, yAt){
  const N=5, maxZ=3, atr = CH.atr;
  let dS=0, dD=0;
  for(let sft=N+1;sft<200 && (dS<maxZ || dD<maxZ);sft++){
    const i = cs.length-1-sft;
    if(i<N || i+N>=cs.length || i<start) break;
    let isH=true, isL=true;
    for(let j=1;j<=N;j++){
      if(cs[i-j].h >= cs[i].h || cs[i+j].h >= cs[i].h) isH=false;
      if(cs[i-j].l <= cs[i].l || cs[i+j].l <= cs[i].l) isL=false;
    }
    const th = atr * 0.6;
    if(isH && dS < maxZ){ ctx.fillStyle = 'rgba(217,70,90,.05)'; ctx.fillRect(xAt(i), yAt(cs[i].h), xAt(cs.length-1)-xAt(i), yAt(cs[i].h-th)-yAt(cs[i].h)); dS++; }
    if(isL && dD < maxZ){ ctx.fillStyle = 'rgba(61,220,151,.05)'; ctx.fillRect(xAt(i), yAt(cs[i].l+th), xAt(cs.length-1)-xAt(i), yAt(cs[i].l)-yAt(cs[i].l+th)); dD++; }
  }
}

function drawFVGs(cs, start, xAt, yAt){
  for(let i=Math.max(2,start);i<cs.length;i++){
    const a = cs[i-2], c = cs[i];
    if(a.h < c.l){
      const top = c.l, bot = a.h;
      if(top > bot && (top-bot) > CH.atr*0.10){
        const x1 = xAt(i-2), x2 = xAt(Math.min(i+8, cs.length-1));
        ctx.fillStyle = 'rgba(61,220,151,.06)'; ctx.fillRect(x1, yAt(top), x2-x1, yAt(bot)-yAt(top));
        ctx.strokeStyle = 'rgba(61,220,151,.2)'; ctx.lineWidth=1; ctx.strokeRect(x1, yAt(top), x2-x1, yAt(bot)-yAt(top));
      }
    }
    if(a.l > c.h){
      const top = a.l, bot = c.h;
      if(top > bot && (top-bot) > CH.atr*0.10){
        const x1 = xAt(i-2), x2 = xAt(Math.min(i+8, cs.length-1));
        ctx.fillStyle = 'rgba(217,70,90,.06)'; ctx.fillRect(x1, yAt(top), x2-x1, yAt(bot)-yAt(top));
        ctx.strokeStyle = 'rgba(217,70,90,.2)'; ctx.strokeRect(x1, yAt(top), x2-x1, yAt(bot)-yAt(top));
      }
    }
  }
}

function drawBasketMarkers(cs, start, xAt, yAt){
  const colors = {macro:'#c9a84c', internal:'#8b7aff'};
  for(const [key, b] of Object.entries(EN.baskets)){
    if(!b.entries.length) continue;
    const color = colors[key];
    b.entries.forEach(x=>{
      ctx.fillStyle = color;
      ctx.globalAlpha = x.lots > 0.001 ? 0.55 : 0.25;
      ctx.beginPath(); ctx.arc(xAt(cs.length-1)-4, yAt(x.entry), 2.5, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    if(b.target > 0){
      const ty = yAt(b.target);
      ctx.strokeStyle = color; ctx.setLineDash([2,4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(PAD.l, ty); ctx.lineTo(W-PAD.r, ty); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawChoCH(cs, start, xAt, yAt){
  const N = 5, len = cs.length; if(len < 30) return;
  for(let i=Math.max(start+10, len-60); i<len; i++){
    if(i < N*2) continue;
    const c = cs[i];
    let sh = -Infinity, sl = Infinity;
    for(let j=i-20; j<i; j++){
      if(j<N || j+N>=len) continue;
      let isH=true, isL=true;
      for(let k=1;k<=N;k++){
        if(cs[j-k].h >= cs[j].h || cs[j+k].h >= cs[j].h) isH=false;
        if(cs[j-k].l <= cs[j].l || cs[j+k].l <= cs[j].l) isL=false;
      }
      if(isH && cs[j].h > sh) sh = cs[j].h;
      if(isL && cs[j].l < sl) sl = cs[j].l;
    }
    if(sh > -Infinity && c.c > sh && cs[i-1].c <= sh){ ctx.fillStyle = 'rgba(61,220,151,.7)'; ctx.beginPath(); ctx.arc(xAt(i), yAt(c.l)-10, 4, 0, Math.PI*2); ctx.fill(); }
    if(sl < Infinity && c.c < sl && cs[i-1].c >= sl){ ctx.fillStyle = 'rgba(217,70,90,.7)'; ctx.beginPath(); ctx.arc(xAt(i), yAt(c.h)+10, 4, 0, Math.PI*2); ctx.fill(); }
  }
}

async function saveProfile(){
  const name = $('pName').value.trim();
  const username = $('pUser').value.trim().toLowerCase();
  const title = $('pTitle').value.trim();
  const jurisdiction = $('pJur').value.trim();
  const phone = $('pPhone').value.trim();
  const timezone = $('pTz').value.trim();
  if(username && !/^[a-z0-9_]{3,24}$/.test(username)){ toast('Username must be 3-24 chars: lowercase, digits, underscore','error'); return; }
  if(APP_MODE === 'SIM'){ Object.assign(S.profile, { name, username, title, jurisdiction, phone, timezone, avatarInitials:(name||'NA').slice(0,2).toUpperCase() }); $('userName').textContent = S.profile.name; $('userAvatar').textContent = S.profile.avatarInitials; toast('Profile saved (SIM)','success'); renderMain(); return; }
  try{
    const upd = { name, username: username || null, title, jurisdiction, phone, timezone, avatar_initials: (name||'NA').slice(0,2).toUpperCase() };
    const { error } = await sb.from('profiles').update(upd).eq('id', S.user.id);
    if(error){ toast('Update failed: '+error.message,'error'); return; }
    Object.assign(S.profile, { name, username, title, jurisdiction, phone, timezone, avatarInitials: (name||'NA').slice(0,2).toUpperCase() });
    $('userName').textContent = S.profile.name;
    $('userAvatar').textContent = S.profile.avatarInitials;
    toast('Profile saved','success');
    audit('PROFILE_UPDATED','profile','profile',S.user.id);
  }catch(e){ toast('Update failed: '+e.message,'error'); }
}

async function setPassword(){
  const pw = $('spNew').value;
  const cf = $('spConf').value;
  if(!pw || pw.length < 8){ toast('Password must be 8+ characters','error'); return; }
  if(pw !== cf){ toast('Passwords do not match','error'); return; }
  if(APP_MODE === 'SIM'){ toast('Password set (SIM)','success'); $('spNew').value=''; $('spConf').value=''; return; }
  try{
    const { error } = await sb.auth.updateUser({ password: pw });
    if(error){ toast('Failed: ' + error.message,'error'); return; }
    toast('Password set — you can now sign in with email or username','success');
    audit('PASSWORD_SET', 'password', 'user', S.user.id);
    $('spNew').value = ''; $('spConf').value = '';
    renderMain();
  }catch(e){ toast('Failed: ' + e.message,'error'); }
}

function renderBasket(key, b){
  const open = b.entries.filter(x=>x.lots>0.001);
  const total = b.entries.length;
  const closed = total - open.length;
  const pnl = b.entries.reduce((s,x)=>s+(x.pnl||0),0);
  const prog = Math.max(0, Math.min(1, b.progress||0));
  return `
    <div class="pnl">
      <div class="pnl-h">
        <h3>${b.label} Basket <span class="bdg ${b.side==='BUY'?'gr':'rd'}">${b.side}</span> <span class="bdg nt">${b.zone}</span></h3>
        <span class="hint">${open.length}/${total} open · ${closed} closed</span>
      </div>
      <div class="pnl-b">
        <div class="bsk-stats">
          <div class="bst"><div class="l">Progress</div><div class="v ${prog>=1?'g':'gd'}">${(prog*100).toFixed(1)}%</div></div>
          <div class="bst"><div class="l">Target</div><div class="v">${b.target?b.target.toFixed(2):'—'}</div></div>
          <div class="bst"><div class="l">Stop</div><div class="v r">${b.sl?b.sl.toFixed(2):'—'}</div></div>
          <div class="bst"><div class="l">PnL</div><div class="v ${pnl>=0?'g':'r'}">${pnl>=0?'+':''}${pnl.toFixed(2)}</div></div>
        </div>
        <div class="ebar">
          ${Array.from({length:9}).map((_,i)=>{
            if(i < closed) return '<div class="seg closed"></div>';
            if(i === total-1 && b.runnerSplit) return '<div class="seg runner"></div>';
            if(i < closed + open.length) return '<div class="seg filled"></div>';
            return '<div class="seg"></div>';
          }).join('')}
        </div>
      </div>
    </div>`;
}
function toggleEngine(){
  if(!canExecuteBot()){ toast('Execution permission required','error'); return; }
  EN.running = !EN.running;
  const d = $('engDot'), l = $('engLabel');
  if(d && l){ d.className = 'd ' + (EN.running?'':'w'); l.textContent = EN.running?'RUNNING':'IDLE'; }
  logEngine(EN.running?'Engine started':'Engine stopped', EN.running?'gd':'w');
  toast(EN.running?'Engine started':'Engine stopped', EN.running?'success':'info');
  audit('ENGINE_TOGGLE', EN.running?'START':'STOP', 'engine', 'vicebot');
  renderMain();
}

async function submitOUV(){
  const vice = parseFloat($('ouvV').value), v4x = parseFloat($('ouvX').value);
  const note = $('ouvN').value;
  if(!vice || !v4x){ toast('Both OUVs required','error'); return; }
  const row = { version:'v'+Date.now().toString(36), vice_ouv:vice, v4x_ouv:v4x, note };
  if(APP_MODE === 'LIVE'){
    try{
      const { error } = await sb.from('ouv_versions').insert(row);
      if(error){ toast('Publish failed: '+error.message,'error'); return; }
    }catch(e){ toast('Publish failed: '+e.message,'error'); return; }
  }
  S.iruClasses[0].ouv = vice; S.iruClasses[1].ouv = v4x;
  S.ouvVersions.unshift({ ...row, createdAt: nowIso() });
  toast('OUV published','success'); closeModal(); renderMain();
  audit('OUV_PUBLISHED', `VICE=${vice} V4X=${v4x}`, 'ouv', row.version);
}

async function submitMT5Add(){
  const broker = $('mBroker').value.trim();
  const login = $('mLogin').value.trim();
  const server = $('mServer').value.trim();
  const balance = parseFloat($('mBal').value) || 0;
  const equity = parseFloat($('mEq').value) || 0;
  const mode = $('mMode').value;
  if(!broker || !login){ toast('Broker and login required','error'); return; }
  const row = { broker, login, server, balance, equity, status:'CONNECTED', mode, display_mode:'AUTO' };
  if(APP_MODE === 'LIVE'){
    try{
      const { data, error } = await sb.from('mt5_accounts').insert({ ...row, owner_id:S.user.id }).select().single();
      if(error){ toast('Add failed: '+error.message,'error'); return; }
      S.mt5.unshift(denorm(data));
    }catch(e){ toast('Add failed: '+e.message,'error'); return; }
  } else {
    S.mt5.unshift({ ...row, id:uuid(), owner_id:'sim-user', createdAt:nowIso() });
  }
  toast('Account added','success');
  audit('MT5_ACCOUNT_ADDED', login, 'mt5', login);

}
async function setMT5DisplayMode(accountId, displayMode){
  if(!isOwner()){ toast('Admin permission required','error'); return; }
  if(APP_MODE === 'LIVE'){
    try{
      const { error } = await sb.from('mt5_accounts').update({ display_mode: displayMode }).eq('id', accountId);
      if(error){ toast('Update failed: '+error.message,'error'); return; }
    }catch(e){ toast('Update failed: '+e.message,'error'); return; }
  }
  const acct = S.mt5.find(a=>a.id===accountId);
  if(acct){ acct.displayMode = displayMode; acct.display_mode = displayMode; }
  toast(`Presentation set to ${displayMode}`,'success');
  audit('MT5_DISPLAY_MODE_SET', `override=${displayMode}`, 'mt5', accountId);
  renderMain();
}
async function toggleMaskAll(){
  if(!isOwner()){ toast('Admin permission required','error'); return; }
  const anyMasked = S.mt5.some(a => (a.displayMode || a.display_mode) !== 'AUTO');
  const target = anyMasked ? 'AUTO' : 'LIVE';
  if(APP_MODE === 'LIVE'){
    try{
      for(const a of S.mt5) await sb.from('mt5_accounts').update({ display_mode: target }).eq('id', a.id);
    }catch(e){ toast('Bulk update failed: '+e.message,'error'); return; }
  }
  S.mt5.forEach(a=>{ a.displayMode = target; a.display_mode = target; });
  toast(target === 'LIVE' ? 'All accounts now presented as LIVE' : 'Presentation restored','success');
  audit('MT5_MASK_ALL', `target=${target}`, 'mt5', 'bulk');
  renderMain();
}

    <div class="rw"><span class="rw-l">Email</span><span class="rw-v">${esc(S.profile.email)}</span></div>
    <div class="rw"><span class="rw-l">Role</span><span class="rw-v">${esc(ROLE_LABELS[S.profile.role]||S.profile.role)}</span></div>
    <div class="rw"><span class="rw-l">Mode</span><span class="rw-v">${APP_MODE}</span></div>
    <div class="mact">
      <button class="btn btn-g" onclick="closeModal();go('profile')">Edit Profile</button>
      ${isOwner()?`<button class="btn btn-gd" onclick="closeModal();openModeSwitch()">Switch Mode</button>`:''}
      <button class="btn btn-r" onclick="closeModal();logout()">${APP_MODE==='SIM'?'Exit SIM':'Sign Out'}</button>
    </div>
  `);
}
function openIntegrations(){
  openModal('Integrations', `
    <table style="width:100%"><tbody>
    ${Object.entries(S.integrations).map(([k,v])=>`<tr>
      <td class="mn">${esc(v.family)}</td><td>${esc(v.label)}</td>
      <td><span class="bdg ${v.status==='CONNECTED'?'gr':'rd'}">${esc(v.status)}</span></td>
    </tr>`).join('')}
    </tbody></table>
    <div class="mact"><button class="btn btn-p" onclick="closeModal()">Close</button></div>
  `);
}
function openInviteHelp(){
  const urlInvite = new URLSearchParams(location.search).get('invite');
  const sessInvite = sessionStorage.getItem('pending_invite');
  const active = urlInvite || sessInvite || '';

  openModal('Have an Invite?', `
    <p style="font-size:.82rem;line-height:1.7;color:var(--tx2);margin-bottom:12px">
      VICE OS is invite-only. Your invite code ${active ? 'is <strong style="color:var(--gdl)">already detected</strong>' : 'must be applied'} before you can create an account.
    </p>

    <div class="ff" style="margin-bottom:14px">
      <label for="invInput">Invite Code</label>
      <input id="invInput" value="${esc(active)}" placeholder="vice-xxxxxxxxxx">
    </div>

    <div class="mact" style="justify-content:flex-start;margin-top:0;padding-top:0;border-top:none">
      <button class="btn btn-g" onclick="applyInviteCode()">${active ? 'Confirm Code' : 'Apply Code'}</button>
    </div>

    <div class="divider" style="margin:18px 0 14px">THEN</div>

    <div class="ff" style="margin-bottom:8px">
      <label for="invEmail">Email</label>
      <input id="invEmail" type="email" placeholder="you@example.com">
    </div>
    <div class="ff" style="margin-bottom:8px">
      <label for="invPass">Password</label>
      <input id="invPass" type="password" placeholder="Minimum 8 characters">
    </div>
    <div class="ff" style="margin-bottom:14px">
      <label for="invConf">Confirm Password</label>
      <input id="invConf" type="password" placeholder="Repeat password">
    </div>
    <button class="btn btn-p btn-b" onclick="signUpWithEmailFromInvite()">Create Account with Email</button>

    <div class="divider" style="margin:14px 0">OR</div>

    <button class="btn btn-gd btn-b" onclick="closeModal();signInWithGoogle()">Continue with Google Instead</button>

    <div class="mact"><button class="btn btn-g" onclick="closeModal()">Cancel</button></div>
  `);
}
function applyInviteCode(){
  const c = $('invInput')?.value.trim(); if(!c) return;
  sessionStorage.setItem('pending_invite', c);
  closeModal();
  toast('Invite code saved','success');
  setTimeout(openInviteHelp, 200);
}

/* ═══ BOOT ═══ */
document.addEventListener('DOMContentLoaded', () => {
  applyModeUI();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }

  const params = new URLSearchParams(location.search);
  const inviteParam = params.get('invite');
  const welcome = params.get('welcome');
  const reset = params.get('reset');

  if(inviteParam) sessionStorage.setItem('pending_invite', inviteParam);
  if(welcome || reset) history.replaceState({}, '', location.pathname + (inviteParam ? '?invite=' + inviteParam : ''));

  if(APP_MODE === 'SIM' && !S.user){
    APP_MODE = 'LIVE';
    localStorage.setItem(MODE_KEY, 'LIVE');
  }

  const lf = $('loginForm');
  if(lf) lf.addEventListener('submit', e => { e.preventDefault(); login(); });

  sb.auth.getSession().then(({data})=>{
    if(data?.session?.user) onAuthenticated(data.session.user);
  }).catch(()=>{});

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN' && session?.user && !S.user) onAuthenticated(session.user);
    if(event === 'SIGNED_OUT'){ S.user = null; }
  });
});
</script>
</body>
</html>
