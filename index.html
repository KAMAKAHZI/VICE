  /* ─── CALLS ─── */
  async function startCall(peerId,mediaMode='voice'){
    if(!S.user) { toast('Sign in first','error'); return; }
    if(!broadcastChannel || !st.connected) { toast('Realtime not connected','error'); return; }
    if(currentCall) { toast('Already in a call','warn'); return; }
    const peer = st.profiles[peerId] || { name: peerId, role:'USER' };

    currentCall = {
      id: uuid(), peer: peerId, peerName: peer.name,
      dir:'out', state:'ringing', muted:false, mediaMode:mediaMode==='video'?'video':'voice',
    };
    pendingIceCandidates = [];

    const activeCall=currentCall;
    const requireActive=()=>{if(currentCall!==activeCall)throw Error('Call canceled');};
    activeCall.signalReady=false;activeCall.outgoingIce=[];
    try {
      const video=activeCall.mediaMode==='video';
      const height=Number(window.ViceComms?.prefs().camera)||1080;
      const acquired=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:video?{width:{ideal:Math.round(height*16/9)},height:{ideal:height},frameRate:{ideal:30,max:30}}:false});
      if(currentCall!==activeCall){acquired.getTracks().forEach(t=>t.stop());return;}
      localStream=acquired;
      const ice=await viceIceConfig();requireActive();
      pc = new RTCPeerConnection(ice);
      localStream.getAudioTracks().forEach(t=>pc.addTrack(t,localStream));
      const vt=localStream.getVideoTracks()[0];
      pc.addTransceiver(vt||'video',{direction:'sendrecv',...(vt?{streams:[localStream]}:{})});
      if(vt){activeCall.videoStream=new MediaStream([vt]);activeCall.videoKind='camera';}

      pc.onicecandidate = e => {
        if(e.candidate && currentCall){
          if(!activeCall.signalReady){activeCall.outgoingIce.push(e.candidate);return;}
          signal({ kind:'ice', callId: currentCall.id, to: peerId, candidate: e.candidate });
        }
      };
      pc.ontrack = e => {
        if(!currentCall)return;
        if(e.track.kind==='video'){
          const ownerCall=currentCall;ownerCall.remoteVideo=new MediaStream([e.track]);
          e.track.onunmute=()=>{if(currentCall===ownerCall)paintCallOverlay();};
          e.track.onended=()=>{if(currentCall===ownerCall){ownerCall.remoteVideo=null;paintCallOverlay();}};
          paintCallOverlay();
        }else{
          const audio=new Audio();audio.srcObject=new MediaStream([e.track]);audio.autoplay=true;
          audio.play().catch(()=>toast('Tap the call to enable audio playback','info'));
          currentCall.remoteAudio=audio;
        }
      };
      pc.onconnectionstatechange = () => {
        if(!pc || !currentCall) return;
        if(pc.connectionState === 'connected'){
          stopRingtone();clearTimeout(currentCall.ringTimeout);
          currentCall.state = 'live';
          callStartAt = callStartAt || Date.now();
          startTimer();
          paintCallOverlay();
        }
        if(pc.connectionState === 'failed'){
          endCall('lost');
        } else if(pc.connectionState === 'disconnected'){
          // Temporary network changes are recoverable; avoid dropping calls immediately.
          const activePc=pc,activeId=currentCall.id;
          setTimeout(()=>{
            if(pc===activePc&&currentCall?.id===activeId&&pc.connectionState==='disconnected')endCall('lost');
          },12000);
        }
      };

      const offer = await pc.createOffer();requireActive();
      await pc.setLocalDescription(offer);requireActive();

      await signal({ kind:'offer', callId: currentCall.id, to: peerId, sdp: offer, fromName: S.profile.name, mediaMode:activeCall.mediaMode });requireActive();
      activeCall.signalReady=true;
      for(const candidate of activeCall.outgoingIce)signal({kind:'ice',callId:activeCall.id,to:activeCall.peer,candidate});
      activeCall.outgoingIce=[];
      S.comms.calls.push({
        id: currentCall.id, peer: peer.name, peerId,
        type:activeCall.mediaMode, dir:'outgoing', at:Date.now(), state:'ringing',
      });
      paintCallOverlay();
    } catch(e){
      if(currentCall!==activeCall)return;
      toast('Cannot start call: ' + e.message, 'error');
      cleanup();
      paintCallOverlay();
    }
  }

  async function acceptCall(withVideo=true){
    if(!currentCall || currentCall.state !== 'incoming') return;
    currentCall.state='connecting';
    if(!withVideo)currentCall.mediaMode='voice';
    clearTimeout(currentCall.ringTimeout);
    stopRingtone();
    paintCallOverlay();
    const activeCall=currentCall;
    const requireActive=()=>{if(currentCall!==activeCall)throw Error('Call canceled');};
    activeCall.signalReady=false;activeCall.outgoingIce=[];
    try {
      const video=activeCall.mediaMode==='video';
      const height=Number(window.ViceComms?.prefs().camera)||1080;
      const acquired=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:video?{width:{ideal:Math.round(height*16/9)},height:{ideal:height},frameRate:{ideal:30,max:30}}:false});
      if(currentCall!==activeCall){acquired.getTracks().forEach(t=>t.stop());return;}
      localStream=acquired;
      const ice=await viceIceConfig();requireActive();
      pc = new RTCPeerConnection(ice);
      localStream.getAudioTracks().forEach(t=>pc.addTrack(t,localStream));

      pc.onicecandidate = e => {
        if(e.candidate && currentCall){
          if(!activeCall.signalReady){activeCall.outgoingIce.push(e.candidate);return;}
          signal({ kind:'ice', callId: currentCall.id, to: currentCall.peer, candidate: e.candidate });
        }
      };
      pc.ontrack = e => {
        if(!currentCall)return;
        if(e.track.kind==='video'){
          const ownerCall=currentCall;ownerCall.remoteVideo=new MediaStream([e.track]);
          e.track.onunmute=()=>{if(currentCall===ownerCall)paintCallOverlay();};
          e.track.onended=()=>{if(currentCall===ownerCall){ownerCall.remoteVideo=null;paintCallOverlay();}};
          paintCallOverlay();
        }else{
          const audio=new Audio();audio.srcObject=new MediaStream([e.track]);audio.autoplay=true;
          audio.play().catch(()=>toast('Tap the call to enable audio playback','info'));
          currentCall.remoteAudio=audio;
        }
      };
      pc.onconnectionstatechange = () => {
        if(!pc || !currentCall) return;
        if(pc.connectionState === 'connected'){
          stopRingtone();clearTimeout(currentCall.ringTimeout);
          currentCall.state = 'live';
          callStartAt = callStartAt || Date.now();
          startTimer();
          paintCallOverlay();
        }
        if(pc.connectionState === 'failed'){
          endCall('lost');
        } else if(pc.connectionState === 'disconnected'){
          // Temporary network changes are recoverable; avoid dropping calls immediately.
          const activePc=pc,activeId=currentCall.id;
          setTimeout(()=>{
            if(pc===activePc&&currentCall?.id===activeId&&pc.connectionState==='disconnected')endCall('lost');
          },12000);
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(currentCall.pendingOffer));requireActive();
      const vt=localStream.getVideoTracks()[0];
      const transceiver=pc.getTransceivers().find(t=>t.receiver?.track?.kind==='video');
      if(transceiver){transceiver.direction='sendrecv';if(vt){await transceiver.sender.replaceTrack(vt);requireActive();activeCall.videoStream=new MediaStream([vt]);activeCall.videoKind='camera';}}

      /* Flush buffered ICE candidates that arrived while ringing */
      const buffer = pendingIceCandidates.slice();
      pendingIceCandidates = [];
      for(const c of buffer){
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(_){}
      }

      const answer = await pc.createAnswer();requireActive();
      await pc.setLocalDescription(answer);requireActive();
      await signal({ kind:'answer', callId: currentCall.id, to: currentCall.peer, sdp: answer, mediaMode:activeCall.mediaMode });requireActive();
      activeCall.signalReady=true;
      for(const candidate of activeCall.outgoingIce)signal({kind:'ice',callId:activeCall.id,to:activeCall.peer,candidate});
      activeCall.outgoingIce=[];

      if(pc.connectionState!=='connected')currentCall.state = 'connecting';
      paintCallOverlay();
    } catch(e){
      if(currentCall!==activeCall)return;
      toast('Cannot accept: ' + e.message, 'error');
      declineCall();
    }
  }

  function declineCall(){
    if(!currentCall) return;
    signal({ kind:'decline', callId: currentCall.id, to: currentCall.peer });
    const rec = S.comms.calls.find(c => c.id === currentCall.id);
    if(rec) rec.state = 'declined';
    cleanup();
    paintCallOverlay();
  }

  function endCall(reason){
    if(!currentCall) return;
    signal({ kind:'end', callId: currentCall.id, to: currentCall.peer });
    const rec = S.comms.calls.find(c => c.id === currentCall.id);
    if(rec) rec.state = reason || 'ended';
    cleanup();
    paintCallOverlay();
  }

  function toggleMute(){
    if(!localStream || !currentCall) return;
    const tracks = localStream.getAudioTracks();
    currentCall.muted = !currentCall.muted;
    tracks.forEach(t => t.enabled = !currentCall.muted);
    void signal({kind:'media',callId:currentCall.id,to:currentCall.peer,muted:currentCall.muted,videoKind:currentCall.videoKind||null});
    paintCallOverlay();
  }

  async function captureScreen(){
    if(!navigator.mediaDevices?.getDisplayMedia)throw Error('Screen sharing is not supported in this browser. Join from a supported desktop browser.');
    const height=Number(window.ViceComms?.prefs().screen)||1080;
    return navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:Math.round(height*16/9),max:3840},height:{ideal:height,max:2160},frameRate:{ideal:30,max:30}},audio:false});
  }
  let mediaBusy=false;
  async function toggleVideoSource(kind){
    if(mediaBusy)return;
    if(!pc||!currentCall||pc.connectionState!=='connected')throw Error('Connect a call first');
    const call=currentCall,activePc=pc;
    const sender=pc.getTransceivers().find(t=>t.receiver?.track?.kind==='video')?.sender;
    if(!sender)throw Error('The other client must update before video is available');
    mediaBusy=true;
    try{
      if(call.videoKind===kind){
        await sender.replaceTrack(null);
        call.videoStream?.getTracks().forEach(t=>t.stop());call.videoStream=null;call.videoKind=null;
      }else{
        const stream=kind==='screen'
          ? await captureScreen()
          : await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:Number(window.ViceComms?.prefs().camera)||1080},frameRate:{ideal:30,max:30}},audio:false});
        if(currentCall!==call||pc!==activePc){stream.getTracks().forEach(t=>t.stop());return;}
        const track=stream.getVideoTracks()[0];
        if(!track){stream.getTracks().forEach(t=>t.stop());throw Error('No video track provided');}
        try{await sender.replaceTrack(track);}catch(e){stream.getTracks().forEach(t=>t.stop());throw e;}
        call.videoStream?.getTracks().forEach(t=>t.stop());call.videoStream=stream;call.videoKind=kind;
        try{const params=sender.getParameters?.();if(params?.encodings?.length){params.encodings.forEach(e=>{e.maxBitrate=kind==='screen'&&window.ViceComms?.prefs().screen==='2160'?16000000:6000000;e.maxFramerate=30;});await sender.setParameters(params);}}catch(e){console.warn('Video bitrate preference unavailable:',e.message);}
        track.contentHint=kind==='screen'?'detail':'motion';
        track.onended=()=>{
          if(currentCall===call&&call.videoStream===stream){
            void sender.replaceTrack(null).catch(e=>console.warn('Video stop:',e));
            call.videoStream=null;call.videoKind=null;void signal({kind:'media',callId:call.id,to:call.peer,muted:call.muted,videoKind:null});paintCallOverlay();
          }
        };
      }
      if(currentCall===call){void signal({kind:'media',callId:call.id,to:call.peer,muted:call.muted,videoKind:call.videoKind||null});paintCallOverlay();}
    }finally{mediaBusy=false;}
  }

  function signal(payload){
    const owner=S.user?.id;
    if(!owner)return;
    const row={id:uuid(),sender_id:owner,peer_id:payload.to,sender_name:S.profile.name||'Member',
      text:'VICE_CALL_V1:'+JSON.stringify({...payload,from:owner,at:Date.now()})};
    // persist validates size and waits for database confirmation. The recipient's
    // RLS-scoped change stream supplies the authenticated sender identity.
    return persist('dm_messages',row).then(()=>true).catch(e=>{
      toast('Call signaling failed: '+e.message,'error');
      if(currentCall?.id===payload.callId){cleanup();paintCallOverlay();}
      return false;
    });
  }
  function receiveCallRow(row){
    if(!S.user||row.peer_id!==S.user.id||row.sender_id===S.user.id)return;
    try{
      const payload=JSON.parse(String(row.text).slice('VICE_CALL_V1:'.length));
      const age=Date.now()-new Date(row.created_at).getTime();
      if(!Number.isFinite(age)||age< -10000||age>90000)return;
      if(!['offer','answer','ice','decline','end','media'].includes(payload.kind)||typeof payload.callId!=='string'||payload.callId.length>80)return;
      void handleCallSignal({...payload,from:row.sender_id,to:row.peer_id}).catch(e=>toast('Call connection error: '+e.message,'error'));
    }catch(e){console.warn('Invalid call signal',e.message);}
  }

  async function handleCallSignal(payload){
    if(!payload || payload.to !== S.user?.id) return;
    if(payload.kind!=='offer'&&(!currentCall||currentCall.id!==payload.callId||currentCall.peer!==payload.from))return;

    if(payload.kind === 'offer'){
      if(currentCall?.id===payload.callId&&currentCall.peer===payload.from)return;
      if(currentCall){
        signal({ kind:'decline', callId: payload.callId, to: payload.from });
        return;
      }
      pendingIceCandidates = [];
      currentCall = {
        id: payload.callId,
        peer: payload.from,
        peerName: payload.fromName || (st.profiles[payload.from]?.name) || 'Unknown',
        dir:'in', state:'incoming', pendingOffer: payload.sdp, muted:false, mediaMode:payload.mediaMode==='video'?'video':'voice',
      };
      S.comms.calls.push({
        id: payload.callId, peer: currentCall.peerName, peerId: payload.from,
        type:currentCall.mediaMode, dir:'incoming', at:Date.now(), state:'incoming',
      });
      playRingtone();
      const pending=currentCall;pending.ringTimeout=setTimeout(()=>{if(currentCall===pending&&pending.state==='incoming'){recordMissed(pending);endCall('missed');}},60000);
      paintCallOverlay();
    }
    else if(payload.kind === 'answer'){
      stopRingtone();
      if(pc && currentCall && currentCall.id === payload.callId){
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
          const buffer = pendingIceCandidates.slice();
          pendingIceCandidates = [];
          for(const c of buffer){
            try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(_){}
          }
          if(pc.connectionState!=='connected')currentCall.state = 'connecting';
          paintCallOverlay();
        } catch(e){
          console.warn('Failed to set remote description (answer)', e);
        }
      }
    }
    else if(payload.kind === 'media'){
      currentCall.remoteMuted=payload.muted===true;currentCall.remoteVideoKind=['camera','screen'].includes(payload.videoKind)?payload.videoKind:null;paintCallOverlay();
    }
    else if(payload.kind === 'ice'){
      if(pc?.remoteDescription && currentCall && currentCall.id === payload.callId){
        try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); }
        catch(_){}
      } else {
        if(pendingIceCandidates.length<64)pendingIceCandidates.push(payload.candidate);
      }
    }
    else if(payload.kind === 'decline'){
      if(currentCall && currentCall.id === payload.callId){
        const rec = S.comms.calls.find(c => c.id === payload.callId);
        if(rec) rec.state = 'declined';
        const name = currentCall.peerName;
        cleanup();
        paintCallOverlay();
        toast(`${name} declined`, 'warn');
      }
    }
    else if(payload.kind === 'end'){
      if(currentCall && currentCall.id === payload.callId){
        if(currentCall.state==='incoming')recordMissed(currentCall);
        const rec = S.comms.calls.find(c => c.id === payload.callId);
        if(rec&&rec.state!=='missed') rec.state = 'ended';
        cleanup();
        paintCallOverlay();
      }
    }
  }

  function recordMissed(call){
    window.ViceComms?.add({id:'call:'+call.id,kind:'missed',title:call.peerName,body:'Missed '+(call.mediaMode||'voice')+' call',route:{receiverId:S.user?.id,peerId:call.peer},at:Date.now()});
    const rec=S.comms.calls.find(c=>c.id===call.id);if(rec)rec.state='missed';
  }
  function cleanup(){
    clearTimeout(currentCall?.ringTimeout);
    stopRingtone();
    stopTimer();
    if(pc){ try { pc.close(); } catch(_){} pc = null; }
    if(localStream){
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    if(currentCall?.videoStream)currentCall.videoStream.getTracks().forEach(t=>t.stop());
    if(currentCall?.remoteAudio){
      try { currentCall.remoteAudio.pause(); } catch(_){}
    }
    currentCall = null;
    callStartAt = 0;
    pendingIceCandidates = [];
  }

  /* ─── ringtone / timer (delegate to Notify) ─── */
  function playRingtone(){
    try { Notify.callStarted(currentCall?.peerName || 'Unknown'); } catch(_){}
  }
  function stopRingtone(){
    try { Notify.callEnded(); } catch(_){}
  }
  function startTimer(){
    stopTimer();
    callTimer = setInterval(() => {
      const timer=document.querySelector('#call-root .call-timer');
      if(timer&&callStartAt){const seconds=Math.floor((Date.now()-callStartAt)/1000);timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
    },1000);
  }
  function stopTimer(){
    clearInterval(callTimer);
    callTimer = null;
  }

  /* ─── UI ─── */
  function paintRealtimeBadge(){
    const b = $('rtBadge');
    if(!b) return;
    if(S.user && S.user.id !== 'sim-user'){
      b.hidden = false;
      b.classList.toggle('off', !st.connected);
      const l = $('rtLabel');
      if(l) l.textContent = st.connected ? `${st.online.size} online` : 'offline';
    } else {
      b.hidden = true;
    }
  }

  function paintCallOverlay(){
    const root = $('call-root');
    if(!root) return;
    if(!currentCall){ root.classList.remove('on'); root.innerHTML = ''; if(S.tab==='comms'&&S.comms.tab==='calls')renderMain();return; }
    root.classList.add('on');
    const c = currentCall;
    const initial = (c.peerName || '?').replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase() || '?';
    const isLive = c.state === 'live';
    const statusText = c.state === 'ringing'
      ? (c.dir === 'out' ? 'Calling…' : 'Ringing…')
      : c.state === 'incoming'
        ? 'Incoming '+(c.mediaMode==='video'?'video':'voice')+' call'
        : isLive
          ? 'Connected'
          : c.state==='connecting'?'Connecting…':'Call ended';
    const statusCls = isLive ? 'live' : c.state === 'ringing' || c.state === 'incoming' ? 'ring' : 'end';
    const elapsed = isLive && callStartAt ? Math.floor((Date.now() - callStartAt) / 1000) : 0;
    const mm = String(Math.floor(elapsed / 60)).padStart(2,'0');
    const ss = String(elapsed % 60).padStart(2,'0');
    root.innerHTML = `
      <div class="call-card ${c.remoteVideo||c.videoStream?'has-video':''}" role="dialog" aria-modal="true" aria-label="Call with ${esc(c.peerName)}">
        <div class="call-brand">VICE<em>4X</em><span>MEMBER COMMUNICATIONS</span></div>
        ${window.ViceComms?ViceComms.avatar(st.profiles[c.peer]||{name:c.peerName},'call-av'):`<div class="call-av">${esc(initial)}</div>`}
        <div class="call-name">${esc(c.peerName)}</div>
        <div class="vc-video-stage" ${c.remoteVideo||c.videoStream?'':'hidden'}>
          ${c.remoteVideo?'<video id="viceRemoteVideo" autoplay playsinline muted aria-label="Remote video"></video>':''}
          ${c.videoStream?'<video id="viceLocalVideo" autoplay playsinline muted aria-label="Your preview"></video>':''}
        </div>
        ${isLive?`<div class="vc-media-controls"><button class="btn btn-g" data-act="call-camera" aria-pressed="${c.videoKind==='camera'}">${c.videoKind==='camera'?'Stop video':'Start video'}</button><button class="btn btn-g" data-act="call-screen" aria-pressed="${c.videoKind==='screen'}">${c.videoKind==='screen'?'Stop sharing':'Share screen'}</button><button class="btn btn-g" data-act="call-audio-play">Enable audio</button></div>`:''}
        ${c.videoKind==='screen'?`<p class="meta">Sharing ${c.videoStream?.getVideoTracks()[0]?.getSettings?.().width||'—'} × ${c.videoStream?.getVideoTracks()[0]?.getSettings?.().height||'—'} capture · camera paused while sharing</p>`:''}
        ${c.muted?'<div class="vc-muted-badge" role="status">✕ Microphone muted</div>':''}
        ${c.remoteMuted?'<div class="meta" role="status">Their microphone is muted</div>':''}
        <div class="call-status ${statusCls}">${esc(statusText)}</div>
        ${isLive ? `<div class="call-timer">${mm}:${ss}</div>` : ''}
        <div class="call-actions">
          ${c.state === 'incoming' ? `
            <button class="call-btn decline" data-act="call-decline" title="Decline" aria-label="Decline call">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg>
            </button>
            <button class="call-btn accept" ${window.ViceComms?.prefs().answer==='slide'?'hidden':''} data-act="call-accept" title="Accept" aria-label="Accept call">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
          ` : `
            <button class="call-btn mute ${c.muted ? 'off' : ''}" data-act="call-mute" title="${c.muted ? 'Unmute' : 'Mute'}" aria-label="${c.muted ? 'Unmute microphone' : 'Mute microphone'}" aria-pressed="${c.muted}">
              <svg viewBox="0 0 24 24" fill="currentColor">${c.muted?'<path d="M3 3L21 21" stroke="currentColor" stroke-width="2.5"/>':''}<path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
            </button>
            <button class="call-btn decline" data-act="call-end" title="End call" aria-label="End call">
              <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" transform="rotate(135 12 12)"/></svg>
            </button>
          `}
        </div>
        ${c.state==='incoming'&&window.ViceComms?.prefs().answer==='slide'?'<label class="vc-answer-slider">Slide to answer<input id="vcAnswerSlide" type="range" min="0" max="100" value="0" aria-label="Slide to answer call" aria-valuetext="Move all the way right to answer"></label><button class="btn btn-g vc-keyboard-answer" data-act="call-accept">Answer with keyboard</button>':''}
        ${c.state==='incoming'&&c.mediaMode==='video'?'<button class="btn btn-g" data-act="call-accept-audio">Answer with audio only</button>':''}
        <p class="call-control-labels">${c.state==='incoming'?'Decline · Answer':'Microphone · End call'}</p>
        <p class="call-device-note">Audio uses your selected device. Screen sharing depends on browser support.</p>
      </div>
    `;
    const slider=$('vcAnswerSlide');if(slider)slider.onchange=()=>{if(Number(slider.value)>=95)void acceptCall();else slider.value='0';};
    if($('viceRemoteVideo'))$('viceRemoteVideo').srcObject=c.remoteVideo;
    if($('viceLocalVideo'))$('viceLocalVideo').srcObject=c.videoStream;
  }

  return {
    state: st,
    connect, disconnect,
    send, sendDm, loadHistory, loadDmHistory,
    startCall, acceptCall, declineCall, endCall, toggleMute, toggleVideoSource,
    isOnline: id => st.online.has(id),
    profileOf: id => st.profiles[id] || null,
    current: () => currentCall,
    status: () => statusChoice,
    chooseStatus,
    onMessage: h => handlers.message.push(h),
    onPresence: h => handlers.presence.push(h),
    onCall: h => handlers.call.push(h),
    emit(kind, payload, toUser){
      if(!broadcastChannel || !st.connected) return;
      try {
        broadcastChannel.send({
          type:'broadcast',
          event:'notify',
          payload:{ kind, to: toUser || null, from: S.user?.id, at: Date.now(), ...payload },
        });
      } catch(_){}
    },
    refresh: loadProfiles, publishProfile:broadcastProfile, repaintCall:paintCallOverlay,
  };
})();
window.Realtime = Realtime;

/* Notifications are opt-in; browsers require a direct user gesture. */
/* ═══════════════════════════════════════════════════════════════════
   NOTIFICATIONS — ringtone + haptic + OS-level notification
   Used by Realtime (incoming messages and calls) and by the
   distribution/assignment broadcast handlers.
   ═══════════════════════════════════════════════════════════════════ */

const Notify = (() => {
  let audioCtx=null, ringTimer=null, pulseTimer=null, ringEpoch=0, registration=null, bannerTimer=null, pendingRoute=null;
  const soundEnabled=()=>window.ViceComms?ViceComms.prefs().sound:true;
  const quiet=()=>typeof Realtime!=='undefined'&&Realtime.status()==='DND';
  function getCtx(){
    if(!audioCtx)try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch{}
    return audioCtx;
  }
  function unlock(){const ctx=getCtx();if(ctx?.state==='suspended')ctx.resume().catch(()=>{});}
  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('keydown',unlock);
  function beep({freq=880,dur=.14,gain=.12,type='sine'}={}){
    if(!soundEnabled()||quiet()||['connecting','live'].includes(Realtime.current()?.state))return;
    const ctx=getCtx();if(!ctx||ctx.state!=='running')return;
    try{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(gain,ctx.currentTime+.015);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);
      o.onended=()=>{o.disconnect();g.disconnect();};o.start();o.stop(ctx.currentTime+dur+.02);
    }catch(e){console.warn('Call audio unavailable:',e.message);}
  }
  function haptic(pattern=[40]){
    if(!quiet()&&window.ViceComms?.prefs().haptics!==false&&!['connecting','live'].includes(Realtime.current()?.state))try{navigator.vibrate?.(pattern);}catch{}
    document.querySelectorAll('#call-root .call-av,.rt-badge').forEach(el=>{
      el.classList.remove('pulse-alert');void el.offsetWidth;el.classList.add('pulse-alert');
    });
  }
  function stopCallRingtone(){ringEpoch++;clearInterval(ringTimer);clearTimeout(pulseTimer);ringTimer=null;pulseTimer=null;try{navigator.vibrate?.(0);}catch{}}
  function startCallRingtone(){
    stopCallRingtone();const epoch=ringEpoch;
    const pulse=()=>{if(epoch!==ringEpoch)return;if(Realtime.current()?.state!=='incoming'){stopCallRingtone();return;}beep({freq:660,dur:.28,gain:.12,type:'triangle'});haptic([180]);};
    const ring=()=>{pulse();pulseTimer=setTimeout(pulse,440);};ring();ringTimer=setInterval(ring,2200);
  }
  function validRoute(route){
    if(!route||route.receiverId!==S.user?.id)return false;
    if(route.peerId&&!/^[a-f0-9-]{36}$/i.test(route.peerId))return false;
    if(route.channelId&&!S.comms.channels.some(c=>c.id===route.channelId))return false;
    return true;
  }
  function navigate(route){
    if(!S.user){pendingRoute=route;return;}
    if(!validRoute(route))return;
    window.focus();
    if(route.kind==='call'&&Realtime.current()){document.getElementById('call-root')?.focus();return;}
    if(route.kind==='distributions'){go('distributions');return;}
    S.comms.tab='chats';S.comms.activeDm=route.peerId||null;S.comms.activeChannel=route.channelId||null;go('comms');
    if(route.peerId){S.comms.unread['dm:'+route.peerId]=0;void Realtime.loadDmHistory(route.peerId).then(()=>{if(validRoute(route)&&S.comms.activeDm===route.peerId)renderMain();});}
    if(route.channelId){S.comms.unread[route.channelId]=0;void Realtime.loadHistory(route.channelId).then(()=>{if(validRoute(route)&&S.comms.activeChannel===route.channelId)renderMain();});}
    document.getElementById('vice4x-alert')?.remove();
  }
  function routeFromTag(tag){return {receiverId:S.user?.id,peerId:tag?.startsWith('dm:')?tag.slice(3):null,channelId:tag?.startsWith('ch:')?tag.slice(3):null};}
  function inApp(title,body,route,click){
    document.getElementById('vice4x-alert')?.remove();clearTimeout(bannerTimer);
    const host=document.createElement('aside');host.id='vice4x-alert';host.className='vice4x-alert';host.setAttribute('aria-live','polite');
    const button=document.createElement('button');button.className='vice4x-alert-open';
    const heading=document.createElement('strong');heading.textContent=title;
    const detail=document.createElement('span');detail.textContent=String(body||'New message').slice(0,120);
    button.append(heading,detail);button.onclick=()=>{if(validRoute(route)){if(click)click();else navigate(route);}host.remove();};
    const close=document.createElement('button');close.className='vice4x-alert-close';close.textContent='×';close.setAttribute('aria-label','Dismiss notification');close.onclick=()=>host.remove();
    host.append(button,close);document.body.append(host);bannerTimer=setTimeout(()=>host.remove(),10000);
  }
  async function systemNotify(title,body,route,options={}){
    if(!document.hidden||!('Notification'in window)||Notification.permission!=='granted')return;
    const opts={body,tag:options.tag||'vice4x',data:{route},requireInteraction:!!options.requireInteraction};
    try{
      const reg=registration||await navigator.serviceWorker?.getRegistration();
      if(reg?.active){await reg.showNotification(title,opts);return;}
      const n=new Notification(title,opts);n.onclick=()=>{navigate(route);n.close();};
    }catch(e){console.warn('Device notification unavailable; in-site alerts remain active:',e.message);}
  }
  async function request(){
    unlock();beep({freq:990,dur:.1});
    if(!('Notification'in window)){toast('In-site sound and message alerts enabled. Device notifications are unavailable in this browser.','info');return;}
    try{const state=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
      toast(state==='granted'?'Device and in-site alerts enabled':state==='denied'?'In-site alerts enabled. Device notifications are blocked in browser settings.':'In-site alerts enabled; device permission not granted',state==='granted'?'success':'info');
    }catch(e){toast('In-site alerts enabled. Add VICE4X to your Home Screen for supported iPhone device notifications.','info');}
  }
  if('serviceWorker'in navigator&&window.isSecureContext){
    navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(r=>{registration=r;return r.update();}).catch(e=>console.warn('Alert service worker:',e.message));
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='VICE4X_NOTIFICATION_OPEN')navigate(e.data.route);});
  }
  return {
    message(senderName,text,meta={}){
      const route=meta.route||routeFromTag(meta.tag);
      if(!quiet()){beep();haptic([20,60,20]);}
      const item={id:meta.id,title:senderName,body:text,route,at:meta.at,kind:'message'};
      const presentation=window.ViceComms?.shown(item)||{title:senderName,body:'New message'};
      window.ViceComms?.add(item);
      if(!window.ViceComms||!ViceComms.prefs().ticker)inApp(presentation.title,presentation.body,route,()=>navigate(route));
      const device=window.ViceComms?.shown(item,true)||{title:'VICE4X',body:'New message'};
      void systemNotify('VICE4X · '+device.title,device.body,route,{tag:meta.tag});
    },
    callStarted(peerName){const c=Realtime.current();if(c?.dir==='out'||c?.state!=='incoming')return;startCallRingtone();
      if(window.ViceComms?.prefs().privacy==='hidden')peerName='Member';
      void systemNotify('VICE4X · '+peerName,'Incoming call · open to answer',{receiverId:S.user?.id,kind:'call'}, {tag:'vice4x-call',requireInteraction:true});},
    callEnded(){stopCallRingtone();registration?.getNotifications({tag:'vice4x-call'}).then(list=>list.forEach(n=>n.close())).catch(()=>{});},
    clear(){stopCallRingtone();pendingRoute=null;clearTimeout(bannerTimer);document.getElementById('vice4x-alert')?.remove();registration?.getNotifications().then(list=>list.forEach(n=>n.close())).catch(()=>{});},
    resumeRoute(){
      void window.ViceComms?.restoreInbox();
      if(pendingRoute){const r=pendingRoute;pendingRoute=null;navigate(r);}
      const q=new URLSearchParams(location.search);if(q.has('alert')){
        try{navigate(JSON.parse(q.get('alert')));}catch{}q.delete('alert');history.replaceState(null,'',location.pathname+(q.size?'?'+q:'')+location.hash);
      }
    },
    haptic,beep,request,navigate,startCallRingtone,stopCallRingtone
  };
})();
window.Notify=Notify;


/* ═══════════════════════════════════════════════════════════════════
   MESSAGE ENCRYPTION — AES-GCM with HKDF per-thread keys
   Encrypts text before it reaches Supabase. Decrypts on read.
   ═══════════════════════════════════════════════════════════════════ */

const MsgCrypto = (() => {
  const PROJ_SALT = new TextEncoder().encode('vice-os-v1-' + COMMS_CRYPTO_VERSION);
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const toB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function deriveThreadKey(threadId){
    const material = enc.encode(`vice-os-msg|${threadId}|${COMMS_CRYPTO_VERSION}`);
    const base = await crypto.subtle.importKey('raw', material, { name:'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: PROJ_SALT, iterations: 50000, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']
    );
  }

  const keyCache = new Map();
  async function getKey(threadId){
    if(keyCache.has(threadId)) return keyCache.get(threadId);
    const k = await deriveThreadKey(threadId);
    keyCache.set(threadId, k);
    if(keyCache.size > 50) keyCache.delete(keyCache.keys().next().value);
    return k;
  }

  const PREFIX = 'ENCv1:';

  async function encrypt(threadId, plaintext){
    try {
      const key = await getKey(threadId);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(String(plaintext)));
      return PREFIX + toB64(iv) + ':' + toB64(ct);
    } catch(error) { throw new Error('Message encryption failed: ' + (error?.message || 'unknown error')); }
  }

  async function decrypt(threadId, ciphertext){
    const s = String(ciphertext || '');
    if(!s.startsWith(PREFIX)) return s;
    try {

      notify();
    },
    stressNow() {
      const ds = dataset();
      if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try {
        const a = {
          data:ds.bars, features:ds.features,
          strategyId:st.strategy,
          costs:st.costs || defaultCosts(ds),
          seed:st.seed
        };
        st.stress = stress(a);
        record('stress (synthetic)', ds, a, null, { scenarios:st.stress.scenarios });
      } catch(e) { st.msg = e.message; }
      notify();
    },
    champion() {
      const ds = dataset();
      if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try {
        const a = {
          data:ds.bars, features:ds.features,
          strategyId:st.strategy,
          costs:st.costs || defaultCosts(ds),
          seed:st.seed
        };
        st.cc = championChallenger(a, st.championParams);
        if (st.cc.promoted) st.championParams = st.cc.promoted.params;
        record('champion-challenger', ds, a, null, { decision:st.cc.decision });
      } catch(e) { st.msg = e.message; }
      notify();
    },
    reproduce(id) {
      const rec = st.ledger.find(x => x.id === id), ds = dataset();
      if (!rec || !rec.resultHash) st.repro[id] = 'nothing to compare';
      else if (!ds) st.repro[id] = `load ${rec.dataset.label} to reproduce`;
      else {
        const r = backtest({
          data:ds.bars, features:ds.features,
          strategyId:rec.strategyId,
          params:rec.params, costs:rec.costs, seed:rec.seed,
        });
        st.repro[id] = hashResult(r) === rec.resultHash ? 'IDENTICAL' : 'DIFFERENT';
      }
      notify();
    },
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   VICE LINK — live MT5 bridge connection (WebSocket client)
   ═══════════════════════════════════════════════════════════════════ */

const Link = (() => {
  const st = S.link;
  const symbols = new Map();
  const series = new Map();
  const loading = new Set();
  const errors = new Map();
  const quotes = new Map();
  const reqs = new Map();
  let ws = null, retry = 0, timer = null, seq = 0, sub = null;
  // Link settings and account metadata are scoped to the signed-in VICE user.
  // Legacy unscoped keys are intentionally not loaded, preventing another
  // member on this browser from inheriting a prior member's connection.
  const accts=[];
  const memberKey=(stem)=>APP_MODE==='LIVE'&&S.user?.id?stem+':'+S.user.id:null;
  function loadAccts(){
    accts.length=0;
    const key=memberKey('vice-mt5-accounts');if(!key)return;
    try{
      const list=JSON.parse(localStorage.getItem(key)||'[]');
      if(Array.isArray(list))accts.push(...list.slice(0,60).filter(a=>a&&a.server&&a.login).map(a=>({
        id:String(a.id||uuid()),broker:String(a.broker||''),server:String(a.server),
        login:String(a.login),mode:String(a.mode||'DEMO'),label:String(a.label||''),
        addedAt:a.addedAt,verified:false,equity:null,balance:null,currency:null
      })));
    }catch(_){accts.length=0;}
  }
  const persistAccts=()=>{
    const key=memberKey('vice-mt5-accounts');if(!key)return;
    try{localStorage.setItem(key,JSON.stringify(accts.map(({id,broker,server,login,mode,label,addedAt})=>
      ({id,broker,server,login,mode,label,addedAt}))));}catch(_){ }
  };
  // Optional Windows connector: only account metadata is collected here.
  // Credentials must not traverse an arbitrary browser-configured WebSocket.


  const notify = () => { try { renderMain(); } catch(_) {} };
  const skey = (src, sym, tf) => `${src}|${sym}|${tf}`;
  function config() {
    const h = new URLSearchParams(location.hash.replace(/^#/,''));
    let saved = {};
    try { const key=memberKey('vice-link');saved=key?JSON.parse(localStorage.getItem(key)||'{}'):{}; } catch(_) { saved = {}; }
    st.url = h.get('link') || saved.url || '';
    st.token = saved.token || '';
    const startErr = h.get('linkerr') || '';
    if (startErr) st.msg = startErr;
    if (h.get('link') || h.get('token') || h.get('linkerr')) {
      if (h.get('link') || h.get('token')) {
        try {
          const key=memberKey('vice-link');if(key)localStorage.setItem(key,JSON.stringify({url:st.url,token:st.token}));
        } catch(_) {}
      }
      try { history.replaceState(null, '', location.pathname + location.search); } catch(_) {}
    }
  }
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const schedule = () => {
    clearTimeout(timer);
    retry = Math.min(30000, retry ? retry * 2 : 1500);
    timer = setTimeout(connect, retry);
  };
  function connect() {
    clearTimeout(timer);
    if (st._stopped||APP_MODE!=='LIVE'||!S.user?.id)return;
    if (!st.url) { st.status = 'off'; notify(); return; }
    if(location.protocol==='https:' && !st.url.startsWith('wss://')) { st.status='error'; st.msg='HTTPS VICE4X requires a WSS bridge behind TLS.'; notify(); return; }
    if (typeof WebSocket === 'undefined') { st.status = 'off'; notify(); return; }
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    st.status = 'connecting';
    notify();
    try { ws = new WebSocket(st.url); }
    catch(e) { ws = null; st.status = 'error'; st.msg = 'Could not reach VICE Link.'; schedule(); notify(); return; }
    const me = ws;
    ws.onopen = () => {
      if(ws!==me||st._stopped||!S.user?.id){try{me.close()}catch(_){}return;}
      if (st.token) send({ t:'auth', token:st.token });
      else { st.status = 'pair'; notify(); }
    };
    ws.onmessage = e => {
      if(ws!==me||st._stopped||APP_MODE!=='LIVE'||!S.user?.id)return;
      let m;
      try { m = JSON.parse(e.data); } catch(_) { return; }
      onMsg(m);
    };
    ws.onclose = () => {
      if (ws !== me) return;
      ws = null;
      if (st.status !== 'pair') {
        st.status = 'error';
        st.msg = 'Lost the connection to VICE Link. Reconnecting…';
      }
      for (const r of reqs.values()) r.reject(new Error('Disconnected'));
      reqs.clear();
      loading.clear();
      schedule();
      notify();
    };
    ws.onerror = () => {};
  }
  function ready(m) {
    st.status = 'live';
    if(S.integrations?.['broker.mt5']) S.integrations['broker.mt5'].status='CONNECTED';
    st.msg = '';
    st.admin = !!m.admin;
    st.device = m.device || '';
    retry = 0;
    send({ t:'sources' });
    send({ t:'portfolio', on:true });
    send({ t:'audit' });
    if (st.admin) send({ t:'admin' });
    if (sub) send({ t:'sub', src:sub.src, s:sub.s, tf:sub.tf });
    notify();
  }
  function onMsg(m) {
    switch (m.t) {
      case 'authed': ready(m); break;
      case 'paired':
        st.token = m.token;
        try {
          const key=memberKey('vice-link');if(key)localStorage.setItem(key,JSON.stringify({url:st.url,token:st.token}));
        } catch(_) {}
        ready(m);
        break;
      case 'error':
        if (m.re === 'auth') {
          st.token = '';
          try {
            const key=memberKey('vice-link');if(key)localStorage.setItem(key,JSON.stringify({url:st.url,token:''}));
          } catch(_) {}
          st.status = 'pair';
          st.msg = m.msg;
          notify();
          break;
        }
        if (m.id != null && reqs.has(m.id)) {
          reqs.get(m.id).reject(new Error(m.msg));
          reqs.delete(m.id);
          break;
        }
        st.msg = m.msg;
        notify();
        break;
      case 'sources':
        st.sources = m.list || [];
        for (const x of st.sources) {
          if (x.online && x.symbolsReady && !symbols.has(x.id)) send({ t:'symbols', src:x.id });
        }
        notify();
        break;
      case 'symbols':
        symbols.set(m.src, m.list || []);
        notify();
        break;
      case 'mt5-verify':
      case 'mt5-account':
      case 'history': {
        const r = reqs.get(m.id);
        if (r) { reqs.delete(m.id); r.resolve(m); }
        break;
      }
      case 'bar': applyBar(m); break;
      case 'tick':
        quotes.set(`${m.src}|${m.s}`, { b:m.b, a:m.a, ms:m.ms, at:Date.now() });
        notify();
        break;
      case 'portfolio':
        st.portfolio = m;
        st.portfolioAt = Date.now();
        notify();
        break;
      case 'audit': st.audit = m; notify(); break;
      case 'admin': st.adminInfo = m; notify(); break;
      case 'pairing':
        if (st.adminInfo) {
          st.adminInfo.pairingCode = m.code;
          st.adminInfo.pairingExpires = m.expires;
        }
        notify();
        break;
      case 'revoked':
        send({ t:'admin' });
        break;
    }
  }
  function request(o) {
    return new Promise((resolve, reject) => {
      if (!ws || ws.readyState !== 1) {
        reject(new Error('Not connected to VICE Link'));
        return;
      }
      const id = ++seq;
      reqs.set(id, { resolve, reject });
      send({ ...o, id });
      setTimeout(() => {
        if (reqs.has(id)) { reqs.delete(id); reject(new Error('VICE Link did not answer in time')); }
      }, 30000);
    });
  }
  function applyBar(m) {
    const k = skey(m.src, m.s, m.tf), sr = series.get(k);
    if (!sr) return;
    const b = { t:m.bar[0], o:m.bar[1], h:m.bar[2], l:m.bar[3], c:m.bar[4], v:0 };
    const bars = sr.bars, last = bars[bars.length-1];
    if (!last || b.t > last.t) {
      bars.push(b);
      if (bars.length > 60000) bars.shift();
    } else {
      for (let i = bars.length - 1; i >= Math.max(0, bars.length - 64); i--) {
        if (bars[i].t === b.t) { bars[i] = b; break; }
      }
    }
    sr.rev++;
    notify();
  }
  function subscribe(src, sym, tf) {
    const key = skey(src, sym, tf);
    if (sub && sub.key === key) return;
    if (sub) send({ t:'unsub', src:sub.src, s:sub.s, tf:sub.tf });
    sub = { src, s:sym, tf, key };
    send({ t:'sub', src, s:sym, tf });
  }
  function ensure(src, sym, tf) {
    const key = skey(src, sym, tf);
    if (series.has(key) || loading.has(key) || st.status !== 'live') return;
    loading.add(key);
    errors.delete(key);
    request({ t:'history', src, s:sym, tf, n:3000 }).then(m => {
      series.set(key, {
        src, sym, tf, digits:m.digits || 2,
        bars:(m.bars || []).map(b => ({ t:b[0], o:b[1], h:b[2], l:b[3], c:b[4], v:0 })),
        rev:0,
      });
      if (series.size > 8) series.delete(series.keys().next().value);
      loading.delete(key);
      notify();
    }).catch(e => { loading.delete(key); errors.set(key, e.message); notify(); });
  }
  const api = {
    state:st, onChange:() => {},
    accounts:accts,
    addAccount({ broker, server, login, password, mode, label }) {
      if(password){
        st.msg='Password entry is disabled for browser-configured bridges. Use secure cloud handoff or sign into your own MT5 terminal.';
        notify();return null;
      }
      mode = mode || 'DEMO';
      label = label || '';
      if (!server || !login) {
        st.msg = 'Server and login are required. VICE Link never stores broker passwords.';
        notify();
        return null;
      }
      const id = uuid();
      const acct = {
        id,
        broker:broker || server.split('-')[0],
        server,
        login:String(login),
        mode,
        label:label || broker || login,
        addedAt:new Date().toISOString(),
        verified:false,
      };
      accts.push(acct);
      persistAccts();
      if (st.status === 'live') {
        request({t:'mt5-verify',account:{server,login}}).then(r=>{
          acct.verified=!!r.ok;acct.equity=r.equity||0;acct.balance=r.balance||0;
          acct.currency=r.currency||'USD';persistAccts();notify();
          toast(r.ok?'MT5 terminal account authenticated':'MT5 account was not verified',r.ok?'success':'warn');
        }).catch(e=>toast('MT5 read-only verification: '+e.message,'error'));
      } else toast('Account details saved, not verified. Cloud MT5 is available without a PC.','info');
      notify();
      return acct;
    },
    removeAccount(id) {
      const i = accts.findIndex(a => a.id === id);
      if (i >= 0) {
        accts.splice(i, 1);
        persistAccts();
        if (st.status === 'live' && st.admin) send({ t:'mt5-account', action:'remove', id });
        notify();
      }
    },
    async testAccount(id) {
      const acct = accts.find(a => a.id === id);
      if (!acct) return;
      if (st.status !== 'live') {
        toast('VICE Link is not connected. Run VICE4X on your PC.','warn');
        return;
      }
      try {
        const r = await request({
          t:'mt5-verify',
          account:{ server:acct.server, login:acct.login }
        });
        acct.verified = !!r.ok;
        acct.equity = r.equity || acct.equity;
        acct.balance = r.balance || acct.balance;
        acct.currency = r.currency || acct.currency;
        persistAccts();
        toast(acct.verified
          ? `Connected · equity ${fmtMoney(acct.equity, acct.currency)}`
          : 'Verification failed',acct.verified?'success':'warn');
      } catch(e) { toast('Verification failed: ' + e.message,'error'); }
      notify();
    },
    start(){
      if(APP_MODE!=='LIVE'||!S.user?.id)return;
      st._stopped=false;loadAccts();config();connect();
    },
    stop(){
      st._stopped=true;clearTimeout(timer);retry=0;
      if(ws){const w=ws;ws=null;try{w.close()}catch(_){}}
      for(const r of reqs.values())try{r.reject(new Error('VICE user signed out'))}catch(_){}
      reqs.clear();loading.clear();symbols.clear();series.clear();errors.clear();quotes.clear();
      accts.length=0;sub=null;
      st.status='off';st.msg='';st.portfolio=null;st.portfolioAt=0;st.sources=[];
      st.audit=null;st.adminInfo=null;st.admin=false;st.token='';st.url='';st.device='';
    },
    send,
    symbols: src => symbols.get(src) || null,
    source: id => st.sources.find(x => x.id === id) || null,
    quote: (src, sym) => quotes.get(`${src}|${sym}`) || null,
    error: (src, sym, tf) => errors.get(skey(src, sym, tf)) || null,
    loading: (src, sym, tf) => loading.has(skey(src, sym, tf)),
    series(src, sym, tf) {
      const sr = series.get(skey(src, sym, tf));
      if (!sr) { ensure(src, sym, tf); return null; }
      subscribe(src, sym, tf);
      const so = api.source(src);
      return {
        symbol:sym, tf, source:'LIVE', decimals:sr.digits,
        bars:sr.bars, builtFrom:null,
        src, broker:so ? brokerShort(so) : 'MT5',
      };
    },
    retryLoad(src, sym, tf) {
      errors.delete(skey(src, sym, tf));
      ensure(src, sym, tf);
    },
    pair(code) {
      if (!ws || ws.readyState !== 1) {
        st.msg = 'Not connected to VICE Link yet.';
        notify();
        return;
      }
      st.msg = '';
      send({ t:'pair', code:String(code).replace(/\D/g,''), device:deviceName() });
    },
    setUrl(url, token) {
      st.url = String(url || '').trim();
      st.token = token || '';
      try {
        const key=memberKey('vice-link');if(key)localStorage.setItem(key,JSON.stringify({url:st.url,token:st.token}));
      } catch(_) {}
      st._stopped = false;
      if (ws) { try { ws.close(); } catch(_) {} ws = null; }
      setTimeout(connect, 100);
      notify();
    },
  };
  return api;
})();

/* ================================================================
   VICE CLOUD MT5 — provider-hosted credential handoff (no PC)
   Requires an authenticated VICE session and configured MetaApi token
   in Supabase Edge secrets. No broker passwords enter this website.
   All broker reads are server-side and are read-only. No trade routes.
   ================================================================ */
const CloudMT5 = (() => {
  const state={accounts:[],configured:null,loaded:false,busy:false,error:'',lastRefresh:0,
               secureUrl:null,pendingNonce:null,pendingForm:null,ownerId:null};
  function reset(){
    // Revoke the previous browser session's in-memory account details and
    // invalidate responses from any request still in flight.
    state.epoch=(state.epoch||0)+1;
    Object.assign(state,{ownerId:null,accounts:[],configured:null,loaded:false,busy:false,
      error:'',lastRefresh:0,secureUrl:null,pendingNonce:null,pendingForm:null,_queued:false});
  }
  function ensureOwner(){
    const id=APP_MODE==='LIVE'?S.user?.id||null:null;
    if(id!==state.ownerId){
      reset();
      state.ownerId=id;
    }
  }
  async function request(action,args={}){
    if(APP_MODE!=='LIVE'||!S.user)throw new Error('Sign in to VICE4X LIVE before using cloud connections.');
    const {data,error}=await sb.functions.invoke('vice-mt5-cloud',{body:{action,...args}});
    if(error){
      let message=error.message||'Cloud connector unavailable';
      try{const j=await error.context?.clone()?.json();if(j?.error)message=j.error}catch(_){ }
      throw new Error(message);
    }
    if(data?.error)throw new Error(data.error);
    return data||{};
  }
  async function refresh(){
    ensureOwner();
    if(APP_MODE!=='LIVE'||!S.user){reset();return;}
    if(state.busy)return;
    state.busy=true;state.error='';
    const requestedFor=state.ownerId;
    const requestEpoch=state.epoch||0;
    const stillCurrent=()=>requestedFor===state.ownerId && requestEpoch===(state.epoch||0)
      && APP_MODE==='LIVE' && S.user?.id===requestedFor;
    try{
      const result=await request('list');
      if(!stillCurrent())return;
      state.accounts=Array.isArray(result.accounts)?result.accounts:[];
      state.configured=result.configured===true;
      if(S.integrations?.['broker.mt5']) S.integrations['broker.mt5'].status=
        (state.accounts.some(a=>a.verified===true)||Link.state.status==='live')?'CONNECTED':
        (state.configured?'READY':'BLOCKED');
      state.loaded=true;state.lastRefresh=Date.now();
    }catch(e){
      if(!stillCurrent())return;
      state.error=e.message;state.loaded=true;state.configured=false;state.accounts=[];state.lastRefresh=0;
    }finally{
      if(stillCurrent()){
        state.busy=false;
        try{renderMain()}catch(_){}
      }
    }
  }
  function verifiedUsd(){
    // Never include stale, unverified, or non-USD values in a USD total.
    ensureOwner();
    if(APP_MODE==='LIVE'&&S.user&&!state.loaded&&!state.busy&&!state._queued){
      state._queued=true;
      setTimeout(()=>{state._queued=false;if(APP_MODE==='LIVE'&&S.user&&!state.loaded)refresh();},250);
    }
    if(APP_MODE!=='LIVE'||!S.user||!state.lastRefresh||Date.now()-state.lastRefresh>120000)return 0;
    const accounted=new Set();
    const record=(a)=>String(a.server||'').trim().toLowerCase()+'|'+String(a.login||'').trim();
    // Deduplicate only against fresh, authenticated LIVE terminal equity.
    // Saved legacy metadata has no monetary authority and must not suppress
    // a verified cloud account.
    for(const a of liveBridgeAccounts())if(a.server&&a.login&&
      String(a.currency||'').toUpperCase()==='USD'&&
      String(a.mode||a.accountMode||'').toUpperCase()==='LIVE')accounted.add(record(a));
    let total=0;
    for(const a of state.accounts){
      const id=record(a);
      // Provider must verify actual terminal REAL mode, not just a member's
      // self-declared LIVE/DEMO label. No proof => account remains visible
      // but its amount is not added to the consolidated portfolio.
      if(!a.verified||a.realEquityVerified!==true||a.mode!=='LIVE'||
        String(a.currency||'').toUpperCase()!=='USD'||a.equity===null||
        a.equity===undefined||!Number.isFinite(Number(a.equity))||
        !a.server||!/^\d+$/.test(String(a.login||'')))continue;
      if(accounted.has(id))continue;
      accounted.add(id);total+=Number(a.equity);
    }
    return total;
  }
  async function prepare(){
    if(state.busy)return;
    const label=($('cloudMt5Label')?.value||'').trim();
    const server=($('cloudMt5Server')?.value||'').trim();
    const mode=$('cloudMt5Mode')?.value||'DEMO';
    if(label.length<2||server.length<2){toast('Enter an account label and the exact MT5 broker server name','warn');return;}
    if(!confirm('Create a MetaApi-hosted MT5 cloud connection? MetaApi may charge for account hosting.'))return;
    const form=JSON.stringify({label,server,mode});
    if(!state.pendingNonce||state.pendingForm!==form){state.pendingNonce=crypto.randomUUID();state.pendingForm=form;}
    state.busy=true;state.error='';
    try{
      const result=await request('prepare',{label,server,mode,nonce:state.pendingNonce});
      if(result.pending){toast('Broker settings detection is processing. Click Retry setup in approximately one minute.','info');return;}
      if(!result.configurationUrl?.startsWith('https://app.metaapi.cloud/'))throw new Error('Provider link failed validation.');
      state.secureUrl=result.configurationUrl;state.pendingNonce=null;state.pendingForm=null;
      closeModal();
      toast('Cloud connection prepared. Click Open secure sign-in to enter credentials directly with MetaApi.','success');
    }catch(e){state.error=e.message;toast('Cloud setup: '+e.message,'error');}
    finally{state.busy=false;await refresh();}
  }
  async function configure(id){
    if(state.busy)return;state.busy=true;
    try{const x=await request('configuration-link',{id});
      if(!x.configurationUrl?.startsWith('https://app.metaapi.cloud/'))throw new Error('Invalid provider URL');
      state.secureUrl=x.configurationUrl;toast('Secure provider link ready. Open it to authenticate.','success');
    }catch(e){toast('Provider handoff: '+e.message,'error')}
    finally{state.busy=false;try{renderMain()}catch(_){}}
  }
  function openSecure(){
    if(!state.secureUrl)return toast('Prepare a cloud connection first','warn');
    const u=new URL(state.secureUrl);
    if(u.protocol!=='https:'||u.hostname!=='app.metaapi.cloud')return toast('Untrusted provider link','error');
    window.open(u.href,'_blank','noopener,noreferrer');
    state.secureUrl=null;try{renderMain()}catch(_){}
  }
  async function deploy(id){
    if(!confirm('Ask MetaApi to start the hosted MT5 session? Provider usage may incur charges.'))return;
    try{await request('deploy',{id});toast('Cloud terminal startup requested. Refresh after authentication.','success');await refresh()}
    catch(e){toast('Cloud terminal: '+e.message,'error')}
  }
  async function remove(id){
    if(!confirm('REMOVE this MT5 cloud connection from VICE AND the hosted MetaApi service? Provider history may be deleted.'))return;
    try{await request('remove',{id,confirm:'DELETE_CLOUD_ACCOUNT'});toast('Cloud connection removed','success');await refresh()}
    catch(e){toast('Remove cloud connection: '+e.message,'error')}
  }
  setInterval(()=>{

function brokerShort(x) {
  const p = String((x && x.server) || '').split('-')[0];
  return p || String((x && x.company) || 'MT5').split(' ')[0];
}
function deviceName() {
  const u = navigator.userAgent || '';
  return /iPhone/.test(u) ? 'iPhone'
    : /iPad/.test(u) ? 'iPad'
    : /Android/.test(u) ? 'Android phone'
    : /Windows/.test(u) ? 'Windows PC'
    : /Mac/.test(u) ? 'Mac'
    : 'Device';
}

KB.forEach(e => e.push(e[3].join(' ')));

function kbSearch(q, k) {
  k = k || 3;
  const words = String(q || '').toLowerCase().match(/[a-z0-9]+/g) || [];
  return KB.map(e => {
    const hay = e[4].toLowerCase();
    let sc = 0;
    for (const w of words) {
      if (w.length < 3) continue;
      if (e[3].includes(w)) sc += 3;
      if (e[1].toLowerCase().includes(w)) sc += 2;
      else if (hay.includes(w)) sc += 1;
    }
    return { e, sc };
  })
    .filter(x => x.sc > 0)
    .sort((a,b) => b.sc - a.sc)
    .slice(0, k)
    .map(x => x.e);
}

        id:`REQ-${String(st.tickets.length + 1).padStart(5,'0')}`,

      };
      st.tickets.push(n);
      try { localStorage.setItem('vice-tickets', JSON.stringify(st.tickets)); } catch(_) {}
      return n;
    },
  };
})();

const OI = (() => {

  const ADVICE = /\b(should i (buy|sell|invest|hold)|what should i (buy|invest)|will (it|price|v4x|vice) go up|price prediction|guarantee|how much will i (make|earn))\b/i;

      run:() => ({

      run:() => ({

          + S.engine2.internal.positions.filter(p => p.status === 'OPEN').length,

    },
    search_knowledge: { d:'Search the VICE4X help library.',
      run: inp => ({
        results:kbSearch(inp && inp.query).map(e => ({ id:e[0], title:e[1], text:e[2] }))
      }),
    },
  };
  const AGENTS = {
    market:{ name:'Market Analyst', tools:['query_market'], re:/price|chart|structure|solace|f0|f100|level|market|pair|gold|trend|choch|internal/i },
    portfolio:{ name:'Portfolio Architect', tools:['query_portfolio'], re:/portfolio|account|equity|balance|position|wallet|mt5|total|worth/i },
    distribution:{ name:'Distribution Auditor', tools:['query_distribution'], re:/reserve|client|holder|distribut|supply|iru|v4x|vice|allocation/i },
    risk:{ name:'Risk Officer', tools:['query_risk','query_system'], re:/risk|ceiling|drawdown|exposure|safe|security/i },
    systems:{ name:'Systems Engineer', tools:['query_system'], re:/system|status|health|bridge|link|connected|server|build/i },
    contracts:{ name:'Chain Verifier', tools:['query_contracts'], re:/contract|on.?chain|token address|v4x address|checksum/i },
    quant:{ name:'Quant Researcher', tools:['query_lab'], re:/backtest|experiment|quant|walk.?forward|monte|expectancy|edge|research/i },
    desk:{ name:'VICEBOT Supervisor', tools:['query_desk','query_risk'], re:/vicebot|order|paper|kill|breaker|position|execution/i },
    support:{ name:'Support Agent', tools:['search_knowledge'], re:/how (do|can|to)|help|set ?up|connect|pair|import|create|restore|sign in|login|two-step|2fa|support|ticket|broken|error|not working|issue/i },
  };
  function route(q) {
    if (/brief|today|overview|summary|everything/i.test(q)) return ['market','portfolio','distribution','systems'];
    const hit = Object.keys(AGENTS).filter(k => AGENTS[k].re.test(q));
    return hit.length ? hit.slice(0, 3) : ['support','systems'];
  }
  function offlineAnswer(q, agents, results) {
    if (ADVICE.test(q)) {
      return "I can explain what your data shows, but I can't give personal investment advice or predict prices or returns.";
    }
    const out = [];
    for (const a of agents) for (const name of AGENTS[a].tools) {
      const r = results[name];
      if (!r) continue;
      if (name === 'query_market') {
        out.push(r.status === 'NO_DATA'
          ? `Market: no ${r.pair} ${r.timeframe} data yet. [query_market]`
          : `Market: ${r.pair} ${r.timeframe} (${r.dataSource}). Last close ${r.lastClose}; F100 ${r.F100}, F0 ${r.F0}${r.positionInRangePct !== null ? `; price is at ${r.positionInRangePct}% of the range` : ''}. Internal poles: H ${r.internalHi}, L ${r.internalLo}. ${r.choch && r.choch.dir ? `CHoCH ${r.choch.dir === 1 ? 'bullish' : 'bearish'} at ${r.choch.level}.` : ''}${r.latestEvent ? ` Latest event: ${r.latestEvent}.` : ''} [query_market]`);
      }
      if (name === 'query_portfolio') {
        out.push(`Portfolio total (rough): ${r.total}. MT5: ${r.mt5.status === 'NOT_CONNECTED' ? 'not connected' : `${r.mt5.accounts.length} account(s)`}. Wallet: ${r.wallet.status || 'unlocked'}. [query_portfolio]`);
      }
      if (name === 'query_distribution') {
        out.push(`Distribution: ${r.clients} clients. V4X remaining ${Number(r.V4X.remaining).toLocaleString()}; VICE remaining ${Number(r.VICE.remaining).toLocaleString()}. Integrity: ${Array.isArray(r.integrity) ? (r.integrity.length ? r.integrity.join('; ') : 'all checks pass') : 'unknown'}. [query_distribution]`);
      }
      if (name === 'query_contracts') {
        out.push(`Contracts: ${r.contracts.map(c => `${c.label} ${c.status}`).join('; ')}. [query_contracts]`);
      }
      if (name === 'query_risk') {
        out.push(`Risk: ${r.perAccountCeiling} per account, ${r.aggregateCeiling} aggregate. [query_risk]`);
      }
      if (name === 'query_system') {
        out.push(`System: build ${r.build}, VICE Link ${r.liveMT5 ? 'live' : 'off'}, ${r.accounts} MT5 account(s), wallet ${r.wallet}. [query_system]`);
      }
      if (name === 'query_lab') {
        out.push(`Quant Lab: ${r.experiments} experiment(s) on record${r.latest ? `, latest ${r.latest.trades} trades at ${fR(r.latest.expectancyR)}` : ''}${r.adversarial ? `, adversarial ${r.adversarial}` : ''}. [query_lab]`);
      }
      if (name === 'query_desk') {
        out.push(`Trade Desk: engine ${r.running ? 'running' : 'stopped'}, ${r.totalPositions} open paper position(s). [query_desk]`);
      }
      if (name === 'search_knowledge') {
        out.push(r.results.length
          ? r.results.map(x => `${x.title}: ${x.text} [kb:${x.id}]`).join('\n\n')
          : "I couldn't find that in the help library. Use Support → Open a ticket and a human will follow up.");
      }
    }
    return out.join('\n\n');
  }
  async function ask(q, mode) {
    q = String(q || '').trim();
    if (!q || st.busy) return;
    st.activeMode = mode || 'general';

    const agents = st.activeMode === 'support'
      ? [...new Set(['support','systems','market','portfolio', ...route(q)])]
      : route(q);

    const turn = {
      q,
      agents:agents.map(a => AGENTS[a].name),
      trace:[], answer:'', at:new Date().toISOString(),
      mode: st.activeMode,
    };
    st.turns.push(turn);
    st.busy = true;
    st.err = '';
    notify();
    const names = [...new Set(agents.flatMap(a => AGENTS[a].tools))];
    if(st.activeMode === 'support' && !names.includes('search_knowledge')){
      names.push('search_knowledge');
    }
    const results = {};
    const exec = (name, input) => {
      const t0 = performance.now();
      const r = TOOLS[name].run(input || {});
      turn.trace.push({ tool:name, ms:Math.round(performance.now() - t0) });
      notify();
      return r;
    };
    try {
      for (const n of names) {
        results[n] = exec(n, n === 'search_knowledge' ? { query:q } : {});
      }
      let answer = offlineAnswer(q, agents, results);
      if(st.activeMode === 'support'){
        answer = 'Support Agent ready. Here is what I found:\n\n' + answer + '\n\nIf this doesn\'t resolve it, tap "Open a ticket" below and a human will respond.';
      }
      turn.answer = answer;
      turn.mode = st.activeMode;
    } catch(e) {
      turn.answer = 'Error: ' + e.message;
      turn.mode = st.activeMode;
    }
    st.busy = false;
    notify();
  }
  return {
    state:st, tools:TOOLS, agents:AGENTS, route, ask, kbSearch,
    onChange:() => {},
    stop() { if (st.abort) st.abort.abort(); },
    speak(text) {
      try {
        if (!('speechSynthesis' in window)) return false;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text).replace(/\[[^\]]+\]/g,''));
        u.rate = 1.02;
        speechSynthesis.speak(u);
        return true;
      } catch(_) { return false; }
    },
    listen(onText) {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) return false;
      const rec = new R();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      st.listening = true;
      notify();
      rec.onresult = ev => {
        st.listening = false;
        onText(ev.results[0][0].transcript);
      };
      rec.onerror = rec.onend = () => { st.listening = false; notify(); };
      rec.start();
      return true;
    },
  };
})();
