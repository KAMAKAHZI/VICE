document.addEventListener('change', async (e) => {
  const f = e.target;
  if(!f || f.tagName !== 'INPUT' || f.type !== 'file') return;

  /* ─── PRICE BARS ─── */
  if(f.id === 'csv'){
    const file = f.files && f.files[0];
    if(!file) return;
    try {
      const text = await file.text();
      const imported = importText(text, file.name);
      const res = addDataset(imported, true);
      S.sel.symbol = imported.symbol;
      S.ch.pair = imported.symbol;
      S.ch.tf = imported.tf;
      S.sel.tf = imported.tf;
      S.sel.src = 'local';
      S.ch.source = 'FILE';
      await loadCandles();
      toast(`Imported ${imported.symbol} ${imported.tf} — ${imported.bars.length.toLocaleString()} bars${res.trimmed ? ' (trimmed)' : ''}`, 'success');
      if(S.tab !== 'markets') go('markets'); else renderMain();
    } catch(err) {
      toast('Import failed: ' + err.message, 'error');
    }
    f.value = '';
    return;
  }

  /* ─── EA LOG (reconciliation) ─── */
  if(f.id === 'eaLog'){
    toast('EA log uploaded — reconciliation queued','info');
    S.reconJobs = S.reconJobs || [];
    S.reconJobs.unshift({ id: uuid(), name:'EA log import', status:'PENDING', createdAt: nowIso() });
    f.value = '';
    if(S.tab === 'reconciliation') renderMain();
    return;
  }

  /* ─── DOCUMENT UPLOAD — actual private object storage and digest ─── */
  if(f.id==='docUpload'){
    const uploadEpoch=authEpoch,uploadOwner=S.user?.id;
    if(!uploadOwner){toast('Sign in to upload documents','error');return;}
    const currentUpload=()=>{if(uploadEpoch!==authEpoch)throw Error('Session changed; retry the upload');};
    const files=Array.from(f.files||[]);if(!files.length)return;
    const allowed=new Set(['application/pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/msword','text/plain','text/markdown','image/png','image/jpeg']);
    let complete=0;
    for(const file of files){
      try{
        if(!allowed.has(file.type))throw Error('File type not permitted');
        if(file.size>10*1024*1024)throw Error('File exceeds 10 MB');
        const id=uuid();const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()));
        currentUpload();
        const sha256=Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('');
        const safeName=file.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(0,140);
        const path=`${S.user?.id||'sim-user'}/${id}/${safeName}`;
        const doc={id,name:file.name,type:file.type,size:file.size,sha256,url:path,
          holderClientId:S.profile.clientId,uploadedBy:S.user?.id,createdAt:nowIso(),signed:false};
        if(APP_MODE==='LIVE' && S.user?.id!=='sim-user'){
          const uploaded=await sb.storage.from('vice-documents').upload(path,file,{contentType:file.type,upsert:false});
          if(uploaded.error)throw uploaded.error;
          currentUpload();
          const saved=await sb.from('documents').insert({id,name:file.name,type:file.type,size:file.size,
            sha256,url:path,holder_client_id:S.profile.clientId,uploaded_by:S.user.id});
          if(saved.error)throw saved.error;
          currentUpload();
        }
        S.documents.unshift(doc);complete++;
      }catch(e){toast(`Upload failed (${file.name}): ${e.message}`,'error');}
    }
    if(complete)toast(APP_MODE==='SIM'?'Practice files added locally; nothing uploaded':`${complete} document${complete===1?'':'s'} uploaded into private storage`,'success');
    f.value='';if(S.tab==='documents')renderMain();return;
  }

  /* ─── AVATAR ─── */
  if(f.id === 'avatarUpload'){
    const file=f.files?.[0];if(!file)return;f.value='';
    try{await ViceComms.uploadAvatar(file);toast('Profile image updated','success');showApp();renderMain();}
    catch(e){toast('Profile image: '+e.message,'error');}
    return;
  }
});

      const mn = document.querySelector('main.mn'); if(mn) mn.style.display = 'none';

      if(S.user?.id!==session.user.id){
        setTimeout(() => onAuthenticated(session.user).catch(e => console.warn('Auth state sync failed:', e)), 0);
      }
    } else if(event === 'TOKEN_REFRESHED'){
      /* silent */
    } else if(event === 'PASSWORD_RECOVERY'){
      setTimeout(showPasswordRecovery,0);

   ═══════════════════════════════════════════════════════════════════ */

async function restoreDatasets(){
  try {
    const rows = await Store.all();
    if(!rows || !rows.length) return;
    for(const row of rows){
      try {
        const d = unpack(row);
        addDataset(d, false);
      } catch(_){}
    }
    if(Object.keys(S.sets).length){
      const first = Object.values(S.sets)[0];
      S.sel.symbol = first.symbol;
      S.sel.tf = first.tf;
      S.ch.pair = first.symbol;
      S.ch.tf = first.tf;
      S.ch.source = 'FILE';
    }
  } catch(e) {
    console.warn('Dataset restore failed:', e);
  }
}

function restoreLocalState(){

    if(Array.isArray(tickets)) S.support.tickets = tickets;

}

   ═══════════════════════════════════════════════════════════════════ */

function runSplash(){
  const splash = $('splash');
  if(!splash) return;

}

/* ═══════════════════════════════════════════════════════════════════
   BOOT — runs once on DOM ready
   ═══════════════════════════════════════════════════════════════════ */

(async function boot(){
  const bv = $('buildv');
  if(bv) bv.textContent = `v${BUILD.version}`;

  /* Apply initial mode / banner state */
  applyModeUI();

  /* Set up login form */
  const lf = $('loginForm');
  if(lf) lf.addEventListener('submit', e => { e.preventDefault(); login(); });

  /* Unlock audio context on first interaction (browser policy) */
  document.addEventListener('pointerdown', function unlockOnce(){
    try { Notify.beep({ freq: 1, dur: 0.01, gain: 0.0001 }); } catch(_){}
    try { Notify.request(); } catch(_){}
    document.removeEventListener('pointerdown', unlockOnce);
  }, { once: true });

  /* Restore local state before anything else */
  restoreLocalState();

  /* Restore imported bar datasets from IndexedDB */
  await restoreDatasets();

  /* VICE Link starts only AFTER the member authenticates; no shared-session
     WebSocket connection may be started at anonymous application boot. */

  /* Start the splash animation */
  runSplash();

  /* ─── Auth flow ─── */
  try {
    if(!(await viceAuthReady)){showViceClockWarning();return;}
    const { data: { session } } = await sb.auth.getSession();

    /* Detect invite link */
    const urlInvite = new URLSearchParams(location.search).get('invite');
    if(urlInvite) sessionStorage.setItem('pending_invite', urlInvite);

    /* Detect reset link */
    if(new URLSearchParams(location.search).get('reset')){
      toast('Set a new password from the email link','info');
    }

    if(session && session.user){
      await onAuthenticated(session.user);
    } else {
      const login = $('login');
      if(login) login.hidden = false;
      const splash = $('splash');
      if(splash) setTimeout(() => splash.classList.remove('active'), 100);
    }
  } catch(e) {
    console.warn('Boot auth check failed:', e);
    const login = $('login');
    if(login) login.hidden = false;
  }
})();

/* VICE4X standalone QR Model 2, byte-mode, error-correction M, versions 1–9.
   Matrix implementation is self-contained; no external runtime dependency. */
const ViceQR = (() => {
  const BLOCKS = [null,[[26,16]],[[44,28]],[[70,44]],[[50,32],[50,32]],
    [[67,43],[67,43]],[[43,27],[43,27],[43,27],[43,27]],
    [[49,31],[49,31],[49,31],[49,31]],[[60,38],[60,38],[61,39],[61,39]],
    [[58,36],[58,36],[58,36],[59,37],[59,37]]];
  const ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46]];
  const exp = new Uint8Array(512), log = new Uint8Array(256);
  for(let i=0,v=1;i<255;i++) { exp[i]=v;log[v]=i;v<<=1;if(v&256)v^=0x11d; }
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  const mul=(x,y)=>!x||!y?0:exp[log[x]+log[y]];
  function rsPolynomial(n){let poly=[1];for(let i=0;i<n;i++){
    const out=Array(poly.length+1).fill(0);
    poly.forEach((c,j)=>{out[j]^=c;out[j+1]^=mul(c,exp[i]);});poly=out;
  }return poly;}
  function rs(data,n){let r=Array(n).fill(0),gen=rsPolynomial(n);
    for(const b of data){const f=b^r[0];r.shift();r.push(0);
      for(let j=0;j<n;j++)r[j]^=mul(f,gen[j+1]);}
    return r;
  }
  function bitsFor(text,v){
    const b=new TextEncoder().encode(text), cap=BLOCKS[v].reduce((n,a)=>n+a[1],0);
    const bits=[];const put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1);};
    put(4,4);put(b.length,8);for(const c of b)put(c,8);
    for(let k=0;k<4&&bits.length<cap*8;k++)bits.push(0);
    while(bits.length%8)bits.push(0);
    const out=[];for(let i=0;i<bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8).join(''),2));
    let pad=0;while(out.length<cap)out.push(pad++%2?0x11:0xec);
    return out;
  }
  function interleave(bytes,v){
    let off=0;const blocks=BLOCKS[v].map(([size,n])=>{
      const d=bytes.slice(off,off+n);off+=n;return {d,e:rs(d,size-n)};});
    const ans=[];for(const key of ['d','e']){
      const m=Math.max(...blocks.map(b=>b[key].length));
      for(let i=0;i<m;i++)for(const b of blocks)if(i<b[key].length)ans.push(b[key][i]);
    }return ans;
  }
  function build(text){
    const b=new TextEncoder().encode(text);
    const v=BLOCKS.findIndex((x,i)=>i>0&&i<10&&b.length<=x.reduce((n,a)=>n+a[1],0)-2);
    if(v<1)throw new Error('QR URL exceeds 9-version capacity');
    const n=v*4+17, m=Array.from({length:n},()=>Array(n).fill(false)),
      reserved=Array.from({length:n},()=>Array(n).fill(false));
    const set=(x,y,color)=>{if(x<0||y<0||x>=n||y>=n)return;m[y][x]=!!color;reserved[y][x]=true;};
    function finder(cx,cy){for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4);}}
    finder(3,3);finder(n-4,3);finder(3,n-4);
    for(let i=8;i<n-8;i++){set(i,6,i%2===0);set(6,i,i%2===0);}
    for(const y of ALIGN[v])for(const x of ALIGN[v]){
      if((x===6&&y===6)||(x===6&&y===n-7)||(x===n-7&&y===6))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)
        set(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    // Format reservation and fixed dark module.
    for(let i=0;i<9;i++)if(i!==6){set(8,i,false);set(i,8,false);}
    for(let i=n-8;i<n;i++){set(8,i,false);set(i,8,false);}
    set(8,n-8,true);
    if(v>=7){for(let i=0;i<18;i++){
      set(n-11+i%3,Math.floor(i/3),false);set(Math.floor(i/3),n-11+i%3,false);}}
    const cw=interleave(bitsFor(text,v),v),bits=[];
    for(const c of cw)for(let i=7;i>=0;i--)bits.push((c>>>i)&1);
    let idx=0,up=true;
    for(let right=n-1;right>=1;right-=2){
      if(right===6)right=5;
      for(let j=0;j<n;j++){
        const y=up?n-1-j:j;
        for(let dx=0;dx<2;dx++){
          const x=right-dx;
          if(reserved[y][x])continue;
          const bit=idx<bits.length?bits[idx++]:0;
          m[y][x]=!!(bit^(((x+y)%2)===0?1:0));
        }
      }up=!up;
    }
    // Format information for EC level M (00) and mask 0, BCH(15,5).
    let rem=0,formatData=0;
    for(let i=14;i>=10;i--){ /* BCH polynomial division below */ }
    let val=formatData<<10;
    for(let i=14;i>=10;i--)if((val>>>i)&1)val^=0x537<<(i-10);
    const format=((formatData<<10)|val)^0x5412;
    const bit=i=>!!((format>>>i)&1);
    for(let i=0;i<=5;i++)set(8,i,bit(i));
    set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));
    for(let i=9;i<15;i++)set(14-i,8,bit(i));
    for(let i=0;i<8;i++)set(n-1-i,8,bit(i));
    for(let i=8;i<15;i++)set(8,n-15+i,bit(i));
    set(8,n-8,true);
    if(v>=7){let vv=v<<12;
      for(let i=17;i>=12;i--)if((vv>>>i)&1)vv^=0x1f25<<(i-12);
      const vb=(v<<12)|vv;
      for(let i=0;i<18;i++){
        const c=!!((vb>>>i)&1),a=n-11+i%3,d=Math.floor(i/3);
        set(a,d,c);set(d,a,c);
      }
    }
    return {version:v,size:n,matrix:m};
  }
  function encode(text,{moduleSize=6,quiet=4}={}){
    const q=build(String(text)), path=[];
    for(let y=0;y<q.size;y++)for(let x=0;x<q.size;x++)
      if(q.matrix[y][x])path.push(`M${x+quiet} ${y+quiet}h1v1h-1z`);
    return {...q,path:path.join(''),moduleSize,quiet,
      svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${q.size+quiet*2} ${q.size+quiet*2}" width="${(q.size+quiet*2)*moduleSize}" height="${(q.size+quiet*2)*moduleSize}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${path.join('')}" fill="#07080a"/></svg>`};
  }
  return {encode};
})();

const ViceBarcode = (()=>{
  // Industrial Code 39 (NW ratio 3:1); scanners return the certificate ID.
  // The QR encodes the canonical verification URL. Barcodes themselves are not proof.
  const patterns={
    '0':'bsbSBsBsb','1':'BsbSbsbsB','2':'bsBSbsbsB','3':'BsBSbsbsb',
    '4':'bsbSBsbsB','5':'BsbSBsbsb','6':'bsBSBsbsb','7':'bsbSbsBsB',
    '8':'BsbSbsBsb','9':'bsBSbsBsb','A':'BsbsbSbsB','B':'bsBsbSbsB',
    'C':'BsBsbSbsb','D':'bsbsBSbsB','E':'BsbsBSbsb','F':'bsBsBSbsb',
    'G':'bsbsbSBsB','H':'BsbsbSBsb','I':'bsBsbSBsb','J':'bsbsBSBsb',
    'K':'BsbsbsbSB','L':'bsBsbsbSB','M':'BsBsbsbSb','N':'bsbsBsbSB',
    'O':'BsbsBsbSb','P':'bsBsBsbSb','Q':'bsbsbsBSB','R':'BsbsbsBSb',
    'S':'bsBsbsBSb','T':'bsbsBsBSb','U':'BSbsbsbsB','V':'bSBsbsbsB',
    'W':'BSBsbsbsb','X':'bSbsBsbsB','Y':'BSbsBsbsb','Z':'bSBsBsbsb',
    '-':'bSbsbsBsB','*':'bSbsBsBsb'};
  function svg(value,{width=600,height=84,fill='#0a0b0d'}={}){
    const encoded='*'+String(value||'').toUpperCase()+'*';
    if([...encoded].some(c=>!patterns[c]))throw Error('Invalid Code39 identifier');
    let x=12;const rects=[];
    for(const ch of encoded){
      const p=patterns[ch];
      for(let i=0;i<9;i++){
        const w=p[i]===p[i].toUpperCase()?6:2;
        if(i%2===0)rects.push(`<rect x="${x}" y="0" width="${w}" height="${height}"/>`);
        x+=w;
      }
      x+=2;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+12} ${height}" width="${width}" height="${height}" preserveAspectRatio="none" role="img" aria-label="Code 39 barcode ${esc(value)}"><g fill="${fill}">${rects.join('')}</g></svg>`;
  }
  return {svg};
})();

      <button class="btn btn-xs btn-g" data-act="iru-cert-verify" data-id="${esc(c.cert_id)}">Verify</button></td></tr>`).join('')}</tbody></table></div>`:
        '<p class="muted">No certificates match. Certificates are generated only by server-authorized IRU changes.</p>'}
      <p class="note">Scan the QR to open a live, digest-checked portfolio snapshot. Each issued certificate captures BOTH VICE and V4X holdings at issuance; later changes do not rewrite it.</p></section>`;
  }
  return {titles,verifyUrl,render,toPNG,downloadPNG,print,copyVerifyUrl,open,load,find,htmlSection,moneyCents};
})();

(function extendTokenCertificateActions(){
  const prev=window.__viceAct;
  window.__viceAct=function(t,e){
    const act=t.dataset.act;
    if(act?.startsWith('iru-cert-')){
      (async()=>{
        try{
          if(act==='iru-cert-refresh'){await ViceTokenCertificates.load();renderMain();return;}
          if(act==='iru-cert-filter')return;
          if(APP_MODE!=='LIVE'||S.user?.id==='sim-user')throw Error('Switch to authenticated LIVE mode');
          if(act==='iru-cert-consolidate'){
            if(!isOwner())throw Error('Issuer authorization required');
            const clientId=prompt('Holder client ID (for a monthly snapshot):',S.profile.clientId||'');
            if(!clientId)return;
            const period=prompt('Closing period in YYYY-MM:',new Date().toISOString().slice(0,7));
            if(period===null)return;
            if(!/^20\d\d-(0[1-9]|1[0-2])$/.test(period))throw Error('Use YYYY-MM');
            const found=await sb.from('holders').select('id').eq('client_id',clientId.trim()).maybeSingle();
            if(found.error)throw found.error;
            if(!found.data)throw Error('Holder is not present in issuer registry');
            const {data,error}=await sb.rpc('issue_holdings_consolidation',{p_holder_id:found.data.id,p_period:period});
            if(error)throw error;
            await ViceTokenCertificates.load();renderMain();
            if(data?.cert_id){const cert=ViceTokenCertificates.find(data.cert_id);if(cert)ViceTokenCertificates.open(cert);}
            toast('Consolidated holdings recorded','success');return;
          }
          const cert=ViceTokenCertificates.find(t.dataset.id);
          if(!cert)throw Error('Certificate not available to this member');
          if(act==='iru-cert-preview'){ViceTokenCertificates.open(cert);return;}
          if(act==='iru-cert-download'){await ViceTokenCertificates.downloadPNG(cert);return;}
          if(act==='iru-cert-print'){ViceTokenCertificates.print(cert);return;}
          if(act==='iru-cert-copy'){await ViceTokenCertificates.copyVerifyUrl(cert);return;}
          if(act==='iru-cert-verify'){window.open(ViceTokenCertificates.verifyUrl(cert),'_blank','noopener');return;}
          if(act==='iru-cert-revoke'){
            if(!isOwner())throw Error('Issuer authorization required');
            const reason=prompt('Revocation reason (minimum 8 characters):');if(reason===null)return;
            const {error}=await sb.rpc('revoke_token_certificate',{p_cert_id:cert.cert_id,p_reason:reason});
            if(error)throw error;await ViceTokenCertificates.load();closeModal();renderMain();toast('Token certificate revoked','success');return;
          }
          throw Error('Unrecognized certificate operation');
        }catch(err){toast('Certificate: '+(err.message||'Operation failed'),'error');}
      })();return;
    }
    if(prev)prev(t,e);
  };
})();
// Filter selects are change events, not click delegation targets.
document.addEventListener('change',e=>{
  if(e.target.id==='iruCertKind'||e.target.id==='iruCertProgram'){
    S.tokenCerts.kind=$('iruCertKind')?.value||'ALL';
    S.tokenCerts.program=$('iruCertProgram')?.value||'ALL';
    renderMain();
  }
});
