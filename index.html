<style>
/* ═══════════════════════════════════════════════════════════════════
   VICE4X — ROOT VARIABLES
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#07080a; --bg2:#0a0b0d; --srf:#0f1115; --raised:#161920;
  --ln:rgba(201,168,76,.10); --ln2:rgba(201,168,76,.18); --ln3:rgba(201,168,76,.32);
  --line-soft:#1a1d23; --line:#242830;
  --tx:#ece8e1; --tx-2:#bdb8ae; --tx2:#a3968e; --tx3:#6b5f59; --tx4:#3d3532;
  --gd:#c9a84c; --gdl:#ecd28a; --gold-hi:#ecd28a; --gold-lo:#9c7c33;
  --gr:#3ddc97; --up:#6fd49a; --rd:#d9465a; --down:#ff7a5c; --wn:#f5a524; --vi:#8b7aff; --bl:#5b8def;
  --ember:#d9492f; --ember-bg:rgba(217,73,47,.12);
  --sage:#7fae93; --f100:#ece8e1; --f0:#3c8cff;
  --gg:linear-gradient(135deg,#ecd28a 0%,#c9a84c 45%,#9c7c33 100%);
  --card:linear-gradient(180deg, rgba(255,255,255,.036), rgba(255,255,255,.012));
  --card-line:rgba(255,255,255,.07);
  --sf:'Fraunces',Georgia,serif;
  --mn:'JetBrains Mono',ui-monospace,monospace;
  --font:'Inter',system-ui,-apple-system,"SF Pro Text","Segoe UI Variable Text",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nh:54px; --bh:22px; --sw:252px;
  --safe-top:env(safe-area-inset-top,0px); --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px); --safe-left:env(safe-area-inset-left,0px);
  --header-height:calc(var(--nh) + var(--safe-top));
  --chrome-height:calc(var(--header-height) + var(--bh));
  --e:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --radius:3px;
  --radius-m:10px;
  --radius-l:18px;
  color-scheme:dark;
  box-sizing:border-box;
  -webkit-text-size-adjust:100%;
}
html.bnr-hidden{--bh:0px}

/* ═══════════════════════════════════════════════════════════════════
   RESET
   ═══════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:calc(var(--chrome-height) + 12px);background:var(--bg)}
html,body{height:100%;min-height:100%}
body{
  background:
    radial-gradient(1100px 620px at 88% -14%, rgba(201,168,76,.09), transparent 62%),
    radial-gradient(900px 540px at -12% 110%, rgba(217,73,47,.07), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--tx);
  font:15px/1.45 var(--font);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40% 35% at 20% 25%, rgba(201,168,76,.10), transparent 70%),
    radial-gradient(35% 30% at 80% 70%, rgba(60,140,255,.07), transparent 70%),
    radial-gradient(30% 30% at 60% 20%, rgba(217,73,47,.06), transparent 70%);
  animation:aurora 28s ease-in-out infinite alternate;
}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0deg)}100%{transform:translate3d(-4%,3%,0) rotate(8deg)}}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
::selection{background:rgba(201,168,76,.32);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1c1d20;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#25282e}
h1,h2,h3,h4{font-weight:500;line-height:1.15;letter-spacing:-.02em}
h1{font-size:1.3rem;font-weight:400}
h1 em,h2 em{font-family:var(--sf);font-style:italic;font-weight:300;color:var(--gdl)}
p{color:var(--tx-2);margin:0}
.num{font-variant-numeric:tabular-nums}
.meta{color:var(--tx3);font-size:13px}
.muted{color:var(--tx-2)}
.mono{font-family:var(--mn)}
.up{color:var(--up)}
.down{color:var(--down)}
.warn{color:var(--wn)}
.ok{color:var(--gr)}
[hidden]{display:none!important}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.app{min-height:100%;display:flex;flex-direction:column}

/* ═══════════════════════════════════════════════════════════════════
   TOP BAR
   ═══════════════════════════════════════════════════════════════════ */
.tb{
  position:fixed;top:0;left:0;right:0;height:var(--header-height);z-index:121;
  background:rgba(7,8,10,.92);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;padding:var(--safe-top) max(14px,var(--safe-right)) 0 max(14px,var(--safe-left));gap:12px;
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;cursor:pointer}
.brand svg{width:24px;height:20.8px}
.bn{font-family:var(--sf);font-size:.92rem;letter-spacing:.02em}
.bn em{font-style:italic;color:var(--gdl);font-weight:300}
.bsub{font-family:var(--mn);font-size:.44rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tx4);margin-top:1px}
.tbc{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.pill{
  display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:3px;
  border:1px solid var(--ln2);background:rgba(0,0,0,.3);
  font-family:var(--mn);font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx-2);cursor:pointer;transition:all .2s;
}
.pill:hover{border-color:var(--ln3);color:var(--tx)}
.pill .d{width:5px;height:5px;border-radius:50%;background:var(--gr);box-shadow:0 0 6px var(--gr)}
.pill .d.w{background:var(--wn);box-shadow:0 0 6px var(--wn)}
.pill .d.r{background:var(--rd);box-shadow:0 0 6px var(--rd)}
.pill .d.v{background:var(--vi);box-shadow:0 0 6px var(--vi)}
.pill.live{color:var(--up);border-color:rgba(111,212,154,.42);background:rgba(111,212,154,.1)}
.pill.live .d{animation:pulse 1.9s var(--ease) infinite}
.pill.sim{color:var(--ember);border-color:rgba(217,73,47,.45);background:var(--ember-bg)}
.pill.file{color:var(--gd);border-color:rgba(201,168,76,.45);background:rgba(201,168,76,.12)}
.pill.blocked{color:var(--tx3)}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(111,212,154,.65)}
  70%{box-shadow:0 0 0 7px rgba(111,212,154,0)}
  100%{box-shadow:0 0 0 0 rgba(111,212,154,0)}
}
.tbr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.upill{
  display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;
  border:1px solid var(--ln2);border-radius:99px;background:rgba(0,0,0,.3);cursor:pointer;
}
.upill:hover{border-color:var(--ln3)}
.av{
  width:24px;height:24px;border-radius:50%;background:var(--gg);
  display:flex;align-items:center;justify-content:center;
  font-size:.56rem;font-weight:700;color:#1a0a0a;
  background-size:cover;background-position:center;
}
.un{font-size:.72rem;color:var(--tx);line-height:1.1}
.ur{font-family:var(--mn);font-size:.44rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4);line-height:1.1}
.mob{display:none;width:44px;height:44px;border-radius:6px;border:1px solid var(--ln2);align-items:center;justify-content:center;flex-direction:column;gap:4px;flex-shrink:0;cursor:pointer;touch-action:manipulation}
.mob:hover{border-color:var(--ln3)}
.mob span{display:block;width:14px;height:1.5px;background:var(--tx);border-radius:2px;transition:transform .3s var(--e)}

/* ═══════════════════════════════════════════════════════════════════
   BANNER — dismissible
   ═══════════════════════════════════════════════════════════════════ */
.bnr{
  position:fixed;top:var(--header-height);left:0;right:0;height:var(--bh);z-index:118;
  display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:0 max(12px,var(--safe-right)) 0 max(12px,var(--safe-left));
  background:linear-gradient(90deg,rgba(160,24,40,.16),rgba(201,168,76,.06),rgba(160,24,40,.16));
  border-bottom:1px solid rgba(201,168,76,.14);
  font-family:var(--mn);font-size:.48rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gdl);
  cursor:pointer;
}
.bnr.sim{background:linear-gradient(90deg,rgba(139,122,255,.22),rgba(201,168,76,.08),rgba(139,122,255,.22));color:var(--vi);border-bottom-color:rgba(139,122,255,.4)}
.bnr .d{width:4px;height:4px;border-radius:50%;background:var(--wn);box-shadow:0 0 5px var(--wn);animation:pulse 2s infinite}
.bnr #bnrText{flex:1;text-align:center;pointer-events:none}
.bnr .bnr-x{
  width:28px;height:22px;border-radius:4px;font-size:16px;line-height:1;
  color:inherit;opacity:.85;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;margin-left:4px;
  background:none;border:none;
}
.bnr .bnr-x:hover{opacity:1;background:rgba(255,255,255,.14)}

/* ═══════════════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════════════ */
.sb{
  position:fixed;top:var(--chrome-height);left:0;bottom:0;width:calc(var(--sw) + var(--safe-left));
  background:rgba(9,10,13,.55);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
  border-right:1px solid rgba(255,255,255,.06);
  padding:14px 12px max(24px,var(--safe-bottom)) max(12px,var(--safe-left));overflow-y:auto;z-index:120;overscroll-behavior:contain;
  transition:transform .4s var(--e);
}
.sb::-webkit-scrollbar{width:6px}
.sb::-webkit-scrollbar-thumb{background:#1e2025}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 12px 20px}
.sb-brand svg{width:28px;height:24.2px;filter:drop-shadow(0 0 10px rgba(201,168,76,.18))}
.sb-brand b{font-size:18px;letter-spacing:.16em;font-weight:700}
.sb-brand span{color:var(--tx3);font-size:13px}
.ss{padding:0;margin-bottom:12px}
.ss h4{
  font-family:var(--mn);font-size:.46rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tx4);margin-bottom:4px;padding-left:12px;font-weight:500;
}
.slink{
  display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;
  font-size:.84rem;color:var(--tx-2);cursor:pointer;border:none;background:none;
  width:100%;text-align:left;transition:all .18s;font-family:var(--font);position:relative;
}
.slink:hover{color:var(--tx);background:rgba(255,255,255,.03)}
.slink.on{color:var(--tx);background:linear-gradient(180deg, rgba(201,168,76,.15), rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.25)}
.slink.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:var(--gd)}
.slink svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.slink span{flex:1;min-width:0}
.sbdg{font-family:var(--mn);font-size:.42rem;letter-spacing:.08em;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.06);color:var(--tx3);flex-shrink:0}
.sbdg.lv{background:rgba(111,212,154,.14);color:var(--up)}
.sbdg.gd{background:rgba(201,168,76,.16);color:var(--gdl)}
.sbdg.rd{background:rgba(217,70,90,.16);color:var(--rd)}
.sbdg.vi{background:rgba(139,122,255,.18);color:var(--vi)}
.sb-foot{margin-top:auto;padding:16px 12px 0;font-family:var(--mn);font-size:.48rem;letter-spacing:.1em;color:var(--tx4);text-transform:uppercase;line-height:1.7}
.mn{font-family:var(--mn)}
main.mn{margin-left:calc(var(--sw) + var(--safe-left));margin-top:var(--chrome-height);min-height:calc(100vh - var(--chrome-height));min-height:calc(100dvh - var(--chrome-height));padding:22px max(26px,var(--safe-right)) calc(40px + var(--safe-bottom)) 26px;position:relative}
#sbBackdrop{display:none}
.mni{max-width:1360px;margin:0 auto;outline:none}

/* ═══════════════════════════════════════════════════════════════════
   SPLASH
   ═══════════════════════════════════════════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  transition:opacity .6s var(--e), transform .6s var(--e);
}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash-mark{width:132px;height:114px;filter:drop-shadow(0 0 28px rgba(201,168,76,.28))}
.splash-mark .band{opacity:0;animation:bandIn .9s var(--e) forwards}
.splash-mark .b1{animation-delay:.05s}
.splash-mark .b2{animation-delay:.18s}
.splash-mark .b3{animation-delay:.31s}
.splash-mark .sheen{animation:sheen 1.6s .55s var(--e) forwards;transform:translateX(-420px);opacity:0}
@keyframes bandIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sheen{from{transform:translateX(-420px);opacity:.9}to{transform:translateX(1400px);opacity:0}}
.splash-word{text-align:center}
.splash-name{font-family:var(--sf);font-size:2.4rem;letter-spacing:.24em;color:var(--gdl);display:flex;gap:8px;justify-content:center}
.splash-name b{font-weight:300;opacity:0;animation:letterIn .5s var(--e) forwards}
.splash-name b:nth-child(1){animation-delay:.55s}
.splash-name b:nth-child(2){animation-delay:.66s}
.splash-name b:nth-child(3){animation-delay:.77s}
.splash-name b:nth-child(4){animation-delay:.88s}
@keyframes letterIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.splash-sub{font-family:var(--mn);font-size:.55rem;letter-spacing:.5em;color:var(--tx3);margin-top:6px;opacity:0;animation:letterIn .6s 1.05s var(--e) forwards}

/* ═══════════════════════════════════════════════════════════════════
   LOGIN
   ═══════════════════════════════════════════════════════════════════ */
.login-wrap{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 600px at 50% 30%, rgba(201,168,76,.07), transparent 60%),var(--bg);
  padding:max(20px,var(--safe-top)) max(20px,var(--safe-right)) max(20px,var(--safe-bottom)) max(20px,var(--safe-left));overflow-y:auto;
}
.login-card{
  width:100%;max-width:400px;background:var(--card);border:1px solid var(--card-line);
  border-radius:var(--radius-l);padding:36px 30px;text-align:center;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 24px 80px rgba(0,0,0,.5);margin:auto;
}
.login-logo{width:56px;height:48px;margin:0 auto 18px;filter:drop-shadow(0 0 14px rgba(201,168,76,.3))}
.login-title{font-family:var(--sf);font-size:1.6rem;margin-bottom:6px}
.login-title em{font-style:italic;color:var(--gdl);font-weight:300}
.login-sub{color:var(--tx3);font-family:var(--mn);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px}
.google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:12px;border:1px solid var(--ln2);border-radius:8px;background:rgba(255,255,255,.03);
  color:var(--tx);font-size:.88rem;transition:all .2s;margin-bottom:18px;
}
.google-btn:hover{border-color:var(--ln3);background:rgba(255,255,255,.05)}
.google-btn svg{width:18px;height:18px}
.google-btn:disabled{opacity:.6;cursor:wait}
.divider{
  display:flex;align-items:center;gap:12px;color:var(--tx4);
  font-family:var(--mn);font-size:.5rem;letter-spacing:.3em;margin:18px 0;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.login-links{display:flex;justify-content:space-between;margin-top:18px}
.login-link{color:var(--tx3);font-size:.78rem;padding:4px 0;background:none;border:none;cursor:pointer}
.login-link:hover{color:var(--gdl)}
.login-legal{margin-top:22px;color:var(--tx4);font-size:.68rem;font-family:var(--mn);letter-spacing:.08em}

/* ═══════════════════════════════════════════════════════════════════
   SUPPORT ORB — added so holders have a distinct support entry point
   ═══════════════════════════════════════════════════════════════════ */
#support-orb{
  position:fixed;right:20px;bottom:86px;width:56px;height:56px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%, rgba(139,122,255,.20), rgba(139,122,255,.06) 45%, transparent 72%),
    rgba(7,8,10,.85);
  border:1px solid rgba(139,122,255,.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:300;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:all .25s var(--spring);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
#support-orb:hover{transform:scale(1.06);box-shadow:0 12px 42px rgba(0,0,0,.5), 0 0 0 6px rgba(139,122,255,.15)}
#support-orb .orb-mark{width:28px;height:28px;position:relative;z-index:1}
#support-orb .orb-ring{
  position:absolute;inset:-3px;border-radius:50%;border:1px solid transparent;
  background:conic-gradient(from 0deg, transparent, rgba(139,122,255,.5), transparent) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:orbSpin 8s linear infinite;pointer-events:none;
}
#support-orb .orb-glass{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.16), transparent 42%);pointer-events:none}
#support-orb .orb-label{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-family:var(--mn);font-size:.44rem;letter-spacing:.16em;color:var(--tx3);
  white-space:nowrap;opacity:0;transition:opacity .2s;
}
#support-orb:hover .orb-label{opacity:1}
/* ═══════════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:7px;font-size:.82rem;font-weight:500;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);
  cursor:pointer;transition:all .18s;white-space:nowrap;font-family:var(--font);
}
.btn:hover{background:rgba(255,255,255,.06);border-color:var(--line-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--gg);color:#1a0a0a;border-color:transparent;font-weight:600}
.btn-p:hover{filter:brightness(1.08);background:var(--gg)}
.btn-g{background:transparent;border-color:var(--ln2);color:var(--tx-2)}
.btn-g:hover{border-color:var(--ln3);color:var(--tx);background:rgba(201,168,76,.06)}
.btn-gd{background:rgba(201,168,76,.12);border-color:var(--ln3);color:var(--gdl)}
.btn-gd:hover{background:rgba(201,168,76,.2);color:var(--gold-hi)}
.btn-r{background:rgba(217,70,90,.1);border-color:rgba(217,70,90,.35);color:var(--rd)}
.btn-r:hover{background:rgba(217,70,90,.18);color:var(--down)}
.btn-b{width:100%}
.btn-sm{padding:6px 10px;font-size:.76rem}
.btn-xs{padding:3px 7px;font-size:.68rem;border-radius:5px}

/* ═══════════════════════════════════════════════════════════════════
   CHIPS & BADGES
   ═══════════════════════════════════════════════════════════════════ */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;
  font-family:var(--mn);font-size:.5rem;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(255,255,255,.05);color:var(--tx3);border:1px solid transparent;
}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
.chip.live{color:var(--up);background:rgba(111,212,154,.1);border-color:rgba(111,212,154,.25)}
.chip.live i{box-shadow:0 0 6px var(--up);animation:pulse 2s infinite}
.chip.blocked{color:var(--tx3);background:rgba(255,255,255,.03)}
.chip.file{color:var(--gd);background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3)}
.bdg{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;
  font-family:var(--mn);font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.05);color:var(--tx3);
}
.bdg.gr{background:rgba(111,212,154,.13);color:var(--up)}
.bdg.rd{background:rgba(217,70,90,.14);color:var(--rd)}
.bdg.gd{background:rgba(201,168,76,.15);color:var(--gdl)}
.bdg.nt{background:rgba(139,122,255,.13);color:var(--vi)}

/* ═══════════════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════════════ */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{margin-top:3px}
.ph p{font-size:.88rem;color:var(--tx2);margin-top:4px;max-width:620px}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap}
.eb{font-family:var(--mn);font-size:.52rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tx3)}
.grid{display:grid;gap:18px;margin-bottom:18px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.grid.cols-2{grid-template-columns:1fr}}
.band{
  background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-m);
  padding:18px;margin-bottom:18px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.band-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);
}
.band-head h2{font-size:.95rem;letter-spacing:-.01em}
.band-head h3{font-size:.86rem;color:var(--tx-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.st{
  background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-m);
  padding:14px 16px;display:flex;flex-direction:column;gap:3px;
}
.st .l{font-family:var(--mn);font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.st .v{font-family:var(--sf);font-size:1.35rem;font-weight:400;color:var(--tx);letter-spacing:-.02em}
.st .v.gd{color:var(--gdl)}
.st .v.gr{color:var(--up)}
.st .v.sm{color:var(--ember)}
.st .n{font-family:var(--mn);font-size:.56rem;color:var(--tx4);text-transform:uppercase;letter-spacing:.08em}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 4px;border-bottom:1px solid var(--line-soft);width:100%;
  text-align:left;cursor:pointer;background:none;border-left:none;border-right:none;
  border-top:none;color:inherit;font:inherit;transition:background .15s;
}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(255,255,255,.02)}
.row-l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.row-l b{font-size:.86rem;font-weight:500;color:var(--tx)}
.row-r{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:.84rem}
.rw{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);
}
.rw:last-child{border-bottom:none}
.rw-l{color:var(--tx3);font-size:.8rem}
.rw-v{color:var(--tx);font-size:.85rem;text-align:right;word-break:break-word}
.crd{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-m);transition:border-color .2s}
.crd:hover{border-color:var(--ln2)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{
  font-size:.78rem;color:var(--tx3);margin-top:12px;padding:10px 12px;
  background:rgba(255,255,255,.02);border-left:2px solid var(--line);
  border-radius:0 6px 6px 0;
}
.note.warn{color:var(--wn);border-left-color:var(--wn);background:rgba(245,165,36,.06)}
.emp{padding:20px;text-align:center;color:var(--tx3);font-size:.84rem}

/* ═══════════════════════════════════════════════════════════════════
   FORMS
   ═══════════════════════════════════════════════════════════════════ */
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-family:var(--mn);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.ff input,.ff select,.ff textarea{
  width:100%;padding:9px 11px;background:rgba(0,0,0,.32);
  border:1px solid var(--line);border-radius:6px;color:var(--tx);
  font-size:.85rem;transition:border-color .18s, background .18s;font-family:var(--font);
}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--ln3);background:rgba(0,0,0,.45);outline:none}
.ff input::placeholder,.ff textarea::placeholder{color:var(--tx4)}
.ff textarea{resize:vertical;min-height:80px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{
  display:flex;flex-direction:column;gap:5px;
  font-family:var(--mn);font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);
}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;background:rgba(0,0,0,.32);
  border:1px solid var(--line);border-radius:6px;color:var(--tx);
  font-size:.85rem;font-family:var(--font);text-transform:none;letter-spacing:normal;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ln3);background:rgba(0,0,0,.45);outline:none}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .fc{grid-column:1/-1}
@media (max-width:600px){.fg{grid-template-columns:1fr}}
.steps{list-style:none;counter-reset:s;margin-top:14px}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 40px;border-bottom:1px solid var(--line-soft)}
.steps li:last-child{border-bottom:none}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;
  border-radius:50%;background:var(--gg);color:#1a0a0a;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.7rem;font-family:var(--mn);
}
.quiz-opt{
  display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;cursor:pointer;transition:all .15s;font-size:.86rem;
}
.quiz-opt:hover{border-color:var(--ln2);background:rgba(255,255,255,.02)}
.quiz-opt.on{border-color:var(--gd);background:rgba(201,168,76,.08)}
.quiz-opt.ok{border-color:var(--gr);background:rgba(61,220,151,.08)}
.quiz-opt.bad{border-color:var(--rd);background:rgba(217,70,90,.08)}

/* ═══════════════════════════════════════════════════════════════════
   TABLES
   ═══════════════════════════════════════════════════════════════════ */
.scroll-x{overflow-x:auto;margin:0 -18px;padding:0 18px}
.pos{width:100%;border-collapse:collapse;font-size:.8rem}
.pos thead th{
  text-align:left;padding:9px 10px;font-family:var(--mn);font-size:.5rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);
  border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap;
}
.pos tbody td{padding:10px;border-bottom:1px solid var(--line-soft);color:var(--tx-2);vertical-align:middle}
.pos tbody tr:hover{background:rgba(255,255,255,.015)}
.pos tbody tr.macro td:first-child{border-left:2px solid var(--gd)}
.pos tbody tr.hedge td:first-child{border-left:2px solid var(--vi)}
.pos td.right,.pos th.right{text-align:right}
.pos td .bdg{margin-right:4px}
.pos td b{color:var(--tx);font-weight:500}
.acts{display:flex;gap:5px}

/* ═══════════════════════════════════════════════════════════════════
   EVENTS & LOGS
   ═══════════════════════════════════════════════════════════════════ */
.events{list-style:none;display:flex;flex-direction:column}
.events li{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:.82rem;
}
.events li:last-child{border-bottom:none}
.events li>span:first-child{flex:1;min-width:0;color:var(--tx-2)}
.events li b{color:var(--tx);font-weight:500}
.events .meta{flex-shrink:0;font-size:.72rem}
.log{font-family:var(--mn);font-size:.72rem;line-height:1.9;color:var(--tx3);max-height:280px;overflow-y:auto}
.log>div{display:flex;gap:12px}
.log .t{color:var(--tx4);flex-shrink:0}
.log .ok{color:var(--up)}
.log .warn{color:var(--wn)}
.log .err{color:var(--rd)}

/* ═══════════════════════════════════════════════════════════════════
   HEALTH
   ═══════════════════════════════════════════════════════════════════ */
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.hs{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 11px;border-radius:6px;background:rgba(255,255,255,.02);
  border-left:2px solid var(--line);
}
.hs span{font-size:.72rem;color:var(--tx3)}
.hs b{font-family:var(--mn);font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.hs.ok{border-left-color:var(--gr)}
.hs.ok b{color:var(--up)}
.hs.idle{border-left-color:var(--tx4)}
.hs.idle b{color:var(--tx3)}
.hs.bad{border-left-color:var(--rd)}
.hs.bad b{color:var(--rd)}

/* ═══════════════════════════════════════════════════════════════════
   CHECKS
   ═══════════════════════════════════════════════════════════════════ */
.checks{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:.82rem}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;color:var(--tx-2)}
.checks li b{flex-shrink:0;width:14px;text-align:center}
.ck-ok b{color:var(--up)}
.ck-no b{color:var(--rd)}
.ck-no{color:var(--tx3)}
.twostep{margin-top:12px;padding:14px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px}
.twostep h3{margin-bottom:10px;font-size:.85rem}

/* ═══════════════════════════════════════════════════════════════════
   PNL BLOCKS
   ═══════════════════════════════════════════════════════════════════ */
.pnl{background:var(--card);border:1px solid var(--card-line);border-radius:var(--radius-m);margin-bottom:18px;overflow:hidden}
.pnl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.pnl-h h3{font-family:var(--mn);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gdl)}
.pnl-h .hint{font-family:var(--mn);font-size:.55rem;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase}
.pnl-b.fl{padding:0}
.pnl-b.fl .pos{padding:0 18px}
.pnl-b.fl .rw{padding-left:18px;padding-right:18px}

/* ═══════════════════════════════════════════════════════════════════
   MODAL — hardened so backdrop click never closes when a child is hit
   ═══════════════════════════════════════════════════════════════════ */
.mb{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.mb.on{display:flex;animation:fadeIn .2s var(--e)}
.mb{padding:max(20px,var(--safe-top)) max(20px,var(--safe-right)) max(20px,var(--safe-bottom)) max(20px,var(--safe-left))}
.mb .mdl{max-height:calc(100dvh - max(20px,var(--safe-top)) - max(20px,var(--safe-bottom)))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mdl{
  width:100%;max-width:520px;max-height:88vh;background:var(--srf);
  border:1px solid var(--line);border-radius:var(--radius-l);
  box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden;
  display:flex;flex-direction:column;animation:modalIn .25s var(--spring);
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.mh h3{font-size:1rem}
.mc{width:28px;height:28px;border-radius:6px;font-size:1.3rem;line-height:1;color:var(--tx3);display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer}
.mc:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.mbd{padding:18px 20px;overflow-y:auto}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════════════
   SHEET
   ═══════════════════════════════════════════════════════════════════ */
#sheet-root{position:fixed;inset:0;z-index:520;display:none}
#sheet-root.on{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{
  position:absolute;right:0;top:0;bottom:0;width:100%;max-width:440px;
  background:var(--srf);border-left:1px solid var(--line);
  display:flex;flex-direction:column;animation:sheetIn .3s var(--spring);
}
@keyframes sheetIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.sheet{padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
.sheet-head h3{font-size:1rem}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px}

/* ═══════════════════════════════════════════════════════════════════
   CHART
   ═══════════════════════════════════════════════════════════════════ */
.cwrap{
  position:relative;width:100%;height:min(60vh,620px);min-height:360px;
  border:1px solid var(--line-soft);border-radius:var(--radius-m);
  overflow:hidden;margin-bottom:12px;
}
.cwrap canvas{display:block;width:100%;height:100%}
.hud{
  position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:4px;
  font-family:var(--mn);font-size:.6rem;letter-spacing:.04em;color:var(--tx2);
  background:rgba(7,8,10,.65);padding:9px 11px;border-radius:6px;
  border:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:none;max-width:280px;
}
.hud .k{color:var(--tx4);margin-right:6px}
.hud .v{color:var(--tx)}
.hud .gd{color:var(--gdl)}
.hud .vi{color:var(--vi)}
.clg{
  position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;
  font-family:var(--mn);font-size:.52rem;color:var(--tx3);
  background:rgba(7,8,10,.6);padding:8px 10px;border-radius:6px;
  border:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:none;
}
.clg>div{display:flex;align-items:center;gap:6px}
.clg .sw{width:11px;height:2px;border-radius:2px;display:inline-block}
.cstat{
  position:absolute;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:10px;
  font-family:var(--mn);font-size:.52rem;color:var(--tx3);
  background:rgba(7,8,10,.6);padding:8px 11px;border-radius:6px;
  border:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:none;max-width:calc(100% - 24px);
}
.cstat .f100{color:var(--f100)}
.cstat .f0{color:var(--f0)}
.cstat .in{color:var(--vi)}
.cstat .ch{color:var(--gd)}
.ctb{
  display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);
  border:1px solid var(--card-line);border-radius:var(--radius-m);
  margin-bottom:12px;flex-wrap:wrap;overflow-x:auto;
}
.ctb-sel{
  padding:6px 11px;background:rgba(0,0,0,.35);border:1px solid var(--ln2);
  border-radius:6px;font-size:.8rem;color:var(--tx);cursor:pointer;font-family:var(--font);
}
.ctb-sel:hover{border-color:var(--ln3)}
.ctg{display:flex;gap:3px;background:rgba(0,0,0,.25);padding:3px;border-radius:7px}
.ctb-btn{
  padding:5px 9px;border-radius:5px;font-family:var(--mn);font-size:.55rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);
  cursor:pointer;transition:all .15s;background:none;border:none;
}
.ctb-btn:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.ctb-btn.on{color:var(--gdl);background:rgba(201,168,76,.14)}
.ctb-sep{width:1px;height:22px;background:var(--line);flex-shrink:0}
.pres{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pres:hover{border-color:var(--ln3)}
.pres.on{border-color:var(--gd);box-shadow:0 0 0 2px rgba(201,168,76,.2)}
.chip-swatch{width:12px;height:12px;border-radius:3px;display:block}
.chart-foot{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.chart-foot input[type=range]{flex:1;min-width:140px;accent-color:var(--gd);height:4px}

/* ═══════════════════════════════════════════════════════════════════
   COMMS
   ═══════════════════════════════════════════════════════════════════ */
.cm-msgs{display:flex;flex-direction:column;gap:12px;padding:14px 0;max-height:60vh;overflow-y:auto;margin:0 -4px}
.cmm{display:flex;gap:9px;align-items:flex-end}
.cmm.me{flex-direction:row-reverse}
.cmm-a{
  width:28px;height:28px;border-radius:50%;background:var(--gg);color:#1a0a0a;
  display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;
  background-size:cover;background-position:center;
}
.cmm-b{max-width:74%;display:flex;flex-direction:column;gap:3px}
.cmm-f{font-family:var(--mn);font-size:.55rem;color:var(--gdl);letter-spacing:.06em;text-transform:uppercase}
.cmm-t{
  padding:9px 13px;border-radius:14px;background:rgba(255,255,255,.05);
  font-size:.86rem;line-height:1.45;color:var(--tx);word-break:break-word;
  border:1px solid var(--line-soft);
}
.cmm.me .cmm-t{background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.08));border-color:rgba(201,168,76,.28);color:var(--tx)}
.cmm-time{font-family:var(--mn);font-size:.5rem;color:var(--tx4);letter-spacing:.04em}
.cmm.me .cmm-time{text-align:right}
.cm-input{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line-soft)}
.cm-input input{
  flex:1;padding:10px 13px;background:rgba(0,0,0,.32);
  border:1px solid var(--line);border-radius:20px;color:var(--tx);font-size:.86rem;
}
.cm-input input:focus{border-color:var(--ln3);outline:none}
.cm-tabs{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  background:rgba(7,8,10,.94);border-top:1px solid var(--line-soft);
  display:none;align-items:stretch;justify-content:space-around;z-index:80;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:0 var(--safe-right) var(--safe-bottom) var(--safe-left);
}
.cm-tabs.on{display:flex}
.cm-tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--mn);font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);position:relative;padding:8px 4px;background:none;border:none;cursor:pointer;
}
.cm-tabs button svg{width:20px;height:20px}
.cm-tabs button[aria-current="page"]{color:var(--gdl)}
.nav-ind{position:absolute;top:0;height:2px;background:var(--gd);transition:all .3s var(--e);border-radius:0 0 2px 2px}
.tab-badge{
  position:absolute;top:6px;right:calc(50% - 22px);background:var(--rd);color:#fff;
  font-size:.5rem;font-weight:700;padding:1px 5px;border-radius:99px;min-width:16px;
  text-align:center;font-family:var(--mn);display:none;
}
.comm-peer-live{width:6px;height:6px;border-radius:50%;background:var(--tx4);flex-shrink:0}
.comm-peer-live.on{background:var(--up);box-shadow:0 0 5px var(--up)}

/* ═══════════════════════════════════════════════════════════════════
   WALLET
   ═══════════════════════════════════════════════════════════════════ */
.phrase-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;
  margin-top:14px;padding:14px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);border-radius:8px;
}
.pw{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:rgba(255,255,255,.03);border-radius:6px;
  font-family:var(--mn);font-size:.78rem;color:var(--tx);
}
.pw-n{color:var(--tx4);font-size:.6rem;min-width:18px}
.addr-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.addr-row:last-child{border-bottom:none}
.addr{font-family:var(--mn);font-size:.72rem;color:var(--tx2);word-break:break-all;margin-top:3px;letter-spacing:.02em}
.asset{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.asset:last-child{border-bottom:none}
.asset-mark{
  width:34px;height:34px;border-radius:50%;background:rgba(201,168,76,.13);
  color:var(--gdl);display:flex;align-items:center;justify-content:center;
  font-family:var(--mn);font-size:.55rem;font-weight:600;letter-spacing:.04em;flex-shrink:0;
}
.asset-l{flex:1;display:flex;flex-direction:column;gap:2px}
.asset-l b{font-size:.85rem;font-weight:500}
.asset-r{text-align:right;display:flex;flex-direction:column;gap:2px}
.asset-r b{font-family:var(--mn);font-size:.9rem;color:var(--tx)}

/* ═══════════════════════════════════════════════════════════════════
   ACADEMY
   ═══════════════════════════════════════════════════════════════════ */
.kb{border-bottom:1px solid var(--line-soft);padding:11px 0}
.kb:last-child{border-bottom:none}
.kb summary{cursor:pointer;color:var(--tx);font-size:.88rem;padding:2px 0}
.kb summary:hover{color:var(--gdl)}
.kb p{font-size:.83rem;color:var(--tx2);line-height:1.65}

/* ═══════════════════════════════════════════════════════════════════
   O.I. ORB + PANEL
   ═══════════════════════════════════════════════════════════════════ */
#oi-orb{
  position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%, rgba(236,210,138,.22), rgba(201,168,76,.08) 45%, transparent 72%),
    rgba(7,8,10,.85);
  border:1px solid var(--ln3);display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:300;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:all .25s var(--spring);
  box-shadow:0 8px 32px rgba(0,0,0,.4), 0 0 0 0 rgba(201,168,76,.2);
}
#oi-orb:hover{transform:scale(1.06);box-shadow:0 12px 42px rgba(0,0,0,.5), 0 0 0 6px rgba(201,168,76,.12)}
.orb-ring{
  position:absolute;inset:-3px;border-radius:50%;border:1px solid transparent;
  background:conic-gradient(from 0deg, transparent, rgba(201,168,76,.5), transparent) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:orbSpin 8s linear infinite;pointer-events:none;
}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.orb-glass{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.16), transparent 42%);pointer-events:none}
.orb-mark{width:26px;height:22.5px;position:relative;z-index:1}
.orb-label{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font-family:var(--mn);font-size:.44rem;letter-spacing:.16em;color:var(--tx3);
  white-space:nowrap;opacity:0;transition:opacity .2s;
}
#oi-orb:hover .orb-label{opacity:1}
/* Chart helpers live in its toolbar so floating buttons cannot capture axis drags. */
body.chart-view #oi-orb,body.chart-view #support-orb{display:none}
#oi-root{
  position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:flex-end;padding:20px;
}
#oi-root.on{display:flex;animation:fadeIn .2s var(--e)}
.oi-panel{
  width:100%;max-width:480px;height:min(78vh,720px);background:var(--srf);
  border:1px solid var(--line);border-radius:var(--radius-l);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.65);animation:oiIn .28s var(--spring);
}
@keyframes oiIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.oi-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);background:rgba(0,0,0,.2);
}
.oi-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.oi-q{
  align-self:flex-end;max-width:85%;padding:10px 14px;
  background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.08));
  border:1px solid rgba(201,168,76,.28);border-radius:14px;
  font-size:.86rem;color:var(--tx);
}
.oi-a{align-self:flex-start;max-width:92%;display:flex;flex-direction:column;gap:6px}
.oi-agents{display:flex;gap:5px;flex-wrap:wrap}
.oi-text{
  padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);
  border-radius:12px;font-size:.85rem;line-height:1.6;color:var(--tx-2);
  white-space:pre-wrap;word-break:break-word;
}
.oi-trace{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mn);font-size:.5rem;color:var(--tx4);letter-spacing:.05em}
.oi-empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.85rem}
.oi-busy{text-align:center;color:var(--gdl);font-family:var(--mn);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase}
.oi-in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft);background:rgba(0,0,0,.2)}
.oi-in input{
  flex:1;padding:10px 13px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);border-radius:20px;color:var(--tx);font-size:.86rem;
}
.oi-in input:focus{border-color:var(--ln3);outline:none}

/* ═══════════════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════════════ */
.tsts{position:fixed;top:calc(var(--chrome-height) + 12px);right:max(16px,var(--safe-right));max-width:calc(100vw - var(--safe-left) - var(--safe-right) - 32px);z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tst{
  padding:10px 14px;background:var(--srf);border:1px solid var(--line);
  border-left:3px solid var(--tx3);border-radius:8px;font-size:.82rem;color:var(--tx);
  min-width:220px;max-width:340px;box-shadow:0 12px 32px rgba(0,0,0,.5);
  animation:toastIn .3s var(--spring);pointer-events:none; /* Status notifications must never swallow underlying mobile taps */
}
.tst.ok{border-left-color:var(--gr)}
.tst.err{border-left-color:var(--rd)}
.tst.warn{border-left-color:var(--wn)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════════════════════════════
   STATUS TOKENS
   ═══════════════════════════════════════════════════════════════════ */
.tstate{
  display:inline-block;padding:1px 6px;border-radius:4px;
  font-family:var(--mn);font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.05);color:var(--tx3);
}
.ts-armed{background:rgba(61,220,151,.14);color:var(--up)}
.ts-invalidated{background:rgba(217,70,90,.14);color:var(--rd)}
.ts-searching{background:rgba(255,255,255,.04);color:var(--tx3)}
.ts-test,.ts-touch{background:rgba(245,165,36,.13);color:var(--wn)}
.ts-rejection,.ts-sweep{background:rgba(139,122,255,.14);color:var(--vi)}
.ts-confirmation{background:rgba(91,141,239,.14);color:var(--bl)}

/* ═══════════════════════════════════════════════════════════════════
   REALTIME BADGE + HAPTIC PULSE
   ═══════════════════════════════════════════════════════════════════ */
.rt-badge{
  position:fixed;top:calc(var(--chrome-height) + 8px);left:calc(var(--sw) + var(--safe-left) + 12px);z-index:70;
  display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  background:rgba(7,8,10,.75);border:1px solid rgba(111,212,154,.3);
  font-family:var(--mn);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--up);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;
}
.rt-dot{width:5px;height:5px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up);animation:pulse 2s infinite}
.rt-badge.off{border-color:rgba(255,255,255,.1);color:var(--tx3)}
.rt-badge.off .rt-dot{background:var(--tx3);box-shadow:none;animation:none}
@keyframes haptic-shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-3px)}
  40%{transform:translateX(3px)}
  60%{transform:translateX(-2px)}
  80%{transform:translateX(2px)}
}
.pulse-alert{animation:haptic-shake .5s cubic-bezier(.36,.07,.19,.97) both}
@media (max-width:900px){.rt-badge{left:max(12px,var(--safe-left));top:calc(var(--chrome-height) + 6px)}}

/* ═══════════════════════════════════════════════════════════════════
   CALL OVERLAY
   ═══════════════════════════════════════════════════════════════════ */
#call-root{
  position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:20px;
}
#call-root.on{display:flex}
.call-card{
  width:100%;max-width:380px;
  background:linear-gradient(180deg,rgba(20,22,28,.98),rgba(10,11,14,.98));
  border:1px solid var(--line);border-radius:22px;padding:32px 26px;text-align:center;
  box-shadow:0 40px 120px rgba(0,0,0,.8);animation:callIn .28s var(--spring);
}
@keyframes callIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.call-av{
  width:88px;height:88px;border-radius:50%;background:var(--gg);color:#1a0a0a;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sf);font-size:2rem;font-weight:300;margin:0 auto 18px;position:relative;
}
.call-av::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(201,168,76,.3);animation:callPulse 2s infinite}
@keyframes callPulse{0%{transform:scale(1);opacity:.6}70%{transform:scale(1.15);opacity:0}100%{transform:scale(1);opacity:0}}
.call-name{font-family:var(--sf);font-size:1.35rem;color:var(--tx);margin-bottom:6px}
.call-status{font-family:var(--mn);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);margin-bottom:26px}
.call-status.ring{color:var(--wn)}
.call-status.live{color:var(--up)}
.call-status.end{color:var(--rd)}
.call-actions{display:flex;gap:14px;justify-content:center}
.call-btn{
  width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;transition:transform .15s;
}
.call-btn:hover{transform:scale(1.08)}
.call-btn:active{transform:scale(.96)}
.call-btn svg{width:26px;height:26px;fill:#fff}
.call-btn.accept{background:linear-gradient(135deg,#3ddc97,#2aa876)}
.call-btn.decline{background:linear-gradient(135deg,#d9465a,#a63448)}
.call-btn.mute{background:rgba(255,255,255,.09)}
.call-btn.mute.off{background:rgba(217,70,90,.4)}
.call-timer{font-family:var(--mn);font-size:1.1rem;color:var(--tx2);letter-spacing:.08em;margin-top:12px}

/* ═══════════════════════════════════════════════════════════════════
   HOLDER STRIP
   ═══════════════════════════════════════════════════════════════════ */
.holder-strip{
  display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:18px;
  background:linear-gradient(135deg,rgba(201,168,76,.09),rgba(201,168,76,.02));
  border:1px solid var(--ln2);border-radius:var(--radius-m);
}
.holder-strip .hs-av{
  width:44px;height:44px;border-radius:50%;background:var(--gg);color:#1a0a0a;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sf);font-size:1.1rem;font-weight:400;flex-shrink:0;
  background-size:cover;background-position:center;
}
.holder-strip .hs-l{flex:1;min-width:0}
.holder-strip .hs-l b{display:block;font-size:.95rem;color:var(--tx);margin-bottom:2px}
.holder-strip .hs-l span{font-family:var(--mn);font-size:.6rem;letter-spacing:.08em;color:var(--tx3)}
.holder-strip .hs-r{display:flex;gap:8px;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════════════
   INVITE CARD
   ═══════════════════════════════════════════════════════════════════ */
.invite-card{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--line-soft);margin-bottom:10px;
}
.invite-card .ic-code{font-family:var(--mn);font-size:.9rem;color:var(--gdl);letter-spacing:.06em;flex:1;word-break:break-all}
.invite-card .ic-meta{font-family:var(--mn);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-top:4px}
.invite-card .ic-acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.invite-card.used{opacity:.55}

/* ═══════════════════════════════════════════════════════════════════
   USER PICKER
   ═══════════════════════════════════════════════════════════════════ */
.up-list{max-height:300px;overflow-y:auto;margin:0 -4px}
.up-row{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
  cursor:pointer;transition:background .15s;border:none;background:none;
  width:100%;text-align:left;color:inherit;font:inherit;
}
.up-row:hover{background:rgba(255,255,255,.04)}
.up-row.on{background:rgba(201,168,76,.12);border:1px solid var(--ln2)}
.up-row:disabled{opacity:.4;cursor:not-allowed}
.up-av{
  width:34px;height:34px;border-radius:50%;background:var(--gg);color:#1a0a0a;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;flex-shrink:0;position:relative;
  background-size:cover;background-position:center;
}
.up-av .on-dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--tx4);border:2px solid var(--srf)}
.up-av .on-dot.live{background:var(--up);box-shadow:0 0 6px var(--up)}
.up-info{flex:1;min-width:0}
.up-info b{display:block;font-size:.86rem;color:var(--tx);font-weight:500}
.up-info span{font-family:var(--mn);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}

/* ═══════════════════════════════════════════════════════════════════
   TIER PICKER
   ═══════════════════════════════════════════════════════════════════ */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.tier-opt{
  padding:12px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.02);cursor:pointer;text-align:left;transition:all .15s;
}
.tier-opt:hover{border-color:var(--ln2);background:rgba(255,255,255,.04)}
.tier-opt.on{border-color:var(--gd);background:rgba(201,168,76,.1)}
.tier-opt b{display:block;font-family:var(--mn);font-size:.7rem;color:var(--gdl);letter-spacing:.08em}
.tier-opt span{display:block;font-size:.78rem;color:var(--tx2);margin-top:3px}
.tier-opt em{display:block;font-family:var(--mn);font-size:.55rem;color:var(--tx3);font-style:normal;margin-top:4px}

/* ═══════════════════════════════════════════════════════════════════
   ROLE PICKER
   ═══════════════════════════════════════════════════════════════════ */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.role-grid{grid-template-columns:1fr}}
.role-opt{
  padding:11px 13px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.02);cursor:pointer;text-align:left;transition:all .15s;
}
.role-opt:hover{border-color:var(--ln2)}
.role-opt.on{border-color:var(--gd);background:rgba(201,168,76,.1)}
.role-opt b{display:block;font-size:.82rem;color:var(--tx);font-weight:500}
.role-opt span{display:block;font-family:var(--mn);font-size:.52rem;color:var(--tx3);margin-top:3px;letter-spacing:.06em}

/* ═══════════════════════════════════════════════════════════════════
   UNITS PREVIEW
   ═══════════════════════════════════════════════════════════════════ */
.units-preview{
  margin-top:12px;padding:12px;border-radius:8px;
  background:rgba(139,122,255,.06);border:1px solid rgba(139,122,255,.2);
  font-family:var(--mn);font-size:.7rem;color:var(--tx2);line-height:1.7;
}
.units-preview b{color:var(--vi)}
.units-preview .warn{color:var(--rd)}

/* ═══════════════════════════════════════════════════════════════════
   MOBILE
   ═══════════════════════════════════════════════════════════════════ */
@media (max-width:900px){
  .mob{display:flex}
  .tbc{display:none}
  .sb{transform:translateX(-100%);max-width:calc(100vw - var(--safe-right) - 56px);pointer-events:none}
  .sb.open{transform:translateX(0);pointer-events:auto}
  #sbBackdrop:not([hidden]){display:block;position:fixed;inset:var(--chrome-height) 0 0;z-index:119;background:rgba(0,0,0,.6);cursor:pointer;touch-action:manipulation}
  body.mobile-menu-open{overflow:hidden}
  .slink{min-height:44px}
  main.mn{margin-left:0;padding:16px max(14px,var(--safe-right)) calc(80px + var(--safe-bottom)) max(14px,var(--safe-left))}
  #oi-orb{bottom:76px;right:14px;width:50px;height:50px}
  #support-orb{bottom:134px;right:14px;width:50px;height:50px}
  .cm-tabs.on ~ main.mn{padding-bottom:80px}
  .scroll-x{margin:0 -14px;padding:0 14px}
  .cwrap{height:52vh;min-height:320px}
  .hud{font-size:.55rem;max-width:220px}
  .mdl{max-width:100%}
  .sheet{max-width:100%}
  #oi-root{padding:10px;align-items:flex-end}
  .oi-panel{max-width:100%}
}

@media(prefers-reduced-motion:reduce){.sb{transition:none}}

/* ═══════════════════════════════════════════════════════════════════
   PRINT
   ═══════════════════════════════════════════════════════════════════ */
@media print{
  body>*{display:none!important}
  #view{display:block!important}
  .band{border:1px solid #ccc}
}

/* VICE4X 1.3.5 — consolidated portfolio + functional overlays */
.portfolio-hero{position:relative;padding:26px clamp(18px,3.2vw,40px);margin:0 0 18px;
  border:1px solid rgba(201,168,76,.38);border-radius:14px;
  background:linear-gradient(115deg,rgba(201,168,76,.115),rgba(11,12,16,.9) 55%,rgba(201,168,76,.055));
  overflow:hidden;box-shadow:0 14px 54px rgba(0,0,0,.12)}
.portfolio-hero:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,#c9a84c,transparent)}
.portfolio-hero-label{font:600 .7rem/1.5 var(--mn);letter-spacing:.22em;color:var(--gdl)}
.portfolio-hero-number{font:500 clamp(2.15rem,5.2vw,4.25rem)/1.16 var(--font);font-variant-numeric:tabular-nums;
  letter-spacing:-.055em;color:var(--tx);margin:12px 0 8px;overflow-wrap:anywhere;cursor:zoom-in;user-select:none}
.portfolio-hero-number:focus-visible{outline:2px solid var(--gd);outline-offset:5px}
.portfolio-hero-actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script type="module">
  /* Load the wallet crypto library (ESM only) and expose it as window.ViceWallet */
  try {
    const [bip39, bip32, secp, hashes] = await Promise.all([
      import('https://esm.sh/@scure/bip39@1.3.0'),
      import('https://esm.sh/@scure/bip32@1.4.0'),
      import('https://esm.sh/@noble/secp256k1@2.1.0'),
      import('https://esm.sh/@noble/hashes@1.4.0/sha3'),
    ]);
    const wordlist = (await import('https://esm.sh/@scure/bip39@1.3.0/wordlists/english')).wordlist;
    const sha2 = await import('https://esm.sh/@noble/hashes@1.4.0/sha256');
    const rip = await import('https://esm.sh/@noble/hashes@1.4.0/ripemd160');
    const cryptoHashes = {keccak_256:hashes.keccak_256,sha256:sha2.sha256,ripemd160:rip.ripemd160};

    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const toB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
    const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    async function deriveKey(password, salt){
      const base = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name:'PBKDF2' }, false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' },
        base,
        { name:'AES-GCM', length:256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function sealPhrase(phrase, password){
      const normalized = bip39.normalize(phrase);
      if(!bip39.validateMnemonic(normalized, wordlist)) throw new Error('Invalid recovery phrase');
      const seed = bip39.mnemonicToSeedSync(normalized);
      const root = bip32.HDKey.fromMasterSeed(seed);
      const evmKey = root.derive("m/44'/60'/0'/0/0");
      const btcKey = root.derive("m/84'/0'/0'/0/0");
      const privBytes = evmKey.privateKey;
      const pubBytes = secp.getPublicKey(privBytes, false);
      const hash = cryptoHashes.keccak_256(pubBytes.slice(1));
      const evmAddress = '0x' + Array.from(hash.slice(-20)).map(b => b.toString(16).padStart(2,'0')).join('');
      const btcPrivBytes = btcKey.privateKey;
      const btcPubBytes = secp.getPublicKey(btcPrivBytes, true);
      const btcHash = cryptoHashes.ripemd160(cryptoHashes.sha256(btcPubBytes));
      const btcAddress = null; // Bech32 derivation not implemented: never show an invalid receive address.

      const vault = {
        v: 1,
        accounts: {
          evm: { address: evmAddress, path: "m/44'/60'/0'/0/0" },
          btc: { address: btcAddress, path: "m/84'/0'/0'/0/0" },
        },
        crypto: {},
      };

      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(normalized));
      vault.crypto = { salt: toB64(salt), iv: toB64(iv), ct: toB64(ct) };
      return vault;
    }

    async function openPhrase(vault, password){
      if(!vault || !vault.crypto) throw new Error('Corrupt vault');
      const salt = fromB64(vault.crypto.salt);
      const iv = fromB64(vault.crypto.iv);
      const ct = fromB64(vault.crypto.ct);
      const key = await deriveKey(password, salt);
      try {
        const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
        return dec.decode(pt);
      } catch(_) { throw new Error('Incorrect password'); }
    }

    function newPhrase(){ return bip39.generateMnemonic(wordlist, 256); }
    function normalizePhrase(phrase){ return bip39.normalize(phrase); }
    function isPhrase(input){
      try {
        const n = bip39.normalize(String(input || '').trim());
        return bip39.validateMnemonic(n, wordlist);
      } catch(_) { return false; }
    }
    function signMessage(phrase, msg){
      const seed = bip39.mnemonicToSeedSync(bip39.normalize(phrase));
      const root = bip32.HDKey.fromMasterSeed(seed);
      const key = root.derive("m/44'/60'/0'/0/0").privateKey;
      const hash = hashes.keccak_256(enc.encode(msg));
      const sig = secp.sign(hash, key);
      const sigBytes = sig.toCompactRawBytes ? sig.toCompactRawBytes() : sig;
      return '0x' + Array.from(sigBytes).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    window.ViceWallet = { newPhrase, normalizePhrase, isPhrase, sealPhrase, openPhrase, signMessage };
    window.ViceWalletHashes = cryptoHashes;
    window.dispatchEvent(new Event('vice-wallet-ready'));
  } catch(e) {

const PRETTY_ALIASES = {
  '^GSPC':'SPX','^NDX':'NDX','^DJI':'DJI','^RUT':'RUT','^FTSE':'FTSE','^N225':'N225','^HSI':'HSI',
  '^GDAXI':'DAX','^FCHI':'CAC','^STOXX50E':'SX5E','^VIX':'VIX',
  'GC=F':'GC','SI=F':'SI','CL=F':'CL','NG=F':'NG','HG=F':'HG',
  'ES=F':'ES','NQ=F':'NQ','YM=F':'YM','RTY=F':'RTY'
};
const YAHOO_INVERSE = {
  'SPX':'^GSPC','NDX':'^NDX','DJI':'^DJI','RUT':'^RUT','FTSE':'^FTSE','N225':'^N225','HSI':'^HSI',
  'DAX':'^GDAXI','CAC':'^FCHI','SX5E':'^STOXX50E','VIX':'^VIX',
  'GC':'GC=F','SI':'SI=F','CL':'CL=F','NG':'NG=F','HG':'HG=F',
  'ES':'ES=F','NQ':'NQ=F','YM':'YM=F','RTY':'RTY=F'
};
const CCY = ['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD','CNY','HKD','SEK','NOK','MXN','SGD','TRY','ZAR','INR','BRL','PLN','DKK','CZK','HUF','ILS','KRW','THB','PHP','IDR','MYR','RUB','SAR','AED'];
const looksLikeForex = s => s.length===6 && CCY.includes(s.slice(0,3)) && CCY.includes(s.slice(3));

function parseSymbol(sym){
  const s = String(sym||'').trim();
  if(!s) return { source:'BINANCE', ticker:'BTCUSDT' };
  if(s === 'PRACTICE') return { source:'PRACTICE', ticker:'PRACTICE' };
  if(s.includes(':')){ const [src,...rest]=s.split(':'); return { source:src.toUpperCase(), ticker:rest.join(':') }; }
  const u = s.toUpperCase();
  if(u.includes('/')){
    const [base,quote]=u.split('/');
    if(['USDT','BUSD','USDC','FDUSD'].includes(quote)) return { source:'BINANCE', ticker:base+quote };
    return { source:'YAHOO', ticker:base+quote+'=X' };
  }
  if(/(USDT|BUSD|USDC|FDUSD)$/.test(u) && u.length<=12) return { source:'BINANCE', ticker:u };
  if(YAHOO_INVERSE[u]) return { source:'YAHOO', ticker:YAHOO_INVERSE[u] };
  if(looksLikeForex(u)) return { source:'YAHOO', ticker:u+'=X' };
  return { source:'YAHOO', ticker:u };
}
function prettyTicker(source, ticker){
  if(source==='BINANCE') return ticker.replace(/(USDT|BUSD|USDC|FDUSD)$/, '/$1');
  if(PRETTY_ALIASES[ticker]) return PRETTY_ALIASES[ticker];
  if(ticker.endsWith('=X')) return ticker.slice(0,-2);
  if(ticker.endsWith('=F')) return ticker.slice(0,-2);
  if(ticker.startsWith('^')) return ticker.slice(1);
  return ticker;
}
function prettySymbol(pair){
  const { source, ticker } = parseSymbol(pair);
  return prettyTicker(source, ticker);
}

  const pill = $('modePill'), dot = $('modeDot'), lbl = $('modeLabel'), bnr = $('bnr'), bnrTxt = $('bnrText');
  if(!pill) return;
  const admin = !!S.user && isOwner();
  const hidden = (() => { try { return localStorage.getItem('vice-banner-hidden') === '1'; } catch(_) { return false; } })();

  if(bnr && bnr.parentNode){
    if(hidden){
      bnr.style.display = 'none';
      document.documentElement.classList.add('bnr-hidden');
    } else {
      bnr.style.display = 'flex';
      document.documentElement.classList.remove('bnr-hidden');
      if(APP_MODE === 'SIM'){
        bnr.classList.add('sim');
        if(bnrTxt) bnrTxt.textContent = 'Demonstration Mode — Simulated Data';
      } else {
        bnr.classList.remove('sim');
        if(bnrTxt) bnrTxt.textContent = window.viceOuvBannerText || 'VICE ◆ V4X ◆ OUV RECORD ACTIVE';
      }
    }
  }

  if(!admin){
    pill.style.display = 'none';
    if(APP_MODE === 'SIM'){ APP_MODE = 'LIVE'; try{ localStorage.setItem(MODE_KEY,'LIVE'); }catch(_){} }
    return;
  }
  pill.style.display = 'flex';
  if(APP_MODE === 'SIM'){ dot.className = 'd v'; lbl.textContent = 'SIM'; }
  else { dot.className = 'd r'; lbl.textContent = 'LIVE'; }
}

function setAppMode(mode){
  const m = (mode||'LIVE').toUpperCase();
  if(m === 'SIM' && !isOwner()){ toast('Admin-only','error'); return; }
  APP_MODE = m;
  try{ localStorage.setItem(MODE_KEY, APP_MODE); }catch(_){}
  closeModal();
  if(APP_MODE === 'SIM') enterSimMode(); else exitSimMode();
}

function openModeSwitch(){
  if(!S.user){ toast('Sign in first.','info'); return; }
  if(!isOwner()){ toast('Admin-only.','error'); return; }
  openModal('Operating Mode', `
    <p style="font-size:.86rem;color:var(--tx-2);line-height:1.6;margin-bottom:16px">LIVE = production. SIM = mock dataset for demos.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="crd" style="padding:16px;${APP_MODE==='LIVE'?'border-color:var(--gd)':''}" data-act="set-mode" data-mode="LIVE"><h4>LIVE</h4><div class="d" style="margin-top:6px">Real data. Real users.</div></div>
      <div class="crd" style="padding:16px;${APP_MODE==='SIM'?'border-color:var(--vi)':''}" data-act="set-mode" data-mode="SIM"><h4>SIM</h4><div class="d" style="margin-top:6px">Mock dataset.</div></div>
    </div>
    <div class="mact"><button class="btn btn-g" data-act="modal-close">Cancel</button></div>

}

  try{ localStorage.setItem(MODE_KEY,'LIVE'); }catch(_){}
  S.user = null;
  ['holders','ouvVersions','proposals','distributions','documents','dataRooms','complianceCases','treasuryTx','mt5','externalAccounts','invites','audit','signatures']
    .forEach(k => S[k]=[]);
  S.comms.messages={};
  S.comms.online=new Set();
  S.defiWallet.chains.forEach(c => { c.address=null; c.balance=0; });
  S.defiWallet.initialized = false;
  ['tb','bnr','sb'].forEach(id => { const el=$(id); if(el) el.style.display='none'; });
  const mn = document.querySelector('main.mn'); if (mn) mn.style.display = 'none';
  $('login').hidden = false;
  $('cmTabs')?.classList.remove('on');
  applyModeUI();
  toast('Switched to LIVE','info');
}

function showApp(){
  setSidebarOpen(false);
  $('login').hidden = true;
  $('tb').style.display = 'flex';
  const bnrEl = $('bnr');
  if(bnrEl && bnrEl.parentNode) $('bnr').style.display = 'flex';
  $('sb').style.display = 'block';
  const mn = document.querySelector('main.mn'); if (mn) mn.style.display = 'block';

  const av = $('userAvatar');
  if (av) {
    if (S.profile.avatarUrl) {
      av.textContent = '';
      const src=window.ViceComms?.imageUrl(S.profile.avatarUrl)||'';
      av.style.backgroundImage = src ? `url("${src}")` : '';
      if(!src)av.textContent=S.profile.avatarInitials||'NA';
      av.style.backgroundSize = 'cover';
      av.style.backgroundPosition = 'center';
    } else {
      av.style.backgroundImage = '';
      av.textContent = S.profile.avatarInitials || 'NA';
    }
  }
  $('userName').textContent = S.profile.name || 'Member';
  $('userRole').textContent = ROLE_LABELS[S.profile.role] || S.profile.role || 'Holder';
  applyModeUI();
  renderNav();
  paintUserBadges();
  go(S.tab || 'command');
  try{Notify.resumeRoute();}catch{}
}

function renderNav(){
  const host = $('navHost'); if(!host) return;
  const isHolder = S.profile.role === 'HOLDER' && !isClient();
  const role = S.profile.role || 'HOLDER';
  const holderGroups = new Set(['My Desk','Connect','My Record','Learn','Support','Services','Accounts']);

  let html = '';
  for(const group of NAV){
    if(isHolder){
      if(!holderGroups.has(group.group)) continue;
    } else if(role === 'AUDITOR'){
      if(!['My Desk','Connect','My Record','Learn','Support','Records & Control','Operations'].includes(group.group)) continue;
    }

    const items = group.items.filter(it => can(it.perm) || (it.perm === 'admin' && isOwner()));
    if(!items.length) continue;
    html += `<div class="ss"><h4>${esc(group.group)}</h4>`;
    for(const it of items){
      const active = S.tab === it.id ? ' on' : '';
      const badgeCls = it.badge==='LIVE'?'lv':it.badge==='OWNER'?'gd':it.badge==='ADMIN'?'rd':it.badge==='18'?'vi':'';
      const openGov=it.id==='governance'?(S.proposals||[]).filter(p=>p.status==='OPEN' && (!p.closesAt||new Date(p.closesAt)>new Date()) && !(S.proposalVotes||[]).some(v=>v.proposal_id===p.id)).length:0;
      const badge = openGov ? `<span class="sbdg gd" title="Proposals awaiting your vote">${openGov}</span>` : (it.badge ? `<span class="sbdg ${badgeCls}">${it.badge}</span>` : '');

      let label = it.label;
      if(isHolder){
        if(it.id === 'markets')  label = 'My Chart';
        if(it.id === 'comms')    label = 'Chats & Calls';
        if(it.id === 'academy')  label = 'Learn & Certify';
        if(it.id === 'support')  label = 'Help & Tickets';
      }
      html += `<button class="slink${active}" data-go="${it.id}">
        <svg viewBox="0 0 24 24">${ICONS[it.icon]||''}</svg>
        <span>${esc(label)}</span>
        ${badge}
      </button>`;
    }
    html += `</div>`;
  }
  host.innerHTML = html;
}

function paintUserBadges(){
  const host = document.querySelector('.tbr');
  if (!host) return;
  let slot = document.getElementById('userBadges');
  if (!slot) {
    slot = document.createElement('div');
    slot.id = 'userBadges';
    slot.style.cssText = 'display:flex;gap:4px;align-items:center';
    host.insertBefore(slot, host.firstChild);
  }
  const badges = [];
  if (isOwner()) badges.push({ label:'FOUNDER · CEO', cls:'gd' });
  else if (S.profile.vipAccess) badges.push({ label:'VIP', cls:'gd' });
  const holder = S.iru.state && S.user ? S.iru.state.holders[currentHolderId()] : null;
  if (holder && holder.tier) badges.push({ label: holder.tier.tier, cls:'nt' });
  slot.innerHTML = badges.map(b => `<span class="bdg ${b.cls}">${esc(b.label)}</span>`).join('');
}

const VIEWS = {};
const TABS = ['command','markets','portfolio','wallet','academy','community','vicebot','desk','lab','treasury','vip','mt5','external','defi','holders','iru','governance','distributions','documents','data-rooms','compliance','contracts','invites','security','admin','audit','reconciliation','marketplace','oi','support','profile','comms'];

function go(tab){
  if(!VIEWS[tab]){ toast('View not loaded: '+tab,'warn'); return; }
  const same = tab === S.tab;
  const dir = TABS.indexOf(tab) < TABS.indexOf(S.tab) ? 'back' : 'fwd';
  S.tab = tab;
  S.sheet = null;
  S.query = '';
  const cmTabs = $('cmTabs');
  if(cmTabs) cmTabs.classList.toggle('on', tab === 'comms');
  renderNav();
  window.scrollTo(0,0);
  if(window.innerWidth <= 900) setSidebarOpen(false);
  if(same){ renderMain(); paintCmTabs(); return; }
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce && typeof document.startViewTransition === 'function'){
    document.documentElement.dataset.dir = dir;
    try { document.startViewTransition(() => renderMain()); } catch(_) { renderMain(); }
  } else {
    renderMain();
  }
  paintCmTabs();
}

function renderMain(){
  const v = $('view'); if(!v) return;
  document.body.classList.toggle('chart-view',S.tab==='markets');
  const fn = VIEWS[S.tab] || VIEWS.command;
  if(!fn){ v.innerHTML = '<div class="emp">View not loaded.</div>'; return; }
  v.innerHTML = '';
  try{ fn(v); }catch(e){ v.innerHTML = `<div class="emp">Error: ${esc(e.message)}</div>`; console.error(e); }
}

function openModal(title, html){
  const mc = $('modalContent'); if(!mc) return;
  mc.innerHTML = `<div class="mh"><h3>${esc(title)}</h3><button class="mc" data-act="modal-close" aria-label="Close">×</button></div><div class="mbd">${html}</div>`;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal')?.classList.remove('on'); }

let authBusy = false;

async function signInWithGoogle(){
  if(!(await viceAuthReady)){showViceClockWarning();return;}
  try{
    const urlInvite = new URLSearchParams(location.search).get('invite');
    if(urlInvite) sessionStorage.setItem('pending_invite', urlInvite);
    const btn = $('googleBtn');
    if(btn){ btn.disabled = true; const s = btn.querySelector('span'); if (s) s.textContent = 'Redirecting…'; }
    const { error } = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo: window.location.origin, queryParams:{ prompt:'select_account' }}
    });
    if(error){
      toast('Google: ' + error.message, 'error');
      if(btn){ btn.disabled=false; const s = btn.querySelector('span'); if (s) s.textContent='Continue with Google'; }
    }
  }catch(e){
    toast('Google: ' + e.message, 'error');
    const btn = $('googleBtn');
    if(btn){ btn.disabled=false; const s = btn.querySelector('span'); if (s) s.textContent='Continue with Google'; }
  }
}

async function login(){
  if(!(await viceAuthReady)){showViceClockWarning();return;}
  if(authBusy) return;
  authBusy = true;
  try{
    const identifier = normalizeLoginIdentifier($('lIdentifier').value);
    const pw = $('lPass').value;
    if(!identifier || !pw){ toast('Email/username + password required','error'); authBusy=false; return; }
    let email = identifier;
    if(!identifier.includes('@')){
      const { data, error } = await sb.rpc('lookup_email_for_login', { p_identifier: identifier });
      if(error || !data){ toast('Username not found','error'); authBusy=false; return; }
      email = normalizeLoginIdentifier(data);
    }
    const btn = $('loginBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error){

// Cloud MT5 is an optional integration, not an authentication prerequisite.
// All error branches fail closed on previous-member portfolio details.
function safeResetCloudMt5Session(){
  try{
    const api=typeof CloudMT5==='undefined' ? null : CloudMT5;
    if(!api)return;
    if(typeof api.reset==='function'){api.reset();return;}
    // Compatibility with deployed 1.3.6 cloud modules that did not expose reset.
    const state=api.state;
    if(state&&typeof state==='object'){
      state.epoch=(state.epoch||0)+1;
      Object.assign(state,{ownerId:null,accounts:[],configured:null,loaded:false,
        busy:false,error:'',lastRefresh:0,secureUrl:null,pendingNonce:null,pendingForm:null,_queued:false});
    }
    console.warn('Optional Cloud MT5 reset interface unavailable; account data cleared.');
  }catch(e){
    // The user's sign-in/out must never depend on MT5 provider health.
    console.warn('Optional MT5 session reset failed:',e);
  }
}
