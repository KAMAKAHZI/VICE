function onAuthenticated(user){
  if(APP_MODE === 'SIM') return Promise.resolve();
  if(!user?.id) return Promise.reject(new Error('Missing authenticated user'));
  if(S.user?.id === user.id && $('login')?.hidden === true) return checkMemberAccess();
  if(authSetupTask){
    if(authSetupOwner===user.id&&authSetupEpoch===authEpoch)return authSetupTask;
    clearMemberSession();
    const requestedEpoch=authEpoch;
    return authSetupTask.then(()=>requestedEpoch===authEpoch?onAuthenticated(user):undefined);
  }
  clearMemberSession();
  authSetupOwner=user.id;authSetupEpoch=authEpoch;
  const epoch=authEpoch;
  authSetupTask = completeAuthenticatedSetup(user,epoch).finally(() => { authSetupTask = null;authSetupOwner=null; });
  return authSetupTask;
}
async function completeAuthenticatedSetup(user,epoch=authEpoch){
  const current=()=>epoch===authEpoch;
  try {
    if(!(await checkMemberAccess(epoch)))return;
    const inviteCode=sessionStorage.getItem('pending_invite') ||
      new URLSearchParams(location.search).get('invite');
    let {data:prof,error:profileError}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    if(!current())return;
    if(profileError) throw profileError;
    // An existing provisioned member must never be forced to redeem an old
    // or already-used URL invitation; that fails even after valid authentication.
    if(inviteCode && !prof){
      const redeemed=await sb.rpc('redeem_invite',{p_code:inviteCode});
    if(!current())return;
      if(redeemed.error) throw redeemed.error;
      sessionStorage.removeItem('pending_invite');
      const result=await sb.from('profiles').select('*').eq('id',user.id).single();
    if(!current())return;
      if(result.error)throw result.error;
      prof=result.data;
    } else if(inviteCode && prof){
      // Returning members can safely reuse historical invite links.
      sessionStorage.removeItem('pending_invite');
    }
    if(!prof){
      // A delayed profile provisioning transaction must not destroy a valid auth session.
      await new Promise(resolve=>setTimeout(resolve,900));
      const retry=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    if(!current())return;
      if(retry.error) throw retry.error;
      prof=retry.data;
      if(!prof){toast('Member profile not provisioned. Contact an administrator; your session is preserved.','error');return;}
    }
    if(!current())return;
    S.profile={name:prof.name||'Member',username:prof.username||'',email:prof.email||user.email||'',
      role:prof.role||'HOLDER',title:prof.title||'Member',phone:prof.phone||'',
      jurisdiction:prof.jurisdiction||'CH',timezone:prof.timezone||'UTC',
      avatarInitials:prof.avatar_initials||'NA',avatarUrl:prof.avatar_url||null,
      vipAccess:!!prof.vip_access,memberId:prof.member_id||null,clientId:prof.client_id||null};
    safeResetCloudMt5Session();
    try{Link.stop()}catch(_){} // prevent bridge portfolio from prior user
    S.user={id:user.id,email:user.email,name:S.profile.name,role:S.profile.role};
    try{await window.ViceComms?.resolveAvatars([S.profile]);}catch(e){console.warn('Profile image:',e.message);}
    if(!current())return;
    Academy.restore();
    S.tokenCerts={list:[],loaded:false,loading:false,error:null,kind:'ALL',program:'ALL'};
    try{Link.start()}catch(e){console.warn('Optional VICE Link:',e)}
    // A holder-registry RPC failure must not hide every other module.
    // The server still enforces IRU permissions; do not invent a holder balance.
    try {
      await ensureHolderForCurrentUser();
    } catch(e) {
      console.error('Holder initialization failed:',e);
      toast('Holder initialization: ' + (e.message || 'server error'), 'warn');
    }
    // Show the authenticated interface immediately; optional data can hydrate
    // afterward and a failed IRU read should not blank the sidebar.
    if(!current())return;
    // Avoid a misleading partial portfolio total while external accounts load.
    // Hydrate authenticated financial records before first dashboard render.
    try { await hydrateData(); } catch(e) {
      console.error('Data hydration failed:',e);
      toast('Some records could not load. Check browser Console.','warn');
    }
    if(!current())return;
    showApp();
    // Refresh current view with hydrated records while preserving navigation.
    try { renderMain(); paintUserBadges(); } catch(e) { console.warn('Refresh after hydrate:',e); }
    // Nonblocking, owner-scoped read after account hydration; never requests MT5 credentials.
    try{
      if(typeof CloudMT5!=='undefined'&&typeof CloudMT5.refresh==='function'){
        Promise.resolve(CloudMT5.refresh()).catch(e=>console.warn('Optional MT5 cloud refresh:',e));
      }
    }catch(e){console.warn('Optional MT5 cloud refresh did not block sign-in:',e);}
    try{await Realtime.connect();await Realtime.loadProfiles();}catch(e){console.warn('Realtime:',e);}
    if(!current())return;
    startViceSync();
    setTimeout(()=>loadCandles().catch(e=>console.warn(e)),250);
  }catch(e){
    if(!current())return;
    console.error('Authentication setup:',e);
    // The account profile determines access. An optional plugin must never
    // invalidate a member's authenticated Supabase session.
    if(S.user?.id===user.id && S.profile?.role){
      try{showApp()}catch(renderError){console.error('App recovery:',renderError);}
      toast('Signed in. Some modules could not load; run Diagnostics or refresh.','warn');
    }else{
      S.user=null;
      const entry=$('login');if(entry)entry.hidden=false;
      toast('Membership profile could not be loaded: '+(e.message||'try again')+'. Run Application Connections.','error');
    }
  }
}

async function refreshDaoConfig(){

      Math.abs(Number(versions[0].vice_ouv)-vice)<0.00000001 &&
      Math.abs(Number(versions[0].v4x_ouv)-v4x)<0.00000001) {
      const previous=Number(versions[1].vice_ouv);

        const symbol=growth>=0?'▲':'▼';

      }

  if(S.daoPriceSyncStatus==='CONFLICT'){
    console.warn('SERVER POLICY CONFLICT: requested latest founder policy 2/320, received',vice,v4x);
  }
}

function startViceSync(){

    viceSyncInFlight=true;

      let ledgerChanged=false;
      const {data:myHolder,error:holderError}=await sb.rpc('get_my_holder');
      if(epoch!==authEpoch||String(S.user?.id)!==userId)return;
      if(!holderError){
        const holder=Array.isArray(myHolder)?myHolder[0]:null;
        const latest=holder?{
          viceUnits:Number(holder.vice_units||0),v4xUnits:Number(holder.v4x_units||0)
        }:{viceUnits:0,v4xUnits:0};
        if(Number.isSafeInteger(latest.viceUnits)&&Number.isSafeInteger(latest.v4xUnits)&&
            (latest.viceUnits!==Number(S.personalHoldings.viceUnits||0)||
             latest.v4xUnits!==Number(S.personalHoldings.v4xUnits||0))){
          ledgerChanged=true;
          await hydrateData(); // replays canonical event ledger only when holdings actually change
        }
      }else console.warn('Holder count refresh deferred:',holderError.message);
      if(!ledgerChanged)await refreshEstateRegistry();
      if(epoch!==authEpoch||String(S.user?.id)!==userId)return;
      if(['governance','command','portfolio','admin','iru'].includes(S.tab))renderMain();
      renderNav();
      if(typeof CloudMT5!=='undefined'&&(!CloudMT5.state.lastRefresh||Date.now()-CloudMT5.state.lastRefresh>240000))
        CloudMT5.refresh().catch(e=>console.warn('MT5 cloud sync:',e));
    }catch(e){console.warn('VICE shared-record synchronization:',e);}
    finally{viceSyncInFlight=false;}
  },45000);
}
async function hydrateData(){
  const epoch=authEpoch;
  const current=()=>epoch===authEpoch&&!!S.user;
  const tables = {
    holders:'holders', ouvVersions:'ouv_versions', proposals:'proposals', distributions:'distributions',
    documents:'documents', dataRooms:'data_rooms', complianceCases:'compliance_cases', treasuryTx:'treasury_tx',
    invites:'invites', audit:'audit_log', mt5:'mt5_accounts', externalAccounts:'external_accounts',
    signatures:'signatures',
  };
  for(const [key, table] of Object.entries(tables)){
    try{
      const query = sb.from(table).select('*');
      if(table==='external_accounts' || table==='mt5_accounts') query.eq('owner_id',S.user.id);
      const { data, error } = await query.order('created_at',{ascending:false}).limit(500);
      if(!current())return;
      if(error) throw error;
      if(data) S[key] = data.map(denorm);
    }catch(e){ console.warn('VICE4X table load failed [' + table + ']:', e); }
  }

  /* Distributions keep the enriched shape we write */
  try {
    const { data } = await sb.from('distributions').select('*').order('created_at',{ascending:false}).limit(500);
      if(!current())return;
    if(data) {
      S.distributions = data.map(d => ({
        id: d.id,
        period: d.period,
        holderId: d.holder_id,
        holderName: d.holder_name,
        holderClientId: d.holder_client_id,
        program: d.program || 'VICE',
        total: Number(d.total || 0),
        perUnit: Number(d.per_unit || 0),
        status: d.status || 'DRAFT',
        note: d.note || '',
        createdAt: d.created_at,
      }));
    }
  } catch(_) {}

  // Votes contain only the current user's ballot; server enforces membership and one vote per proposal.
  try{
    const {data,error}=await sb.from('vice_proposal_votes').select('proposal_id,choice').eq('voter_id',S.user.id).limit(500);
      if(!current())return;
    if(!error)S.proposalVotes=data||[];
  }catch(e){console.warn('Governance votes unavailable until migration:',e);}

  // OUV values are shared issuer references; newest saved version becomes the display value.
  const latestOuv = (S.ouvVersions || []).slice().sort((a,b)=>
    new Date(b.effectiveAt||b.createdAt||0)-new Date(a.effectiveAt||a.createdAt||0))[0];
  if(latestOuv){
    const a=Number(latestOuv.viceOuv), b=Number(latestOuv.v4xOuv);
    if(Number.isFinite(a) && a>0 && Number.isFinite(b) && b>0){
      S.iruClasses[0].ouv=a; S.iruClasses[1].ouv=b;
    }
  }
  if(!current())return;
  await refreshDaoConfig();
  if(!current())return;

  /* Push every holder from the holders table into S.holders so the Registry is complete */
  try {
    const { data: rows } = await sb.from('holders').select('*').limit(500);
      if(!current())return;
    if (rows) {
      const ids = new Set(S.holders.map(h => h.clientId));
      for (const r of rows) {
        if (ids.has(r.client_id)) continue;
        S.holders.push({
          id: r.profile_id || r.id,
          clientId: r.client_id,
          name: r.name,
          email: r.email,
          status: r.status || 'ACTIVE',
          viceUnits: Number(r.vice_units || 0),
          v4xUnits: Number(r.v4x_units || 0),
          tier: r.tier,
          legacy: r.legacy,
          holderType: r.holder_type,
        });
      }
    }
  } catch(_) {}

  if(!current())return;
  /* Fire the holder IRU auto-enrollment after everything else is loaded */
  try { await ensureHolderForCurrentUser(); } catch(_){}
  if(!current())return;
  /* Rebuild IRU state exclusively from the persisted, ordered event ledger. */
  try {
    // Cursor/keyset pages: Supabase may cap any single response below the
    // requested limit. Stop only on an empty page; never infer completion
    // solely from a short page. Sequence must be strictly increasing.
    const pages=[];
    let lastSeq=0;
    const pageSize=500;
    for(let batch=0;batch<20000;batch++){
      const {data,error}=await sb.from('iru_events')
        .select('seq,payload,actor_id,actor_role,created_at')
        .gt('seq',lastSeq)
        .order('seq',{ascending:true})
        .limit(pageSize);
      if(!current())return;
      if(error)throw error;
      if(!Array.isArray(data))throw new Error('IRU registry response was not an array');
      if(data.length===0)break;
      for(const e of data){
        const seq=Number(e.seq);
        if(!Number.isSafeInteger(seq)||seq<=lastSeq)throw new Error('Non-monotonic IRU event cursor');
        if(!e.payload||typeof e.payload!=='object')throw new Error('Invalid IRU event payload at '+seq);
        pages.push({...e.payload,seq,by:e.actor_id||e.actor_role||'DATABASE_OPERATOR',at:e.created_at});
        lastSeq=seq;
      }
      if(batch===19999)throw new Error('IRU replay safety bound reached; use server checkpoints');
    }
    S.iru.state=IruEngine.replay(pages);
    let reserveAdmins=new Set();
    if(isRegistryOperator()){
      const directory=await sb.rpc('list_member_directory');
      if(!current())return;
      if(directory.error)throw directory.error;
      reserveAdmins=new Set((directory.data||[]).filter(p=>p.role==='SUPER_ADMIN').map(p=>p.id));
    }
    // Holder IDs can differ from auth IDs. Display current authoritative
    // identity/control metadata without changing replayed financial balances.
    for(const row of S.holders||[]){
      const h=S.iru.state.holders[row.id];
      if(h)Object.assign(h,{clientId:row.clientId,name:row.name,email:row.email,
        status:row.status,holdingsLocked:!!row.holdingsLocked,accountSuspended:!!row.accountSuspended,
        accountRevoked:!!row.accountRevoked,userId:row.userId,profileId:row.profileId,
        reserveProtected:[row.id,row.userId,row.profileId].some(id=>reserveAdmins.has(id))});
    }
    // Replay is a derived view, not a substitute for authoritative SQL counters.
    const defects=IruEngine.checkInvariants(S.iru.state);
    if(defects.length)throw new Error('IRU invariant failures: '+defects.slice(0,3).join('; '));
    S.iru.registryReady=true;
    S.iru.registryError=null;
  } catch(e) {
    S.iru.state=null;
    S.iru.registryReady=false;
    S.iru.registryError=e.message||'IRU read failed';
    console.error('IRU registry fetch/replay failed:',e);
    toast('IRU registry: ' + S.iru.registryError, 'warn');
  }
  if(!current())return;
  try { await refreshEstateRegistry(); } catch(e) { console.warn('Estate book unavailable:',e); }
  try {
    const {data}=await sb.rpc('get_my_holder');
      if(!current())return;
    if(data?.[0])S.personalHoldings={viceUnits:Number(data[0].vice_units),v4xUnits:Number(data[0].v4x_units)};
  }catch(_){}
  try{
    const {data}=await sb.from('support_tickets').select('*').order('created_at',{ascending:false}).limit(100);
      if(!current())return;
    if(data)S.support.tickets=data.map(r=>({id:r.id,subject:r.subject,text:r.body,status:r.status,at:r.created_at}));
  }catch(e){console.warn('Support sync:',e);}
  try {
    const {data}=await sb.from('certificates').select('cert_id,holder_name,course_title,issued_at,scores,overall_score,digest')
      .eq('profile_id',S.user.id).eq('revoked',false).order('issued_at',{ascending:false}).limit(100);
      if(!current())return;
    if(data) Academy.state.certs=data.map(c=>({id:c.cert_id,name:c.holder_name,course:c.course_title,
      issuedAt:c.issued_at,scores:c.scores,overallScore:c.overall_score,digest:c.digest}));
    const {data:attempts}=await sb.from('academy_attempts').select('module,score,passed,submitted_at')
      .eq('profile_id',S.user.id).order('submitted_at',{ascending:false});
      if(!current())return;
    if(attempts){Academy.state.quiz={};for(const a of attempts){if(!Academy.state.quiz[a.module] || a.score>Academy.state.quiz[a.module].score*100)
      Academy.state.quiz[a.module]={score:a.score/100,passed:a.passed,at:a.submitted_at};}}
    const {data:progress,error:progressError}=await sb.from('academy_progress')
      .select('module,chapter,completed_at').eq('profile_id',S.user.id).limit(100);
    if(!current())return;if(progressError)throw progressError;
    Academy.state.read=Object.fromEntries((progress||[]).map(p=>[`${p.module}.${p.chapter}`,p.completed_at]));
  }catch(e){console.warn('Academy hydrate:',e);toast('Academy progress could not synchronize: '+e.message,'warn');}
}

function denorm(row){
  const out = {};
  for(const [k,v] of Object.entries(row)) out[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())] = v;
  return out;
}

async function saveMemberProfile(updates){

  const fields={name:'name',username:'username',title:'title',phone:'phone',jurisdiction:'jurisdiction',timezone:'timezone',avatarInitials:'avatar_initials',avatarUrl:'avatar_url'};
  const row={},safe={};
  for(const [key,value] of Object.entries(updates)){

async function audit(eventType, action, objectType, objectId, outcome='SUCCESS'){
  try{
    const entry = {
      id: uuid(), eventType, action,
      objectType, objectId: String(objectId||''),
      actorId: S.user?.id || 'system',
      actorRole: S.profile?.role || 'SYSTEM',
      outcome, correlationId: uuid().slice(0,8),
      createdAt: nowIso(),
    };
    // This is user-reported activity, not proof of successful settlement,
    // a signed instruction, or issuer-authenticated administrative execution.
    if(APP_MODE==='LIVE') {
      entry.actorRole='CLIENT_REPORTED';
      entry.outcome='UNVERIFIED_CLIENT_EVENT';
    }
    S.audit.unshift(entry);
    if(S.audit.length>500) S.audit.length=500;
    if(sb && S.user && APP_MODE==='LIVE' && S.user.id!=='sim-user') {

        });
        if(error) console.warn('Client activity was not persisted:',error.message);
      }catch(error){console.warn('Client activity telemetry unavailable:',error);}
    }
  }catch(_){}
}


// Estate-reserve balances use a SEPARATE internal double-entry book.
// They are not included in the strategic 2.5M issuance counter and do not
// constitute verified blockchain custody or guaranteed external transfer.
async function refreshEstateRegistry(){
  const epoch=authEpoch;
  if(APP_MODE!=='LIVE'||!S.user)return;
  const own=await sb.rpc('vice_get_my_estate_holdings');
  if(epoch!==authEpoch)return;
  if(own.error){
    S.estateHolderBalances=null;
    console.warn('Estate holder ledger RPC unavailable:',own.error.message);
  } else {
    const h=own.data||{};
    S.estateHolderBalances={VICE:Number(h.VICE||0),V4X:Number(h.V4X||0)};
  }
  if(isOwner()){
    const admin=await sb.rpc('vice_get_estate_admin_dashboard');
  if(epoch!==authEpoch)return;
    if(admin.error){
      S.estateAdminLedger=null;
      console.warn('Estate admin ledger RPC unavailable:',admin.error.message);
    } else S.estateAdminLedger=admin.data||null;
  } else S.estateAdminLedger=null;
}

async function persistIruEvent(ev,correlationId=crypto.randomUUID()){
  if(APP_MODE==='SIM' && S.user?.id==='sim-user')return {simulated:true};
  if(!S.user||!isRegistryOperator())throw new Error('CFO or Reserve administrator authorization required');
  if(!S.iru.registryReady) throw new Error('IRU registry not synchronized. No changes were made: ' + (S.iru.registryError || 'reload and inspect Console'));
  if(['UNITS_ISSUED','UNITS_RETIRED'].includes(ev?.type) && !await verifyStrategicBackend())
    throw new Error('Unit mutations disabled: live canonical-price release gate has not passed');
  const {data,error}=await sb.rpc('append_iru_event',{
    p_payload:ev,p_correlation_id:correlationId});
  if(error)throw error;
  if(['UNITS_ISSUED','UNITS_RETIRED'].includes(ev?.type)) {
    S.tokenCerts.loaded=false;
    ViceTokenCertificates.load().then(()=>{if(S.tab==='iru'||S.tab==='documents')renderMain();}).catch(()=>{});
  }
  return data;
}

   ═══════════════════════════════════════════════════════════════════ */
function defiUsd(){
  return S.defiWallet.chains.reduce((s,c)=>s+(c.balance*c.usdRate),0);
}
function liveBridgeAccounts(){
  // Local account metadata is not evidence of broker equity. Only fresh
  // authenticated WSS terminal snapshots are eligible to enter totals.
  if(APP_MODE!=='LIVE'||!S.user||Link.state.status!=='live')return [];
  const last=Number(Link.state.portfolioAt)||0, age=Date.now()-last;
  if(!last||age<0||age>120000||!Array.isArray(Link.state.portfolio?.accounts))return [];
  return Link.state.portfolio.accounts.filter(a=>a&&typeof a==='object');
}
function mt5Usd(){
  if(APP_MODE==='SIM')return (S.mt5||[]).reduce((s,a)=>s+(Number(a.equity)||0),0);
  let total=0;const seen=new Set();
  for(const a of liveBridgeAccounts()){
    // DEMO money must not inflate the personal portfolio; a verified LIVE
    // account must carry its explicit account mode from the terminal bridge.
    const mode=String(a.mode||a.accountMode||'').toUpperCase();
    if(mode!=='LIVE'||String(a.currency||'').toUpperCase()!=='USD')continue;
    if(a.equity===null||a.equity===undefined||!Number.isFinite(Number(a.equity)))continue;
    const id=String(a.server||'').trim().toLowerCase()+'|'+String(a.login||'').trim();
    if(!a.server||!a.login||seen.has(id))continue;
    seen.add(id);total+=Number(a.equity);
  }
  return total;
}
function externalUsd(){
  // Member-entered bank and custodian balances are not verified assets.
  // Only demonstrate these estimates in SIM; never add them to LIVE totals.
  if(APP_MODE==='LIVE')return 0;
  const fx={USD:1,SGD:0.74,EUR:1.08,CHF:1.11,GBP:1.27};
  return S.externalAccounts.reduce((sum,a)=>sum+Number(a.balance||0)*(fx[a.currency]||1),0);
}
function documentedExternalUsd(){
  // Historical, user-supplied statement figures: never present as current cash.
  return (S.externalAccounts||[]).filter(a=>
    APP_MODE==='SIM' || (S.user?.id && String(a.ownerId||a.owner_id||'')===String(S.user.id))
  ).filter(a=>
    a.currency==='USD' && a.status!=='REJECTED' &&
    Number.isFinite(Number(a.balance)) && Number(a.balance)>=0
  ).reduce((sum,a)=>sum+Number(a.balance),0);
}
function iruUsd(){
  const v = S.iruClasses.find(c=>c.class==='VICE')?.ouv??2;
  const x = S.iruClasses.find(c=>c.class==='V4X')?.ouv??320;
  const estate=S.estateHolderBalances||{VICE:0,V4X:0};
  // Internal holder entitlements from estate transfers ARE personal IRU
  // holdings, whereas undistributed issuer reserve is NOT personal holdings.
  return ((Number(S.personalHoldings.viceUnits||0)+Number(estate.VICE||0))*v)
       + ((Number(S.personalHoldings.v4xUnits||0)+Number(estate.V4X||0))*x);
}
function totalPersonalUsd(){
  // Cloud MT5 equity is counted only after a fresh, broker-verified USD read.
  // Other currencies are displayed in their original denomination until an
  // independently sourced conversion rate is available. Never duplicate
  // an account already represented in the existing ledger or local bridge.
  return iruUsd() + defiUsd() + mt5Usd() + externalUsd() + (typeof CloudMT5 !== 'undefined' ? CloudMT5.verifiedUsd() : 0);
}
// The owner sees the estate-administered IRU reserve within their ACCOUNT portfolio.
// It remains a policy-designated ESTATE ledger account, NOT verified custody,
// minted supply, cash, personal beneficial ownership or corporate stock.
function managedReserveUnits(program){
  if(!isOwner()) return 0;
  const p=program==='V4X'?'V4X':'VICE';
  // In LIVE, the founder portfolio may include ONLY the server-confirmed
  // unassigned reserve. Using a static 7.5M ceiling after a distribution
  // would double-count transferred units in holder + issuer totals.
  const ledgerValue=S.estateAdminLedger?.programs?.[p]?.unassigned_units;
  if(APP_MODE==='LIVE'){
    if(ledgerValue===undefined||ledgerValue===null)return 0;
    const n=Number(ledgerValue);
    return Number.isFinite(n)&&Number.isSafeInteger(n)&&n>=0&&n<=7500000?n:0;
  }
  if(ledgerValue===undefined||ledgerValue===null)return Number(IruEngine.ECON.reserve);
  const n=Number(ledgerValue);
  return Number.isFinite(n)&&n>=0?n:Number(IruEngine.ECON.reserve);
}
function managedReserveUsd(){
  if(!isOwner()) return 0;
  const v=Number(S.iruClasses.find(c=>c.class==='VICE')?.ouv ?? 2);
  const x=Number(S.iruClasses.find(c=>c.class==='V4X')?.ouv ?? 320);
  return managedReserveUnits('VICE')*v+managedReserveUnits('V4X')*x;
}
function totalAccountPortfolioUsd(){
  // Founder view ATTRIBUTES the still-unassigned estate reserve to the
  // founder-controlled IRU portfolio REFERENCE. Accounting remains separate:
  // transferred units leave the unassigned reserve and enter recipient ledgers.
  // This display is NOT independent FMV, liquid net worth, on-chain custody,
  // corporate shares, or collateral acceptance.
  return totalPersonalUsd() + (isOwner() ? managedReserveUsd() : 0);
}
function accountIruUnits(program){
  const p=program==='VICE'?'VICE':'V4X';
  const personal=Number(S.personalHoldings[p==='VICE'?'viceUnits':'v4xUnits']||0);
  const transferred=Number(S.estateHolderBalances?.[p]||0);
  return personal+transferred+(isOwner()?managedReserveUnits(p):0);
}
function accountIruReferenceUsd(){
  return iruUsd()+(isOwner()?managedReserveUsd():0);
}
function viceReferenceCards(){
  const vice=accountIruUnits('VICE')*Number(S.iruClasses[0].ouv),v4x=accountIruUnits('V4X')*Number(S.iruClasses[1].ouv);
  return '<div class="v4x-reference-cards">'+[['VICE reference value',vice,fmtNum(accountIruUnits('VICE'))+' units · '+fmtUsd(S.iruClasses[0].ouv)+' / unit'],['V4X reference value',v4x,fmtNum(accountIruUnits('V4X'))+' units · '+fmtUsd(S.iruClasses[1].ouv)+' / unit'],['Total IRU reference value',vice+v4x,'Combined VICE + V4X management reference']].map(([label,n,note])=>`<div class="st" data-exact="false"><span class="l">${esc(label)}</span><div class="v vc-metal-number" data-money-value="${n}" tabindex="0" aria-label="${fmtUsd(n)}">${fmtK(n)}</div><div class="n">${esc(note)}</div><button type="button" class="btn btn-xs btn-g" data-money-precision-toggle aria-pressed="false">Show full amount</button></div>`).join('')+'</div>';
}
function portfolioReliabilityNote(){
  return APP_MODE==='SIM'
    ? 'Demonstration figures for exploring the platform. Switch to LIVE for your recorded holdings and eligible linked account equity.'
    : 'IRUs are displayed at VICE management reference values, alongside eligible verified linked account equity. Intended collateral use is subject to lender approval, independent valuation and executed agreements.';
}
function portfolioValuationTerms(){
  return 'VICE CAPITAL INC. — INSTITUTIONAL VALUATION & COLLATERAL REVIEW. The consolidated display aggregates separately classified records under the VICE4X sui generis private digital-property and Internal Revenue Unit (IRU) framework. IRU amounts are internal management reference calculations based on recorded unit quantities and the currently effective OUV; they are not corporate shares, independent fair market valuations, realizable cash, or lender-approved collateral. The Estate Reserve and Administrative Reserve remain designated institutional records administered by authorized executives, distinct from personal holder allocations. External corporate account figures are recorded from supporting statements and identified by their reporting dates; a historical statement balance is not confirmation of currently available cash. Each proposed pledge remains subject to documented legal rights, applicable transfer restrictions, independent diligence, lender underwriting, any appraisal required by the institution, and executed security agreements. Certificates evidence only the specific rights and quantities recorded in the governing registry; external account balances are excluded from IRU certificate valuations. No platform reference display constitutes a bank guarantee, credit approval, or representation of regulatory classification.';
}

function setSidebarOpen(open, restoreFocus=false){
  const sidebar=$('sb'), toggle=$('sbToggle'), mobile=window.matchMedia('(max-width:900px)').matches;
  if(!sidebar||!toggle)return;
  const visible=mobile&&!!open;
  sidebar.classList.toggle('open',visible);
  sidebar.inert=mobile&&!visible;
  toggle.setAttribute('aria-expanded',String(visible));
  toggle.setAttribute('aria-label',visible?'Close navigation':'Open navigation');
  const backdrop=$('sbBackdrop');if(backdrop)backdrop.hidden=!visible;
  document.body.classList.toggle('mobile-menu-open',visible);
  if(restoreFocus&&mobile)toggle.focus({preventScroll:true});
}

   ═══════════════════════════════════════════════════════════════════ */
function commsUnreadTotal(){
  return Object.values(S.comms.unread).reduce((a,b) => a + (b||0), 0);
}
function paintCmTabs(){
  const t = $('cmTabs'); if (!t) return;
  t.classList.toggle('on', S.tab === 'comms');
  const btns = [...t.querySelectorAll('button[data-cm-tab]')];
  const active = t.querySelector(`button[data-cm-tab="${S.comms.tab}"]`);
  btns.forEach(b => b.setAttribute('aria-current', b.dataset.cmTab === S.comms.tab ? 'page' : 'false'));
  const ind = $('cmInd');
  if (ind && active) {
    ind.style.width = active.offsetWidth + 'px';
    ind.style.height = '2px';
    ind.style.pointerEvents = 'none';
    ind.style.left = active.offsetLeft + 'px';
    ind.style.top = active.offsetTop + 'px';
  }
  const badge = $('cmBadgeChats');
  if (badge) {
    const n = commsUnreadTotal();
    badge.textContent = n > 99 ? '99+' : String(n);
    badge.style.display = n > 0 ? 'block' : 'none';
  }
}

/* ═══════════════════════════════════════════════════════════════════
   GLOBAL CLICK DELEGATION
   Critical: modal-close only fires when the click landed on the
   backdrop itself, not on any descendant. This is what was causing
   inputs and selects to silently dismiss the modal ("freeze").
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act]');
  if(!t || t.disabled) return;
  const act = t.dataset.act;

  if (act === 'modal-close') {
    // Backdrop closes only on a click outside the dialog. Actual Close,
    // Cancel, and X controls close when any part of the button is clicked.
    const backdrop = document.getElementById('modal');
    if (t === backdrop) {
      if (e.target === backdrop) closeModal();
    } else if (t.closest('button')) {
      closeModal();
    }
    return;
  }

  if (act === 'sheet-close') {
    /* sheet-back has data-sheet-back="1"; its close button always works */
    if (t.dataset.sheetBack === '1') {
      if (e.target === t) closeSheet();
    } else {
      closeSheet();
    }
    return;
  }

  if(act==='vice-attach'){try{viceMediaContext();$('viceMediaInput')?.click()}catch(e){toast(e.message,'error')}return}
  if(act==='vice-voice'){void viceToggleVoiceRecording().catch(e=>toast('Voice: '+e.message,'error'));return}
  if(t.dataset.go){ go(t.dataset.go); return; }

  switch(act){
    case 'open-mode': openModeSwitch(); return;
    case 'set-mode': setAppMode(t.dataset.mode); return;
    case 'open-user': openUserMenu(); return;
    case 'google-sign-in': signInWithGoogle(); return;
    case 'forgot': forgotPassword(); return;
    case 'vice-health-check': viceServiceDiagnostics(); return;
    case 'auth-reset-complete': applyRecoveredPassword(); return;
    case 'invite-help': openInviteHelp(); return;
    case 'sign-out': logout(); return;
    case 'auth-reset': {
      (async()=>{
        try{await sb.auth.signOut();}catch(_){}
        try{localStorage.removeItem('vice-os-auth-v1.0.1');}catch(_){}
        sessionStorage.removeItem('pending_invite');location.assign(location.pathname);
      })();return;
    }
  }
  if(typeof window.__viceAct === 'function') window.__viceAct(t, e);
});

/* ═══════════════════════════════════════════════════════════════════
   LATE-BOUND ACTION HANDLER (LAYER 1)
   ═══════════════════════════════════════════════════════════════════ */
window.__viceAct = function(t, e){
  const act = t.dataset.act;
  switch(act){
    case 'apply-invite': {
      const c = $('invInput')?.value.trim(); if(!c) return;
      sessionStorage.setItem('pending_invite', c);
      closeModal(); toast('Invite saved','success');
      setTimeout(openInviteHelp, 200); return;
    }
    case 'signup-invite': {
      const email = normalizeLoginIdentifier($('invEmail')?.value);
      const pw = $('invPass')?.value, cf = $('invConf')?.value;
      const inviteCode = sessionStorage.getItem('pending_invite')
        || new URLSearchParams(location.search).get('invite');
      if(!inviteCode){ toast('Invite required','error'); return; }
      if(!email || !email.includes('@')){ toast('Valid email required','error'); return; }
      if(!pw || pw.length < 8){ toast('Password 8+ chars','error'); return; }
      if(pw !== cf){ toast('Mismatch','error'); return; }
      (async () => {
        const { data: invite, error: invError } = await sb.rpc('validate_invite',{p_code:inviteCode,p_email:email});
        if(invError || !invite?.valid){ toast('Invite invalid, expired or restricted to another email','error'); return; }
        const { data, error } = await sb.auth.signUp({
          email, password: pw,
          options:{
            data:{
              invite_code: inviteCode,
              name: invite.name || email.split('@')[0],
            }
          }
        });
        if(error){ toast('Signup failed: ' + error.message,'error'); return; }
        if(data.session && data.user){ closeModal(); await onAuthenticated(data.user); }
        else { closeModal(); toast('Check your email to confirm','success'); }
      })();
      return;
    }
  }
};

/* ═══════════════════════════════════════════════════════════════════
   SOLACE v5 ENGINE
   Full port of V4X SOLACE-final(2030).mq5
   Confirmed 5-bar fractal pivots · hold layer · no repaint
   Plus: internal LTF poles · CHoCH · trade geometry · history
   ═══════════════════════════════════════════════════════════════════ */

const Solace = (() => {
  /* ─── ATR (Wilder RMA, matches MT5 iATR) ─── */
  function atr(bars, len) {
    const n = bars.length;
    const out = new Array(n).fill(NaN);
    let sum = 0, rma = NaN;
    for (let i = 0; i < n; i++) {
      const b = bars[i], p = bars[i-1];
      const tr = i === 0
        ? b.h - b.l
        : Math.max(b.h - b.l, Math.abs(b.h - p.c), Math.abs(b.l - p.c));
      if (i < len) {
        sum += tr;
        if (i === len - 1) { rma = sum / len; out[i] = rma; }
      } else {
        rma = (rma * (len - 1) + tr) / len;
        out[i] = rma;
      }
    }
    return out;
  }

  /* ─── Confirmed N-bar fractal ─── */
  function pivotHigh(bars, p, L, R) {
    if (p - L < 0 || p + R >= bars.length) return false;
    const v = bars[p].h;
    for (let k = 1; k <= L; k++) if (!(v > bars[p-k].h)) return false;
    for (let k = 1; k <= R; k++) if (!(v >= bars[p+k].h)) return false;
    return true;
  }
  function pivotLow(bars, p, L, R) {
    if (p - L < 0 || p + R >= bars.length) return false;
    const v = bars[p].l;
    for (let k = 1; k <= L; k++) if (!(v < bars[p-k].l)) return false;
    for (let k = 1; k <= R; k++) if (!(v <= bars[p+k].l)) return false;
    return true;
  }

  /* ─── LTF map for internal poles ─── */
  const LTF_FOR_TF = {
    '1d': '4h', '4h': '1h', '1h': '15m', '15m': '5m', '5m': '1m', '1m': null,
    'D1': 'H4', 'H4': 'H1', 'H1': 'M15', 'M15': 'M5', 'M5': 'M1', 'M1': null,
  };

  /* ─── Internal poles from LTF high/low ─── */
  function internalPoles(ltf, primaryBars, lookback) {
    if (!ltf || ltf.length < 20) return { hi: null, lo: null, hiBar: -1, loBar: -1 };
    const n = Math.min(lookback, ltf.length);
    let hh = -Infinity, ll = Infinity, hb = 0, lb = 0;
    for (let k = 0; k < n; k++) {
      const idx = ltf.length - 1 - k;
      if (idx < 0) break;
      if (ltf[idx].h > hh) { hh = ltf[idx].h; hb = k; }
      if (ltf[idx].l < ll) { ll = ltf[idx].l; lb = k; }
    }
    return { hi: hh, lo: ll, hiBar: hb, loBar: lb };
  }

  /* ─── Main engine ─── */
  function run(bars, opts, ltfBars) {
    const n = bars.length;
    const o = {
      sens: (opts && opts.sens) || 'Balanced',
      minLegATR: Math.max(0.5, (opts && opts.minLegATR) || 2),
      noTighten: opts && opts.noTighten !== false,
      breakCloses: Math.min(10, Math.max(1, (opts && opts.breakCloses) || 1)),
      whipsaw: opts && opts.whipsaw !== false,
      fallback: opts && opts.fallback !== false,
      fbLen: Math.min(200, Math.max(5, (opts && opts.fbLen) || 20)),
      atrLen: Math.max(1, (opts && opts.atrLen) || 14),
      zoneTolATR: (opts && opts.zoneTolATR) != null ? opts.zoneTolATR : 0.5,
      structuralLookback: (opts && opts.structuralLookback) || 1000,
    };
    const L = Math.max(1, o.sens === 'Aggressive' ? 3 : o.sens === 'Conservative' ? 7 : 5);
    const R = L, MAXSCAN = 2000;

    const A = atr(bars, o.atrLen);
    const f0 = new Array(n).fill(null);
    const f100 = new Array(n).fill(null);
    const s0 = new Array(n).fill('waiting');
    const s100 = new Array(n).fill('waiting');
    const legIds = new Array(n).fill(0);

    const events = [];
    const pivots = [];
    const fractals = [];
    const f0History = [];
    const f100History = [];

    let zHi = null, zHiBar = null, zLo = null, zLoBar = null, zLast = 0;
    let pHi = null, pLo = null, zLegId = 0, prevLegId = 0;
    let F0 = null, F100 = null, b0 = null, b100 = null;
    let hiBrk = 0, loBrk = 0, src0 = 'waiting', src100 = 'waiting';
    let curF0From = 0, curF100From = 0;

    const lowIn = (i, from, to) => {
      if (to == null || !(to >= from)) return [null, null];
      let v = null, off = null;
      for (let k = from; k <= to; k++) {
        const j = i - k; if (j < 0) break;
        if (v === null || bars[j].l < v) { v = bars[j].l; off = k; }
      }
      return [v, off];
    };
    const hiIn = (i, from, to) => {
      if (to == null || !(to >= from)) return [null, null];
      let v = null, off = null;
      for (let k = from; k <= to; k++) {
        const j = i - k; if (j < 0) break;
        if (v === null || bars[j].h > v) { v = bars[j].h; off = k; }
      }
      return [v, off];
    };

    for (let i = 0; i < n; i++) {
      const b = bars[i];
      const aSafe = Number.isNaN(A[i]) ? b.c * 0.01 : A[i];
      const ph = (i - R >= 0 && pivotHigh(bars, i - R, L, R)) ? bars[i - R].h : null;
      const pl = (i - R >= 0 && pivotLow(bars, i - R, L, R))  ? bars[i - R].l : null;

      if(ph!==null)fractals.push({bar:i-R,confirmedAt:i,side:'HIGH',price:ph});
      if(pl!==null)fractals.push({bar:i-R,confirmedAt:i,side:'LOW',price:pl});
      let zChanged = false;

      /* ─── Confirmed pivot high ─── */
      if (ph !== null) {
        if (zLast === -1) {
          const [lv, lo] = lowIn(i, R, Math.min(i - zLoBar, MAXSCAN));
          if (lv !== null && lv < zLo) { zLo = lv; zLoBar = i - lo; }
          const [hv, ho] = hiIn(i, R, Math.min(i - zLoBar, MAXSCAN));
          if (hv !== null) { zHi = hv; zHiBar = i - ho; zLast = 1; zChanged = true; }
        } else if (zLast === 1) {
          const [lv, lo] = lowIn(i, R, Math.min(i - zHiBar - 1, MAXSCAN));
          if (lv !== null && zLo !== null && lv < zLo) {
            zLo = lv; zLoBar = i - lo;
            const [hv, ho] = hiIn(i, R, lo);
            if (hv !== null) { zHi = hv; zHiBar = i - ho; }
            zChanged = true;
          } else {
            const [hv, ho] = hiIn(i, R, Math.min(i - zHiBar - 1, MAXSCAN));
            if (hv !== null && hv > zHi) { zHi = hv; zHiBar = i - ho; zChanged = true; }
          }
        } else {
          zHi = ph; zHiBar = i - R; zLast = 1; zChanged = true;
        }
      }

      /* ─── Confirmed pivot low ─── */
      if (pl !== null) {
        if (zLast === 1) {
          const [hv, ho] = hiIn(i, R, Math.min(i - zHiBar, MAXSCAN));
          if (hv !== null && hv > zHi) { zHi = hv; zHiBar = i - ho; }
          const [lv, lo] = lowIn(i, R, Math.min(i - zHiBar, MAXSCAN));
          if (lv !== null) { zLo = lv; zLoBar = i - lo; zLast = -1; zChanged = true; }
        } else if (zLast === -1) {
          const [hv, ho] = hiIn(i, R, Math.min(i - zLoBar - 1, MAXSCAN));
          if (hv !== null && zHi !== null && hv > zHi) {
            zHi = hv; zHiBar = i - ho;
            const [lv, lo] = lowIn(i, R, ho);
            if (lv !== null) { zLo = lv; zLoBar = i - lo; }
            zChanged = true;
          } else {
            const [lv, lo] = lowIn(i, R, Math.min(i - zLoBar - 1, MAXSCAN));
            if (lv !== null && lv < zLo) { zLo = lv; zLoBar = i - lo; zChanged = true; }
          }
        } else {
          zLo = pl; zLoBar = i - R; zLast = -1; zChanged = true;
        }
      }

      if (zChanged) pivots.push({ i, zHi, zHiBar, zLo, zLoBar });

      /* ─── Leg detection ─── */
      const legOK = zHi !== null && zLo !== null
        && zHi > zLo && (zHi - zLo) >= aSafe * o.minLegATR;
      if (zChanged && legOK && (pHi === null || zHi !== pHi || zLo !== pLo)) {
        pHi = zHi; pLo = zLo; zLegId++;
      }
      const newLeg = zLegId !== prevLegId;
      prevLegId = zLegId;

      /* ─── Break-retirement: N closes beyond the level ─── */
      if (F100 !== null) {
        hiBrk = b.c > F100 ? hiBrk + 1 : 0;
        if (hiBrk >= o.breakCloses) {
          events.push({ i, type:'BROKEN', side:'F100', price:F100 });
          if (i > curF100From) f100History.push({ price:F100, from:curF100From, to:i, origin:b100 });
          F100 = null; b100 = null; hiBrk = 0; src100 = 'broken';
        }
      }
      if (F0 !== null) {
        loBrk = b.c < F0 ? loBrk + 1 : 0;
        if (loBrk >= o.breakCloses) {
          events.push({ i, type:'BROKEN', side:'F0', price:F0 });
          if (i > curF0From) f0History.push({ price:F0, from:curF0From, to:i, origin:b0 });
          F0 = null; b0 = null; loBrk = 0; src0 = 'broken';
        }
      }

      /* ─── Whipsaw extension (RAID) or plain SWEEP ─── */
      if (o.whipsaw) {
        if (F100 !== null && b.h > F100 && b.c < F100) {
          events.push({ i, type:'RAID', side:'F100', price:b.h, from:F100 });
          if (i > curF100From) f100History.push({ price:F100, from:curF100From, to:i, origin:b100 });
          F100 = b.h; b100 = i; curF100From = i; hiBrk = 0; src100 = 'raid';
        }
        if (F0 !== null && b.l < F0 && b.c > F0) {
          events.push({ i, type:'RAID', side:'F0', price:b.l, from:F0 });
          if (i > curF0From) f0History.push({ price:F0, from:curF0From, to:i, origin:b0 });
          F0 = b.l; b0 = i; curF0From = i; loBrk = 0; src0 = 'raid';
        }
      } else {
        if (F100 !== null && b.h > F100 && b.c < F100) events.push({ i, type:'SWEEP', side:'F100', price:b.h, from:F100 });
        if (F0 !== null && b.l < F0 && b.c > F0) events.push({ i, type:'SWEEP', side:'F0', price:b.l, from:F0 });
      }

      /* ─── Accept the zigzag proposal (with tighten guard) ─── */
      const reAnchor = !o.noTighten && newLeg;
      if (legOK) {
        const takeHi = (F100 === null || zHi > F100 || reAnchor) && b.c < zHi;
        if (takeHi && (F100 === null || F100 !== zHi)) {
          if (F100 !== null && i > curF100From) f100History.push({ price:F100, from:curF100From, to:i, origin:b100 });
          F100 = zHi; b100 = zHiBar; curF100From = i; hiBrk = 0; src100 = 'leg';
        }
        const takeLo = (F0 === null || zLo < F0 || reAnchor) && b.c > zLo;
        if (takeLo && (F0 === null || F0 !== zLo)) {
          if (F0 !== null && i > curF0From) f0History.push({ price:F0, from:curF0From, to:i, origin:b0 });
          F0 = zLo; b0 = zLoBar; curF0From = i; loBrk = 0; src0 = 'leg';
        }
      }

      /* ─── Rolling-extreme fallback so the chart is never bare ─── */
      if (o.fallback && i >= o.fbLen - 1) {
        if (F100 === null) {
          let v = -Infinity, k = i;
          for (let j = i - o.fbLen + 1; j <= i; j++) if (bars[j].h > v) { v = bars[j].h; k = j; }
          if (b.c < v) { F100 = v; b100 = k; curF100From = i; hiBrk = 0; src100 = 'roll'; }
        }
        if (F0 === null) {
          let v = Infinity, k = i;
          for (let j = i - o.fbLen + 1; j <= i; j++) if (bars[j].l < v) { v = bars[j].l; k = j; }
          if (b.c > v) { F0 = v; b0 = k; curF0From = i; loBrk = 0; src0 = 'roll'; }
        }
      }

      f0[i] = F0;
      f100[i] = F100;
      s0[i] = src0;
      s100[i] = src100;
      legIds[i] = zLegId;
    }

    /* ─── Close out any still-open history ─── */
    if (n > 0) {
      if (F0 !== null && n - 1 > curF0From) f0History.push({ price:F0, from:curF0From, to:n, origin:b0, open:true });
      if (F100 !== null && n - 1 > curF100From) f100History.push({ price:F100, from:curF100From, to:n, origin:b100, open:true });
    }

    /* ─── Internal LTF poles ─── */
    const internal = internalPoles(ltfBars, bars, o.structuralLookback);
    const internalArmed = { hi: false, lo: false };
    if (n > 0) {
      const last = bars[n-1];
      if (internal.hi != null) internalArmed.hi = last.c < internal.hi - 0.5 * A[n-1];
      if (internal.lo != null) internalArmed.lo = last.c > internal.lo + 0.5 * A[n-1];
    }

    /* ─── CHoCH detection ─── */
    let chochDir = 0, chochLevel = null, chochBar = -1;
    if (n > 10 && internal.hi != null && internal.lo != null) {
      const last = bars[n-1], prev = bars[n-2];
      const lb = 3;
      let sweptLo = false, sweptHi = false;
      for (let k = 1; k <= 20 && k < n - 1; k++) {
        const c = bars[n-1-k];
        if (c.l <= internal.lo + A[n-1] * 0.05) sweptLo = true;
        if (c.h >= internal.hi - A[n-1] * 0.05) sweptHi = true;
      }
      if (sweptLo) {
        let sh = -Infinity;
        for (let k = 1; k <= lb; k++) {
          const c = bars[n-1-k-1]; if (!c) break;
          if (c.h > sh) sh = c.h;
        }
        if (prev && last && prev.c <= sh && last.c > sh) { chochDir = 1; chochLevel = sh; chochBar = n - 1; }
      }
      if (!chochDir && sweptHi) {
        let sl = Infinity;
        for (let k = 1; k <= lb; k++) {
          const c = bars[n-1-k-1]; if (!c) break;
          if (c.l < sl) sl = c.l;
        }
        if (prev && last && prev.c >= sl && last.c < sl) { chochDir = -1; chochLevel = sl; chochBar = n - 1; }
      }
    }

    /* ─── Trade geometry ─── */
    let trade = { macro: null, internal: null };
    if (n > 0 && F0 != null && F100 != null && F100 > F0) {
      const lastAtr = A[n-1] || (bars[n-1].c * 0.01);
      const stopAtr = 0.5;
      const rng = F100 - F0;
      if (chochDir === 1 && chochLevel != null) {
        const entry = chochLevel;
        const stop = F0 - stopAtr * lastAtr;
        const target = F100;
        const risk = Math.abs(entry - stop);
        const rew = Math.abs(target - entry);
        trade.macro = { side:'BUY', entry, stop, target, rr: risk > 0 ? rew / risk : 0 };
      } else if (chochDir === -1 && chochLevel != null) {
        const entry = chochLevel;
        const stop = F100 + stopAtr * lastAtr;
        const target = F0;
        const risk = Math.abs(entry - stop);
        const rew = Math.abs(target - entry);
        trade.macro = { side:'SELL', entry, stop, target, rr: risk > 0 ? rew / risk : 0 };
      }
      if (internal.hi != null && internal.lo != null) {
        const iRng = internal.hi - internal.lo;
        if (iRng > 0) {
          const be = (F0 + F100) / 2;
          if (chochDir === 1) {
            const entry = internal.lo + iRng * 0.382;
            const stop = internal.lo - stopAtr * lastAtr;
            const target = be;
            const risk = Math.abs(entry - stop);
            const rew = Math.abs(target - entry);
            trade.internal = { side:'BUY', entry, stop, target, rr: risk > 0 ? rew / risk : 0 };
          } else if (chochDir === -1) {
            const entry = internal.hi - iRng * 0.382;
            const stop = internal.hi + stopAtr * lastAtr;
            const target = be;
            const risk = Math.abs(entry - stop);
            const rew = Math.abs(target - entry);
            trade.internal = { side:'SELL', entry, stop, target, rr: risk > 0 ? rew / risk : 0 };
          }
        }
      }
    }

    /* ─── Summary for the last bar ─── */
    const li = n - 1;
    const atrLast = n > 0 ? (Number.isNaN(A[li]) ? bars[li].c * 0.01 : A[li]) : 0;
    const zTol = atrLast * o.zoneTolATR;
    const lb = n > 0 ? bars[li] : null;
    const last = lb ? {
      F0, F100, src0, src100, b0, b100, zTol,
      close: lb.c,
      atHigh: F100 !== null && lb.h >= F100 - zTol,
      atLow:  F0 !== null && lb.l <= F0 + zTol,
      position: F0 !== null && F100 !== null && F100 > F0
        ? ((lb.c - F0) / (F100 - F0)) * 100
        : null,
    } : null;

    /* ─── Confirmed pivot markers (last 400) ─── */
    const markers = pivots.slice(-400).map(p => ({
      hiBar: p.zHiBar, hi: p.zHi, loBar: p.zLoBar, lo: p.zLo,
    }));

    return {
      f0, f100, s0, s100, legIds, events, pivots, fractals, atr: A,
      f0History, f100History, internal, internalArmed,
      choch: { dir: chochDir, level: chochLevel, bar: chochBar },
      trade, last, markers,
      params: o,
    };
  }

  return { run, atr, LTF_FOR_TF };
})();

const PRACTICE = 'PRACTICE';
const MAX_BARS = 60000;

const TF_SEC = {
  M1:60, M5:300, M15:900, M30:1800, H1:3600, H2:7200, H4:14400, D1:86400, W1:604800, MN1:2592000,
  '1m':60,'5m':300,'15m':900,'30m':1800,'1h':3600,'2h':7200,'4h':14400,'1d':86400,'1wk':604800,'1mo':2592000,
};
const MAIN_TFS = ['1m','5m','15m','30m','1h','2h','4h','1d','1wk','1mo'];

const CCY_NAMES = {
  EUR:'Euro', USD:'US Dollar', GBP:'British Pound', JPY:'Japanese Yen', CHF:'Swiss Franc',
  AUD:'Australian Dollar', CAD:'Canadian Dollar', NZD:'New Zealand Dollar',
  XAU:'Gold', XAG:'Silver', XPT:'Platinum', XPD:'Palladium',
  BTC:'Bitcoin', ETH:'Ether', SOL:'Solana', XRP:'XRP', LTC:'Litecoin',
};

const CATALOG = [
  ['Forex majors', ['EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','USDCAD','NZDUSD']],
  ['Forex crosses', ['EURGBP','EURJPY','EURCHF','EURAUD','GBPJPY','GBPCHF','GBPAUD','AUDJPY','AUDCHF','NZDJPY','CADJPY','CHFJPY']],
  ['Metals', ['XAUUSD','XAGUSD','XPTUSD','XPDUSD']],
  ['Indices', [['NAS100','Nasdaq 100'],['US30','Dow Jones 30'],['SPX500','S&P 500'],['GER40','Germany 40'],['UK100','UK 100'],['JPN225','Japan 225']]],
  ['Energies', [['USOIL','WTI crude oil'],['UKOIL','Brent crude oil'],['NATGAS','Natural gas']]],
  ['Crypto', [['BTCUSDT','Bitcoin / USDT'],['ETHUSDT','Ether / USDT'],['SOLUSDT','Solana / USDT'],['XRPUSDT','XRP / USDT']]],
];

const CATALOG_DESC = new Map();
CATALOG.forEach(([, list]) => list.forEach(x => {
  const [s, d] = Array.isArray(x) ? x : [x, null];
  CATALOG_DESC.set(s.toUpperCase(), d);
}));
const catalogSymbols = () => CATALOG.flatMap(([, list]) => list.map(x => Array.isArray(x) ? x[0] : x));
const displaySymbol = s => s === PRACTICE ? 'Practice' : s;

function symDesc(sym) {
  if (sym === PRACTICE) return 'Simulated practice series, not market prices';
  const up = String(sym).toUpperCase(), core = up.split(/[._#!]/)[0];
  const d = CATALOG_DESC.get(up) || CATALOG_DESC.get(core);
  if (d) return d;
  const letters = core.replace(/[^A-Z]/g, '');
  if (letters.length >= 6 && CCY_NAMES[letters.slice(0,3)] && CCY_NAMES[letters.slice(3,6)])
    return `${CCY_NAMES[letters.slice(0,3)]} / ${CCY_NAMES[letters.slice(3,6)]}`;
  return 'Custom symbol';
}

function bucketStart(t, tf) {
  if (tf === 'MN1' || tf === '1mo') {
    const d = new Date(t);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
  }
  if (tf === 'W1' || tf === '1wk') {
    const d = new Date(t);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - d.getUTCDay());
  }
  const sec = TF_SEC[tf] || 3600;
  return Math.floor(t / (sec * 1000)) * sec * 1000;
}

function resample(bars, tf) {
  const out = [];
  let cur = null, key = null;
  for (const b of bars) {
    const k = bucketStart(b.t, tf);
    if (k !== key) {
      if (cur) out.push(cur);
      key = k;
      cur = { t: k, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v || 0 };
    } else {
      if (b.h > cur.h) cur.h = b.h;
      if (b.l < cur.l) cur.l = b.l;
      cur.c = b.c;
      cur.v += (b.v || 0);
    }
  }
  if (cur) out.push(cur);
  return out;
}

function canBuild(baseTf, tf) {
  if (baseTf === tf) return true;
  const b = TF_SEC[baseTf], t = TF_SEC[tf];
  if (!b || !t) return false;
  if (tf === 'W1' || tf === '1wk' || tf === 'MN1' || tf === '1mo') return b <= 86400;
  return b < t && t % b === 0;
}

const setsFor = sym => Object.values(S.sets).filter(d => d.symbol === sym);

function tfList(sym) {
  const extra = setsFor(sym).map(d => d.tf).filter(tf => !MAIN_TFS.includes(tf));
  return [...new Set([...MAIN_TFS, ...extra])].sort((a,b) => (TF_SEC[a]||0) - (TF_SEC[b]||0));
}

const availableTfs = sym => {
  const sets = setsFor(sym);
  return tfList(sym).filter(tf => sets.some(d => canBuild(d.tf, tf)));
};

const seriesCache = new Map();

function resolveLocal(sym, tf) {
  const sets = setsFor(sym);
  const base = sets.find(d => d.tf === tf)
    || sets.filter(d => canBuild(d.tf, tf)).sort((a,b) => (TF_SEC[b.tf]||0) - (TF_SEC[a.tf]||0))[0];
  if (!base) return null;
  const key = `${base.id}|${base.rev||0}|${tf}`;
  if (!seriesCache.has(key)) {
    seriesCache.clear();
    seriesCache.set(key, base.tf === tf ? base.bars : resample(base.bars, tf));
  }
  return {
    symbol: sym, tf, source: base.source, decimals: base.decimals,
    bars: seriesCache.get(key),
    builtFrom: base.tf === tf ? null : base.tf,
  };
}

const isLive = () => !!(S.sel && S.sel.src && S.sel.src !== 'local');

function resolveSeries(sym, tf) {
  return isLive()
    ? (typeof Link !== 'undefined' ? Link.series(S.sel.src, sym, tf) : null)
    : resolveLocal(sym, tf);
}

let REV = 0;

function normalizeBars(bars) {
  const sorted = bars.filter(b => b.t > 1e11).sort((a,b) => a.t - b.t);
  const out = [];
  for (const b of sorted) {
    if (out.length && out[out.length-1].t === b.t) out[out.length-1] = b;
    else out.push(b);
  }
  return out;
}

function addDataset(d, persist) {
  const id = `${d.symbol}|${d.tf}`;
  const prev = S.sets[id];
  let bars = normalizeBars(
    prev && prev.source === 'FILE' && d.source === 'FILE' ? prev.bars.concat(d.bars) : d.bars
  );
  const trimmed = bars.length > MAX_BARS;
  if (trimmed) bars = bars.slice(-MAX_BARS);
  const set = {
    id, symbol: d.symbol, tf: d.tf, source: d.source,
    decimals: Math.max(d.decimals || 2, prev ? prev.decimals : 0),
    name: d.name || '', bars, rev: ++REV,
  };
  S.sets[id] = set;
  if (persist) { try { Store.put(pack(set)); } catch(_) {} }
  return { set, trimmed, merged: !!prev };
}

function pack(set) {
  const a = new Float64Array(set.bars.length * 5);
  set.bars.forEach((b, i) => {
    a[i*5]   = b.t;
    a[i*5+1] = b.o;
    a[i*5+2] = b.h;
    a[i*5+3] = b.l;
    a[i*5+4] = b.c;
  });
  return {
    id:set.id, symbol:set.symbol, tf:set.tf, source:set.source,
    decimals:set.decimals, name:set.name, packed:a
  };
}
function unpack(r) {
  const a = r.packed, bars = [];
  for (let i = 0; i + 4 < a.length; i += 5) {
    bars.push({ t:a[i], o:a[i+1], h:a[i+2], l:a[i+3], c:a[i+4], v:0 });
  }
  return { symbol:r.symbol, tf:r.tf, source:r.source, decimals:r.decimals, name:r.name, bars };
}

function mulberry32(a) {
  return () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function sampleSeries(n = 720, seed = 20260921, stepMs = 3600e3, t0 = Date.UTC(2026, 5, 1)) {
  const r = mulberry32(seed);
  const bars = [];
  let p = 100, vol = 0.3, drift = 0, legLeft = 0;
  const rd = x => Math.round(x * 100) / 100;
  for (let i = 0; i < n; i++) {
    if (legLeft <= 0) {
      drift = (r() - 0.5) * 0.22;
      legLeft = 18 + Math.floor(r() * 55);
      vol = 0.18 + r() * 0.4;
    }
    legLeft--;
    const o = p;
    let c = o, h = o, l = o;
    for (let k = 0; k < 4; k++) {
      c *= 1 + (drift / 4 + (r() - 0.5) * vol) / 100;
      h = Math.max(h, c);
      l = Math.min(l, c);
    }
    if (r() < 0.09) h += r() * vol * 1.8 * (c / 100);
    if (r() < 0.09) l -= r() * vol * 1.8 * (c / 100);
    const O = rd(o), C = rd(c);
    bars.push({
      t: t0 + i * stepMs,
      o: O,
      h: Math.max(rd(h), O, C),
      l: Math.min(rd(l), O, C),
      c: C,
      v: Math.random() * 1e6
    });
    p = c;
  }
  return bars;
}

function parseBars(text) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) throw new Error('The file has no rows.');
  const first = lines[0];
  const delim = first.includes('\t')
    ? '\t'
    : first.split(';').length > first.split(',').length ? ';' : ',';
  const head = first.split(delim).map(s => s.replace(/[<>"]/g, '').trim().toLowerCase());
  const find = n => head.findIndex(h => h === n || h.startsWith(n));
  let io = find('open'), ih = find('high'), il = find('low'), ic = find('close');
  let id = find('date'), it = find('time');
  let start = 1;
  if (io < 0 || ih < 0 || il < 0 || ic < 0) {
    start = 0;
    const cols = first.split(delim);
    const hasTime = cols.length >= 6 && /^\d{1,2}:\d{2}/.test(cols[1]);
    id = 0;
    it = hasTime ? 1 : -1;
    io = hasTime ? 2 : 1;
    ih = io+1;
    il = io+2;
    ic = io+3;
  }
  let decimals = 0, skipped = 0;
  const bars = [];
  for (const line of lines.slice(start)) {
    const c = line.split(delim);
    const vals = [io, ih, il, ic].map(k => (c[k] ?? '').replace(/"/g, '').trim());
    const [o, h, l, cl] = vals.map(Number);
    if (![o,h,l,cl].every(Number.isFinite) || h < Math.max(o, cl) || l > Math.min(o, cl) || h < l) {
      skipped++;
      continue;
    }
    for (const v of vals) {
      const d = (v.split('.')[1] || '').length;
      if (d > decimals) decimals = d;
    }
    let t = NaN;
    if (id >= 0 && c[id]) {
      const ds = c[id].replace(/"/g, '').trim().replace(/\./g, '-');
      const ts = it >= 0 && c[it] ? c[it].replace(/"/g, '').trim() : '00:00';
      t = Date.parse(`${ds.length <= 10 ? ds : ds.slice(0, 10)}T${ts.length === 5 ? ts + ':00' : ts}Z`);
      if (Number.isNaN(t)) t = Date.parse(c[id]);
    }
    bars.push({ t: Number.isNaN(t) ? bars.length : t, o, h, l, c: cl, v: 0 });
  }
  if (bars.length < 30) throw new Error(`Only ${bars.length} valid bars found. SOLACE needs at least 30; its full view needs 1,000+.`);
  return { bars, decimals: Math.min(Math.max(decimals, 2), 5), skipped };
}

function nameInfo(filename) {
  const stem = String(filename).replace(/\.(csv|txt)$/i, '');
  const m = /^(.+?)_(MN1|MN|M1|M2|M3|M4|M5|M6|M10|M12|M15|M20|M30|H1|H2|H3|H4|H6|H8|H12|D1|W1)(?=_|$)/i.exec(stem);
  if (m) {
    const tf = m[2].toUpperCase();
    return { symbol: m[1], tf: tf === 'MN' ? 'MN1' : tf };
  }
  return { symbol: stem.split('_')[0] || stem, tf: null };
}

function inferTf(bars) {
  const d = [];
  for (let i = 1; i < bars.length; i++) {
    const x = (bars[i].t - bars[i-1].t) / 1000;
    if (x > 0) d.push(x);
  }
  if (!d.length) return null;
  d.sort((a, b) => a - b);
  const med = d[Math.floor(d.length/2)];
  if (med >= 27*86400 && med <= 32*86400) return 'MN1';
  for (const [tf, sec] of Object.entries(TF_SEC)) {
    if (tf !== 'MN1' && Math.abs(med-sec) <= sec*0.02) return tf;
  }
  return null;
}

function importText(text, filename) {
  const parsed = parseBars(text);
  if (!parsed.bars.some(b => b.t > 1e11)) throw new Error('This file has no dates, so its timeframe can\'t be read.');
  const info = nameInfo(filename);
  const bars = normalizeBars(parsed.bars);
  const tf = info.tf || inferTf(bars);
  if (!tf) throw new Error('Couldn\'t tell the timeframe. Keep MT5\'s file name, like XAUUSD_M15_….csv.');
  return { symbol: info.symbol, tf, source: 'FILE', decimals: parsed.decimals, bars, name: filename };
}

/* ─── IndexedDB store for imported bars ─── */
const Store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (typeof indexedDB === 'undefined') { rej(new Error('IndexedDB unavailable')); return; }
    const rq = indexedDB.open('vice-os', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('datasets', { keyPath: 'id' });
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction('datasets', mode);
      const req = fn(tx.objectStore('datasets'));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  };
  return {
    all: () => run('readonly', st => st.getAll()).catch(() => []),
    put: d => run('readwrite', st => st.put(d)).catch(() => {}),
    del: id => run('readwrite', st => st.delete(id)).catch(() => {}),
  };
})();

/* ─── Live feeds ─── */
const BINANCE_TF = {'1m':'1m','5m':'5m','15m':'15m','30m':'30m','1h':'1h','2h':'2h','4h':'4h','1d':'1d','1wk':'1w','1mo':'1M'};
const YAHOO_TF = {'1m':'1m','5m':'5m','15m':'15m','30m':'30m','1h':'1h','2h':'1h','4h':'1h','1d':'1d','1wk':'1wk','1mo':'1mo'};
const YAHOO_RANGE = {'1m':'5d','5m':'1mo','15m':'1mo','30m':'1mo','1h':'3mo','2h':'1y','4h':'1y','1d':'2y','1wk':'5y','1mo':'10y'};

async function fetchCandlesBinance(ticker, tf, limit) {
  if(!BINANCE_TF[tf])throw Error('Unsupported Binance timeframe: '+tf);
  const wanted=Math.min(5000,Math.max(1,Number(limit)||500));let rows=[],endTime;
  while(rows.length<wanted){
    const params=new URLSearchParams({symbol:ticker,interval:BINANCE_TF[tf],limit:String(Math.min(1000,wanted-rows.length))});if(endTime!=null)params.set('endTime',String(endTime));
    const r=await fetch('https://api.binance.com/api/v3/klines?'+params);if(!r.ok)throw Error('Binance HTTP '+r.status);
    const page=await r.json();if(!Array.isArray(page)||page.some(k=>!Array.isArray(k)||![+k[0],+k[1],+k[2],+k[3],+k[4]].every(Number.isFinite)))throw Error('Binance returned invalid candles');
    if(!page.length)break;const first=Number(page[0][0]);if(endTime!=null&&first>endTime)throw Error('Binance history did not advance');rows=page.concat(rows);endTime=first-1;if(page.length<Number(params.get('limit')))break;

}

async function fetchCandlesYahoo(ticker, tf) {
  if(!YAHOO_TF[tf])throw Error('Unsupported Yahoo timeframe: '+tf);
  const interval = YAHOO_TF[tf];
  const range = YAHOO_RANGE[tf] || '3mo';
  const url = `/.netlify/functions/yahoo?symbol=${encodeURIComponent(ticker)}&interval=${interval}&range=${range}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Yahoo HTTP ' + r.status);
  const j = await r.json();
  const res = j?.chart?.result?.[0];
  if (!res || !res.timestamp?.length) throw new Error('Yahoo: no data');
  const ts = res.timestamp, q = res.indicators?.quote?.[0] || {};

    if(l>Math.min(o,c)||h<Math.max(o,c)||l>h)continue;

      t: ts[i]*1000,
      o:q.open[i], h:q.high[i], l:q.low[i], c:q.close[i],
      v:q.volume?.[i] || 0
