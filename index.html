let authBusy = false;

async function signInWithGoogle(){
  try{
    const urlInvite = new URLSearchParams(location.search).get('invite');
    if(urlInvite) sessionStorage.setItem('pending_invite', urlInvite);
    const btn = $('googleBtn');
    if(btn){ btn.disabled = true; btn.querySelector('span').textContent = 'Redirecting…'; }
    const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.origin, queryParams:{ prompt:'select_account' }}});
    if(error){
      toast('Google: ' + error.message, 'error');
      if(btn){ btn.disabled=false; btn.querySelector('span').textContent='Continue with Google'; }
    }
  }catch(e){
    toast('Google: ' + e.message, 'error');
    const btn = $('googleBtn');
    if(btn){ btn.disabled=false; btn.querySelector('span').textContent='Continue with Google'; }
  }
}

async function login(){
  if(authBusy) return; authBusy = true;
  try{
    const identifier = $('lIdentifier').value.trim();
    const pw = $('lPass').value;
    if(!identifier || !pw){ toast('Email/username + password required','error'); authBusy=false; return; }
    let email = identifier;
    if(!identifier.includes('@')){
      const { data, error } = await sb.rpc('lookup_email_for_login', { p_identifier: identifier });
      if(error || !data){ toast('Username not found','error'); authBusy=false; return; }
      email = data;
    }
    const btn = $('loginBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error){
      toast('Login failed: ' + error.message,'error');
      if(btn){ btn.disabled=false; btn.textContent='Log In'; }
      authBusy=false;
      return;
    }
    await onAuthenticated(data.user);
  }catch(e){
    toast('Login failed: ' + e.message,'error');
    const btn = $('loginBtn'); if(btn){ btn.disabled=false; btn.textContent='Log In'; }
  }
  authBusy = false;
}

async function forgotPassword(){
  const email = prompt('Account email:');
  if(!email) return;
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '?reset=1' });
    if(error){ toast('Reset failed: ' + error.message,'error'); return; }
    toast('Reset link sent','success');
  }catch(e){ toast('Reset failed: ' + e.message,'error'); }
}

async function onAuthenticated(user){
  try{
    const { data: prof } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(!prof){
      const inviteCode = sessionStorage.getItem('pending_invite') || new URLSearchParams(location.search).get('invite');
      if(!inviteCode){ await sb.auth.signOut(); toast('Invite-only. Open your invite link.','error'); return; }
      const { data: invite } = await sb.from('invites').select('*').eq('code', inviteCode).eq('used', false).maybeSingle();
      if(!invite){ await sb.auth.signOut(); toast('Invite invalid.','error'); sessionStorage.removeItem('pending_invite'); return; }
      const googleName = user.user_metadata?.full_name || user.user_metadata?.name || '';
      const displayName = invite.for_user || googleName || user.email.split('@')[0];
      const initials = displayName.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase() || 'NA';
      const newProf = { id:user.id, email:user.email, name:displayName, role:invite.role||'HOLDER', vip_access:!!invite.vip_access || invite.role==='SUPER_ADMIN', avatar_initials:initials, title:'Member', jurisdiction:'CH', timezone:'UTC' };
      const { error: createErr } = await sb.from('profiles').insert(newProf);
      if(createErr){ await sb.auth.signOut(); toast('Profile creation failed: ' + createErr.message, 'error'); return; }
      await sb.from('invites').update({ used:true }).eq('id', invite.id);
      sessionStorage.removeItem('pending_invite');
      S.profile = { ...newProf, username:'' };
      toast('Welcome to VICE OS.','success');
    } else {
      S.profile = {
        name: prof.name || user.email?.split('@')[0] || 'User',
        username: prof.username || '', email: prof.email || user.email,
        role: prof.role || 'HOLDER', title: prof.title || 'Member',
        phone: prof.phone || '', jurisdiction: prof.jurisdiction || 'CH',
        timezone: prof.timezone || 'UTC',
        avatarInitials: prof.avatar_initials || (prof.name||'NA').slice(0,2).toUpperCase(),
        vipAccess: prof.vip_access || prof.role === 'SUPER_ADMIN',
        clientId: prof.client_id || null,
        memberId: prof.member_id || null,
      };
    }
    S.user = { id:user.id, email:user.email, name:S.profile.name, role:S.profile.role };
    S.personalHoldings = S.profile.role === 'SUPER_ADMIN' ? { viceUnits:7500000, v4xUnits:7500000 } : { viceUnits:0, v4xUnits:0 };
    await hydrateData();
    showApp();
    if(!S.profile.username) toast('Set your username in Profile.','info');
    setTimeout(()=> { try{ loadCandles(); }catch(_){} }, 250);
  }catch(e){
    console.error('Auth error', e);
    toast('Signed in but data load failed: ' + e.message, 'error');
  }
}

async function hydrateData(){
  const tables = {
    holders:'holders', ouvVersions:'ouv_versions', proposals:'proposals', distributions:'distributions',
    documents:'documents', dataRooms:'data_rooms', complianceCases:'compliance_cases', treasuryTx:'treasury_tx',
    invites:'invites', audit:'audit_log', mt5:'mt5_accounts', externalAccounts:'external_accounts',
    signatures:'signatures',
  };
  for(const [key, table] of Object.entries(tables)){
    try{
      const { data } = await sb.from(table).select('*').order('created_at',{ascending:false}).limit(500);
      if(data) S[key] = data.map(denorm);
    }catch(_){}
  }
}

function denorm(row){
  const out = {};
  for(const [k,v] of Object.entries(row)) out[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())] = v;
  return out;
}

async function logout(){
  if(APP_MODE === 'SIM'){ exitSimMode(); return; }
  if(!confirm('Sign out?')) return;
  try{ await sb.auth.signOut(); }catch(_){}
  S.user = null;
  ['tb','bnr','sb'].forEach(id=>{ const el=$(id); if(el) el.style.display='none'; });
  document.querySelector('.mn').style.display = 'none';
  $('login').hidden = false;
  $('cmTabs')?.classList.remove('on');
  toast('Signed out','info');
}

async function audit(eventType, action, objectType, objectId, outcome='SUCCESS'){
  try{
    const entry = { id:uuid(), event_type:eventType, action, object_type:objectType, object_id:String(objectId||''),
      actor_id:S.user?.email||'system', actor_role:S.profile?.role||'SYSTEM', outcome, correlation_id:uuid().slice(0,8), createdAt:nowIso() };
    S.audit.unshift(entry);
    if(S.audit.length>500) S.audit.length=500;
    if(sb && S.user && APP_MODE==='LIVE' && S.user.id!=='sim-user') await sb.from('audit_log').insert(entry);
  }catch(_){}
}

function defiUsd(){ return S.defiWallet.chains.reduce((s,c)=>s+(c.balance*c.usdRate),0); }
function mt5Usd(){ return S.mt5.reduce((s,a)=>s+Number(a.equity||0),0); }
function externalUsd(){ const fx={USD:1,SGD:0.74,EUR:1.08,CHF:1.11,GBP:1.27}; return S.externalAccounts.reduce((s,a)=>s+(Number(a.balance||0)*(fx[a.currency]||1)),0); }
function iruUsd(){ const v=S.iruClasses.find(c=>c.class==='VICE')?.ouv||2, x=S.iruClasses.find(c=>c.class==='V4X')?.ouv||320; return (S.personalHoldings.viceUnits*v) + (S.personalHoldings.v4xUnits*x); }
function totalPersonalUsd(){ return iruUsd() + defiUsd() + mt5Usd() + externalUsd(); }

  }
}

window.__viceAct = function(t, e){
  const act = t.dataset.act;
  switch(act){
    case 'apply-invite': {
      const c = $('invInput')?.value.trim(); if(!c) return;
      sessionStorage.setItem('pending_invite', c);
      closeModal(); toast('Invite saved','success');
      setTimeout(openInviteHelp, 200); return;
    }
    case 'signup-invite': {
      const email = $('invEmail')?.value.trim();
      const pw = $('invPass')?.value, cf = $('invConf')?.value;
      const inviteCode = sessionStorage.getItem('pending_invite') || new URLSearchParams(location.search).get('invite');
      if(!inviteCode){ toast('Invite required','error'); return; }
      if(!email || !email.includes('@')){ toast('Valid email required','error'); return; }
      if(!pw || pw.length < 8){ toast('Password 8+ chars','error'); return; }
      if(pw !== cf){ toast('Mismatch','error'); return; }
      (async () => {
        const { data: invite } = await sb.from('invites').select('*').eq('code', inviteCode).eq('used', false).maybeSingle();
        if(!invite){ toast('Invite invalid','error'); return; }
        const { data, error } = await sb.auth.signUp({ email, password: pw, options:{ data:{ invite_code: inviteCode, name: invite.for_user || email.split('@')[0], role: invite.role || 'HOLDER' }}});
        if(error){ toast('Signup failed: ' + error.message,'error'); return; }
        if(data.session && data.user){ closeModal(); await onAuthenticated(data.user); }
        else { closeModal(); toast('Check your email to confirm','success'); }
      })();
      return;
    }
  }
};

<script>
/* ═══════════════════════════════════════════════════════════════════
   VICE OS — engines (part 3a)
   SOLACE v5 · candle data · IRU event-sourced journal · Risk Kernel
   ═══════════════════════════════════════════════════════════════════ */

/* ─── SOLACE v5 — confirmed pivots → hold layer ─── */
const Solace = (() => {
  function atr(bars, len) {
    const n = bars.length, out = new Array(n).fill(NaN);
    let sum = 0, rma = NaN;
    for (let i = 0; i < n; i++) {
      const b = bars[i], p = bars[i-1];
      const tr = i === 0 ? b.h - b.l : Math.max(b.h - b.l, Math.abs(b.h - p.c), Math.abs(b.l - p.c));
      if (i < len) { sum += tr; if (i === len - 1) { rma = sum / len; out[i] = rma; } }
      else { rma = (rma * (len - 1) + tr) / len; out[i] = rma; }
    }
    return out;
  }
  function pivotHigh(bars, p, L, R) {
    if (p - L < 0 || p + R >= bars.length) return false;
    const v = bars[p].h;
    for (let k = 1; k <= L; k++) if (!(v > bars[p-k].h)) return false;
    for (let k = 1; k <= R; k++) if (!(v >= bars[p+k].h)) return false;
    return true;
  }
  function pivotLow(bars, p, L, R) {
    if (p - L < 0 || p + R >= bars.length) return false;
    const v = bars[p].l;
    for (let k = 1; k <= L; k++) if (!(v < bars[p-k].l)) return false;
    for (let k = 1; k <= R; k++) if (!(v <= bars[p+k].l)) return false;
    return true;
  }
  function run(bars, o) {
    const n = bars.length;
    o = { ...o, minLegATR: Math.max(0.5, o.minLegATR), breakCloses: Math.min(10, Math.max(1, o.breakCloses)),
          fbLen: Math.min(200, Math.max(5, o.fbLen)), atrLen: Math.max(1, o.atrLen) };
    const L = Math.max(1, o.left || (o.sens === 'Aggressive' ? 3 : o.sens === 'Conservative' ? 7 : 5)), R = L, MAXSCAN = 2000;
    const A = atr(bars, o.atrLen);
    const f0 = new Array(n).fill(null), f100 = new Array(n).fill(null);
    const s0 = new Array(n).fill('waiting'), s100 = new Array(n).fill('waiting'), legIds = new Array(n).fill(0);
    const events = [], pivots = [];
    let zHi=null, zHiBar=null, zLo=null, zLoBar=null, zLast=0;
    let pHi=null, pLo=null, zLegId=0, prevLegId=0;
    let F0=null, F100=null, b0=null, b100=null, hiBrk=0, loBrk=0, src0='waiting', src100='waiting';
    const lowIn = (i, from, to) => { if (to == null || !(to >= from)) return [null, null]; let v=null, off=null;
      for (let k = from; k <= to; k++) { const j = i - k; if (j < 0) break; if (v === null || bars[j].l < v) { v = bars[j].l; off = k; } } return [v, off]; };
    const hiIn  = (i, from, to) => { if (to == null || !(to >= from)) return [null, null]; let v=null, off=null;
      for (let k = from; k <= to; k++) { const j = i - k; if (j < 0) break; if (v === null || bars[j].h > v) { v = bars[j].h; off = k; } } return [v, off]; };
    for (let i = 0; i < n; i++) {
      const b = bars[i], aSafe = Number.isNaN(A[i]) ? b.c * 0.01 : A[i];
      const ph = (i - R >= 0 && pivotHigh(bars, i - R, L, R)) ? bars[i - R].h : null;
      const pl = (i - R >= 0 && pivotLow(bars, i - R, L, R)) ? bars[i - R].l : null;
      let zChanged = false;
      if (ph !== null) {
        if (zLast === -1) { const [lv, lo] = lowIn(i, R, Math.min(i - zLoBar, MAXSCAN));
          if (lv !== null && lv < zLo) { zLo = lv; zLoBar = i - lo; }
          const [hv, ho] = hiIn(i, R, Math.min(i - zLoBar, MAXSCAN));
          if (hv !== null) { zHi = hv; zHiBar = i - ho; zLast = 1; zChanged = true; } }
        else if (zLast === 1) {
          const [lv, lo] = lowIn(i, R, Math.min(i - zHiBar - 1, MAXSCAN));
          if (lv !== null && zLo !== null && lv < zLo) { zLo = lv; zLoBar = i - lo;
            const [hv, ho] = hiIn(i, R, lo); if (hv !== null) { zHi = hv; zHiBar = i - ho; } zChanged = true; }
          else { const [hv, ho] = hiIn(i, R, Math.min(i - zHiBar - 1, MAXSCAN));
            if (hv !== null && hv > zHi) { zHi = hv; zHiBar = i - ho; zChanged = true; } } }
        else { zHi = ph; zHiBar = i - R; zLast = 1; zChanged = true; }
      }
      if (pl !== null) {
        if (zLast === 1) { const [hv, ho] = hiIn(i, R, Math.min(i - zHiBar, MAXSCAN));
          if (hv !== null && hv > zHi) { zHi = hv; zHiBar = i - ho; }
          const [lv, lo] = lowIn(i, R, Math.min(i - zHiBar, MAXSCAN));
          if (lv !== null) { zLo = lv; zLoBar = i - lo; zLast = -1; zChanged = true; } }
        else if (zLast === -1) {
          const [hv, ho] = hiIn(i, R, Math.min(i - zLoBar - 1, MAXSCAN));
          if (hv !== null && zHi !== null && hv > zHi) { zHi = hv; zHiBar = i - ho;
            const [lv, lo] = lowIn(i, R, ho); if (lv !== null) { zLo = lv; zLoBar = i - lo; } zChanged = true; }
          else { const [lv, lo] = lowIn(i, R, Math.min(i - zLoBar - 1, MAXSCAN));
            if (lv !== null && lv < zLo) { zLo = lv; zLoBar = i - lo; zChanged = true; } } }
        else { zLo = pl; zLoBar = i - R; zLast = -1; zChanged = true; }
      }
      if (zChanged) pivots.push({ i, zHi, zHiBar, zLo, zLoBar });
      const legOK = zHi !== null && zLo !== null && zHi > zLo && zHi - zLo >= aSafe * o.minLegATR;
      if (zChanged && legOK && (pHi === null || zHi !== pHi || zLo !== pLo)) { pHi = zHi; pLo = zLo; zLegId++; }
      const newLeg = zLegId !== prevLegId; prevLegId = zLegId;
      if (F100 !== null) { hiBrk = b.c > F100 ? hiBrk + 1 : 0;
        if (hiBrk >= o.breakCloses) { events.push({ i, type: 'BROKEN', side: 'F100', price: F100 }); F100 = null; b100 = null; hiBrk = 0; src100 = 'broken'; } }
      if (F0 !== null) { loBrk = b.c < F0 ? loBrk + 1 : 0;
        if (loBrk >= o.breakCloses) { events.push({ i, type: 'BROKEN', side: 'F0', price: F0 }); F0 = null; b0 = null; loBrk = 0; src0 = 'broken'; } }
      if (o.whipsaw) {
        if (F100 !== null && b.h > F100 && b.c < F100) { events.push({ i, type: 'RAID', side: 'F100', price: b.h, from: F100 }); F100 = b.h; b100 = i; hiBrk = 0; src100 = 'raid'; }
        if (F0 !== null && b.l < F0 && b.c > F0) { events.push({ i, type: 'RAID', side: 'F0', price: b.l, from: F0 }); F0 = b.l; b0 = i; loBrk = 0; src0 = 'raid'; }
      } else {
        if (F100 !== null && b.h > F100 && b.c < F100) events.push({ i, type: 'SWEEP', side: 'F100', price: b.h, from: F100 });
        if (F0 !== null && b.l < F0 && b.c > F0) events.push({ i, type: 'SWEEP', side: 'F0', price: b.l, from: F0 });
      }
      const reAnchor = !o.noTighten && newLeg;
      if (legOK) {
        const takeHi = (F100 === null || zHi > F100 || reAnchor) && b.c < zHi;
        if (takeHi && (F100 === null || F100 !== zHi)) { F100 = zHi; b100 = zHiBar; hiBrk = 0; src100 = 'leg'; }
        const takeLo = (F0 === null || zLo < F0 || reAnchor) && b.c > zLo;
        if (takeLo && (F0 === null || F0 !== zLo)) { F0 = zLo; b0 = zLoBar; loBrk = 0; src0 = 'leg'; }
      }
      if (o.fallback && i >= o.fbLen - 1) {
        if (F100 === null) { let v = -Infinity, k = i; for (let j = i - o.fbLen + 1; j <= i; j++) if (bars[j].h > v) { v = bars[j].h; k = j; }
          if (b.c < v) { F100 = v; b100 = k; hiBrk = 0; src100 = 'roll'; } }
        if (F0 === null) { let v = Infinity, k = i; for (let j = i - o.fbLen + 1; j <= i; j++) if (bars[j].l < v) { v = bars[j].l; k = j; }
          if (b.c > v) { F0 = v; b0 = k; loBrk = 0; src0 = 'roll'; } }
      }
      f0[i] = F0; f100[i] = F100; s0[i] = src0; s100[i] = src100; legIds[i] = zLegId;
    }
    const li = n - 1, atrLast = n ? (Number.isNaN(A[li]) ? bars[li].c * 0.01 : A[li]) : 0;
    const zTol = atrLast * (o.zoneTolATR || 0.5), lb = bars[li];
    return { f0, f100, s0, s100, legIds, events, pivots, atr: A,
      last: n ? { F0, F100, src0, src100, b0, b100, zTol, close: lb.c,
        atHigh: F100 !== null && lb.h >= F100 - zTol,
        atLow: F0 !== null && lb.l <= F0 + zTol,
        position: F0 !== null && F100 !== null && F100 > F0 ? ((lb.c - F0) / (F100 - F0)) * 100 : null } : null };
  }
  return { run, atr };
})();

/* ─── Candle data: Binance · Yahoo · MT5 import · Practice ─── */
const BINANCE_TF = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1d':'1d' };
const YAHOO_TF = { '1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'1h','1d':'1d','1wk':'1wk' };
const YAHOO_RANGE = { '1m':'5d','5m':'1mo','15m':'1mo','1h':'3mo','4h':'1y','1d':'2y','1wk':'5y' };
const PRACTICE = 'PRACTICE', MAX_BARS = 60000;
const TF_SEC = { M1:60, M5:300, M15:900, M30:1800, H1:3600, H4:14400, D1:86400, W1:604800, MN1:2592000,
  '1m':60,'5m':300,'15m':900,'30m':1800,'1h':3600,'4h':14400,'1d':86400,'1wk':604800,'1mo':2592000 };
const MAIN_TFS = ['1m','5m','15m','1h','4h','1d'];
const CCY_NAMES = { EUR:'Euro', USD:'US Dollar', GBP:'British Pound', JPY:'Japanese Yen', CHF:'Swiss Franc', AUD:'Australian Dollar', CAD:'Canadian Dollar', NZD:'New Zealand Dollar', XAU:'Gold', XAG:'Silver', BTC:'Bitcoin', ETH:'Ether', SOL:'Solana' };
const CATALOG = [
  ['Forex majors', ['EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','USDCAD','NZDUSD']],
  ['Forex crosses', ['EURGBP','EURJPY','EURCHF','EURAUD','GBPJPY','GBPCHF','GBPAUD','AUDJPY','AUDCHF','NZDJPY','CADJPY','CHFJPY']],
  ['Metals', ['XAUUSD','XAGUSD','XPTUSD','XPDUSD']],
  ['Indices', [['NAS100','Nasdaq 100'],['US30','Dow Jones 30'],['SPX500','S&P 500'],['GER40','Germany 40'],['UK100','UK 100'],['JPN225','Japan 225']]],
  ['Energies', [['USOIL','WTI crude oil'],['UKOIL','Brent crude oil'],['NATGAS','Natural gas']]],
  ['Crypto', [['BTCUSDT','Bitcoin / USDT'],['ETHUSDT','Ether / USDT'],['SOLUSDT','Solana / USDT'],['XRPUSDT','XRP / USDT']]],
];
const CATALOG_DESC = new Map();
CATALOG.forEach(([, list]) => list.forEach(x => { const [s, d] = Array.isArray(x) ? x : [x, null]; CATALOG_DESC.set(s.toUpperCase(), d); }));
const catalogSymbols = () => CATALOG.flatMap(([, list]) => list.map(x => Array.isArray(x) ? x[0] : x));
const displaySymbol = s => s === PRACTICE ? 'Practice' : s;
function symDesc(sym) {
  if (sym === PRACTICE) return 'Simulated practice series, not market prices';
  const up = String(sym).toUpperCase(), core = up.split(/[._#!]/)[0];
  const d = CATALOG_DESC.get(up) || CATALOG_DESC.get(core);
  if (d) return d;
  const letters = core.replace(/[^A-Z]/g, '');
  if (letters.length >= 6 && CCY_NAMES[letters.slice(0,3)] && CCY_NAMES[letters.slice(3,6)])
    return `${CCY_NAMES[letters.slice(0,3)]} / ${CCY_NAMES[letters.slice(3,6)]}`;
  return 'Custom symbol';
}
function bucketStart(t, tf) {
  if (tf === 'MN1' || tf === '1mo') { const d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); }
  if (tf === 'W1' || tf === '1wk') { const d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - d.getUTCDay()); }
  const sec = TF_SEC[tf] || 3600;
  return Math.floor(t / (sec * 1000)) * sec * 1000;
}
function resample(bars, tf) {
  const out = []; let cur = null, key = null;
  for (const b of bars) {
    const k = bucketStart(b.t, tf);
    if (k !== key) { if (cur) out.push(cur); key = k; cur = { t: k, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v||0 }; }
    else { if (b.h > cur.h) cur.h = b.h; if (b.l < cur.l) cur.l = b.l; cur.c = b.c; cur.v += (b.v||0); }
  }
  if (cur) out.push(cur);
  return out;
}
function canBuild(baseTf, tf) {
  if (baseTf === tf) return true;
  const b = TF_SEC[baseTf], t = TF_SEC[tf];
  if (!b || !t) return false;
  if (tf === 'W1' || tf === '1wk' || tf === 'MN1' || tf === '1mo') return b <= 86400;
  return b < t && t % b === 0;
}
const setsFor = sym => Object.values(S.sets).filter(d => d.symbol === sym);
function tfList(sym) {
  const extra = setsFor(sym).map(d => d.tf).filter(tf => !MAIN_TFS.includes(tf));

/* ─── Load candles + compute SOLACE ─── */
async function fetchCandlesBinance(ticker, tf, limit=500){
  const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${ticker}&interval=${BINANCE_TF[tf]||'1h'}&limit=${limit}`);
  if(!r.ok) throw new Error('Binance HTTP ' + r.status);
  const d = await r.json();
  return d.map(k => ({ t:k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] }));
}
async function fetchCandlesYahoo(ticker, tf){
  const interval = YAHOO_TF[tf] || '1h';
  const range = YAHOO_RANGE[tf] || '3mo';
  const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=${interval}&range=${range}`);
  if(!r.ok) throw new Error('Yahoo HTTP ' + r.status);
  const j = await r.json();
  const res = j?.chart?.result?.[0];
  if(!res || !res.timestamp?.length) throw new Error('Yahoo: no data');
  const ts = res.timestamp, q = res.indicators?.quote?.[0] || {};
  const out = [];
  for(let i=0;i<ts.length;i++){
    if(q.open[i]==null || q.close[i]==null) continue;
    out.push({ t:ts[i]*1000, o:q.open[i], h:q.high[i], l:q.low[i], c:q.close[i], v:q.volume?.[i]||0 });
  }
  return out;
}
async function fetchCandlesUnified(symbol, tf, limit=500){
  if(APP_MODE === 'SIM') return sampleSeries(limit, 20260921, 3600e3, Date.now() - limit * 3600e3);
  const { source, ticker } = parseSymbol(symbol);
  if(source === 'YAHOO') return await fetchCandlesYahoo(ticker, tf);
  return await fetchCandlesBinance(ticker, tf, limit);
}
async function loadCandles(){
  try{
    const cs = await fetchCandlesUnified(S.ch.pair, S.ch.tf, 500);
    S.ch.candles = cs;
    computeATR();
    S.res = Solace.run(cs, S.engine);
    if (typeof drawAll === 'function') drawAll();
  }catch(e){
    S.ch.candles = sampleSeries(500, 20260921, 3600e3, Date.now() - 500*3600e3);
    computeATR();
    S.res = Solace.run(S.ch.candles, S.engine);
    toast('Live feed unavailable — simulated data', 'warn');
    if (typeof drawAll === 'function') drawAll();
  }
}
function computeATR(){
  const cs = S.ch.candles; if(cs.length < 15) return;
  let s = 0;
  for(let i=cs.length-14;i<cs.length;i++){
    const c = cs[i], pc = cs[i-1]?.c || c.o;
    s += Math.max(c.h-c.l, Math.abs(c.h-pc), Math.abs(c.l-pc));
  }
  S.ch.atr = s/14;
}

      oosTrades.push(...oos.trades);
      out.push({ fold:f, inSample:[isStart,isEnd], outOfSample:[oosStart,oosEnd], chosen: best ? best.params : null, isMetrics: best ? best.metrics : null, oosMetrics:oos.metrics });
    }
    return { folds:out, configsTested:grid.length*folds, embargo, oos:metrics(oosTrades) };
  }
  function monteCarlo(trades, { runs = 1000, seed = 7 } = {}) {
    const R = trades.map(t => t.R); if (R.length < 2) return null;
    const rnd = rng(seed); const totals = [], dds = [];
    for (let k = 0; k < runs; k++) {
      let sum = 0, peak = 0, dd = 0;
      for (let i = 0; i < R.length; i++) { sum += R[Math.floor(rnd() * R.length)]; if (sum > peak) peak = sum; if (peak - sum > dd) dd = peak - sum; }
      totals.push(sum); dds.push(dd);
    }
    const pct = (arr, p) => { const s = arr.slice().sort((a,b) => a-b); return s[Math.min(s.length-1, Math.floor(p*s.length))]; };
    return { runs, seed, totalR:{ p5:pct(totals,.05), p50:pct(totals,.5), p95:pct(totals,.95) }, maxDrawdownR:{ p5:pct(dds,.05), p50:pct(dds,.5), p95:pct(dds,.95) }, probLoss: totals.filter(x => x < 0).length / runs };
  }
  function adversarial(opts) {
    const base = backtest(opts);
    const spread = (opts.costs && opts.costs.spread) || 0, slip = (opts.costs && opts.costs.slippage) || 0;
    const rows = [['As tested', {}], ['Spread doubled', { costs:{ ...opts.costs, spread:spread*2 } }], ['Slippage tripled', { costs:{ ...opts.costs, slippage:slip*3 } }],
      ['Entry one bar late', { delay:1 }], ['Costs doubled and one bar late', { costs:{ spread:spread*2, slippage:slip*2 }, delay:1 }]]
      .map(([name, extra]) => { const r = backtest({ ...opts, ...extra }); return { name, trades:r.metrics.trades, expectancyR:r.metrics.expectancyR, totalR:r.metrics.totalR }; });
    const verdict = rows.every(r => r.expectancyR !== null && r.expectancyR > 0) ? 'SURVIVED'
      : base.metrics.expectancyR !== null && base.metrics.expectancyR > 0 ? 'FRAGILE' : 'NO EDGE';
    return { rows, verdict };
  }
  function stress(opts) {
    const rnd = rng(opts.seed || 1), atr = opts.features.atr;
    const picks = new Set(Array.from({ length:3 }, () => Math.floor(opts.data.length * (0.2 + rnd()*0.7))));
    const scenarios = [
      ['Flash wicks: three 6-ATR spikes', opts.data.map((b,i) => picks.has(i) && atr[i] > 0 ? { ...b, l:b.l - 6*atr[i], h:b.h + 6*atr[i] } : b), opts.costs],
      ['Spread explosion ×5', opts.data, { ...opts.costs, spread:(opts.costs.spread||0)*5 }],
      ['Volatility ×2 (wicks twice as long)', opts.data.map(b => ({ ...b, h:b.h + (b.h - Math.max(b.o,b.c)), l:b.l - (Math.min(b.o,b.c) - b.l) })), opts.costs],
    ].map(([name, data, costs]) => { const r = backtest({ ...opts, data, costs }); return { name, synthetic:true, trades:r.metrics.trades, expectancyR:r.metrics.expectancyR, maxDrawdownR:r.metrics.maxDrawdownR }; });
    const base = backtest(opts);
    return { base:{ trades:base.metrics.trades, expectancyR:base.metrics.expectancyR, maxDrawdownR:base.metrics.maxDrawdownR }, scenarios };
  }
  function championChallenger(opts, championParams = {}) {
    const strat = STRATEGIES[opts.strategyId];
    const evalFrom = Math.floor(opts.data.length * 0.6);
    const run = p => { const r = backtest({ ...opts, params:p, from:evalFrom }); return { params:r.params, oos:r.metrics, verdict:adversarial({ ...opts, params:p, from:evalFrom }).verdict }; };
    const champion = run({ ...strat.defaults, ...championParams });
    const keys = o => JSON.stringify(o);

    const promoted = challengers.filter(c => c.verdict === 'SURVIVED' && c.oos.trades >= 20 && c.oos.expectancyR > floor).sort((a,b) => b.oos.expectancyR - a.oos.expectancyR);
    return { champion, challengers, evaluatedFrom:evalFrom, decision: promoted.length ? 'PROMOTE CHALLENGER' : 'KEEP CHAMPION', promoted:promoted[0] || null,
      rule:'beat the champion by 0.05R per trade out of sample, with 20+ trades, and survive the adversarial lab' };
  }
  function dataset() {
    if (!S.ch.candles || !S.res) return null;
    return { bars:S.ch.candles, features:{ f0:S.res.f0, f100:S.res.f100, atr:S.res.atr },
      label:`${displaySymbol(S.sel.symbol)} ${S.sel.tf}`, source:S.ch.live ? 'LIVE' : 'FILE' };
  }
  function defaultCosts(ds) {
    const r = ds.bars.slice(-2000).map(b => b.h - b.l).sort((a,b) => a-b), med = r[Math.floor(r.length/2)] || 0;
    const d = Math.max(2, Math.min(6, Math.ceil(-Math.log10(med * 0.01 || 1e-5))));
    return { spread:+(med*0.05).toFixed(d), slippage:+(med*0.02).toFixed(d), commission:0 };
  }
  function record(kind, ds, a, result, extra) {
    const m = result ? result.metrics : null;
    const rec = { id:`EXP-${String(st.ledger.length+1).padStart(6,'0')}`, kind, strategyId:a.strategyId,
      version:STRATEGIES[a.strategyId].version, params: result ? result.params : null, costs:a.costs, seed:a.seed, delay:0,
      dataset:{ label:ds.label, source:ds.source, bars:ds.bars.length }, resultHash: result ? hashResult(result) : null,
      summary: m ? { trades:m.trades, expectancyR:m.expectancyR, totalR:m.totalR, maxDrawdownR:m.maxDrawdownR, winRate:m.winRate } : null, extra:extra || null, at:new Date().toISOString() };
    st.ledger.push(rec);
    try{ localStorage.setItem('vice-lab', JSON.stringify(st.ledger)); }catch(_){}
    return rec;
  }
  function hashResult(r) {
    const s = JSON.stringify([r.strategyId, r.version, r.params, r.costs, r.seed, r.from, r.to, r.delay, r.trades.map(t => [t.side, t.entryI, t.exitI, t.reason, Math.round(t.R*1e9)])]);
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

  }
  const notify = () => { if(typeof safeRender === 'function') safeRender(); else renderMain(); };
  return { state:st, strategies:STRATEGIES, metrics, backtest, walkForward, monteCarlo, adversarial, stress, championChallenger, dataset, defaultCosts,
    onChange:() => {},
    setCosts(c) { st.costs = c; },
    run() { const ds = dataset(); if (!ds) { st.msg = 'Load chart data first (Markets).'; notify(); return; }
      try { st.msg=''; const a = { data:ds.bars, features:ds.features, strategyId:st.strategy, costs:st.costs || defaultCosts(ds), seed:st.seed };
        st.run = backtest(a); st.base = backtest({ ...a, strategyId:'baseline-random' }); st.mc=null; st.adv=null; st.wf=null;
        record('backtest', ds, a, st.run);
        if (!st.run.metrics.trades) st.msg = `No trades on ${ds.label} (${ds.bars.length} bars). Try a lower timeframe or a longer history.`; }
      catch(e) { st.msg = e.message; } notify(); },
    walk() { const ds = dataset(); if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try { st.msg=''; const a = { data:ds.bars, features:ds.features, strategyId:st.strategy, costs:st.costs || defaultCosts(ds), seed:st.seed };
        st.wf = walkForward({ ...a, folds:4, embargo:20 }); record('walk-forward', ds, a, null, { configsTested:st.wf.configsTested, oos:st.wf.oos }); }
      catch(e) { st.msg = e.message; } notify(); },
    carlo() { const ds = dataset(); if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try { const a = { data:ds.bars, features:ds.features, strategyId:st.strategy, costs:st.costs || defaultCosts(ds), seed:st.seed };
        if (!st.run) st.run = backtest(a); st.mc = monteCarlo(st.run.trades, { runs:1000, seed:st.seed });
        if (!st.mc) throw new Error('Not enough trades for Monte Carlo.'); record('monte-carlo', ds, a, st.run, { mc:st.mc }); }
      catch(e) { st.msg = e.message; } notify(); },
    attack() { const ds = dataset(); if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try { const a = { data:ds.bars, features:ds.features, strategyId:st.strategy, costs:st.costs || defaultCosts(ds), seed:st.seed };
        st.adv = adversarial(a); record('adversarial', ds, a, null, { verdict:st.adv.verdict, rows:st.adv.rows }); }
      catch(e) { st.msg = e.message; } notify(); },
    stressNow() { const ds = dataset(); if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try { const a = { data:ds.bars, features:ds.features, strategyId:st.strategy, costs:st.costs || defaultCosts(ds), seed:st.seed };
        st.stress = stress(a); record('stress (synthetic)', ds, a, null, { scenarios:st.stress.scenarios }); }
      catch(e) { st.msg = e.message; } notify(); },
    champion() { const ds = dataset(); if (!ds) { st.msg = 'Load chart data first.'; notify(); return; }
      try { const a = { data:ds.bars, features:ds.features, strategyId:st.strategy, costs:st.costs || defaultCosts(ds), seed:st.seed };
        st.cc = championChallenger(a, st.championParams); if (st.cc.promoted) st.championParams = st.cc.promoted.params;

    reproduce(id) { const rec = st.ledger.find(x => x.id === id), ds = dataset();

      else if (!ds) st.repro[id] = `load ${rec.dataset.label} to reproduce`;

      notify(); } };
})();

/* ═══════════════════════════════════════════════════════════════════
   VICE Link — live MT5 broker connection (login + balance + positions)
   This is the "real broker login" bridge. Add MT5 accounts with
   server / login / password. The Windows VICE Bridge EA uses these
   credentials (stored encrypted in the browser only) to authenticate
   with the MT5 terminal and stream live data back over WebSocket.
   ═══════════════════════════════════════════════════════════════════ */
const Link = (() => {
  const st = S.link;
  const symbols = new Map(), series = new Map(), loading = new Set(), errors = new Map(), quotes = new Map(), reqs = new Map();
  let ws = null, retry = 0, timer = null, seq = 0, sub = null, startError = '';

  /* Persisted account credentials — AES-GCM encrypted in localStorage */
  const accts = (() => {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('vice-mt5-accounts') || '[]'); } catch(_) { list = []; }
    return list;
  })();
  const persistAccts = () => { try{ localStorage.setItem('vice-mt5-accounts', JSON.stringify(accts)); }catch(_){} };
  async function encryptPassword(pw) {
    if (!pw || !window.crypto || !window.crypto.subtle) return pw;
    try {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode('vice-os-mt5-key-2026'), { name:'AES-GCM' }, false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));

      if (h.get('link') || h.get('token')) { try{ localStorage.setItem('vice-link', JSON.stringify({ url:st.url, token:st.token })); }catch(_){} }

    clearTimeout(timer);
    if (!st.url) { st.status = 'off'; notify(); return; }
    if (typeof WebSocket === 'undefined') { st.status = 'off'; notify(); return; }

    try { ws = new WebSocket(st.url); } catch(e) { ws = null; st.status = 'error'; st.msg = 'Could not reach VICE Link.'; schedule(); notify(); return; }
    const me = ws;
    ws.onopen = () => { if (st.token) send({ t:'auth', token:st.token }); else { st.status = 'pair'; notify(); } };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch(_) { return; } onMsg(m); };
    ws.onclose = () => { if (ws !== me) return; ws = null;
      if (st.status !== 'pair') { st.status = 'error'; st.msg = 'Lost the connection to VICE Link. Reconnecting…'; }
      for (const r of reqs.values()) r.reject(new Error('Disconnected')); reqs.clear(); loading.clear(); schedule(); notify(); };
    ws.onerror = () => {};
  }
  function ready(m) {
    st.status = 'live'; st.msg = ''; st.admin = !!m.admin; st.device = m.device || ''; retry = 0;
    send({ t:'sources' }); send({ t:'portfolio', on:true }); send({ t:'audit' });
    if (st.admin) send({ t:'admin' });
    if (sub) send({ t:'sub', src:sub.src, s:sub.s, tf:sub.tf });
    notify();
  }
  function onMsg(m) {
    switch (m.t) {
      case 'authed': ready(m); break;
      case 'paired': st.token = m.token; try{ localStorage.setItem('vice-link', JSON.stringify({ url:st.url, token:st.token })); }catch(_){} ready(m); break;
      case 'error':

        if (m.id != null && reqs.has(m.id)) { reqs.get(m.id).reject(new Error(m.msg)); reqs.delete(m.id); break; }

      series.set(key, { src, sym, tf, digits:m.digits || 2, bars:(m.bars||[]).map(b => ({ t:b[0], o:b[1], h:b[2], l:b[3], c:b[4], v:0 })), rev:0 });

    }).catch(e => { loading.delete(key); errors.set(key, e.message); notify(); });
  }
  const api = {
    state:st, onChange:() => {},
    /* MT5 accounts — the NEW login feature */
    accounts:accts,
    addAccount({ broker, server, login, password, mode = 'DEMO', label = '' }) {
      if (!server || !login || !password) { st.msg = 'Server, login and password are required.'; notify(); return null; }

      encryptPassword(password).then(pwEnc => { acct._pwEnc = pwEnc; accts.push(acct); persistAccts();
        if (st.status === 'live' && st.admin) send({ t:'mt5-account', action:'add', account:acct });
        // Try to verify immediately through the bridge if connected
        if (st.status === 'live') request({ t:'mt5-verify', account:{ server, login, password } })
          .then(r => { acct.verified = !!r.ok; acct.equity = r.equity || 0; acct.balance = r.balance || 0; acct.currency = r.currency || 'USD'; persistAccts(); notify();
            toast(acct.verified ? `Connected to ${acct.broker} · ${acct.login}` : 'Bridge could not verify that login','success'); })
          .catch(e => { st.msg = 'Bridge could not verify: ' + e.message; notify(); });
        else { toast('Account saved. Start VICE Link on your PC to connect.','info'); notify(); }
      });
      return acct;
    },
    removeAccount(id) { const i = accts.findIndex(a => a.id === id); if (i >= 0) { accts.splice(i, 1); persistAccts(); if (st.status === 'live' && st.admin) send({ t:'mt5-account', action:'remove', id }); notify(); } },
    async testAccount(id) {
      const acct = accts.find(a => a.id === id); if (!acct) return;
      if (st.status !== 'live') { toast('VICE Link is not connected. Run VICE OS on your PC.','warn'); return; }

    },

    /* Connection lifecycle */

    send,
    symbols: src => symbols.get(src) || null,
    source: id => st.sources.find(x => x.id === id) || null,
    quote: (src, sym) => quotes.get(`${src}|${sym}`) || null,
    error: (src, sym, tf) => errors.get(skey(src, sym, tf)) || null,

    pair(code) { if (!ws || ws.readyState !== 1) { st.msg = 'Not connected to VICE Link yet.'; notify(); return; }
      st.msg = ''; send({ t:'pair', code:String(code).replace(/\D/g,''), device:deviceName() }); },
    setUrl(url, token = '') { st.url = String(url||'').trim(); st.token = token;
      try{ localStorage.setItem('vice-link', JSON.stringify({ url:st.url, token:st.token })); }catch(_){}
      api.stop(); setTimeout(connect, 100); notify(); },
  };

})();

  return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android phone' : /Windows/.test(u) ? 'Windows PC' : /Mac/.test(u) ? 'Mac' : 'Device'; }

          latestEvent: ev ? `${ev.type} ${ev.side} @ ${ev.price}` : null }; } },
    query_portfolio: { d:'MT5 accounts and VICE Wallet on-chain balances.',
      run: () => { const P = Link.state.portfolio, w = Wallet.state;
        const mt5 = Link.state.status !== 'live' ? { status:'NOT_CONNECTED' } : { accounts:(P ? P.accounts : []).map(a => ({ broker:brokerShort(a), mode:a.mode, currency:a.currency, equity:a.equity, balance:a.balance, positions:(a.positions||[]).length })) };
        const wal = !Wallet.has() ? { status:'NO_WALLET' } : !Wallet.unlocked() ? { status:'LOCKED' } : { ethereum: w.balances && w.balances.ethereum ? { native:w.balances.ethereum.native, tokens:(w.balances.ethereum.tokens||[]).map(t => [t.symbol, t.amount]) } : 'not read yet', bitcoin:'balance source not connected' };
        return { mt5, wallet:wal, total: fmtUsd(totalPersonalUsd()), accounts: S.mt5.length }; } },
    query_distribution: { d:'V4X and VICE supply: Estate reserve, client reserve, allocated, distributed, remaining, client count.',
      run: () => { const st = S.iru.state || IruEngine.emptyState(); const cap = IruEngine.capacity(st);
        const one = id => { const v = IruEngine.supplyView(st, id), cur = st.current[id]; return { total:String(v.total), estateReserve:String(v.reserve), clientReserve:String(v.pool), allocated:String(v.allocated), distributed:String(v.distributed), remaining:String(v.remaining), internalReferenceValue: cur ? Money.fmt(cur.valueCents) : 'not set' }; };
        return { V4X:one('V4X'), VICE:one('VICE'), clients:`${cap.current}/${cap.max}`, integrity:IruEngine.checkInvariants(st) }; } },
    query_risk: { d:'Risk ceilings and current mirror plan.', run:() => ({ perAccountCeiling:Money.bpsText(500), aggregateCeiling:Money.bpsText(900), accountsInPlan:S.risk.accounts.length }) },
    query_contracts: { d:'Canonical contract registry.', run:() => ({ network:'Ethereum Mainnet', contracts:ChainCheck.contracts.map(c => ({ key:c.key, label:c.label, address:c.address, status:c.candidates ? 'CONFLICT' : 'NOT VERIFIED' })) }) },
    query_system: { d:'Component health and build version.', run:() => ({ build:BUILD.version, liveMT5:Link.state.status === 'live', accounts:Link.accounts.length, wallet:Wallet.state.status }) },
    query_lab: { d:'Latest Quant Lab backtest and adversarial result.', run:() => ({ experiments:Lab.state.ledger.length, latest:Lab.state.run && Lab.state.run.metrics, adversarial:Lab.state.adv ? Lab.state.adv.verdict : null }) },
    query_desk: { d:'Trade Desk state.', run:() => ({ running:S.engine2.running, totalPositions:S.engine2.macro.positions.filter(p => p.status==='OPEN').length + S.engine2.internal.positions.filter(p => p.status==='OPEN').length }) },
    search_knowledge: { d:'Search the VICE OS help knowledge base.', run: inp => ({ results:kbSearch(inp && inp.query).map(e => ({ id:e[0], title:e[1], text:e[2] })) }) },
  };
  const AGENTS = {
    market:{ name:'Market Analyst', tools:['query_market'], re:/price|chart|structure|solace|f0|f100|level|market|pair|gold|trend/i },
    portfolio:{ name:'Portfolio Architect', tools:['query_portfolio'], re:/portfolio|account|equity|balance|position|wallet|mt5|total|worth/i },
    distribution:{ name:'Distribution Auditor', tools:['query_distribution'], re:/reserve|client|holder|distribut|supply|iru|v4x|vice|allocation/i },
    risk:{ name:'Risk Officer', tools:['query_risk','query_system'], re:/risk|ceiling|drawdown|exposure|safe|security/i },
    systems:{ name:'Systems Engineer', tools:['query_system'], re:/system|status|health|bridge|link|connected|server|build/i },
    contracts:{ name:'Chain Verifier', tools:['query_contracts'], re:/contract|on.?chain|token address|v4x address|checksum/i },
    quant:{ name:'Quant Researcher', tools:['query_lab'], re:/backtest|experiment|quant|walk.?forward|monte|expectancy|edge|research/i },
    desk:{ name:'VICEBOT Supervisor', tools:['query_desk','query_risk'], re:/vicebot|order|paper|kill|breaker|position|execution/i },
    support:{ name:'Support Agent', tools:['search_knowledge'], re:/how (do|can|to)|help|set ?up|connect|pair|import|create|restore|sign in|login|two-step|2fa/i },
  };
  function route(q) {
    if (/brief|today|overview|summary|everything/i.test(q)) return ['market','portfolio','distribution','systems'];
    const hit = Object.keys(AGENTS).filter(k => AGENTS[k].re.test(q));
    return hit.length ? hit.slice(0,3) : ['support','systems'];
  }
  function offlineAnswer(q, agents, results) {
    if (ADVICE.test(q)) return 'I can explain what your data shows, but I can’t give personal investment advice or predict prices or returns.';
    const out = [];
    for (const a of agents) for (const name of AGENTS[a].tools) {
      const r = results[name]; if (!r) continue;
      if (name === 'query_market') out.push(r.status === 'NO_DATA' ? `Market: no ${r.pair} ${r.timeframe} data yet. [query_market]`
        : `Market: ${r.pair} ${r.timeframe} (${r.dataSource}). Last close ${r.lastClose}; F100 ${r.F100}, F0 ${r.F0}${r.positionInRangePct !== null ? `; price is at ${r.positionInRangePct}% of the range` : ''}.${r.latestEvent ? ` Latest: ${r.latestEvent}.` : ''} [query_market]`);
      if (name === 'query_portfolio') out.push(`Portfolio total (rough): ${r.total}. MT5: ${r.mt5.status === 'NOT_CONNECTED' ? 'not connected' : `${r.mt5.accounts.length} account(s)`}. Wallet: ${r.wallet.status || 'unlocked'}. [query_portfolio]`);
      if (name === 'query_distribution') out.push(`Distribution: ${r.clients} clients. V4X remaining ${Number(r.V4X.remaining).toLocaleString()}; VICE remaining ${Number(r.VICE.remaining).toLocaleString()}. Integrity: ${Array.isArray(r.integrity) ? (r.integrity.length ? r.integrity.join('; ') : 'all checks pass') : 'unknown'}. [query_distribution]`);
      if (name === 'query_contracts') out.push(`Contracts: ${r.contracts.map(c => `${c.label} ${c.status}`).join('; ')}. [query_contracts]`);
      if (name === 'query_risk') out.push(`Risk: ${r.perAccountCeiling} per account, ${r.aggregateCeiling} aggregate. [query_risk]`);
      if (name === 'query_system') out.push(`System: build ${r.build}, VICE Link ${r.liveMT5 ? 'live' : 'off'}, ${r.accounts} MT5 account(s), wallet ${r.wallet}. [query_system]`);
      if (name === 'query_lab') out.push(`Quant Lab: ${r.experiments} experiment(s) on record${r.latest ? `, latest ${r.latest.trades} trades at ${fR(r.latest.expectancyR)}` : ''}${r.adversarial ? `, adversarial ${r.adversarial}` : ''}. [query_lab]`);
      if (name === 'query_desk') out.push(`Trade Desk: engine ${r.running ? 'running' : 'stopped'}, ${r.totalPositions} open paper position(s). [query_desk]`);
      if (name === 'search_knowledge') out.push(r.results.length ? r.results.map(x => `${x.title}: ${x.text} [kb:${x.id}]`).join('\n\n') : 'I couldn’t find that in the help library. Use Support → Talk to a person.');
    }
    return out.join('\n\n');
  }
  async function ask(q) {
    q = String(q||'').trim(); if (!q || st.busy) return;
    const agents = route(q);
    const turn = { q, agents:agents.map(a => AGENTS[a].name), trace:[], answer:'', at:new Date().toISOString() };
    st.turns.push(turn); st.busy = true; st.err = ''; notify();
    const names = [...new Set(agents.flatMap(a => AGENTS[a].tools))];
    const results = {};
    const exec = (name, input) => { const t0 = performance.now(); const r = TOOLS[name].run(input||{}); turn.trace.push({ tool:name, ms:Math.round(performance.now()-t0) }); notify(); return r; };
    try {
      for (const n of names) results[n] = exec(n, n === 'search_knowledge' ? { query:q } : {});
      turn.answer = offlineAnswer(q, agents, results);
      turn.mode = 'offline';
    } catch(e) {
      turn.answer = 'Error: ' + e.message; turn.mode = 'offline';
    }
    st.busy = false; notify();
  }
  return {
    state:st, tools:TOOLS, agents:AGENTS, route, ask, kbSearch, onChange:() => {},
    stop() { if (st.abort) st.abort.abort(); },
    speak(text) { try { if (!('speechSynthesis' in window)) return false; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(text).replace(/\[[^\]]+\]/g,'')); u.rate = 1.02; speechSynthesis.speak(u); return true; } catch(_) { return false; } },
    listen(onText) { const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return false;
      const rec = new R(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
      st.listening = true; notify();
      rec.onresult = ev => { st.listening = false; onText(ev.results[0][0].transcript); };
      rec.onerror = rec.onend = () => { st.listening = false; notify(); };
      rec.start(); return true; },
  };
})();

/* ─── Auto-start the core services ─── */
Wallet.start();
Link.start();
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   VIEWS — part 1
   ═══════════════════════════════════════════════════════════════════ */

/* ─── PRESETS + chart rendering ─── */
const PRESETS = {
  'vice-gold': { name:'VICE Gold', type:'hollow', bg:'#0a0b0d', grid:'rgba(201,168,76,.05)', gridMajor:'rgba(201,168,76,.12)', text:'#a3968e',
    bull:'#c9a84c', bullB:'#ecd28a', bullW:'#9c7c33', bear:'#f2ebe4', bearB:'#3d3532', bearW:'#6b5f59', f100:'#f2ebe4', f0:'#3c8cff', raid:'#d9465a', last:'#c9a84c' },
  'midnight': { name:'Midnight', type:'candles', bg:'#000', grid:'rgba(255,255,255,.04)', gridMajor:'rgba(255,255,255,.09)', text:'#b0b0b0',
    bull:'#fff', bullB:'#fff', bullW:'#8a8a8a', bear:'#555', bearB:'#888', bearW:'#555', f100:'#fff', f0:'#3c8cff', raid:'#ff6a3d', last:'#c9a84c' },
  'ember': { name:'Ember', type:'candles', bg:'#07080a', grid:'rgba(201,168,76,.05)', gridMajor:'rgba(201,168,76,.12)', text:'#a3968e',
    bull:'#c9a84c', bullB:'#ecd28a', bullW:'#9c7c33', bear:'#b8412c', bearB:'#8a2f2a', bearW:'#6b2620', f100:'#f3efe7', f0:'#3c8cff', raid:'#ff6a3d', last:'#e8d29a' },
  'paper': { name:'Paper (light)', type:'hollow', bg:'#f4f2ed', grid:'rgba(60,50,40,.05)', gridMajor:'rgba(60,50,40,.14)', text:'#5a5248',
    bull:'#2b3036', bullB:'#2d5c3a', bullW:'#2d5c3a', bear:'#8a9099', bearB:'#8a2f2a', bearW:'#8a2f2a', f100:'#1c1f24', f0:'#1f5fd1', raid:'#c2412a', last:'#9a7a2e' },
};
S.chart.colors = { ...PRESETS['vice-gold'] };

let _cv = null, _ctx = null, _dpr = 1, _W = 0, _H = 0;
const PAD = { t:22, r:76, b:42, l:10 };
function initCanvas(){
  _cv = $('cv'); if(!_cv) return;
  _ctx = _cv.getContext('2d');
  resizeCanvas(); drawAll();
  if(!_cv._wired){
    _cv._wired = true;
    _cv.addEventListener('mousemove', e => { const r=_cv.getBoundingClientRect(); _cv._mx=e.clientX-r.left; _cv._my=e.clientY-r.top; drawAll(); });
    _cv.addEventListener('mouseleave', () => { _cv._mx=null; _cv._my=null; drawAll(); });
    _cv.addEventListener('touchstart', e => { if(e.touches.length!==1) return; const t=e.touches[0],r=_cv.getBoundingClientRect(); _cv._mx=t.clientX-r.left; _cv._my=t.clientY-r.top; _cv._drag={ x:t.clientX, end:S.view2.end }; }, { passive:true });
    _cv.addEventListener('touchmove', e => { if(e.touches.length!==1 || !_cv._drag) return;
      const dx = e.touches[0].clientX - _cv._drag.x;
      const n = S.ch.candles.length, bw = (_W - PAD.l - PAD.r) / Math.max(1, Math.min(n, Math.max(30, S.view2.count)));
      S.view2.end = Math.max(Math.min(n, S.view2.count), Math.min(n, Math.round(_cv._drag.end - dx / bw)));
      if(S.view2.end >= n) S.view2.end = null;
      drawAll(); }, { passive:true });
    _cv.addEventListener('touchend', () => { _cv._drag=null; });
    _cv.addEventListener('wheel', e => { e.preventDefault(); zoomChart(e.deltaY<0 ? 0.8 : 1.25); }, { passive:false });
  }
}
function resizeCanvas(){
  if(!_cv) return;
  const r = _cv.parentElement.getBoundingClientRect();
  _dpr = window.devicePixelRatio || 1;
  _cv.width = r.width*_dpr; _cv.height = r.height*_dpr;
  _cv.style.width = r.width+'px'; _cv.style.height = r.height+'px';
  _ctx.setTransform(_dpr,0,0,_dpr,0,0);
  _W = r.width; _H = r.height;
}
function zoomChart(f){
  if(!S.ch.candles.length) return;
  const n = S.ch.candles.length;
  S.view2.count = Math.max(30, Math.min(n, Math.round(S.view2.count * f)));
  drawAll();
}
function fmtP(v){
  const d = S.ch.candles.length ? (S.ch.candles[0].c > 100 ? 2 : 4) : 2;
  return v == null ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d });
}
function drawAll(){ drawSolace(); }
function drawSolace(){
  if(!_cv || !_ctx || !S.ch.candles.length || !S.res) return;
  const P = S.chart.colors, cs = S.ch.candles;
  _ctx.fillStyle = P.bg; _ctx.fillRect(0, 0, _W, _H);
  const cw = _W - PAD.l - PAD.r, ch = _H - PAD.t - PAD.b;
  const visCount = Math.min(S.view2.count, cs.length);
  const start = cs.length - visCount;
  const end = S.view2.end == null ? cs.length : Math.min(cs.length, S.view2.end);
  const startIdx = Math.max(0, end - visCount);

  let vmin = Infinity, vmax = -Infinity;
  for (let i = startIdx; i < end; i++) {
    if (cs[i].l < vmin) vmin = cs[i].l; if (cs[i].h > vmax) vmax = cs[i].h;
    if (S.res.f0[i] != null) vmin = Math.min(vmin, S.res.f0[i]);
    if (S.res.f100[i] != null) vmax = Math.max(vmax, S.res.f100[i]);
  }
  const rng = vmax - vmin || 1; vmin -= rng*0.06; vmax += rng*0.06;
  const xAt = i => PAD.l + (i - startIdx)/(Math.max(1, end - startIdx - 1)) * cw;
  const yAt = v => PAD.t + (1 - (v - vmin)/(vmax - vmin)) * ch;

  // grid
  _ctx.strokeStyle = P.grid; _ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) { const y = PAD.t + (i/5)*ch; _ctx.beginPath(); _ctx.moveTo(PAD.l, y); _ctx.lineTo(_W-PAD.r, y); _ctx.stroke(); }
  _ctx.strokeStyle = P.gridMajor;
  for (let i = 0; i <= 10; i++) { const x = PAD.l + (i/10)*cw; _ctx.beginPath(); _ctx.moveTo(x, PAD.t); _ctx.lineTo(x, _H-PAD.b); _ctx.stroke(); }

  // candles
  const cw2 = Math.max(1.5, cw/Math.max(1, end - startIdx) - 1);
  for (let i = startIdx; i < end; i++) {
    const c = cs[i], x = xAt(i), up = c.c >= c.o;
    const bC = up ? P.bull : P.bear, bB = up ? P.bullB : P.bearB, bW = up ? P.bullW : P.bearW;
    _ctx.strokeStyle = bW; _ctx.beginPath(); _ctx.moveTo(x, yAt(c.h)); _ctx.lineTo(x, yAt(c.l)); _ctx.stroke();
    const yO = yAt(c.o), yC = yAt(c.c);
    const top = Math.min(yO, yC), bh = Math.max(1, Math.abs(yC - yO));
    _ctx.fillStyle = bC; _ctx.fillRect(x - cw2/2, top, cw2, bh);
    _ctx.strokeStyle = bB; _ctx.strokeRect(x - cw2/2 + 0.5, top + 0.5, cw2 - 1, Math.max(1, bh - 1));
  }

  // F0/F100 levels
  const f0 = S.res.f0[end-1], f100 = S.res.f100[end-1];
  if (f0 != null) { _ctx.strokeStyle = P.f0; _ctx.lineWidth = 1.5; _ctx.setLineDash([5,3]);
    const y = yAt(f0); _ctx.beginPath(); _ctx.moveTo(PAD.l, y); _ctx.lineTo(_W-PAD.r, y); _ctx.stroke(); _ctx.setLineDash([]);
    _ctx.fillStyle = P.f0; _ctx.font = '10px "JetBrains Mono", monospace'; _ctx.textAlign='left'; _ctx.fillText(`F0 ${fmtP(f0)}`, _W-PAD.r+5, y+12); }
  if (f100 != null) { _ctx.strokeStyle = P.f100; _ctx.lineWidth = 1.5; _ctx.setLineDash([5,3]);
    const y = yAt(f100); _ctx.beginPath(); _ctx.moveTo(PAD.l, y); _ctx.lineTo(_W-PAD.r, y); _ctx.stroke(); _ctx.setLineDash([]);
    _ctx.fillStyle = P.f100; _ctx.font = '10px "JetBrains Mono", monospace'; _ctx.textAlign='left'; _ctx.fillText(`F100 ${fmtP(f100)}`, _W-PAD.r+5, y-4); }

  // price axis
  _ctx.font = '9px "JetBrains Mono", monospace'; _ctx.fillStyle = P.text; _ctx.textBaseline = 'middle';
  for (let i = 0; i <= 5; i++) { const v = vmax - (i/5)*(vmax-vmin), y = PAD.t + (i/5)*ch; _ctx.fillText(v.toFixed(v > 100 ? 2 : 4), _W-PAD.r+5, y); }

  // last price tag
  const last = cs[end-1], yLast = yAt(last.c);
  const tag = last.c.toFixed(last.c > 100 ? 2 : 4);
  const tw = _ctx.measureText(tag).width + 10;
  _ctx.fillStyle = last.c >= last.o ? P.bullB : P.bearB;
  _ctx.fillRect(_W-PAD.r+2, yLast-8, tw, 16);
  _ctx.fillStyle = '#07080a'; _ctx.textAlign='left'; _ctx.fillText(tag, _W-PAD.r+7, yLast);

  // crosshair
  if (_cv._mx != null && _cv._my != null) {
    _ctx.strokeStyle = 'rgba(201,168,76,0.4)'; _ctx.lineWidth = 1; _ctx.setLineDash([3,3]);
    _ctx.beginPath(); _ctx.moveTo(_cv._mx,? PAD.t); _ctx.lineTo(_cv._mx, _H-PAD.b); _ctx.stroke();
    _ctx.beginPath(); _ctx.moveTo(PAD.l, _cv._my); _ctx.lineTo(_W-PAD.r, _cv._my); _ctx.stroke();
    _ctx.setLineDash([]);
    const priceAtY = vmax - ((_cv._my - PAD.t)/(_H - PAD.t - PAD.b)) * (vmax - vmin);
    _ctx.fillStyle = 'rgba(201,168,76,0.9)'; _ctx.fillRect(_W-PAD.r, _cv._my-8, PAD.r-2, 16);
    _ctx.fillStyle = '#07080a'; _ctx.fillText(priceAtY.toFixed(priceAtY>100?2:4), _W-PAD.r+5, _cv._my);
  }

  // HUD
  const hud = $('hud');
  if (hud) {
    const L = S.res.last, chg = ((last.c - last.o)/last.o * 100);
    hud.innerHTML = `<div><span class="k">${esc(displaySymbol(S.sel.symbol))}</span><span class="v">${S.sel.tf}</span></div>
      <div><span class="k">Last</span><span class="${chg>=0?'up':'dn'}">${fmtP(last.c)}</span> <span class="${chg>=0?'up':'dn'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span></div>
      <div><span class="k">ATR</span><span class="v">${S.ch.atr.toFixed(S.ch.atr>12:5)}</span></div>
      <div><span class="k">Macro</span><span class="${L && L.position !== null ? 'gd' : 'w'}">${L && L.position !== null ? `${L.position.toFixed(1)}% of range` : '—'}</span></div>`;
  }
  const cstat = $('cstat');
  if (cstat) {
    cstat.innerHTML = `<span class="f100">F100 ${f100 != null ? fmtP(f100) : '—'}</span>
      <span class="f0">F0 ${f0 != null ? fmtP(f0) : '—'}</span>
      <span class="in">Bars ${cs.length.toLocaleString()}</span>
      <span class="ch">Zoom ${S.view2.count}</span>`;
  }
}

/* ─── Desk helpers (used by Part 6 too) ─── */
const Desk = (() => {
  const st = S.desk;
  st.policy = ViceCore.effectivePolicy(st.policy);
  const key = () => S.sel.symbol;
  const spec = () => st.specs[key()] || null;
  const ctx = () => {
    if (!S.ch.candles.length || !S.res) return null;
    const bars = S.ch.candles, n = bars.length, cur = st.replay && st.cursor !== null ? Math.min(st.cursor, n - 1) : n - 1;
    const atr = S.res.atr, regime = ViceCore.regimeAt(bars, atr, cur),
      long = ViceCore.tighten(bars, S.res.f0, S.res.f100, atr, cur, 1),
      short = ViceCore.tighten(bars, S.res.f0, S.res.f100, atr, cur, -1);
    const rank = { ARMED:6, CONFIRMATION:5, REJECTION:4, SWEEP:3, TEST:2, TOUCH:1, SEARCHING:0, INVALIDATED:0 };
    const active = rank[long.state] >= rank[short.state] ? long : short;
    const spread = 0.0001 * (bars[cur].c || 1);
    const mode = ViceCore.precisionMode({ regime, t:active, price:bars[cur].c, atr:atr[cur], spread });
    return { bars, n, cur, atr, regime, long, short, active, spread, price:bars[cur].c, mode };
  };
  const audit = what => { st.audit.push({ at:new Date().toISOString(), what }); if (st.audit.length > 200) st.audit.shift(); };
  const notify = () => { if(typeof safeRender === 'function') safeRender(); else renderMain(); };
  const api = {
    state:st, ctx, spec,
    onChange:() => {},
    startReplay() { if (!S.ch.candles.length) return; st.replay = true; st.cursor = Math.max(300, S.ch.candles.length - 600);
      st.broker = ViceCore.createPaperBroker({ equity:10000, spec:spec() || { tickSize:1, tickValue:0, volumeMin:1, volumeMax:1, volumeStep:1 } });
      st.breaker = ViceCore.newBreaker(); st.risk = null; st.order = null;
      audit(`replay at bar ${st.cursor}`); notify(); },
    stopReplay() { st.replay = false; st.cursor = null; notify(); },
    advance(k = 1) { if (!st.replay || !st.broker) return; const bars = S.ch.candles, c = ctx();
      for (let j = 0; j < k && st.cursor < bars.length - 1; j++) { st.cursor++; st.broker.step(bars[st.cursor], st.cursor, c ? c.spread : 0); }
      notify(); },
    playTo(kind, max = 600) { if (!st.replay || !st.broker) return; const bars = S.ch.candles, spread = (ctx() || { spread:0 }).spread;
      for (let k = 0; k < max && st.cursor < bars.length - 1; k++) {
        st.cursor++; st.broker.step(bars[st.cursor], st.cursor, spread);
        if (kind === 'setup') { const a = ViceCore.tighten(bars, S.res.f0, S.res.f100, S.res.atr, st.cursor, 1), b = ViceCore.tighten(bars, S.res.f0, S.res.f100, S.res.atr, st.cursor, -1); if (a.state === 'ARMED' || b.state === 'ARMED') break; }
      }
      notify(); },
    saveSpec(v) { st.specs[key()] = v; try{ localStorage.setItem('vice-specs', JSON.stringify(st.specs)); }catch(_){}
      if (!st.broker) st.broker = ViceCore.createPaperBroker({ equity:10000, spec:v });
      audit(`spec saved for ${S.sel.symbol}`); notify(); },
    prepare() {
      const c = ctx(); if (!c) return;
      if (!st.broker) st.broker = ViceCore.createPaperBroker({ equity:10000, spec:spec() || { tickSize:1, tickValue:0, volumeMin:1, volumeMax:1, volumeStep:1 } });
      const t = c.active;
      if (t.state !== 'ARMED' || !t.plan) { st.msg = 'Nothing armed: Tighten needs an ARMED setup first.'; st.risk = null; notify(); return; }
      const runner = /SWING|RUNNER/.test(c.mode.mode);
      st.order = { idempotencyKey:`${S.sel.symbol}-${S.sel.tf}-${c.cur}-${t.side}`, symbol:S.sel.symbol, side:t.side,
        price:t.side > 0 ? t.plan.zoneHi : t.plan.zoneLo, entry:t.side > 0 ? t.plan.zoneHi : t.plan.zoneLo,
        stop:t.plan.stop, target:runner ? t.plan.t2 : t.plan.t1, strategy:'tighten-f0f100', createdI:c.cur,
        why:{ regime:c.regime.regime, tighten:`${t.side > 0 ? 'F0' : 'F100'} ${t.state}`, level:t.level, mode:c.mode.mode, plan:t.plan } };
      st.risk = ViceCore.preTrade({ order:st.order, account:st.broker.account,
        market:{ spread:c.spread, atr:c.atr[c.cur], mode:'PAPER' }, spec:spec(), policy:st.policy, breaker:st.breaker,
        openPositions:st.broker.positions.length, usedKeys:st.broker.book.keys });
      if (st.risk.size) st.order.volume = st.risk.size.volume;
      st.msg = ''; audit(`risk ${st.risk.decision.toLowerCase()} for ${st.order.idempotencyKey}`); notify(); },
    send() { if (!st.order || !st.risk) return; const r = st.broker.submit(st.order, st.risk); audit(`order ${r.order.id}`); st.order = null; st.risk = null; notify(); },
    kill() { const bars = S.ch.candles, c = ctx(); st.breaker = ViceCore.breakerStep(st.breaker, 'MANUAL_KILL', { at:new Date().toISOString() });
      if (st.broker && bars.length && c) st.broker.flatten(bars[c.cur], c.cur, c.spread);
      audit('KILL SWITCH'); notify(); },
    reset(reason) { try { st.breaker = ViceCore.breakerStep(st.breaker, st.breaker.state === 'SAFE_MODE' ? 'ACKNOWLEDGE_RESET' : 'RESET', { reason, at:new Date().toISOString() });
      audit(`breaker reset: ${reason}`); st.msg = ''; } catch(e) { st.msg = e.message; } notify(); },
  };
  return api;
})();

   VIEWS — part 2 (final)

/* ─── Comms (Telegram-style, bottom tabs ONLY here) ─── */
function commsUnreadTotal(){
  return Object.values(S.comms.unread).reduce((a,b) => a + (b||0), 0);
}
function paintCmTabs(){
  const t = $('cmTabs'); if (!t) return;
  t.classList.toggle('on', S.tab === 'comms');
  const btns = [...t.querySelectorAll('button[data-cm-tab]')];
  const active = t.querySelector(`button[data-cm-tab="${S.comms.tab}"]`);
  btns.forEach(b => b.setAttribute('aria-current', b.dataset.cmTab === S.comms.tab ? 'page' : 'false'));
  const ind = $('cmInd');
  if (ind && active) { ind.style.width = active.offsetWidth + 'px'; ind.style.height = active.offsetHeight + 'px'; ind.style.left = active.offsetLeft + 'px'; ind.style.top = active.offsetTop + 'px'; }
  const badge = $('cmBadgeChats');
  if (badge) { const n = commsUnreadTotal(); badge.textContent = n > 99 ? '99+' : String(n); badge.style.display = n > 0 ? 'block' : 'none'; }
}
function viewComms(el){
  const tab = S.comms.tab || 'chats';
  if (tab === 'chats') return viewCommsChats(el);
  if (tab === 'calls') return viewCommsCalls(el);
  if (tab === 'contacts') return viewCommsContacts(el);
  return viewCommsSettings(el);
}
function viewCommsChats(el){
  const activeDm = S.comms.activeDm;
  const activeCh = S.comms.activeChannel;
  const isDm = !!activeDm;
  const list = commsList();
  const active = isDm ? S.comms.dms[activeDm] || [] : S.comms.messages[activeCh] || [];
  const ch = S.comms.channels.find(c => c.id === activeCh);
  const peer = S.comms.peers.find(p => p.id === activeDm);

  el.innerHTML = `
    <div class="cm-app${isDm || activeCh ? ' thread-open' : ''}" id="cmApp">
      <aside class="cm-list-pane">
        <div class="cm-list-head">
          <div class="cm-list-head-row"><h2>Chats</h2><button class="btn btn-icon btn-g" data-act="cm-new-channel" aria-label="New channel">＋</button></div>
          <input class="cm-list-search" id="cmSearch" placeholder="Search chats…" value="${esc(S.query)}" data-role="cm-search">
        </div>
        <div class="cm-list-scroll">
          ${list.length ? list.map(c => `
            <button class="cm-item${c.active ? ' on' : ''}${c.unread ? ' unread' : ''}" data-act="cm-open" data-type="${c.type}" data-id="${esc(c.id)}">
              <div class="cm-item-ava ${c.color === 'v4x' ? 'v4x' : ''}${c.online ? ' online' : ''}">${esc(c.initials)}</div>
              <div class="cm-item-body">
                <div class="cm-item-top"><span class="cm-item-name">${esc(c.name)}</span><span class="cm-item-time">${c.time}</span></div>
                <div class="cm-item-top"><span class="cm-item-prev">${esc(c.preview)}</span>${c.unread ? `<span class="cm-item-badge">${c.unread}</span>` : ''}</div>
              </div>
            </button>`).join('') : '<div class="emp">No chats yet. Create a channel with the + button.</div>'}
        </div>
      </aside>
      <section class="cm-thread-pane">
        ${(isDm || activeCh) ? `
          <header class="cm-thread-head">
            <button class="cm-back" data-act="cm-close-thread" aria-label="Back">←</button>
            <div class="cm-thread-title">
              <b>${isDm ? esc(peer ? peer.name : activeDm) : '#' + esc(ch ? ch.name : activeCh)}</b>
              <span>${isDm ? (S.comms.online.has(peer ? peer.name : '') ? 'online' : 'offline') : esc(ch ? ch.topic || '' : '')}</span>
            </div>
            <div class="cm-thread-acts">
              <button data-act="cm-call-voice" title="Voice call">📞</button>
              <button data-act="cm-call-video" title="Video call">🎥</button>
              <button data-act="cm-invite-link" title="Copy invite link">🔗</button>
            </div>
          </header>
          ${ch && ch.pinned && !isDm ? `<div class="cm-pin-bar"><b>📌</b> ${esc(ch.pinned)}</div>` : ''}
          <div class="cm-msgs" id="cmMsgs">
            ${active.length ? active.map(m => commsBubble(m, isDm)).join('') : '<div class="cm-empty"><svg viewBox="0 0 1000 866"><path fill="currentColor" d="M500 866L259.1 448.8L414 180.4L477.1 289.6L395.5 430.9L500 611.9L589.4 457.1L736.1 457.1ZM1000 0L759.1 417.2L449.3 417.2L512.3 308L675.4 308L779.9 127.1L601.2 127.1L527.8 0ZM0 0L481.8 0L636.7 268.3L510.6 268.3L429.1 127.1L220.1 127.1L309.4 281.9L236.1 408.9Z"/></svg><span>No messages yet. Say hello.</span></div>'}
          </div>
          <div class="cm-typing" id="cmTyping"></div>
          <form class="cm-composer" data-act="cm-send-form">
            <input type="text" id="cmInput" placeholder="Message" autocomplete="off" data-role="cm-input">
            <button class="send" type="submit" aria-label="Send">➤</button>
          </form>
        ` : `<div class="cm-empty"><svg viewBox="0 0 1000 866"><path fill="currentColor" d="M500 866L259.1 448.8L414 180.4L477.1 289.6L395.5 430.9L500 611.9L589.4 457.1L736.1 457.1ZM1000 0L759.1 417.2L449.3 417.2L512.3 308L675.4 308L779.9 127.1L601.2 127.1L527.8 0ZM0 0L481.8 0L636.7 268.3L510.6 268.3L429.1 127.1L220.1 127.1L309.4 281.9L236.1 408.9Z"/></svg><span>Select a chat or channel to start.</span></div>`}
      </section>
    </div>
  `;
  const box = $('cmMsgs'); if (box) box.scrollTop = box.scrollHeight;
  paintCmTabs();
}
function commsList(){
  const q = (S.query || '').toLowerCase();
  const out = [];
  for (const ch of S.comms.channels) {
    const list = S.comms.messages[ch.id] || [];
    const last = list[list.length - 1];
    const name = '#' + ch.name;
    if (q && !name.toLowerCase().includes(q) && !String(ch.topic || '').toLowerCase().includes(q)) continue;
    out.push({ type:'channel', id:ch.id, name, initials:'#', preview:last ? last.text.slice(0, 60) : (ch.topic || 'No messages'),
      time:last ? timeAgo(last.at) : '', unread:S.comms.unread[ch.id] || 0, active:!S.comms.activeDm && S.comms.activeChannel === ch.id, color:'v4x' });
  }
  for (const p of S.comms.peers) {
    if (p.name === S.profile.name) continue;
    const list = S.comms.dms[p.id] || [];
    const last = list[list.length - 1];
    const name = p.name;
    if (q && !name.toLowerCase().includes(q)) continue;
    out.push({ type:'dm', id:p.id, name, initials:p.name.slice(0,2).toUpperCase(),
      preview:last ? last.text.slice(0, 60) : `${p.role} · no messages`, time:last ? timeAgo(last.at) : '',
      unread:S.comms.unread['dm:'+p.id] || 0, active:S.comms.activeDm === p.id, online:S.comms.online.has(p.name) });
  }
  return out;
}
function commsBubble(m, isDm){
  const isSelf = m.self;
  const rx = (m.reactions || []).map(e => `<button class="cm-reaction">${esc(e)}</button>`).join('');
  return `<div class="cm-bubble-row${isSelf ? ' self' : ''}">
    <div class="cm-bubble-ava">${esc((m.from||'?').slice(0,2).toUpperCase())}</div>
    <div class="cm-bubble">
      ${!isSelf && !isDm ? `<div class="cm-bubble-from">${esc(m.from)}</div>` : ''}
      <div>${esc(m.text)}</div>
      <div class="cm-bubble-meta">${whenText(new Date(m.at).toISOString())}${isSelf ? ' <span class="tick">✓✓</span>' : ''}</div>
      ${rx ? `<div class="cm-reactions">${rx}</div>` : ''}
    </div>
  </div>`;
}
function viewCommsCalls(el){
  const calls = S.comms.calls || [];
  el.innerHTML = `
    <div class="ph"><div><div class="eb">Comms · Calls</div><h1>Call <em>History</em></h1></div>
      <div class="ph-acts"><button class="btn btn-p" data-act="cm-new-call">Start a call</button></div></div>
    <section class="band">
      ${calls.length ? calls.map(c => `<div class="cm-call-row${c.missed ? ' missed' : ''}">
        <div class="cm-item-ava${c.video ? ' v4x' : ''}">${esc(c.peer.slice(0,2).toUpperCase())}</div>
        <div class="cm-item-body"><div class="cm-call-name"><b>${esc(c.peer)}</b></div>
          <div class="meta">${c.video ? 'Video call' : 'Voice call'} · ${whenText(c.at)}</div></div>
        <div class="meta">${c.duration ? c.duration + ' min' : c.missed ? 'Missed' : ''}</div>
      </div>`).join('') : '<div class="emp">No calls yet.</div>'}
    </section>
    <section class="band">
      <div class="band-head"><h2>Invite someone to a call</h2></div>
      <p class="muted">Generate a one-shot room link. Anyone with the link joins this room through the same WebRTC infrastructure.</p>
      <div class="actions" style="margin-top:12px">
        <button class="btn btn-p" data-act="cm-invite-room">Generate call invite link</button>
      </div>
      ${S.comms.lastInvite ? `<p class="note">Last invite link: <span class="code" style="display:inline-block;padding:4px 8px">${esc(S.comms.lastInvite)}</span>
        <button class="btn btn-xs btn-gd" style="margin-left:6px" data-act="copy" data-copy="${esc(S.comms.lastInvite)}">Copy</button></p>` : ''}
    </section>
  `;
}
function viewCommsContacts(el){
  el.innerHTML = `
    <div class="ph"><div><div class="eb">Comms · Contacts</div><h1>Contacts</h1></div></div>
    <section class="band">
      <div class="band-head"><h2>Team</h2><span class="meta">${S.comms.peers.length} peers</span></div>
      ${S.comms.peers.filter(p => p.name !== S.profile.name).map(p => `<div class="cm-contact" data-act="cm-open-dm" data-id="${p.id}">
        <div class="cm-item-ava${S.comms.online.has(p.name) ? ' online' : ''}">${esc(p.name.slice(0,2).toUpperCase())}</div>
        <div class="cm-item-body"><b>${esc(p.name)}</b><span class="meta">${esc(p.role)}</span></div>
      </div>`).join('')}
    </section>
    <section class="band">
      <div class="band-head"><h2>Holders</h2><span class="meta">${S.holders.length} registered</span></div>
      ${S.holders.slice(0, 20).map(h => `<div class="cm-contact">
        <div class="cm-item-ava">${esc(String(h.name||'?').slice(0,2).toUpperCase())}</div>
        <div class="cm-item-body"><b>${esc(h.name)}</b><span class="meta">${esc(h.email||'')}</span></div>
      </div>`).join('') || '<p class="meta">No holders yet.</p>'}
    </section>
  `;
}
function viewCommsSettings(el){
  el.innerHTML = `
    <div class="ph"><div><div class="eb">Comms · Settings</div><h1>Comms Settings</h1></div></div>
    <section class="band">
      <div class="band-head"><h2>Channels</h2></div>
      ${S.comms.channels.map(c => `<div class="rw"><span class="rw-l"><b>#${esc(c.name)}</b><span class="meta">${esc(c.topic||'')}</span></span>
        <button class="btn btn-xs btn-g" data-act="cm-edit-channel" data-id="${c.id}">Edit</button></div>`).join('')}
      <div class="actions" style="margin-top:12px"><button class="btn btn-sm" data-act="cm-new-channel">+ New channel</button></div>
    </section>
    <section class="band">
      <div class="band-head"><h2>Presence</h2></div>
      <p class="muted">Online state is broadcast via Supabase Realtime presence. Team members appear here as they log in.</p>
      <div class="kpis" style="margin-top:12px">
        <div class="kpi"><span class="meta">Online now</span><div class="figure num">${S.comms.online.size}</div></div>
        <div class="kpi"><span class="meta">Channels</span><div class="figure num">${S.comms.channels.length}</div></div>
        <div class="kpi"><span class="meta">Direct messages</span><div class="figure num">${Object.keys(S.comms.dms).length}</div></div>
      </div>
    </section>
  `;
}
async function sendCommsMessage(e){
  if (e) e.preventDefault();
  const inp = $('cmInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  const isDm = !!S.comms.activeDm;
  const ch = S.comms.activeChannel;
  const payload = { channel_id:isDm ? `dm:${S.user.id}:${S.comms.activeDm}` : ch,
    from_user:S.user ? S.user.id : 'local', from_name:S.profile.name, body:text };
  if (APP_MODE === 'LIVE' && S.user && S.user.id !== 'sim-user') {
    try { const { error } = await sb.from('vip_messages').insert(payload); if (error) throw error; }
    catch(e) { toast('Send failed: ' + e.message,'error'); return; }
  }
  const msg = { id:uuid(), from:S.profile.name, at:Date.now(), text, self:true, user_id:S.user ? S.user.id : null, reactions:[] };
  if (isDm) { if (!S.comms.dms[S.comms.activeDm]) S.comms.dms[S.comms.activeDm] = []; S.comms.dms[S.comms.activeDm].push(msg); }
  else { if (!S.comms.messages[ch]) S.comms.messages[ch] = []; S.comms.messages[ch].push(msg); }
  renderMain();
}
function openCommsNewChannel(){
  openModal('New Channel', `
    <div class="ff" style="margin-bottom:10px"><label>Name</label><input id="chName" placeholder="announcements"></div>
    <div class="ff" style="margin-bottom:10px"><label>Topic</label><input id="chTopic"></div>
    <div class="mact"><button class="btn btn-g" data-act="modal-close">Cancel</button><button class="btn btn-p" data-act="cm-new-channel-submit">Create</button></div>
  `);
}
function openCommsEditChannel(id){
  const c = S.comms.channels.find(x => x.id === id); if (!c) return;
  openModal('Edit Channel', `
    <div class="ff" style="margin-bottom:10px"><label>Name</label><input id="chEName" value="${esc(c.name)}"></div>
    <div class="ff" style="margin-bottom:10px"><label>Topic</label><input id="chETopic" value="${esc(c.topic||'')}"></div>
    <div class="ff" style="margin-bottom:10px"><label>Pinned message</label><input id="chEPin" value="${esc(c.pinned||'')}"></div>
    <div class="mact"><button class="btn btn-g" data-act="modal-close">Cancel</button><button class="btn btn-p" data-act="cm-edit-channel-submit" data-id="${esc(id)}">Save</button></div>
  `);
}
function commsCallInviteLink(){
  const room = 'vice-call-' + uuid().replace(/-/g,'').slice(0,10);
  const url = `${location.origin}${location.pathname}#call=${room}`;
  S.comms.lastInvite = url;
  return url;
}
async function startCommsCall(video){
  const peerId = S.comms.activeDm; const peer = S.comms.peers.find(p => p.id === peerId);
  if (!peer) { toast('Open a DM first','info'); return; }
  if (!navigator.mediaDevices) { toast('Media not supported','error'); return; }
  ensureCallChannel();
  try {
    CS._localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:!!video });
    localPreview(CS._localStream);
    const { error } = await sb.channel('vice-calls').send({ type:'broadcast', event:'offer', payload: { to:peerId, video:!!video, from:S.user.id }});
    if (error) throw error;
    S.comms.calls.unshift({ peer:peer.name, video:!!video, at:new Date().toISOString(), missed:false });
    toast(`${video ? 'Video' : 'Voice'} call ringing…`,'info');
    renderMain();
  } catch(e) { toast('Call failed: ' + e.message,'error'); }
}
let CS = { _localStream:null, _remoteStream:null, _pc:null, _callCh:null };
function ensureCallChannel(){
  if (CS._callCh || APP_MODE !== 'LIVE' || !S.user || S.user.id === 'sim-user') return;
  try { CS._callCh = sb.channel('vice-calls', { config:{ broadcast:{ self:false } } }).subscribe(); } catch(_) {}
}
function localPreview(stream){
  let host = $('_localPrev');
  if (!host) { host = document.createElement('div'); host.id = '_localPrev';
    host.style.cssText = 'position:fixed;bottom:80px;right:16px;z-index:9998;width:220px;border:1px solid var(--gd);border-radius:10px;overflow:hidden;background:#000';
    host.innerHTML = '<video autoplay playsinline muted style="width:100%;display:block"></video><button style="position:absolute;top:4px;right:4px;background:var(--rd);color:#fff;width:22px;height:22px;border-radius:50%;font-size:.75rem;cursor:pointer">×</button>';
    host.querySelector('button').onclick = () => endCall();
    document.body.appendChild(host); }
  host.querySelector('video').srcObject = stream;
}
function endCall(){
  try { CS._localStream?.getTracks().forEach(t => t.stop()); } catch(_) {}
  try { CS._pc?.close(); } catch(_) {}
  ['_localPrev','_remotePrev'].forEach(id => { const el = $(id); if (el) el.remove(); });
  CS = { _localStream:null, _remoteStream:null, _pc:null, _callCh:CS._callCh };
}

/* ─── Holders registry + holder portal ─── */
function viewHolders(el){

  el.innerHTML = `
    <div class="ph"><div><div class="eb">Records</div><h1>Holders <em>Registry</em></h1>
      <p>${reg.rows.length} client(s) appointed · ${reg.holders} with active balances.</p></div>
      <div class="ph-acts">${isOwner() ? '<button class="btn btn-p" data-act="appoint-client">+ Appoint Client</button>' : ''}</div>
    </div>
    <section class="band">
      <div class="band-head"><h2>Registry</h2><span class="meta">${reg.rows.length} rows</span></div>
      ${reg.rows.length ? `<div class="scroll-x"><table class="pos"><thead><tr>
        <th>Client ID</th><th>Name</th><th>Tier</th><th>V4X</th><th>VICE</th><th class="right">Ref Value</th><th>Status</th><th></th>
      </tr></thead><tbody>
        ${reg.rows.slice(0, 200).map(h => `<tr>
          <td class="mn"><b>${esc(h.clientId)}</b></td>
          <td>${esc(h.name)}${h.demo ? ' <span class="bdg nt">DEMO</span>' : ''}</td>
          <td>${h.tierId ? `<span class="bdg gd">${esc(h.tierId)}</span>${h.legacyOrder ? ` <span class="bdg nt">L${esc(h.legacyOrder)}</span>` : ''}` : '—'}</td>
          <td class="mn">${fmtU(h.v4x)}</td>
          <td class="mn">${fmtU(h.vice)}</td>
          <td class="mn right">${h.refTotal === null ? '—' : Money.fmt(h.refTotal)}</td>
          <td>${IruEngine.state === S.iru.state ? (S.iru.state.holders[h.holderId].status === 'ACTIVE' ? '<span class="bdg gr">Active</span>' : `<span class="bdg wn">${esc(S.iru.state.holders[h.holderId].status)}</span>`) : ''}</td>
          <td class="acts"><button class="btn btn-xs btn-g" data-act="view-holder" data-id="${esc(h.holderId)}">View</button>
            ${isOwner() ? `<button class="btn btn-xs btn-gd" data-act="classification-holder" data-id="${esc(h.holderId)}">Classify</button>` : ''}</td>
        </tr>`).join('')}
      </tbody></table></div>` : '<div class="emp">No holders appointed yet. Tap + Appoint Client to add the first one.</div>'}
    </section>
    ${S.iru.viewHolder ? holderPortalHtml(S.iru.viewHolder) : ''}

function holderPortalHtml(holderId){

  if (!v) return '';
  const line = id => `<div class="asset"><div class="asset-mark">${id === 'V4X' ? 'V4X' : 'VIC'}</div>
    <div class="asset-l"><b>${id}</b><span class="meta">${v[id].share}% of supply · ${fmtU(v[id].pending)} pending</span></div>
    <div class="asset-r"><b>${fmtU(v[id].held)}</b> <span class="meta">units</span>${v[id].refCents !== null ? `<div class="meta">${Money.fmt(v[id].refCents)}</div>` : ''}</div></div>`;
