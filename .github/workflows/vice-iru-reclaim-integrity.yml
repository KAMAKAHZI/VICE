name: IRU reclaim and market-data integrity
on:
  pull_request:
    paths:
      - 'vice-iru-reclaim-policy.js'
      - 'vice-iru-reclaim-batch.js'
      - 'vice-market-data-integrity.js'
      - 'tests/vice-iru-reclaim-policy.test.cjs'
      - 'tests/vice-iru-reclaim-batch.test.cjs'
      - 'tests/vice-market-data-integrity.test.cjs'
      - '.github/workflows/vice-iru-reclaim-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate reclaim policy, batch planner and market-data integrity
        run: node --test tests/vice-iru-reclaim-policy.test.cjs tests/vice-iru-reclaim-batch.test.cjs tests/vice-market-data-integrity.test.cjs
