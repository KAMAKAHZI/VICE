name: VICE passkey deployment drift (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
permissions:
  contents: read
concurrency:
  group: vice-passkey-drift
  cancel-in-progress: false
jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify drift detector behavior (no secrets)
        run: node --test tests/vice-passkey-drift.cjs
      - name: Compare deployed Supabase passkey bundle to approved baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::BLOCKED: configure a read-only Supabase Management API token in SUPABASE_ACCESS_TOKEN (edge_functions_read).'
            exit 1
          fi
          node scripts/vice-passkey-drift.cjs
