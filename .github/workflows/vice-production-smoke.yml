name: VICE OS production smoke
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'guide.html'
      - 'verify.html'
      - 'netlify/**'
      - 'tests/vice-production-smoke.mjs'
      - 'tests/vice-browser-smoke.cjs'
      - '.github/workflows/vice-production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'
permissions:
  contents: read
jobs:
  public-production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Rebuild exact Netlify public artifacts for byte-level comparison
        env:
          COMMIT_REF: ${{ github.sha }}
          CONTEXT: production
        run: |
          bash scripts/vice-publish-netlify.sh
          node tests/vice-deploy-privacy.cjs
      - name: Compare production deployment to GitHub exact release
        run: node tests/vice-production-smoke.mjs
        env:
          VICE_SMOKE_ATTEMPTS: '8'
          VICE_SMOKE_DELAY_MS: '10000'
      - name: Test published desktop and mobile public browser
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
          node tests/vice-browser-smoke.cjs
          node tests/vice-pwa-layout.mjs
        env:
          VICE_BROWSER_ORIGIN: https://vice4x.netlify.app
      - name: Publish truthful public production report (including failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VICE_OS_PRODUCTION_SMOKE
          path: production-smoke-report.json
          if-no-files-found: warn
