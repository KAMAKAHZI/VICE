# Manual-only fallback when native Netlify Git integration is unavailable.
# Avoid duplicate paid deployments and expected failures from missing CLI secrets.
name: VICE OS secure Netlify publish
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vice-netlify-prod
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Validate complete application
        run: |
          node tests/vice-release-safety.cjs
          node tests/vice-1367-contracts.cjs
          node tests/vice-1369-integrity.cjs
          node tests/vice-1378-audit-turn.cjs
          node tests/vice-1379-membership-signature.cjs
          node tests/vice-token-certificates.cjs
          node --test tests/vice-ouv-fixed-supply-distribution.cjs
          node --check tests/vice-production-smoke.mjs
      - name: Prepare strict public web root
        env:
          COMMIT_REF: ${{ github.sha }}
          CONTEXT: production
        run: |
          bash scripts/vice-publish-netlify.sh
          node tests/vice-deploy-privacy.cjs
          node -e "const x=require('./dist/site/deployment.json');if(x.commit!==process.env.COMMIT_REF||x.context!=='production')process.exit(1)"
      - name: Verify Netlify token and project without printing secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.NETLIFY_AUTH_TOKEN || '';
          const siteId = process.env.NETLIFY_SITE_ID || '';
          const fail = message => { console.error('::error::' + message); process.exit(1); };
          if (!token.trim() || !siteId.trim()) fail('Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID repository secret.');
          if (token !== token.trim() || siteId !== siteId.trim()) fail('Netlify secrets contain leading/trailing whitespace; correct the stored secrets instead of silently changing credentials.');
          if (/[\r\n]/.test(token + siteId)) fail('Netlify secrets contain newline characters; correct repository secrets.');
          console.log('::add-mask::' + token);
          const headers = { Authorization: 'Bearer ' + token, Accept: 'application/json' };
          async function probe(label, path) {
            let response;
            try { response = await fetch('https://api.netlify.com/api/v1' + path, { headers, signal: AbortSignal.timeout(15000) }); }
            catch (error) { fail(label + ': Netlify API request failed (' + error.name + ')'); }
            console.log(label + ': HTTP ' + response.status);
            return response;
          }
          const user = await probe('token_identity', '/user');
          if (user.status === 401 || user.status === 403) fail('Netlify rejected token identity. Check NETLIFY_AUTH_TOKEN validity and project team access; site metadata HTTP 200 does not prove deployment permission.');
          if (!user.ok) fail('Netlify token identity check returned HTTP ' + user.status);
          const siteResponse = await probe('site_access', '/sites/' + encodeURIComponent(siteId));
          if (!siteResponse.ok) fail('Netlify token cannot access configured project: HTTP ' + siteResponse.status);
          let site;
          try { site = await siteResponse.json(); } catch { fail('Netlify project returned invalid JSON.'); }
          const hostname = value => { try { return new URL(value).hostname; } catch { return ''; } };
          const expected = [site.ssl_url, site.url].some(value => hostname(String(value || '')) === 'vice4x.netlify.app') || site.name === 'vice4x';
          if (!expected) fail('NETLIFY_SITE_ID does not identify expected VICE4X production site.');
          console.log('expected_production_site: PASS');
          NODE
      - name: Publish validated VICE OS to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@23.12.0 deploy --prod --no-build \
            --dir=dist/site \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --message="VICE OS ${{ github.sha }} — verified frontend + cloud functions"
      - name: Run independent live smoke
        run: |
          node tests/vice-production-smoke.mjs
        env:
          VICE_SMOKE_ATTEMPTS: '5'
          VICE_SMOKE_DELAY_MS: '7000'
          VICE_MANUAL_DEPLOY: '1'
          VICE_EXPECTED_COMMIT: ${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VICE_OS_NETLIFY_PRODUCTION_ACCEPTANCE
          path: production-smoke-report.json
          if-no-files-found: warn
