# Manual-only fallback when native Netlify Git integration is unavailable.
# Avoid duplicate paid deployments and expected failures from missing CLI secrets.
name: VICE OS secure Netlify publish
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vice-netlify-prod
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate complete application
        run: |
          node tests/vice-release-safety.cjs
          node tests/vice-1367-contracts.cjs
          node tests/vice-1369-integrity.cjs
          node tests/vice-1378-audit-turn.cjs
          node tests/vice-1379-membership-signature.cjs
          node tests/vice-token-certificates.cjs
          node --test tests/vice-ouv-fixed-supply-distribution.cjs
          node --check tests/vice-production-smoke.mjs
      - name: Prepare strict public web root
        env:
          COMMIT_REF: ${{ github.sha }}
          CONTEXT: production
        run: |
          bash scripts/vice-publish-netlify.sh
          node tests/vice-deploy-privacy.cjs
          node -e "const x=require('./dist/site/deployment.json');if(x.commit!==process.env.COMMIT_REF||x.context!=='production')process.exit(1)"
      - name: Confirm deployment authorization
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Netlify deployment not authorized yet. Create GitHub repository secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in repository Settings > Secrets and variables > Actions. Never put these values in chat, SQL, source, or public artifacts."
            exit 1
          fi
      - name: Diagnose Netlify authorization without exposing credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.NETLIFY_AUTH_TOKEN;
          const siteId = process.env.NETLIFY_SITE_ID;
          const headers = { Authorization: 'Bearer ' + token, Accept: 'application/json' };
          async function probe(label, url) {
            let response;
            try { response = await fetch(url, { headers, signal: AbortSignal.timeout(15000) }); }
            catch (e) { console.error(label + ': NETWORK_ERROR (' + e.name + ')'); process.exitCode = 1; return null; }
            console.log(label + ': HTTP ' + response.status);
            if (!response.ok) { process.exitCode = 1; return null; }
            try { return await response.json(); } catch { console.error(label + ': INVALID_JSON'); process.exitCode = 1; return null; }
          }
          const user = await probe('token_identity', 'https://api.netlify.com/api/v1/user');
          const site = await probe('site_access', 'https://api.netlify.com/api/v1/sites/' + encodeURIComponent(siteId));
          if (user && site) {
            const domain = String(site.ssl_url || site.url || '');
            const matches = domain.includes('vice4x.netlify.app') || site.name === 'vice4x';
            console.log('expected_production_site: ' + (matches ? 'PASS' : 'FAIL'));
            console.log('site_build_settings_present: ' + (site.build_settings ? 'YES' : 'NO'));
            if (!matches) process.exitCode = 1;
          }
          NODE
      - name: Publish validated VICE OS to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@23.12.0 deploy --prod --no-build --dir=dist/site --functions=netlify/functions --site="$NETLIFY_SITE_ID" --message="VICE OS ${{ github.sha }} — verified frontend + cloud functions"
      - name: Run independent live smoke
        run: |
          node tests/vice-production-smoke.mjs
        env:
          VICE_SMOKE_ATTEMPTS: '5'
          VICE_SMOKE_DELAY_MS: '7000'
          VICE_MANUAL_DEPLOY: '1'
          VICE_EXPECTED_COMMIT: ${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VICE_OS_NETLIFY_PRODUCTION_ACCEPTANCE
          path: production-smoke-report.json
          if-no-files-found: warn
