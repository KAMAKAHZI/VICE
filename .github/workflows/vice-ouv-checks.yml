name: VICE OUV Security & Reference Checks
on:
  push:
    branches:
      - integration/institutional-ouv-20261023
  pull_request:
    paths:
      - 'vice-ouv-reference.js'
      - 'vice-ouv-final-deploy.js'
      - 'netlify/functions/ouv-final-deploy.js'
      - 'tests/vice-ouv-*.cjs'
      - 'scripts/vice-ouv-readonly-smoke.cjs'
      - 'sql/vice_ouv_executive_forensic_gate.sql'
      - 'sql/vice_ouv_atomic_staging_preflight.sql'
      - 'tests/vice-ouv-forensic-gate.cjs'
      - 'tests/vice-ouv-atomicity-contract.cjs'
      - 'supabase/migrations/*ouv_atomic_executor*.sql'
      - '.github/workflows/vice-ouv-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ouv-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check vice-ouv-reference.js
          node --check vice-ouv-final-deploy.js
          node --check netlify/functions/ouv-final-deploy.js
          node --check scripts/vice-ouv-readonly-smoke.cjs
          node --check tests/vice-ouv-reference.cjs
          node --check tests/vice-ouv-executive-endpoint.cjs
          node --check tests/vice-ouv-governance-mocked.cjs
      - name: Run financial and governance contract tests
        run: |
          node tests/vice-ouv-reference.cjs
          node tests/vice-ouv-executive-endpoint.cjs
          node tests/vice-ouv-governance-mocked.cjs
          node tests/vice-ouv-forensic-gate.cjs
          node tests/vice-ouv-staging-preflight.cjs
          node tests/vice-ouv-atomicity-contract.cjs
      - name: Prove premature OUV activation fails closed
        run: |
          if VICE_OUV_EXECUTION_ENABLED=true node tests/vice-ouv-atomicity-contract.cjs; then
            echo 'Unexpectedly permitted OUV activation without an audited migration'
            exit 1
          fi
      - name: Confirm production financial writes remain gated
        run: |
          test -f sql/vice_ouv_auto_execution_guard.sql
          grep -q 'INDEPENDENT_GOVERNANCE_VERIFICATION_REQUIRED' sql/vice_ouv_auto_execution_guard.sql
          grep -q "VICE_OUV_EXECUTION_ENABLED" netlify/functions/ouv-final-deploy.js
