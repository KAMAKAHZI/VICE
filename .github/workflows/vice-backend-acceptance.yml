name: VICE OS public backend acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/vice-backend-acceptance.mjs'
      - '.github/workflows/vice-backend-acceptance.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:
  schedule:
    - cron: '39 13 * * *'
permissions:
  contents: read
jobs:
  backend-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Smoke-test live Supabase public API without credentials
        run: node tests/vice-backend-acceptance.mjs
      - name: Publish independent backend check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VICE_OS_BACKEND_ACCEPTANCE
          path: backend-acceptance-report.json
          if-no-files-found: warn
