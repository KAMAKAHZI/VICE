name: VICE OS public backend acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/vice-backend-acceptance.mjs'
      - '.github/workflows/vice-backend-acceptance.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:
  schedule:
    - cron: '39 13 * * *'
permissions:
  contents: read
jobs:
  backend-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Smoke-test live Supabase public API without credentials
        run: node tests/vice-backend-acceptance.mjs
      - name: Publish independent backend check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VICE_OS_BACKEND_ACCEPTANCE
          path: backend-acceptance-report.json
          if-no-files-found: warn
