name: VICE OS release integrity
on:
  push:
    paths:
      - 'index.html'
      - 'vice4x-institutional.js'
      - 'vice4x-institutional-core.js'
      - 'supabase/functions/**'
      - 'scripts/**'
      - 'version.json'
      - 'supabase/functions/vice-mt5-cloud/index.ts'
      - 'tests/**'
      - 'scripts/vice-publish-netlify.sh'
      - '_headers'
      - 'netlify/functions/**'
      - 'tests/vice-1369-integrity.cjs'
      - 'tests/vice-1378-audit-turn.cjs'
      - 'tests/vice-1379-membership-signature.cjs'
      - 'netlify/functions/turn-credentials.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/vice-os-release-guard.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'index.html'
      - 'vice4x-institutional.js'
      - 'vice4x-institutional-core.js'
      - 'supabase/functions/**'
      - 'scripts/**'
      - 'version.json'
      - 'supabase/functions/vice-mt5-cloud/index.ts'
      - 'tests/**'
      - 'scripts/vice-publish-netlify.sh'
      - '_headers'
      - 'netlify/functions/**'
      - 'tests/vice-1369-integrity.cjs'
      - 'tests/vice-1378-audit-turn.cjs'
      - 'tests/vice-1379-membership-signature.cjs'
      - 'netlify/functions/turn-credentials.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/vice-os-release-guard.yml'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          node tests/vice-auth-session-contract.mjs
          node --test tests/vice-production-repairs.cjs
          node tests/vice-release-safety.cjs
          node tests/vice-institutional-boundaries.cjs
          node tests/vice-source-secret-gates.cjs
          node tests/vice-1369-integrity.cjs
          node tests/vice-1378-audit-turn.cjs
          node tests/vice-1379-membership-signature.cjs
          node tests/vice-token-certificates.cjs
