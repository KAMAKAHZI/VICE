name: VICE OS release integrity
on:
  push:
    paths:
      - 'index.html'
      - 'version.json'
      - 'supabase/functions/vice-mt5-cloud/index.ts'
      - 'tests/**'
      - 'netlify/functions/**'
      - 'tests/vice-1369-integrity.cjs'
      - 'tests/vice-1378-audit-turn.cjs'
      - 'tests/vice-1379-membership-signature.cjs'
      - 'netlify/functions/turn-credentials.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/vice-os-release-guard.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'version.json'
      - 'supabase/functions/vice-mt5-cloud/index.ts'
      - 'tests/**'
      - 'netlify/functions/**'
      - 'tests/vice-1369-integrity.cjs'
      - 'tests/vice-1378-audit-turn.cjs'
      - 'tests/vice-1379-membership-signature.cjs'
      - 'netlify/functions/turn-credentials.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/vice-os-release-guard.yml'
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --test tests/vice-production-repairs.cjs
          node tests/vice-release-safety.cjs
          node tests/vice-1369-integrity.cjs
          node tests/vice-1378-audit-turn.cjs
          node tests/vice-1379-membership-signature.cjs
          node tests/vice-token-certificates.cjs
