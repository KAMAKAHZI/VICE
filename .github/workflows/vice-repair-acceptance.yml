name: VICE repair behavioral and browser acceptance
on:
  push:
    branches: ['repair/production-acceptance-20261015', 'repair/registry-cfo-20261017', 'fix/phase0-hardening']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: vice-repair-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: vice_staging
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate recipient policy in disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: |
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-dm-staging.sql
          psql -h localhost -U postgres -d vice_staging -v ON_ERROR_STOP=1 -f supabase/migrations/20261015132937_vice_dm_recipient_membership_acl.sql
          psql -h localhost -U postgres -d vice_staging -v ON_ERROR_STOP=1 -f supabase/migrations/20261015132937_vice_dm_recipient_membership_acl.sql
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-dm-assertions.sql
      - name: Validate audited issuance reversal in disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: |
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-iru-staging.sql
          psql -h localhost -U postgres -d vice_staging -v ON_ERROR_STOP=1 -f supabase/migrations/20261015140648_vice_audited_strategic_issuance_reversal.sql
          psql -h localhost -U postgres -d vice_staging -v ON_ERROR_STOP=1 -f supabase/migrations/20261015140648_vice_audited_strategic_issuance_reversal.sql
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-iru-assertions.sql
      - name: Validate public certificate privacy in disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: |
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-certificate-privacy-staging.sql
          psql -h localhost -U postgres -d vice_staging -v ON_ERROR_STOP=1 -f supabase/migrations/20261015190802_vice_private_certificate_verification.sql
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-certificate-privacy-assertions.sql
      - name: Validate Academy progress and award gates in disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: |
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-academy-staging.sql
          psql -h localhost -U postgres -d vice_staging -v ON_ERROR_STOP=1 -f supabase/migrations/20261015193846_vice_academy_progress_receipts.sql
          psql -h localhost -U postgres -d vice_staging -f tests/sql/vice-academy-assertions.sql
      - name: Install integrity-locked test dependencies
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Capture production bridge server dependency lock (one-time bootstrap)
        run: |
          npm install --prefix server --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const z=require('node:zlib'),f=require('node:fs');console.log('VICE_SERVER_LOCKFILE_GZIP_BASE64:'+z.gzipSync(f.readFileSync('server/package-lock.json')).toString('base64'))"
      - name: Validate registry, CFO authority and account suspension in isolated PostgreSQL
        run: |
          node tests/vice-registry-controls.mjs
          node tests/vice-comms-db.mjs
          node tests/vice-institutional-db.mjs
      - run: |
          bash scripts/vice-publish-netlify.sh
          for f in tests/*.cjs; do
            if [ "$f" != tests/vice-browser-smoke.cjs ]; then node "$f"; fi
          done
      - run: ./tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/vice-browser-smoke.cjs
      - run: node tests/vice-pwa-layout.mjs
      - run: node tests/vice-comms-browser.mjs
      - run: node tests/vice-institutional-browser.mjs
      - run: node tests/vice-backend-acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VICE_REPAIR_BACKEND_ACCEPTANCE
          path: backend-acceptance-report.json
