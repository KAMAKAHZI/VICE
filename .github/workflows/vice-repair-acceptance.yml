name: VICE repair behavioral and browser acceptance
on:
  push:
    branches: ['repair/production-acceptance-20261015']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.64.1 pdf-lib@1.17.1
      - run: |
          bash scripts/vice-publish-netlify.sh
          for f in tests/*.cjs; do
            if [ "$f" != tests/vice-browser-smoke.cjs ]; then node "$f"; fi
          done
      - run: npx playwright install --with-deps chromium
      - run: node tests/vice-browser-smoke.cjs
      - run: node tests/vice-backend-acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VICE_REPAIR_BACKEND_ACCEPTANCE
          path: backend-acceptance-report.json
