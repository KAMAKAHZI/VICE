name: VICE Phase 3 Security Contracts
on:
  pull_request:
    paths:
      - 'security/ai-soc/**'
      - 'security/auth/**'
      - 'tests/vice-ai-soc-*.mjs'
      - 'tests/vice-device-trust-policy.mjs'
      - 'tests/vice-passkey-gate.mjs'
      - 'tests/vice-passkey-challenge-policy.mjs'
      - 'tests/vice-phase3-role-gate.mjs'
      - 'supabase/migrations/20261025_phase3_*.sql'
      - '.github/workflows/vice-phase3-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run isolated Phase 3 security contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/vice-phase3-role-gate.mjs
          node tests/vice-device-trust-policy.mjs
          node tests/vice-passkey-gate.mjs
          node tests/vice-passkey-challenge-policy.mjs
          node tests/vice-ai-soc-triage.mjs
          node tests/vice-ai-soc-normalize.mjs
          node tests/vice-ai-soc-incidents.mjs
          node tests/vice-ai-soc-ledger.mjs
          node tests/vice-ai-soc-webhook-auth.mjs
          node tests/vice-ai-soc-pg-nonce.mjs
          node tests/vice-ai-soc-ingress.mjs
          node tests/vice-ai-soc-pg-incident-writer.mjs
